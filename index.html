["How do I demonstrate concurrency awareness without over-engineering?","Mention it where it matters. For the rate limiter, the synchronized block and the reason for it. For the ledger, the synchronized methods and the fact that a real implementation would use a database constraint. For the cache, the fact that LinkedHashMap isn't thread-safe and you'd use ConcurrentHashMap plus a lock, or a Caffeine cache. One sentence per component is enough — you're demonstrating awareness, not building a production system."],
["What if the interviewer wants me to use a language or framework I'm rusty on?","Say so and proceed. "I'm a bit rusty on the exact API but the structure is the same — let me write it and we can correct syntax as we go." Most interviewers care about the design and the reasoning, not whether you remember the exact method signature. And admitting the gap is better than silently struggling."]
],
exit:"Complete all three drills with passing tests in 60 minutes total, and explain every design decision aloud."},

{d:54,wk:8,prio:"P0",title:"Résumé, Negotiation & Logistics",
obj:"Build the artifacts and the script that convert offers into good offers.",
core:`<h4>The architect résumé — what changes at this level</h4>
<table><thead><tr><th>Don't</th><th>Do</th></tr></thead><tbody>
<tr><td>List 40 technologies</td><td>Lead with outcomes and scale, mention technology only where it's a differentiator</td></tr>
<tr><td>"Responsible for the payments platform"</td><td>"Led the architecture of a payments platform processing 50M transactions/day across 3 PSPs"</td></tr>
<tr><td>"Worked on a microservices migration"</td><td>"Moved a monolith to 14 services over 18 months, cutting deploy lead time from 3 weeks to 2 days"</td></tr>
<tr><td>List every job since 2004</td><td>Detail the last 10–12 years; compress the early career to one line</td></tr>
<tr><td>No numbers anywhere</td><td>A number in every bullet</td></tr>
</tbody></table>
<p><b>The structure that works for 20+ years:</b></p>
<pre><code>NAME — Principal / Enterprise Architect
[city] · [email] · [linkedin] · [github]

SUMMARY (3 lines)
Architect with 20+ years in enterprise Java, focused on [domain].
Currently accountable for [system] processing [scale].
Specialise in [2-3 things that differentiate you].

SELECTED IMPACT (this replaces the old "experience" section)
• Led [initiative] that [business outcome with number]
• Designed [system] handling [scale], reducing [metric] by [X%]
• Established [practice] adopted by [N] teams, cutting [metric] by [X%]

EXPERIENCE
2020–present Company — Principal Architect
• 3–4 impact bullets with numbers
• Scope: team size, system scale, budget if relevant
2014–2020 Company — Senior Architect / Lead Engineer
• 3–4 impact bullets
2004–2014 Company — Senior / Engineer
• One line: "Progressed from developer to tech lead across
[domain] systems; delivered [one notable thing]."

SKILLS (one line, not a wall)
Architecture: microservices, event-driven, DDD, CQRS
Platform: Java 21, Spring Boot, Kafka, PostgreSQL, Redis, Kubernetes
Domain: payments, ledgers, PCI-DSS, reconciliation
Cloud: AWS (EKS, RDS, SQS, Lambda), Terraform</code></pre>
<p><b>The three things that get you screened in:</b></p>
<ol>
<li><b>Numbers in the first three bullets.</b> A recruiter spends 8 seconds. Scale and outcome are what register.</li>
<li><b>The right title.</b> If your current title is "Senior Developer" but you do architecture, say "Senior Developer (Architecture)" or lead with the functional role.</li>
<li><b>Domain keywords.</b> If you're targeting fintech, "ledger," "reconciliation," "idempotency," and "PCI" in the résumé get you past keyword filters and signal domain fluency.</li>
</ol>

<h4>LinkedIn — the 10-minute fix</h4>
<ul>
<li><b>Headline:</b> "Principal Architect | Payments & Distributed Systems | Java" — not "Senior Java Developer at X".</li>
<li><b>About section:</b> 4–5 lines, first person, leading with what you do and the scale you operate at.</li>
<li><b>Featured:</b> a link to a GitHub repo, a talk, or an article. One artifact is worth more than a paragraph.</li>
<li><b>Open to work:</b> enable it for recruiters only, not the public badge, if you're currently employed.</li>
</ul>

<h4>Salary research — do this today</h4>
<table><thead><tr><th>Source</th><th>What it gives you</th></tr></thead><tbody>
<tr><td>levels.fyi</td><td>Level-by-level, company-by-company. Best for product companies and big tech.</td></tr>
<tr><td>Blind</td><td>Anonymous but often accurate for big tech and fintech.</td></tr>
<tr><td>Glassdoor / Payscale</td><td>Broader, less precise. Good for cross-industry baselines.</td></tr>
<tr><td>The job posting</td><td>Many US states require a range. The most reliable single data point.</td></tr>
<tr><td>The recruiter</td><td>Ask directly and early: "What range is budgeted for this role?" Most will tell you.</td></tr>
</tbody></table>
<pre><code>For each target company, write down:
Base range: $____ – $____
Target base: $____ (your anchor — aim for the 65th percentile)
Walk-away: $____ (below this, you decline)
Equity/bonus: ____% (target bonus, equity type and vesting)
Sign-on: $____ (the flexible bucket)

Also: your current total comp, so you can articulate the delta.
And: the number that would make you say yes immediately.</code></pre>

<h4>The negotiation script</h4>
<div class="script">"Thank you — I'm genuinely excited about this and I want to accept.<br><br>
I do want to talk about the number. Based on [my research / the range you shared / another offer I'm holding], I was expecting something closer to [$X]. Given [specific: the scope of the programme / my 20 years in regulated payments / the fact that this is an architect role with team-wide accountability], I think that's a fair reflection of the value.<br><br>
If [$X] isn't possible on base, I'm open to getting there through [sign-on / equity / an early review at six months]. What's possible?"</div>
<p><b>Why this works:</b> enthusiasm first (you're not a flight risk), a specific number with a reason, an alternative path so they can say yes without breaking the band, and an open question rather than an ultimatum.</p>

<h4>The hard moments</h4>
<table><thead><tr><th>They say</th><th>You say</th></tr></thead><tbody>
<tr><td>"That's above our band for this level."</td><td>"Can we talk about the level then? If the scope includes [architect responsibility], I'd expect it to map to a different band."</td></tr>
<tr><td>"What's your current comp?"</td><td>"I'd rather focus on the value of this role — what range have you budgeted?"</td></tr>
<tr><td>"We need an answer by tomorrow."</td><td>"I want to give you a considered yes. I have another conversation finishing [day]. Can we speak [day+2]?"</td></tr>
<tr><td>"We don't negotiate."</td><td>"I understand. Is there flexibility on [sign-on / equity / review timing] instead?"</td></tr>
<tr><td>"That's our final offer."</td><td>Then decide: is it above your walk-away? If yes, accept warmly. If no, decline warmly and keep the relationship.</td></tr>
</tbody></table>

<h4>The five negotiation rules</h4>
<ol>
<li><b>Never give the first number.</b> "What range is budgeted?" If pressed, give a range where your target is the bottom.</li>
<li><b>Negotiate the whole package.</b> Base, bonus, equity, sign-on, vacation, remote, learning budget, title. Sometimes base is fixed but sign-on isn't.</li>
<li><b>Competing offers are the only real leverage.</b> Not bluffs. Interview on overlapping timelines.</li>
<li><b>Negotiate once, properly.</b> One well-reasoned counter with your full ask. Repeated small asks read as bad faith.</li>
<li><b>Get it in writing.</b> Verbally agreed numbers are not agreed. The offer letter is the offer.</li>
</ol>

<h4>Questions to ask them that signal seniority</h4>
<ul>
<li>"How are architecture decisions made, and who has the final call when there's disagreement?"</li>
<li>"What's the biggest technical risk on the roadmap in the next 18 months?"</li>
<li>"How does this role interact with the business — do I present to finance or product?"</li>
<li>"What happened to the last person in this role?"</li>
<li>"How is technical debt funded — a standing budget or competing with features?"</li>
<li>"What does success look like at 6 and 12 months, concretely?"</li>
<li>"How many people here have been promoted internally into architect roles in the last two years?"</li>
</ul>
<p>The last one tells you whether the role is a real function or a title they hand out to retain people.</p>

<h4>Logistics checklist</h4>
<ul class="chk-list">
<li>Résumé updated with numbers in the first three bullets</li>
<li>LinkedIn headline and About section rewritten for architect roles</li>
<li>Three target tiers: reach, match, safety — five companies each</li>
<li>Salary band researched per company, with target and walk-away written down</li>
<li>Negotiation script rehearsed aloud five times</li>
<li>Interview-day cheat sheet: three designs, ten stories, five questions</li>
<li>Calendar blocked for interview slots</li>
<li>References lined up and warned</li>
<li>Notice period known and reasonable</li>
</ul>

<h4>The application strategy</h4>
<ol>
<li><b>Wave 1 (this week):</b> 5 applications at companies you're less excited about. These are practice. Expect to be rusty in the first two interviews.</li>
<li><b>Wave 2 (next week):</b> 5 match-tier companies. You'll be sharper by now.</li>
<li><b>Wave 3:</b> your top 5. Apply once you've had at least three interviews, so you're at peak form.</li>
</ol>
<div class="box o"><div class="t">Why waves matter</div>Your first interview will be your worst. Interviewing is a skill that degrades without practice. Sequencing your applications means your top targets get your best performance rather than your warm-up. Most people apply to their dream job first and burn it.</div>`,

drill:["Rewrite your résumé with numbers in the first three bullets. Get one peer review.",
"Do the salary research for 5 target companies. Write down target and walk-away.",
"Rehearse the negotiation script aloud 5 times. Record the last one."],

qa:[
["How do I handle a gap or a long tenure on my résumé?","Long tenure is an asset at architect level — it signals you can operate in a complex environment over time and that you're not a job hopper. Lead with the scope and the progression. For a gap, one line explaining it is enough: "Career break 2023–2024 for [family / health / study]." Interviewers care far less than candidates fear. What they don't want is to discover it in the interview and wonder why you hid it."],
["Should I include a GitHub link if my repos are old or sparse?","Only if it adds something. An empty GitHub is worse than no GitHub. If you have one good repo — even a small well-tested library — feature it. If not, replace it with something else: a conference talk, a technical article, or a well-documented architecture case study (with anything confidential removed). One genuine artifact beats an empty profile."],
["How do I negotiate when I don't have a competing offer?","Use market data as your anchor: "Based on levels.fyi data for this level at companies in this tier, the range is X–Y, and I'm targeting Z." You still have leverage — your experience, the difficulty of the search, and their sunk cost in the interview loop. And never say "I have no other offers." Just don't raise it. If they ask directly, "I'm in conversations elsewhere" is only a lie if it's false — and by the time you're negotiating, you should be."],
["What if they lowball me on the first offer?","Don't react to the number. Ask about the structure: "Can you walk me through how the base, bonus, and equity are structured?" Sometimes a low base comes with a strong equity package that changes the picture. Then counter once, with a specific number and a reason. If the total package is genuinely below your walk-away and they won't move, decline — politely, and keeping the relationship. The market for architect-level talent is small and you may encounter these people again."],
["How many interviews should I run in parallel?","Three to five active processes. Fewer and you have no leverage. More and you can't prepare properly for any of them — and at this level preparation matters more than volume. Stagger the timelines so offers land at roughly the same time, which is what creates the negotiation leverage. If one process accelerates, you can ask the others to speed up: "I have an offer with a deadline — can we accelerate?""]
],
exit:"Have a rewritten résumé with numbers, a researched salary band per target, and a negotiation script rehearsed five times."},

{d:55,wk:8,prio:"P0",title:"Final Mock — Full Loop",
obj:"One complete interview loop under real conditions. This is the dress rehearsal.",
core:`<h4>The full loop — do this today</h4>
<p>Four rounds, back to back, with 10-minute breaks. Record everything. This is the last chance to find gaps before it counts.</p>

<table><thead><tr><th>Round</th><th>Length</th><th>What to do</th></tr></thead><tbody>
<tr><td><b>1. Coding</b></td><td>45 min</td><td>LRU cache with tests. Or the in-memory ledger.</td></tr>
<tr><td><b>2. System design</b></td><td>45 min</td><td>The payment processing system from Day 42, or the wallet from Day 48.</td></tr>
<tr><td><b>3. Behavioral</b></td><td>45 min</td><td>Six questions from Day 51, including the failure story.</td></tr>
<tr><td><b>4. Your questions + negotiation</b></td><td>30 min</td><td>Deliver five questions, then run the negotiation script.</td></tr>
</tbody></table>

<h4>Round-by-round scoring</h4>

<details><summary>Round 1 — Coding rubric</summary>
<div class="dbody">
<table><thead><tr><th>Check</th><th>Y/N</th></tr></thead><tbody>
<tr><td>Clarified inputs, outputs, edge cases before coding</td><td></td></tr>
<tr><td>Stated the approach and complexity before writing</td><td></td></tr>
<tr><td>Used meaningful names — no <code>a</code>, <code>b</code>, <code>tmp2</code></td><td></td></tr>
<tr><td>Handled edge cases: empty, single element, null</td><td></td></tr>
<tr><td>Wrote at least three tests, covering the invariants</td><td></td></tr>
<tr><td>Tested it aloud by walking a small example</td><td></td></tr>
<tr><td>Discussed a trade-off without being asked</td><td></td></tr>
<tr><td>No over-abstraction — 3–5 classes maximum</td><td></td></tr>
</tbody></table>
</div></details>

<details><summary>Round 2 — Design rubric</summary>
<div class="dbody">
<table><thead><tr><th>Check</th><th>Y/N</th></tr></thead><tbody>
<tr><td>Asked 4+ clarifying questions before drawing anything</td><td></td></tr>
<tr><td>Computed QPS, storage, and used them to drive decisions</td><td></td></tr>
<tr><td>Defined an API contract with 4–6 endpoints</td><td></td></tr>
<tr><td>Chose 2 components and went three levels deep</td><td></td></tr>
<tr><td>Handled failure modes for every component</td><td></td></tr>
<tr><td>Named the metrics and what would page someone</td><td></td></tr>
<tr><td>Stated 5+ explicit trade-offs</td><td></td></tr>
<tr><td>Finished all six phases within 45 minutes</td><td></td></tr>
</tbody></table>
</div></details>

<details><summary>Round 3 — Behavioral rubric</summary>
<div class="dbody">
<table><thead><tr><th>Check</th><th>Y/N</th></tr></thead><tbody>
<tr><td>Every answer had a number in it</td><td></td></tr>
<tr><td>Every answer used "I" for the judgment, "we" for the execution</td><td></td></tr>
<tr><td>Every answer ended on the Result or the Learning</td><td></td></tr>
<tr><td>No answer exceeded 2 minutes</td><td></td></tr>
<tr><td>The failure story was genuinely bad and you owned it</td><td></td></tr>
<tr><td>Connected at least one story to a current behaviour</td><td></td></tr>
<tr><td>No filler: no "so basically," no "kind of," no trailing off</td><td></td></tr>
</tbody></table>
</div></details>

<details><summary>Round 4 — Questions and negotiation rubric</summary>
<div class="dbody">
<table><thead><tr><th>Check</th><th>Y/N</th></tr></thead><tbody>
<tr><td>Asked five questions that signal seniority</td><td></td></tr>
<tr><td>Didn't give a number first when asked about comp</td><td></td></tr>
<tr><td>Delivered the counter-offer script without hesitation</td><td></td></tr>
<tr><td>Offered an alternative path (sign-on, equity, review)</td><td></td></tr>
<tr><td>Ended with an open question, not an ultimatum</td><td></td></tr>
</tbody></table>
</div></details>

<h4>The five designs you must be able to whiteboard from memory</h4>
<ol>
<li><b>Payment processing system</b> — the full flow, idempotency, ledger, reconciliation, PSP failover</li>
<li><b>Wallet with multi-currency</b> — schema, top-up, transfer, FX, suspense accounts, CQRS for balance</li>
<li><b>Rate limiter</b> — token bucket, Redis + Lua, two-tier caching, failure policy</li>
<li><b>Notification service</b> — transactional vs marketing split, per-channel consumers, DLQ, dedupe</li>
<li><b>URL shortener</b> — ID generation, read path, CDN, cache-aside, analytics via Kafka</li>
</ol>

<h4>The ten stories you must be able to deliver</h4>
<ol>
<li>Major architecture decision — three options, explicit trade-off, what you'd revisit</li>
<li>Business-IT alignment — business goal, technical obstacle, quantified outcome</li>
<li>Influencing without authority — the real constraint behind the resistance</li>
<li>Failure you owned — genuine, unsoftened, with a current behaviour change</li>
<li>Conflict resolution — the crux, the test, and committing fully to the outcome</li>
<li>Technical debt — reframed in business terms, attached to funded work</li>
<li>Mentoring — leverage, not headcount. Decisions made well without you</li>
<li>Production crisis — mitigate before investigating, systemic fix, alerting gap</li>
<li>Saying no — "yes, and here's the trade" — plus what happened later</li>
<li>Ambiguity — written assumptions, expensive-to-reverse first, feature flags</li>
</ol>

<h4>The interview-day cheat sheet</h4>
<p><b>Write this on one page and review it 30 minutes before the interview.</b></p>
<pre><code>THE SIX FINTECH CONSTRAINTS
1. Idempotency — atomic claim, 3 states, request hash
2. Consistency where it counts — linearizable ledger, eventual dashboard
3. Downstream rate limits are the real ceiling — decouple, backpressure
4. Retry storms — idempotency + jitter + circuit breaker + budget
5. Reconciliation — daily files, break categories, never mutate
6. Auditability — append-only double-entry, integer minor units

MY THREE STRONGEST STORIES
____ (with the number: ____)
____ (with the number: ____)
____ (with the number: ____)

MY FIVE QUESTIONS TO ASK
1. How are architecture decisions made and who has final call?
2. What's the biggest technical risk in the next 18 months?
3. How is technical debt funded?
4. What happened to the last person in this role?
5. What does success look like at 6 and 12 months?

MY NUMBERS
Target base: $____
Walk-away: $____
Current total comp: $____

OPENERS
Design: "Before I design, let me confirm what we're optimising for."
Behavioral: lead with the situation and the stakes, not "that's a great question"
Negotiation: enthusiasm first, then the number with a reason</code></pre>

<h4>What to do if the mock exposes a gap</h4>
<table><thead><tr><th>Gap</th><th>Fix today</th></tr></thead><tbody>
<tr><td>Ran out of time in design</td><td>Practise the 5/4/4/10/15/7 timing with a timer visible</td></tr>
<tr><td>Stories had no numbers</td><td>Go back to Day 50 and find the numbers. Don't proceed without them.</td></tr>
<tr><td>Couldn't finish the code</td><td>Do the three drills from Day 53 again, timed</td></tr>
<tr><td>Forgot the fintech constraints</td><td>Recite them five times aloud, then re-do Day 43</td></tr>
<tr><td>Filler words everywhere</td><td>Record again. Count them. Set a target of zero and re-record.</td></tr>
<tr><td>Hesitated on negotiation</td><td>Rehearse the script aloud ten times. It should be automatic.</td></tr>
</tbody></table>

<div class="box o"><div class="t">The honest assessment</div>If you can deliver all five designs from memory, tell all ten stories with numbers, recite the six fintech constraints, and run the negotiation script without hesitation — you are ready. Not perfect. Ready. <b>Perfection is not the bar; confident competence is.</b> An interviewer can tell the difference between someone who's memorised and someone who understands, and it's the second one who gets the offer.</div>

<h4>The one thing that matters most tomorrow</h4>
<p><b>Rest.</b> Not more revision. Your brain consolidates during rest, and interview performance is 30% knowledge and 70% being sharp enough to deploy it. A tired candidate with perfect preparation loses to a rested candidate with good preparation. This is not a platitude — it's the last piece of the plan.</p>`,

drill:["Run the full four-round loop. Record every round. Take real breaks between them.",
"Score each round against the rubric. Write down every gap.",
"Spend the remaining time on the two biggest gaps — not on everything."],

qa:[
["How do I know if I'm actually ready?","When you can deliver the five designs from memory without notes, tell all ten stories with specific numbers, recite the fintech constraints unprompted, and run the negotiation script without hesitation. Not perfectly — confidently. The test isn't whether you know everything; it's whether you can deploy what you know under pressure. If you can, you're ready. Additional preparation has diminishing returns and increasing fatigue cost."],
["What if I bomb the mock?","Good — that's what it's for. A mock that exposes gaps is more valuable than one that goes smoothly, because you still have time to fix them. Identify the two biggest gaps and fix those. Don't try to fix everything; that's how you end up anxious and under-prepared on the things that matter. And remember: the mock is harder than the real thing, because you're judging yourself while doing it."],
["How many hours should I study the day before an interview?","Two at most, and only review — no new material. Read your cheat sheet, say your three strongest stories aloud, recite the fintech constraints. Then stop. The day before is for consolidation and rest, not for cramming. Learning something new the night before means you'll be tired and you won't retain it anyway."],
["What if I get a question I've never seen in the real interview?","That will happen — the point of preparation isn't to have seen every question, it's to have a method. For design: clarify, compute, define the API, sketch, go deep, handle failure. For behavioral: pick the closest story and reframe it, or be honest and reason through it aloud. For coding: clarify, state the approach, write it, test it. Having a method means an unfamiliar question is still tractable."],
["How do I stop being nervous?","By having done it enough times that it's familiar. That's what the waves of applications are for — your first interview will be your worst, and that's fine if it's a company you're not desperate for. Beyond that: breathe deliberately before you start, take notes during the question (which gives you a beat to think), and remember that the interviewer wants you to succeed. They've spent hours on this loop; they'd rather hire you than not."]
],
exit:"Complete the full four-round loop, score every round, and fix only the two biggest gaps."},

{d:56,wk:8,prio:"P0",title:"Rest, Consolidate & Launch",
obj:"Stop preparing. Consolidate what you have and start applying.",
core:`<h4>Today is deliberately light</h4>
<p>Fifty-five days of preparation is done. Today is not for new material. It's for consolidation, rest, and the first wave of applications.</p>

<h4>Morning — 60 minutes of review (not study)</h4>
<ol>
<li><b>Read your one-page cheat sheet.</b> Slowly. Out loud.</li>
<li><b>Say your three strongest stories aloud.</b> Not to practise — to remind yourself you have them.</li>
<li><b>Recite the six fintech constraints.</b> Twice.</li>
<li><b>Skim your five design outlines.</b> Just the headings and the trade-offs.</li>
<li><b>Read your negotiation script.</b> Once.</li>
</ol>
<p><b>Then stop.</b> No new topics. No "one more thing."</p>

<h4>Midday — the first wave of applications</h4>
<pre><code>Wave 1 — 5 companies you're less excited about
These are practice. Expect to be rusty in the first two interviews.
Apply today. Don't wait until you feel ready — you won't feel ready.

Wave 2 — 5 match-tier companies
Apply once you've had at least one interview. You'll be sharper.

Wave 3 — your top 5
Apply after wave 1 has produced at least two interviews.
Your best performance should go to your best targets.</code></pre>
<div class="box o"><div class="t">Why waves</div>Interviewing is a skill that degrades without practice. Your first interview will be your worst — and that's fine if it's a company you're not desperate for. Sequencing means your top targets get your peak form rather than your warm-up. Most people apply to their dream job first and burn it.</div>

<h4>Afternoon — rest, genuinely</h4>
<p>Not "rest while feeling guilty about not studying." Actual rest. Walk. Sleep. Cook something. See people who aren't in tech. Your brain consolidates during rest — this is not a break from the plan, it's the last phase of it.</p>

<h4>The day before an interview — the protocol</h4>
<pre><code>Two hours maximum, review only:
• Read the cheat sheet
• Say three stories aloud
• Recite the six constraints
• Read your five questions
• Review the salary numbers

Then:
• Confirm the logistics: time, platform, dial-in, backup number
• Test your setup if it's virtual: camera, mic, background, lighting
• Lay out what you'll wear
• Set two alarms
• Go to bed early. Genuinely early.

Do NOT:
• Learn anything new
• Re-read your notes obsessively
• Do a mock interview
• Stay up late "finishing"</code></pre>

<h4>The day of — the first 30 minutes</h4>
<ol>
<li><b>Eat something.</b> Low blood sugar reads as nervousness and slows recall.</li>
<li><b>Read the cheat sheet once.</b> Five minutes, not thirty.</li>
<li><b>Say one story aloud</b> to warm up your voice and your delivery.</li>
<li><b>Breathe.</b> Four counts in, six counts out, five times. This genuinely lowers arousal.</li>
<li><b>Arrive early.</b> Five minutes, not twenty — twenty minutes of waiting increases anxiety.</li>
<li><b>Have water and paper.</b> Notes during the question give you a beat to think.</li>
</ol>

<h4>During the interview — the five reminders</h4>
<ul>
<li><b>Pause before answering hard questions.</b> Two seconds reads as consideration, not hesitation.</li>
<li><b>Think out loud.</b> They're scoring your reasoning, not your conclusions.</li>
<li><b>Say "I don't know" early</b> rather than circling for three minutes.</li>
<li><b>Watch your last sentence.</b> End on the Result or the Learning, not on a trailing-off.</li>
<li><b>Remember you're evaluating them too.</b> This is a two-way conversation. That framing alone reduces anxiety.</li>
</ul>

<h4>After the interview — within two hours</h4>
<pre><code>Write down, while it's fresh:
• Every question asked
• Where you were strong
• Where you fumbled
• The question you got wrong, and the correct answer
• What you'll drill before the next one

Then send a short thank-you note. Three sentences:
• Thanks for the time
• One specific thing you enjoyed discussing
• You're looking forward to the next step

No more than that. Don't relitigate the interview in the email.</code></pre>

<h4>The 90-day view</h4>
<table><thead><tr><th>Timeline</th><th>What happens</th></tr></thead><tbody>
<tr><td><b>Week 1–2</b></td><td>Wave 1 applications. First interviews. Expect to be rusty. Take notes after each.</td></tr>
<tr><td><b>Week 3–4</b></td><td>Wave 2 applications. You're sharper now. Offers start appearing.</td></tr>
<tr><td><b>Week 5–6</b></td><td>Wave 3 — your top targets. You're at peak form. Final rounds.</td></tr>
<tr><td><b>Week 7–8</b></td><td>Offers land. Negotiate. Compare on total package, not just base.</td></tr>
<tr><td><b>Week 9–12</b></td><td>Notice period, background checks, start date negotiation, onboarding prep.</td></tr>
</tbody></table>
<div class="box w"><div class="t">The thing that kills offers</div>Accepting too early because the process is exhausting. The negotiation window is short and it's worth real money — often $20–60K at your level. Don't take the first offer because you're tired. Take it because it's the best one you have after a real conversation about the number.</div>

<h4>The final checklist</h4>
<ul class="chk-list">
<li>Résumé with numbers in the first three bullets</li>
<li>LinkedIn rewritten for architect roles</li>
<li>Salary band researched per target, target and walk-away written down</li>
<li>Negotiation script rehearsed until automatic</li>
<li>Five designs from memory</li>
<li>Ten stories with numbers</li>
<li>Six fintech constraints recited</li>
<li>Five questions to ask each interviewer</li>
<li>Cheat sheet printed and reviewed</li>
<li>Wave 1 applications submitted today</li>
<li>Interview log started — every interview, written up within two hours</li>
</ul>

<h4>The last thing</h4>
<div class="box o"><div class="t">What you actually have now</div>
Fifty-six days ago you had 20 years of experience and a vague sense that you should prepare. You now have:<br><br>
• A complete refresh of every CS and Java fundamental that gets tested<br>
• Deep knowledge of distributed systems, databases, caching, messaging, and cloud<br>
• Five system designs you can whiteboard from memory<br>
• Domain expertise in payments — idempotency, ledgers, reconciliation, the six constraints<br>
• Ten quantified stories that demonstrate judgment, not just execution<br>
• A negotiation script and a researched salary band<br><br>
<b>That is a genuinely strong position.</b> The preparation is done. The remaining work is execution — showing up, staying sharp, and letting twenty years of pattern recognition do the work. Go get the offers.</div>`,

drill:["60 minutes of review, then stop. No new material.",
"Apply to 5 wave-1 companies today. Don't wait until you feel ready.",
"Rest. Genuinely. This is part of the plan, not a break from it."],

qa:[
["What if I still feel unprepared?","That feeling doesn't go away — it's not a signal that you need more preparation, it's a signal that you care. The question isn't whether you feel ready, it's whether you can deliver the five designs, ten stories, and six constraints. If you can, you're ready. And the only way to become more ready is to interview, because the real thing teaches you things no amount of study can."],
["How long should I keep preparing?","Until you're getting offers. If you're getting to final rounds and not converting, that's a specific gap to diagnose — usually negotiation or the behavioral round. If you're not getting to final rounds, the gap is earlier. But you can't diagnose any of that without interviewing. So the answer is: start now, and let the results tell you what to refine."],
["What if I get rejected?","Every rejection is information. Write down what happened within two hours and look for the pattern across rejections. If three companies all pass after the design round, that's a design problem. If they all pass after behavioral, that's a storytelling problem. Rejections are only wasted if you don't diagnose them. And at architect level, rejections often have nothing to do with your ability — the role was filled internally, the budget changed, they wanted a different domain."],
["How do I compare multiple offers?","On total package, not base. Base plus target bonus plus equity value plus sign-on, over the vesting period. Then adjust for: growth trajectory, the actual scope of the role, who you'd report to, how decisions get made, remote flexibility, and how the team treated you during the process. The company that was responsive and respectful during interviews is the one that'll be responsive and respectful when you work there. That's not a soft factor — it's predictive."],
["What's the one thing I should do differently from here?","Apply today rather than waiting until you feel ready. The single most common failure mode at this stage is continuing to prepare past the point of usefulness because the preparation feels safe and the interviewing feels risky. Every day you delay is a day your knowledge atrophies and your confidence erodes. Submit five applications today, even if you don't feel ready. You'll feel more ready after the first interview than you ever will from more study."]
],
exit:"Submit wave-1 applications today and rest. The preparation is done. Execution starts now."},

];

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const LS = {
get(k, d) { try { const v = localStorage.getItem('mat.v1.' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
set(k, v) { try { localStorage.setItem('mat.v1.' + k, JSON.stringify(v)); } catch(e){} },
del(k) { try { localStorage.removeItem('mat.v1.' + k); } catch(e){} }
};

let STATE = {
start: LS.get('start', iso(today())),
currentDay: LS.get('currentDay', 1),
done: LS.get('done', {}), // day -> true when exit check + all drills checked
drills: LS.get('drills', {}), // "d5:0" -> true
notes: LS.get('notes', {}), // day -> string
qa: LS.get('qa', {}), // "d5:2" -> true (revealed)

};

function save() {
LS.set('start', STATE.start);
LS.set('currentDay', STATE.currentDay);
LS.set('done', STATE.done);
LS.set('drills', STATE.drills);
LS.set('notes', STATE.notes);
LS.set('qa', STATE.qa);

}

const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function iso(d){ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Navigation ---------- */
function weeksOf(days) {
const out = {};
days.forEach(d => { (out[d.wk] = out[d.wk] || []).push(d); });
return out;
}

function renderNav() {
const nav = $('#nav');
const weeks = weeksOf(DAYS);
let html = '';
Object.keys(weeks).sort((a,b)=>a-b).forEach(w => {
const wk = weeks[w];
const doneCount = wk.filter(d => STATE.done[d.d]).length;
html += '<div class="wkg">Week ' + w + ' · ' + doneCount + '/' + wk.length + '</div>';
wk.forEach(d => {
const isDone = !!STATE.done[d.d];
const isOn = d.d === STATE.currentDay;
html += '<a class="dl' + (isDone?' done':'') + (isOn?' on':'') + '" data-day="' + d.d + '" href="#day' + d.d + '">' +
'<span class="n">' + String(d.d).padStart(2,'0') + '</span>' +
'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(d.title) + '</span>' +
'<span class="ck">✓</span></a>';
});
});
nav.innerHTML = html;
nav.querySelectorAll('.dl').forEach(a => {
a.addEventListener('click', e => {
e.preventDefault();
goToDay(parseInt(a.dataset.day, 10));
if (window.innerWidth <= 980) closeNav();
});
});
}

/* ---------- Day rendering ---------- */
function renderDay(d) {
const drillsKey = 'd' + d.d;
const drills = d.drill || [];
const allDrillsDone = drills.length === 0 || drills.every((_, i) => STATE.drills[drillsKey + ':' + i]);
const exitDone = !!STATE.done[d.d];

let html = '';
html += '<div class="day" id="day' + d.d + '">';
html += '<div class="dh">';
html += '<div class="top">';
html += '<span class="daynum">Day ' + d.d + '</span>';
html += '<span class="wkp">Week ' + d.wk + '</span>';
html += '<span class="prp ' + d.prio + '">' + d.prio + '</span>';
html += '</div>';
html += '<h1>' + esc(d.title) + '</h1>';
html += '<div class="obj"><b>Objective</b><span>' + esc(d.obj) + '</span></div>';
html += '</div>';

html += '<div class="db">';

// Core material
html += d.core;

// Drills
if (drills.length) {
html += '<h4>Drills — do these before moving on</h4>';
drills.forEach((dr, i) => {
const k = drillsKey + ':' + i;
const checked = !!STATE.drills[k];
html += '<label class="drill"><input type="checkbox" data-drill="' + k + '"' + (checked?' checked':'') + '>' +
'<span class="x">' + dr + '</span></label>';
});
}

// Self-test
if (d.qa && d.qa.length) {
html += '<h4>Self-test — answer aloud before revealing</h4>';
d.qa.forEach((pair, i) => {
const k = drillsKey + ':q' + i;
const open = !!STATE.qa[k];
html += '<div class="qa' + (open?' open':'') + '" data-qa="' + k + '">' +
'<div class="q"><span class="qn">Q' + (i+1) + '</span><span style="flex:1">' + pair[0] + '</span>' +
'<span class="tg">' + (open ? 'hide' : 'reveal') + '</span></div>' +
'<div class="a">' + pair[1] + '</div></div>';
});
}

// Exit check
html += '<div class="exit">';
html += '<div class="t">Exit check — only tick this if you can do it</div>';
html += '<div class="d">' + esc(d.exit) + '</div>';
html += '<label><input type="checkbox" id="exitCheck"' + (exitDone?' checked':'') + '> I can do this, out loud, without notes.</label>';
html += '</div>';

// Notes
html += '<div class="nb2"><h4>Notes for this day</h4>';
html += '<textarea data-notes="' + d.d + '" placeholder="What clicked, what is still fuzzy, what to revisit…">' + esc(STATE.notes[d.d] || '') + '</textarea>';
html += '<div class="nm"><span>' + (STATE.notes[d.d] || '').length + ' chars</span><span>saved locally</span></div></div>';

html += '</div></div>';

// Nav buttons
const prev = d.d > 1 ? d.d - 1 : null;
const next = d.d < DAYS.length ? d.d + 1 : null;
html += '<div class="nav">';
html += '<button class="nb" ' + (prev ? '' : 'disabled') + ' data-go="' + (prev || '') + '">← Day ' + (prev||'') + '</button>';
html += '<button class="nb" data-go-today>Jump to today</button>';
html += '<button class="nb pri" ' + (next ? '' : 'disabled') + ' data-go="' + (next || '') + '">Day ' + (next||'') + ' →</button>';
html += '</div>';

return html;
}

function bindDay(d) {
// drills
$$('input[data-drill]').forEach(cb => {
cb.addEventListener('change', () => {
STATE.drills[cb.dataset.drill] = cb.checked;
save(); updateProgress(); maybeComplete(d);
});
});
// QA toggle
$$('.qa').forEach(el => {
el.querySelector('.q').addEventListener('click', () => {
const k = el.dataset.qa;
const open = !STATE.qa[k];
STATE.qa[k] = open;
el.classList.toggle('open', open);
el.querySelector('.tg').textContent = open ? 'hide' : 'reveal';
save();
});
});
// exit
const ex = $('#exitCheck');
if (ex) {
ex.addEventListener('change', () => {
if (ex.checked) {
STATE.done[d.d] = true;
markStreak();
toast('Day ' + d.d + ' complete');
} else {
delete STATE.done[d.d];
}
save(); updateProgress(); renderNav();
});
}
// notes
const ta = $('textarea[data-notes]');
if (ta) {
ta.addEventListener('input', () => {
STATE.notes[d.d] = ta.value;
LS.set('notes', STATE.notes);
const m = ta.parentElement.querySelector('.nm span');
if (m) m.textContent = ta.value.length + ' chars';
});
}
// nav buttons
$$('[data-go]').forEach(b => {
b.addEventListener('click', () => {
const n = parseInt(b.dataset.go, 10);
if (n) goToDay(n);
});
});
const jt = $('[data-go-today]');
if (jt) jt.addEventListener('click', jumpToToday);
}

function maybeComplete(d) {
const drills = d.drill || [];
const allDone = drills.every((_, i) => STATE.drills['d' + d.d + ':' + i]);
if (allDone && drills.length) {
toast('All drills done — now tick the exit check if you can teach it');
}
}

function markStreak() {
const t = iso(today());
const s = STATE.streak;
if (s.last === t) return;
const y = iso(addDays(today(), -1));
s.count = (s.last === y) ? s.count + 1 : 1;
s.last = t;
save();
}

function goToDay(n) {
STATE.currentDay = n;
save();
render();
const el = document.getElementById('day' + n);
if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpToToday() {
const start = parse(STATE.start);
const elapsed = daysBetween(start, today());
const n = Math.max(1, Math.min(DAYS.length, elapsed + 1));
goToDay(n);
}

/* ---------- Progress ---------- */
function updateProgress() {
const totalDays = DAYS.length;
const doneDays = DAYS.filter(d => STATE.done[d.d]).length;
const pct = Math.round(doneDays / totalDays * 100);
$('#pbar').style.width = pct + '%';
$('#ptxt').textContent = doneDays + ' of ' + totalDays + ' days complete';
$('#ppct').textContent = pct + '%';
$('#hDone').textContent = doneDays + '/' + totalDays;

const totalDrills = DAYS.reduce((s, d) => s + (d.drill ? d.drill.length : 0), 0);
const doneDrills = Object.values(STATE.drills).filter(Boolean).length;
$('#hStreak').textContent = STATE.streak.count || 0;

const start = parse(STATE.start);
const elapsed = daysBetween(start, today());
const logical = Math.max(1, Math.min(DAYS.length, elapsed + 1));
$('#hDay').textContent = 'Day ' + logical;
$('#sbSub').textContent = 'Started ' + parse(STATE.start).getDate() + ' ' + MON[parse(STATE.start).getMonth()] + ' · ' + doneDays + '/' + totalDays + ' done';
}

/* ---------- Main render ---------- */
function render() {
const d = DAYS.find(x => x.d === STATE.currentDay) || DAYS[0];
$('#content').innerHTML = renderDay(d);
bindDay(d);
renderNav();
updateProgress();
}

/* ---------- Theme, menu, search, toast ---------- */
function toast(msg) {
const el = $('#toast');
el.textContent = msg;
el.classList.add('show');
clearTimeout(window.__tt);
window.__tt = setTimeout(() => el.classList.remove('show'), 2200);
}

function closeNav() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

function initChrome() {
const t = LS.get('theme','dark');
document.documentElement.setAttribute('data-theme', t);
$('#themeBtn').addEventListener('click', () => {
const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
document.documentElement.setAttribute('data-theme', n);
LS.set('theme', n);
});
$('#menuBtn').addEventListener('click', () => {
$('#sidebar').classList.toggle('open');
$('#scrim').classList.toggle('show');
});
$('#scrim').addEventListener('click', closeNav);
$('#todayBtn').addEventListener('click', jumpToToday);

// search
let timer;
$('#search').addEventListener('input', e => {
clearTimeout(timer);
timer = setTimeout(() => {
const q = e.target.value.trim().toLowerCase();
if (!q) { render(); return; }
const matches = DAYS.filter(d =>
(d.title + ' ' + d.obj + ' ' + d.core + ' ' + (d.drill||[]).join(' ') +
' ' + (d.qa||[]).map(p=>p[0]+' '+p[1]).join(' ')).toLowerCase().includes(q));
if (!matches.length) { toast('No days match "' + q + '"'); return; }
// jump to first match
goToDay(matches[0].d);
toast(matches.length + ' day' + (matches.length===1?'':'s') + ' match');
}, 200);
});
$('#search').addEventListener('keydown', e => {
if (e.key === 'Escape') { e.target.value = ''; render(); }
});

// keyboard
document.addEventListener('keydown', e => {
if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
if (e.key === 'ArrowRight' && STATE.currentDay < DAYS.length) goToDay(STATE.currentDay + 1);
if (e.key === 'ArrowLeft' && STATE.currentDay > 1) goToDay(STATE.currentDay - 1);
if (e.key === 't') $('#themeBtn').click();
});
}

/* ---------- Init ---------- */
initChrome();
render();
</script>
</body>
</html>
