<tr><td>Use for</td><td>Public APIs, browser clients</td><td>Service-to-service, streaming</td><td>Complex UIs, mobile clients</td></tr>
</tbody></table>
<p><b>The architect's take:</b> "REST for public APIs where caching and ubiquity matter. gRPC for internal service-to-service where performance and strong typing matter. GraphQL when the client has varied data needs and over-fetching is a real problem — typically a mobile app with limited bandwidth. Using GraphQL internally between services usually adds complexity for no benefit."</p>

<h4>Idempotency in HTTP</h4>
<table><thead><tr><th>Method</th><th>Safe</th><th>Idempotent</th></tr></thead><tbody>
<tr><td>GET, HEAD</td><td>Yes</td><td>Yes</td></tr>
<tr><td>PUT, DELETE</td><td>No</td><td>Yes</td></tr>
<tr><td>POST</td><td>No</td><td>No</td></tr>
<tr><td>PATCH</td><td>No</td><td>Not guaranteed</td></tr>
</tbody></table>
<p>POST isn't idempotent — which is exactly why payment APIs require an idempotency key. The key makes a non-idempotent method idempotent at the application level.</p>

<h4>DNS — the first step of every request</h4>
<pre><code>A → IPv4 address
AAAA → IPv6 address
CNAME → alias to another name
MX → mail server
TXT → verification, SPF, DKIM
NS → nameserver for the zone
SRV → service discovery (host + port)
SOA → zone authority</code></pre>
<p><b>Why it matters:</b> DNS is the first thing that happens, and its TTL controls how fast you can fail over. A TTL of 300 seconds means a failover takes up to 5 minutes. A TTL of 30 seconds enables fast failover but increases query load. And DNS caching is aggressive at every level — the OS, the resolver, the ISP — so lowering the TTL doesn't take effect immediately.</p>
<p><b>DNS-based load balancing</b> (round-robin, geo-routing via Route 53) is the cheapest global traffic distribution. But without health checks, it will happily route traffic to a dead server. Use it with health checks or not at all.</p>

<h4>Load balancing — L4 vs L7</h4>
<table><thead><tr><th></th><th>L4 (TCP/UDP)</th><th>L7 (HTTP)</th></tr></thead><tbody>
<tr><td>Operates on</td><td>IP + port</td><td>HTTP request content</td></tr>
<tr><td>Can inspect</td><td>Nothing — no payload</td><td>Headers, path, cookies</td></tr>
<tr><td>Routing</td><td>Round-robin, least connections, hash</td><td>Path, host, header, cookie</td></tr>
<tr><td>Performance</td><td>Very fast</td><td>Slower — TLS termination, parsing</td></tr>
<tr><td>Features</td><td>Basic health checks</td><td>TLS termination, sticky sessions, retries, WAF</td></tr>
<tr><td>Examples</td><td>AWS NLB, HAProxy TCP</td><td>AWS ALB, Nginx, Envoy</td></tr>
</tbody></table>
<p><b>Algorithms:</b> round-robin (ignores load), least connections (better for variable request times), least response time (best, needs measurement), IP hash (sticky sessions), consistent hashing (cache affinity).</p>

<h4>TLS — the handshake</h4>
<ol>
<li><b>Client Hello</b> — cipher suites, TLS version, random nonce, SNI (the hostname).</li>
<li><b>Server Hello</b> — chosen cipher, certificate, random nonce.</li>
<li><b>Key exchange</b> — client verifies the cert against trusted CAs, both derive a shared secret via ECDHE.</li>
<li><b>Finished</b> — both send a MAC over the handshake; encrypted communication begins.</li>
</ol>
<p><b>TLS 1.3 improvements:</b> 1-RTT handshake (0-RTT on resumption), removed weak ciphers, forward secrecy mandatory, encrypted SNI with ECH. This is why TLS 1.3 is measurably faster — one round trip instead of two.</p>
<p><b>mTLS:</b> both sides present certificates. Standard for service-to-service auth in zero-trust architectures and service meshes. The cost is certificate lifecycle management — issuance, rotation, revocation — which is why service meshes exist.</p>

<h4>Real-time communication</h4>
<table><thead><tr><th>Technique</th><th>Direction</th><th>Latency</th><th>Use when</th></tr></thead><tbody>
<tr><td>Short polling</td><td>Client → Server</td><td>Poll interval</td><td>Simple, low frequency</td></tr>
<tr><td>Long polling</td><td>Client → Server</td><td>Near real-time</td><td>Works everywhere; ties up connections</td></tr>
<tr><td>SSE</td><td>Server → Client</td><td>Real-time</td><td>One-way streaming: notifications, progress, feeds</td></tr>
<tr><td>WebSocket</td><td>Bidirectional</td><td>Real-time</td><td>Chat, collaboration, trading</td></tr>
<tr><td>Webhook</td><td>Server → Server</td><td>Event-driven</td><td>Async notification between services</td></tr>
</tbody></table>

<h4>Webhooks — the fintech requirement</h4>
<div class="box w"><div class="t">Three requirements for a webhook receiver</div>
<b>1. Verify the signature.</b> HMAC over the raw body with a shared secret. Otherwise anyone can POST a fake "payment succeeded."<br>
<b>2. Be idempotent.</b> You <em>will</em> receive duplicates — retries on timeout, at-least-once delivery. Dedupe by event ID.<br>
<b>3. Respond fast.</b> Return 200 within a second and process asynchronously. If you take 30 seconds, the sender will time out and retry, and now you have duplicate processing under load.<br><br>
Mention all three unprompted in a payments interview and you'll immediately sound like someone who's built this.</div>

<h4>API design principles worth stating</h4>
<ul>
<li><b>Version in the path</b> (<code>/v1/payments</code>) or a header. Path is simpler and more visible.</li>
<li><b>Pagination with a cursor, not an offset.</b> Offsets break when data changes and get slow at depth.</li>
<li><b>Consistent error format.</b> RFC 7807 Problem Details: <code>type</code>, <code>title</code>, <code>status</code>, <code>detail</code>, <code>instance</code>.</li>
<li><b>Idempotency keys on all POST endpoints that create resources.</b> Non-negotiable for anything financial.</li>
<li><b>Rate limit with headers</b> — <code>X-RateLimit-Limit</code>, <code>X-RateLimit-Remaining</code>, <code>Retry-After</code>.</li>
<li><b>Deprecation policy</b> — announce, support in parallel, sunset with a date. Never break a published contract.</li>
</ul>`,

drill:["Trace an HTTPS request from DNS lookup through TLS to the response. Write out every step.",
"Design a webhook receiver with signature verification, idempotency, and async processing.",
"Choose REST, gRPC, or GraphQL for five different scenarios and justify each in one sentence."],

qa:[
["Why does HTTP/3 use UDP?","Because TCP's ordered delivery creates head-of-line blocking that can't be fixed within TCP. QUIC implements its own reliability, ordering, and congestion control on top of UDP, but per-stream — so a lost packet only stalls its own stream. And because it's in userspace, it can be updated without changing the OS kernel. The trade-off is more CPU per connection, because the reliability logic runs in userspace rather than the kernel."],
["When would you use gRPC over REST for internal services?","When performance matters (Protobuf is much smaller than JSON), when you want strong typing and code generation across languages, or when you need streaming — gRPC has native bidirectional streaming. The costs are: not human-readable (harder to debug with curl), limited browser support (needs grpc-web and a proxy), and a harder time with load balancers that expect HTTP/1.1. For a small internal service, REST is often simpler and fast enough."],
["What's the difference between a 401 and a 403?","401 means not authenticated — you haven't proven who you are. The response should include a WWW-Authenticate header. 403 means authenticated but not authorised — we know who you are, and you don't have permission. Confusing them leaks information: returning 403 for an unauthenticated request tells the attacker the resource exists."],
["How do you handle API versioning without breaking existing clients?","Additive changes only in a version: new optional fields, new endpoints. Never remove a field or change its type or semantics. For breaking changes, add a new version in parallel and support both. Publish a deprecation timeline, add a Sunset header, monitor usage of the old version, and only remove it when traffic is zero. And never silently change behaviour — a field that was always populated becoming nullable is a breaking change."],
["Why is long polling still used when WebSockets exist?","Because it works through every proxy, firewall, and load balancer without special configuration, and it needs no client library. WebSockets require the infrastructure to support the upgrade handshake, and some corporate proxies break it. For a notification feature that fires a few times an hour, long polling is simpler and perfectly adequate. WebSockets are for genuinely interactive, high-frequency bidirectional communication."]
],
exit:"Trace an HTTPS request end to end, then explain the three webhook requirements, in 3 minutes."},

{d:36,wk:6,prio:"P1",title:"Microservices, DDD & Decomposition",
obj:"Decide when microservices are wrong, and decompose a system by bounded context.",
core:`<h4>The honest comparison</h4>
<table><thead><tr><th></th><th>Monolith</th><th>Modular Monolith</th><th>Microservices</th></tr></thead><tbody>
<tr><td>Deployment</td><td>Single unit</td><td>Single unit</td><td>Independent per service</td></tr>
<tr><td>Coupling</td><td>Often high</td><td>Enforced by module boundaries</td><td>Low runtime, high network</td></tr>
<tr><td>Transactions</td><td>Local ACID</td><td>Local ACID</td><td>Saga, outbox, eventual consistency</td></tr>
<tr><td>Scaling</td><td>Whole app</td><td>Whole app</td><td>Per service</td></tr>
<tr><td>Ops cost</td><td>Low</td><td>Low</td><td>Very high</td></tr>
<tr><td>Debugging</td><td>One stack trace</td><td>One stack trace</td><td>Distributed tracing required</td></tr>
<tr><td>Team autonomy</td><td>Low</td><td>Medium</td><td>High</td></tr>
</tbody></table>
<div class="box o"><div class="t">The answer that signals judgment</div>"I'd start with a modular monolith and extract services only when I have a specific reason: a team that needs independent deployment, a component with genuinely different scaling characteristics, or a domain with different availability requirements. Microservices trade a compile-time problem — coupling — for a runtime problem — distributed systems. That trade is only worth it past a certain organisational scale. Most companies that adopt microservices early regret it, and the cost is paid in operational complexity, not in code."</div>

<h4>When microservices are actually justified</h4>
<ol>
<li><b>Independent deployment.</b> Teams are blocked on each other's release cycles.</li>
<li><b>Different scaling profiles.</b> One component needs 100× the capacity of another.</li>
<li><b>Different availability requirements.</b> The payment path must be 99.99%; the reporting path can be 99%.</li>
<li><b>Different technology needs.</b> A Python ML service alongside Java services.</li>
<li><b>Regulatory isolation.</b> A component handling PII must be separately auditable.</li>
<li><b>Organisational scale.</b> Hundreds of engineers can't coordinate in one repo.</li>
</ol>
<p><b>If none of these apply, microservices are overhead without benefit.</b></p>

<h4>DDD — strategic patterns</h4>
<table><thead><tr><th>Concept</th><th>What it is</th><th>Why it matters</th></tr></thead><tbody>
<tr><td><b>Bounded context</b></td><td>An explicit boundary within which a domain model is defined and consistent</td><td>The primary decomposition tool. One service per context.</td></tr>
<tr><td><b>Ubiquitous language</b></td><td>Shared vocabulary between developers and domain experts</td><td>If the same word means different things in two contexts, that's a boundary.</td></tr>
<tr><td><b>Context map</b></td><td>How bounded contexts relate</td><td>Shared kernel, customer/supplier, conformist, anticorruption layer</td></tr>
<tr><td><b>Core domain</b></td><td>Where competitive advantage lives</td><td>Invest your best engineers here</td></tr>
<tr><td><b>Supporting / generic</b></td><td>Necessary but not differentiating</td><td>Buy or outsource</td></tr>
</tbody></table>
<div class="box"><div class="t">The bounded context test</div>If the word "customer" means "someone who buys things" in one part of the system and "the legal entity we have a contract with, including their credit limit and payment terms" in another, those are <b>two different bounded contexts</b>. They should not share a Customer entity. Each has its own model, its own database, and its own service. Recognising this is the core skill of decomposition.</div>

<h4>DDD — tactical patterns</h4>
<table><thead><tr><th>Pattern</th><th>Definition</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Entity</b></td><td>Has identity that persists across state changes</td><td><code>Order</code> with an orderId</td></tr>
<tr><td><b>Value Object</b></td><td>Immutable, defined by attributes, no identity</td><td><code>Money</code>, <code>Address</code>, <code>DateRange</code></td></tr>
<tr><td><b>Aggregate</b></td><td>Cluster of entities/VOs with one root; the consistency boundary</td><td><code>Order</code> + its <code>OrderLines</code></td></tr>
<tr><td><b>Aggregate Root</b></td><td>The only entry point; all invariants enforced here</td><td>You never modify an <code>OrderLine</code> directly</td></tr>
<tr><td><b>Repository</b></td><td>Persistence abstraction for one aggregate</td><td><code>OrderRepository</code>, not <code>OrderLineRepository</code></td></tr>
<tr><td><b>Domain Event</b></td><td>Something meaningful that happened</td><td><code>PaymentCaptured</code>, <code>OrderShipped</code></td></tr>
<tr><td><b>Domain Service</b></td><td>Logic that doesn't belong to a single entity</td><td>Funds transfer between two accounts</td></tr>
</tbody></table>
<div class="box b"><div class="t">The aggregate design rule</div><b>One aggregate = one transaction.</b> If you need to modify two aggregates atomically, either your boundaries are wrong, or you need eventual consistency between them. Keep aggregates small. A large aggregate means more contention, more data loaded, and more lock scope.</div>

<h4>Decomposition strategies</h4>
<ul>
<li><b>By business capability</b> — Payments, Fraud, Accounts, Notifications. Aligns with how the business thinks.</li>
<li><b>By bounded context</b> — each has its own model and language. Most robust.</li>
<li><b>By subdomain type</b> — core, supporting, generic. Different investment levels.</li>
<li><b>By scaling characteristics</b> — read-heavy vs write-heavy, latency-sensitive vs batch.</li>
<li><b>By transaction boundary</b> — things that must be atomic together belong together. This constraint most often overrides the others.</li>
<li><b>By team (Conway's Law)</b> — the system mirrors communication structure. Use the inverse Conway manoeuvre: design teams to produce the architecture you want.</li>
</ul>

<h4>Conway's Law and its inverse</h4>
<pre><code>Conway's Law:
Organisations design systems that mirror their own
communication structures.

Inverse Conway Manoeuvre:
Design the team structure you want, then let the
architecture emerge from it.

If you want microservices, you need small autonomous teams.
If you have one team of 8, you'll build a monolith — and that's correct.</code></pre>

<h4>Communication patterns</h4>
<table><thead><tr><th></th><th>Sync (REST/gRPC)</th><th>Async (events)</th></tr></thead><tbody>
<tr><td>Coupling</td><td>Temporal — both must be up</td><td>Decoupled — producer doesn't know consumers</td></tr>
<tr><td>Latency</td><td>Immediate</td><td>Eventual</td></tr>
<tr><td>Complexity</td><td>Simple to reason about</td><td>Harder to debug and trace</td></tr>
<tr><td>Failure</td><td>Cascades if one service is down</td><td>Buffered; consumer catches up</td></tr>
<tr><td>Consistency</td><td>Immediate if handled</td><td>Eventual by definition</td></tr>
<tr><td>Use</td><td>Queries needing an answer now</td><td>State changes others care about</td></tr>
</tbody></table>
<p><b>The guideline:</b> synchronous for queries (the caller needs the answer to proceed), asynchronous for commands and notifications (the caller doesn't wait). Chaining sync calls across five services is how you build a distributed monolith — it has all the coupling of a monolith and all the failure modes of a distributed system.</p>

<h4>Service boundaries — the tests</h4>
<ol>
<li><b>Can it be deployed independently?</b> If deploying it requires deploying another service, the boundary is wrong.</li>
<li><b>Does it own its data?</b> If two services write to the same table, they're one service pretending to be two.</li>
<li><b>Can it fail independently?</b> If its failure always takes down another service, they're coupled.</li>
<li><b>Does it have a clear owner?</b> If no team owns it, it will rot.</li>
<li><b>Can you describe what it does in one sentence without "and"?</b> If you need an "and," it's probably two services.</li>
</ol>

<h4>Architecture styles</h4>
<table><thead><tr><th>Style</th><th>Structure</th><th>Best for</th><th>Weakness</th></tr></thead><tbody>
<tr><td><b>Layered</b></td><td>Presentation → Business → Persistence</td><td>Simple CRUD</td><td>Changes ripple through layers</td></tr>
<tr><td><b>Hexagonal</b></td><td>Domain core with ports; adapters for I/O</td><td>Testable domain logic</td><td>More indirection</td></tr>
<tr><td><b>Clean / Onion</b></td><td>Concentric layers, dependencies inward</td><td>Complex domains</td><td>More code; steep curve</td></tr>
<tr><td><b>Event-Driven</b></td><td>Components communicate via events</td><td>Decoupled, reactive systems</td><td>Hard to trace</td></tr>
<tr><td><b>Microservices</b></td><td>Independently deployable services</td><td>Large orgs</td><td>Distributed complexity</td></tr>
<tr><td><b>Serverless</b></td><td>Functions as a service</td><td>Bursty, low-ops workloads</td><td>Cold starts, lock-in</td></tr>
</tbody></table>

<div class="box o"><div class="t">The line that wins the architecture round</div>"I don't have a default architecture. I have a default <em>process</em>: understand the constraints, identify the one or two that actually matter, and choose the simplest architecture that satisfies them. Most systems don't need microservices, event sourcing, or a service mesh — they need clear boundaries and good tests. The failure mode I see most is architects choosing the architecture they want to build rather than the one the problem requires."</div>`,

drill:["Take a system you know well. Identify its bounded contexts. Where does the same word mean different things?",
"Design a decomposition for an e-commerce system using DDD. Justify each service boundary against the five tests.",
"Argue for a modular monolith for a 20-person team. Then argue against it for a 200-person team."],

qa:[
["How do you decide the size of a microservice?","By the transaction boundary and the team that owns it, not by lines of code. A service should own one aggregate and be deployable independently by one team. If you find yourself needing a distributed transaction between two services, they're probably one service. If one team owns five services, they might be one service. The smell is coordination — if changing one thing requires coordinating multiple deploys, the boundary is wrong."],
["What's an anticorruption layer and when do you need one?","A translation layer between your bounded context and an external one, so the external model doesn't leak into yours. You need it when integrating with a legacy system or a third-party API whose model doesn't match yours. Without it, their concepts spread through your codebase and you can't change your model without breaking theirs. It's the DDD answer to the adapter pattern, applied at the context level."],
["Why is 'one aggregate per transaction' such a strong rule?","Because an aggregate is the consistency boundary — the unit within which invariants must hold atomically. If you need to modify two aggregates atomically, you're relying on a distributed transaction, which brings all the problems of 2PC. The rule forces you to either put the invariant inside one aggregate, or accept eventual consistency between them with an explicit reconciliation. Both are fine; pretending you have atomicity across two aggregates is not."],
["How does Conway's Law affect architecture decisions?","It means the architecture will mirror the communication structure whether you plan for it or not. If you have three teams, you'll get a three-service system — even if the domain needs four boundaries or two. The practical implication is that architecture changes require organisational changes. If you want to split a monolith, you need to split the team first, or the monolith will reform. This is why 'inverse Conway manoeuvre' is a real technique, not a buzzword."],
["When would you deliberately NOT use DDD?","When the domain is simple — CRUD screens over a database. DDD's tactical patterns (aggregates, value objects, domain events) add indirection that pays off in complex domains and becomes ceremony in simple ones. A basic admin tool doesn't need an aggregate root. The strategic patterns (bounded contexts, ubiquitous language) are more broadly useful, but even those are overkill for a single-team application."]
],
exit:"Argue for and against microservices for a specific scenario, then decompose a system by bounded context, in 4 minutes."},

{d:37,wk:6,prio:"P1",title:"CQRS, Event Sourcing & The Pattern Catalogue",
obj:"Know when each pattern applies and when it's over-engineering.",
core:`<h4>CQRS — separating reads from writes</h4>
<pre><code>COMMAND side (writes) QUERY side (reads)
validated, transactional denormalised, fast
normalised, consistent optimised per query
writes to write model reads from read model
↑
events keep them in sync</code></pre>
<p><b>The problem it solves:</b> a single model optimised for both reads and writes is optimised for neither. Writes need normalisation and invariants; reads need denormalisation and speed.</p>
<p><b>The cost:</b> eventual consistency between the two models, more infrastructure, and more code. The read model must handle stale data.</p>
<table><thead><tr><th>Use CQRS when</th><th>Don't when</th></tr></thead><tbody>
<tr><td>Read and write loads differ by 10× or more</td><td>The workload is balanced</td></tr>
<tr><td>Read queries are complex and slow against the write model</td><td>Simple CRUD</td></tr>
<tr><td>You already need event sourcing</td><td>You're adding it "for the future"</td></tr>
<tr><td>Different teams own reads and writes</td><td>One small team owns everything</td></tr>
</tbody></table>

<h4>Event Sourcing — the state IS the events</h4>
<pre><code>Traditional: store current state
orders: { id: 123, status: 'SHIPPED', total: 99.00 }

Event Sourcing: store the events; derive the state
OrderCreated { id: 123, total: 99.00 }
PaymentReceived{ id: 123, amount: 99.00 }
OrderPacked { id: 123 }
OrderShipped { id: 123, tracking: 'XYZ' }

current state = fold(events) ← replay to rebuild</code></pre>
<table><thead><tr><th>Benefit</th><th>Cost</th></tr></thead><tbody>
<tr><td>Complete audit trail for free</td><td>Schema evolution is hard — you can never change an old event</td></tr>
<tr><td>Replay to any point in time</td><td>Replay is slow; you need snapshots</td></tr>
<tr><td>Build new read models from history</td><td>Eventual consistency everywhere</td></tr>
<tr><td>Natural fit for event-driven systems</td><td>Unfamiliar mental model; harder to hire for</td></tr>
<tr><td>Debugging: you can see exactly what happened</td><td>Deleting data is very hard (GDPR right to erasure)</td></tr>
</tbody></table>
<div class="box b"><div class="t">Event Sourcing vs Event-Driven — the distinction people blur</div><b>Event-driven</b> means services communicate via events. <b>Event sourcing</b> means events are the source of truth for state. You can have event-driven without event sourcing (most systems). You can have event sourcing without event-driven (a single service). Being precise about this in an interview signals you actually understand it.</div>

<h4>Snapshots — the performance fix</h4>
<pre><code>Problem: an aggregate with 10,000 events takes 10,000 reads to load.

Solution: periodically snapshot the state.
snapshot at version 9500 = { status: 'SHIPPED', total: 99.00, ... }

Load = snapshot + replay events 9500..10000 → 501 reads instead of 10,000

Snapshot policy: every N events, or every N minutes, or by size.
Snapshots are a cache — the events remain the source of truth.</code></pre>

<h4>Schema evolution for events</h4>
<pre><code>Rules:
1. Events are immutable. You never change a stored event.
2. Add optional fields with defaults — readers tolerate absence.
3. Never remove a field or change its meaning.
4. Upcast on read: transform old versions to the current shape.

// Upcasting
OrderCreatedV1 { id, total }
OrderCreatedV2 { id, total, currency } // currency defaults to 'USD' for V1</code></pre>
<p><b>Why this is hard:</b> you have events from three years ago written by code that no longer exists. They must still be readable. This is the fundamental cost of event sourcing and the reason many teams avoid it.</p>

<h4>The pattern catalogue</h4>

<details><summary>API Gateway</summary>
<div class="dbody"><p>A single entry point routing to backend services. Handles authentication, rate limiting, request/response transformation, and observability. <b>Trade-off:</b> a potential bottleneck and SPOF. Keep it thin — business logic belongs in services. Use Backend-for-Frontend when different clients need different APIs.</p></div>
</details>

<details><summary>Service Discovery</summary>
<div class="dbody"><p>Services are ephemeral; IPs change. <b>Client-side:</b> the client queries a registry (Eureka, Consul) and picks an instance. <b>Server-side:</b> the client calls a load balancer that queries the registry. <b>Kubernetes:</b> built in — Services provide stable DNS names and virtual IPs.</p></div>
</details>

<details><summary>Sidecar & Service Mesh</summary>
<div class="dbody"><p><b>Sidecar:</b> a helper process alongside the main service sharing network and lifecycle. Handles logging, proxying, config without changing the app. <b>Service mesh:</b> a fleet of managed sidecars providing mTLS, traffic management, observability, and policy. <b>Trade-off:</b> adds latency, operational complexity, and a new thing to debug. Justified at scale; overkill for five services.</p></div>
</details>

<details><summary>Strangler Fig</summary>
<div class="dbody"><p>Incrementally replace a legacy system by routing traffic to new implementations piece by piece until the old one can be decommissioned. Put a facade in front, implement new functionality behind it, route traffic gradually. <b>Why it works:</b> no big-bang rewrite (which almost always fails), continuous value delivery, per-piece rollback. <b>The hard part:</b> data lives in both systems during the transition — you need CDC or dual-write with reconciliation.</p></div>
</details>

<details><summary>Backend for Frontend (BFF)</summary>
<div class="dbody"><p>One gateway per client type — web, mobile, partner API. Each BFF is optimised for its client's needs: the mobile BFF returns smaller payloads, the web BFF aggregates more. <b>Why:</b> a single API serving all clients ends up serving none well. <b>Cost:</b> more services to maintain, and duplicated logic across BFFs.</p></div>
</details>

<details><summary>Ambassador</summary>
<div class="dbody"><p>A sidecar that proxies <em>outbound</em> traffic — handles retries, circuit breaking, and observability for calls the service makes. Distinct from a sidecar that proxies inbound. Used when you want consistent outbound behaviour without changing application code.</p></div>
</details>

<details><summary>Leader Election</summary>
<div class="dbody"><p>One instance performs a task; others stand by. Implemented via a consensus store (etcd, ZooKeeper) holding a lease. <b>Use for:</b> scheduled jobs that must run once, partition assignment, cache warming. <b>The trap:</b> a leader that's partitioned from the consensus store must stop acting as leader. Leases handle this — the leader must renew, and stops when it can't.</p></div>
</details>

<details><summary>Distributed Lock</summary>
<div class="dbody"><p>Mutual exclusion across processes. <b>Redis SET NX EX</b> is the common implementation, with a Lua script for safe deletion. <b>The problem:</b> a single Redis instance is a SPOF; Redlock's safety is debated. <b>The architect's answer:</b> for anything where correctness matters, use a database unique constraint instead of a distributed lock. Most lock requirements are actually idempotency requirements in disguise.</p></div>
</details>

<details><summary>Rate Limiting</summary>
<div class="dbody"><p><b>Token bucket:</b> allows bursts up to the bucket size, then steady rate. <b>Sliding window:</b> smooths bursts entirely. <b>Fixed window:</b> simple but allows 2× the limit at the boundary. <b>Distributed:</b> needs shared state — Redis with Lua for atomicity. <b>Where to enforce:</b> at the edge for fairness, at the service for protection. Both.</p></div>
</details>

<details><summary>Idempotency Key</summary>
<div class="dbody"><p>A client-generated key stored with the request outcome, so retries return the same result. <b>Implementation:</b> atomic insert with a unique constraint before any side effect. Store a hash of the request body to detect key reuse with different payloads. <b>Retention:</b> long enough to cover the client's retry window — typically 24–72 hours.</p></div>
</details>

<details><summary>Circuit Breaker, Bulkhead, Timeout, Retry</summary>
<div class="dbody"><p>The resilience quartet. <b>Timeout:</b> bound every network call. <b>Retry:</b> exponential backoff with full jitter, only for retryable errors. <b>Circuit breaker:</b> fail fast when a dependency is failing. <b>Bulkhead:</b> isolate thread pools per dependency so one slow service doesn't consume all threads. Together they convert a cascade into a partial degradation.</p></div>
</details>

<details><summary>Saga & Outbox</summary>
<div class="dbody"><p><b>Saga:</b> a sequence of local transactions with compensating actions for rollback. Choreography for simple flows, orchestration for complex ones with audit needs. <b>Outbox:</b> write the business row and an event row in one local transaction; a separate relay publishes. Makes the impossible (atomic DB + message broker write) into two retryable operations.</p></div>
</details>

<details><summary>Anti-Corruption Layer</summary>
<div class="dbody"><p>A translation layer between your bounded context and an external one. Prevents a legacy or third-party model from leaking into yours. You need it when integrating with something whose concepts don't match — a mainframe, a vendor API, an acquired company's system.</p></div>
</details>

<h4>The over-engineering checklist</h4>
<div class="box w"><div class="t">Signs you're over-engineering</div>
• You have event sourcing but no audit requirement<br>
• You have CQRS but reads and writes have the same load<br>
• You have microservices but one team<br>
• You have a service mesh but eight services<br>
• You have Kafka but no throughput requirement<br>
• You have a distributed lock but no actual concurrency<br>
• You have sagas but the operations are all in one database<br><br>
Every pattern has a cost. If you can't name the specific problem it solves, you're paying the cost for nothing.</div>`,

drill:["Design event sourcing for a bank account. Define every event type and the snapshot policy.",
"Take a simple CRUD app and argue why CQRS would be over-engineering. Then find the one scenario where it wouldn't be.",
"Go through the pattern catalogue and for each, name the specific problem it solves — one sentence each."],

qa:[
["What's the difference between event sourcing and a traditional audit log?","An audit log records what happened alongside the current state, which remains the source of truth. In event sourcing, the events <em>are</em> the source of truth and the current state is derived. The practical difference: with event sourcing you can rebuild state at any point in time, project new read models from history, and the audit trail is structurally guaranteed rather than an additional concern. With an audit log, you can see what happened but the state is still primary — and if the log and the state disagree, the state wins."],
["How do you handle GDPR right-to-erasure with event sourcing?","This is genuinely hard and it's a real reason to avoid event sourcing for personal data. Options: (1) store PII separately from the event stream, keyed by a reference, and delete the PII — the events remain but contain only a reference. (2) Crypto-shredding: encrypt PII with a per-user key and delete the key. (3) Rewrite the event stream, which breaks immutability. In practice, option 1 is the standard answer — keep the event stream free of PII and store it in a separate, deletable store."],
["When would you use CQRS without event sourcing?","When read and write loads differ significantly, or when read queries are complex enough that they're slow against a normalised write model. You can maintain the read model via triggers, via an outbox feeding a projector, or via a materialised view. Event sourcing gives you a natural way to build the read model, but it's not required. CQRS is about separating the models; event sourcing is about how you store state."],
["Why is eventual consistency between read and write models acceptable?","Because for most queries, a 100ms lag is invisible. The user submits a form, sees a success page, and by the time they navigate to a list view, the read model has caught up. Where it isn't acceptable — read-your-writes — you handle it by returning the authoritative value in the write response, or by routing that specific read to the write model. The key is to identify which reads need freshness and which don't, rather than making everything strongly consistent."],
["How do you test an event-sourced system?","Three levels. Unit tests on the aggregates — given a sequence of events, assert the resulting state and the events emitted. These are pure functions and fast. Integration tests on the projectors — given a stream of events, assert the read model is correct. And replay tests — feed a production event stream into a new version of the projector and assert it produces the same result, which catches breaking changes before deployment. The last one is the most valuable and the one most teams skip."]
],
exit:"Explain CQRS and event sourcing in 90 seconds each, including the cost of each, then name three signs of over-engineering."},

{d:38,wk:6,prio:"P1",title:"Security — OWASP, Auth & Secrets",
obj:"Design a secure system and name the vulnerability class for each risk.",
core:`<h4>OWASP Top 10 — with the concrete attack</h4>
<table><thead><tr><th>#</th><th>Vulnerability</th><th>Concrete attack</th><th>Mitigation</th></tr></thead><tbody>
<tr><td>A01</td><td>Broken Access Control</td><td>Change <code>/orders/123</code> to <code>/orders/124</code> and see someone else's order</td><td>Server-side authorisation on every request; deny by default</td></tr>
<tr><td>A02</td><td>Cryptographic Failures</td><td>Passwords stored with MD5; data in transit over HTTP</td><td>TLS everywhere; bcrypt/argon2 for passwords; AES-256 at rest</td></tr>
<tr><td>A03</td><td>Injection</td><td><code>' OR 1=1 --</code> in a login form</td><td>Parameterised queries; never concatenate input</td></tr>
<tr><td>A04</td><td>Insecure Design</td><td>Password reset that emails the password in plaintext</td><td>Threat modelling; abuse-case testing</td></tr>
<tr><td>A05</td><td>Security Misconfiguration</td><td>Actuator <code>/env</code> exposed publicly, leaking DB credentials</td><td>Hardened baselines; no defaults; disable unused features</td></tr>
<tr><td>A06</td><td>Vulnerable Components</td><td>Log4Shell — a known CVE in a transitive dependency</td><td>Dependency scanning in CI; automated updates</td></tr>
<tr><td>A07</td><td>Auth Failures</td><td>Credential stuffing against an endpoint with no rate limit</td><td>MFA; rate limiting; breach-password checks</td></tr>
<tr><td>A08</td><td>Data Integrity Failures</td><td>Java native deserialization of untrusted input → RCE</td><td>Never deserialize untrusted data; allowlists</td></tr>
<tr><td>A09</td><td>Logging Failures</td><td>A breach goes undetected for six months</td><td>Log security events; alert on anomalies; retain logs</td></tr>
<tr><td>A10</td><td>SSRF</td><td>Submit <code>url=http://169.254.169.254/latest/meta-data/</code> and read cloud credentials</td><td>Allowlist outbound destinations; block metadata IPs</td></tr>
</tbody></table>
<div class="box b"><div class="t">The SSRF example worth knowing</div>The AWS metadata endpoint at <code>169.254.169.254</code> is the classic SSRF target. If your service fetches a user-supplied URL, an attacker can point it at the metadata service and retrieve the instance's IAM credentials. This was the mechanism behind the 2019 Capital One breach, which exposed 100 million records. Mitigations: IMDSv2 (which requires a token), allowlisting outbound destinations, and blocking link-local addresses at the network layer.</div>

<h4>Authentication vs Authorization</h4>
<table><thead><tr><th></th><th>Authentication (AuthN)</th><th>Authorization (AuthZ)</th></tr></thead><tbody>
<tr><td>Question</td><td>Who are you?</td><td>What can you do?</td></tr>
<tr><td>Mechanisms</td><td>Password, token, certificate, biometric</td><td>RBAC, ABAC, ReBAC, policy engine</td></tr>
<tr><td>Failure code</td><td>401 Unauthorized</td><td>403 Forbidden</td></tr>
<tr><td>When</td><td>Once per session</td><td>Every request</td></tr>
</tbody></table>

<h4>JWT — structure and the five pitfalls</h4>
<pre><code>header.payload.signature (base64url, dot-separated)

header: {"alg":"RS256","typ":"JWT"}
payload: {"sub":"user-123","iss":"auth.example.com",
"exp":1735689600,"iat":1735686000,"aud":"payments-api"}
signature: RS256(base64(header) + "." + base64(payload), privateKey)</code></pre>
<table><thead><tr><th>Pitfall</th><th>Attack</th><th>Fix</th></tr></thead><tbody>
<tr><td><b>alg: none</b></td><td>Attacker sets alg to "none" and removes the signature</td><td>Pin the expected algorithm server-side; reject "none"</td></tr>
<tr><td><b>HS256/RS256 confusion</b></td><td>Server expects RS256 but accepts HS256; attacker signs with the public key as an HMAC secret</td><td>Pin the algorithm; never derive it from the token</td></tr>
<tr><td><b>No expiry check</b></td><td>A stolen token works forever</td><td>Always validate <code>exp</code>; use short lifetimes</td></tr>
<tr><td><b>Trusting the payload</b></td><td>Payload is base64, not encrypted — anyone can read it</td><td>Never put secrets in a JWT; always verify the signature</td></tr>
<tr><td><b>localStorage storage</b></td><td>XSS reads the token</td><td>HttpOnly, Secure, SameSite cookies</td></tr>
</tbody></table>
<p><b>Revocation:</b> JWTs are valid until they expire. For immediate revocation you need a denylist (which reintroduces state) or short expiry plus refresh tokens. In practice: access tokens live 5–15 minutes, refresh tokens live days and are revocable.</p>

<h4>OAuth2 flows</h4>
<table><thead><tr><th>Flow</th><th>Use when</th></tr></thead><tbody>
<tr><td><b>Authorization Code + PKCE</b></td><td>Web apps, mobile, SPAs — the modern default. Always use PKCE.</td></tr>
<tr><td><b>Client Credentials</b></td><td>Service-to-service, no user involved</td></tr>
<tr><td><b>Device Code</b></td><td>Smart TVs, CLI tools — user authorizes on another device</td></tr>
<tr><td><b>Implicit</b></td><td><b>Deprecated.</b> Replaced by Auth Code + PKCE.</td></tr>
<tr><td><b>Resource Owner Password</b></td><td><b>Deprecated.</b> Only for trusted first-party migration.</td></tr>
</tbody></table>
<p><b>OIDC is OAuth2 + an ID token</b> (a JWT with identity claims). Use OIDC for authentication, OAuth2 for authorization. Confusing the two is a common interview trap — OAuth2 is an <em>authorization</em> framework, not an authentication protocol.</p>

<h4>Encryption at rest and in transit</h4>
<div class="grid g2">
<div class="card"><h4>In transit</h4>
<ul>
<li>TLS 1.2+ everywhere, including service-to-service</li>
<li>mTLS for zero-trust internal communication</li>
<li>HSTS to prevent downgrade</li>
<li>Certificate rotation automated (ACME, cert-manager)</li>
</ul></div>
<div class="card"><h4>At rest</h4>
<ul>
<li>Full-disk encryption — protects against physical theft only</li>
<li><b>Application-level encryption</b> for sensitive fields — protects against DB compromise</li>
<li>Envelope encryption: data key encrypted by a KMS master key</li>
<li>Key rotation policy with a documented schedule</li>
</ul></div>
</div>
<div class="box w"><div class="t">The distinction that matters</div>Full-disk encryption protects against someone stealing the disk. It does <b>not</b> protect against SQL injection, a misconfigured backup, a compromised application, or an over-privileged DBA. If you need the data to be unreadable by anyone with database access, you must encrypt at the application layer with a key the database never sees.</div>

<h4>Secrets management</h4>
<table><thead><tr><th>Approach</th><th>Verdict</th></tr></thead><tbody>
<tr><td>Hardcoded in source</td><td>Never. Not even in private repos.</td></tr>
<tr><td>Config files in the repo</td><td>Never</td></tr>
<tr><td>Environment variables</td><td>Better, but visible in process listings and crash dumps</td></tr>
<tr><td>Dedicated secret store (Vault, Secrets Manager)</td><td><b>The answer.</b> Rotation, audit, fine-grained access.</td></tr>
<tr><td>Kubernetes Secrets</td><td>Base64 by default — use External Secrets Operator or Sealed Secrets</td></tr>
</tbody></table>
<p><b>Rotation is the point.</b> A secret that's never rotated is a secret that will eventually leak and stay valid forever. Automate rotation and make sure applications can handle a rotation without a restart.</p>

<h4>The security questions architects get asked</h4>
<div class="qa">
<div class="q">How do you secure service-to-service communication?</div>
<div class="a"><p>"Three layers. First, mTLS for transport — every service has a certificate and both sides verify. In Kubernetes a service mesh handles this without application changes. Second, workload identity with short-lived credentials — SPIFFE/SPIRE, or the cloud provider's IAM roles, so there are no long-lived secrets. Third, network segmentation — services can only reach what they need, enforced by security groups or network policies. The principle is zero-trust: never assume the internal network is safe. I've seen too many architectures where the perimeter is hardened and everything inside is wide open."</p></div>
</div>
<div class="qa">
<div class="q">How do you handle PII in a payment system?</div>
<div class="a"><p>"The first rule is don't store what you don't need. For PCI, card data never touches our servers — we tokenize at the edge with the PSP's SDK. What we do store is encrypted with a KMS-managed key, and access is logged. Logs are scrubbed at the logging library level, not by a post-processing job, because a post-processing job can fail and the PII is already in the log aggregator. For data at rest I'd use column-level encryption so a database compromise doesn't expose it. For data in use — the hardest case — tokenization or format-preserving encryption if analytics needs to work with it."</p></div>
</div>
<div class="qa">
<div class="q">How do you prevent SQL injection?</div>
<div class="a"><p>"Parameterized queries, always. PreparedStatement in JDBC, or the equivalent in JPA. Never string concatenation, never String.format into a query, never dynamic table names from user input. If I genuinely need dynamic SQL — a reporting tool, for example — the column and table names come from an allowlist, never from user input. I'd also add a static analysis rule that fails the build on string concatenation into a query, because this is a class of bug that should be impossible to introduce rather than something to catch in review."</p></div>
</div>

<h4>Threat modelling — the practical version</h4>
<ol>
<li><b>What are we building?</b> Draw the data flow. Where does data enter, where does it leave, where is it stored.</li>
<li><b>What can go wrong?</b> For each element, ask: can this be spoofed? Tampered with? Repudiated? Disclosed? Denied? Escalated?</li>
<li><b>What are we going to do about it?</b> For each risk, a mitigation or an explicit acceptance.</li>
<li><b>Did we do a good job?</b> Test the mitigations. Revisit when the design changes.</li>
</ol>
<p><b>STRIDE</b> is the mnemonic: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Running through STRIDE on a data flow diagram takes 30 minutes and catches most design-level issues.</p>`,

drill:["Take a login endpoint and list every attack it's vulnerable to. Write the mitigation for each.",
"Decode a JWT by hand. Then forge one with alg:none and verify a naive verifier accepts it.",
"Run a threat model on a payment flow using STRIDE. List five risks and their mitigations."],

qa:[
["Why is OAuth2 not an authentication protocol?","Because it issues access tokens for <em>authorization</em> — permission to access a resource. It says nothing about who the user is. Historically people used the access token as proof of identity, which led to vulnerabilities because a token issued for one purpose could be replayed for another. OIDC was created to add an identity layer: an ID token that's a JWT with verified identity claims, issued alongside the access token. Use OIDC for authentication."],
["How do you store passwords correctly?","With a memory-hard, salted hash — bcrypt, scrypt, or Argon2id. Argon2id is the current recommendation. The key properties: a unique salt per password (so rainbow tables don't work), a tunable cost factor (so you can increase it as hardware gets faster), and deliberate slowness. Never SHA-256 or MD5 — they're designed to be fast, which is exactly wrong for passwords. And never encrypt a password — it should be hashed, not reversible."],
["What's the difference between RBAC and ABAC?","RBAC assigns permissions to roles, and users to roles. Simple, auditable, and sufficient for most systems. ABAC evaluates policies over attributes of the user, the resource, and the environment — so "managers can approve expenses under $5,000 during business hours" is expressible. ABAC is more flexible and more complex. In practice most systems start with RBAC and add attribute conditions where needed. Tools like Open Policy Agent let you externalise the policy so it's not scattered through the code."],
["How do you handle secrets in a CI/CD pipeline?","Never in the repository, never in build logs. Use the CI system's secret store (GitHub Actions secrets, GitLab CI variables) for pipeline credentials, and a dedicated secret manager (Vault, AWS Secrets Manager) for application secrets. The pipeline authenticates to the secret manager with a short-lived identity — OIDC federation with the cloud provider, so there are no long-lived cloud credentials in the CI system at all. That last part is important: many breaches start with a long-lived CI credential."],
["Why is encryption at rest alone insufficient?","Because the application decrypts the data to use it. If an attacker compromises the application, they can read everything the application can read — the encryption at rest is irrelevant. Encryption at rest protects against physical theft of the disk and against someone accessing the raw storage. If your threat model includes a compromised application or an over-privileged insider, you need application-level encryption where the key is held outside the application's normal trust boundary, or tokenization where the sensitive data never reaches your system at all."]
],
exit:"Name the OWASP Top 10 with a concrete attack for each, then design mTLS-based service-to-service auth, in 4 minutes."},

{d:39,wk:6,prio:"P0",title:"System Design Framework & First Drill",
obj:"Internalise the 6-phase framework and deliver your first full design under time.",
core:`<h4>The 6-phase framework</h4>
<table><thead><tr><th>Phase</th><th>Time (45 min)</th><th>What you do</th></tr></thead><tbody>
<tr><td><b>1. Clarify &amp; scope</b></td><td>5 min</td><td>Ask about scale, latency, consistency, failure tolerance, and what's out of scope. <b>Draw nothing yet.</b></td></tr>
<tr><td><b>2. Back-of-envelope</b></td><td>4 min</td><td>QPS, storage/year, read:write ratio. Round aggressively.</td></tr>
<tr><td><b>3. API contract</b></td><td>4 min</td><td>4–6 endpoints or events. Forces precision about what the system does.</td></tr>
<tr><td><b>4. High-level design</b></td><td>10 min</td><td>Boxes and arrows. Data flow, not deployment topology.</td></tr>
<tr><td><b>5. Deep dive</b></td><td>15 min</td><td>Pick the 2 hardest components and go deep. This is where you win.</td></tr>
<tr><td><b>6. Failure modes &amp; trade-offs</b></td><td>7 min</td><td>What breaks, what you'd monitor, what you'd do differently.</td></tr>
</tbody></table>

<h4>Phase 1 — the clarifying questions that make you sound senior</h4>
<div class="grid g2">
<div class="card"><h4>Scale &amp; shape</h4>
<ul>
<li>How many users / transactions per day? Peak vs average?</li>
<li>Read:write ratio?</li>
<li>Global or single region? Data residency requirements?</li>
<li>Expected growth over 2 years?</li>
</ul></div>
<div class="card"><h4>Correctness &amp; cost</h4>
<ul>
<li>What happens if two users act on the same record simultaneously?</li>
<li>Is eventual consistency acceptable anywhere, or is everything money-critical?</li>
<li>Cost of a duplicate vs cost of a loss?</li>
<li>Latency SLA — p50 and p99?</li>
</ul></div>
</div>
<div class="box w"><div class="t">The most common senior-candidate mistake</div>Diving into architecture in the first 60 seconds. Interviewers read this as "can't handle ambiguity — will build the wrong thing confidently." Even if you're certain, ask two questions and state your assumptions out loud: <em>"I'll assume 5,000 TPS peak, strong consistency on the ledger, eventual on the read model, single-region for now — correct me if that's off."</em></div>

<h4>Phase 2 — the numbers</h4>
<pre><code>1M requests/day ≈ 12 req/s average
plan for 3–5× peak ≈ 50 req/s

1M writes/day @ 1KB ≈ 1GB/day ≈ 365GB/year
× 3 for replication = ~1.1TB/year
+ indexes ≈ 1.5–2TB/year

Single Postgres ~5–10K simple TPS, thousands of writes/s tuned
Kafka partition ~10MB/s per partition (safe planning number)
Redis single node ~100K ops/s, sub-millisecond
SSD random read ~100μs
DC network RTT ~0.5ms
Cross-region RTT 50–150ms</code></pre>

<h4>Phase 5 — what "deep dive" means</h4>
<p>Don't go deeper on everything. Pick the two components where the risk concentrates and go three levels down. Signs you've gone deep enough:</p>
<ul>
<li>You've described a specific failure mode and what happens.</li>
<li>You've named a trade-off and the price you're paying.</li>
<li>You've said what you'd monitor.</li>
<li>You've said what you'd do differently with more time or budget.</li>
</ul>

<h4>Phase 6 — the failure checklist</h4>
<ol>
<li>What happens when each component is down?</li>
<li>What happens when each component is slow?</li>
<li>What happens during a network partition?</li>
<li>What happens when the data grows 10×?</li>
<li>What's the blast radius of a bad deploy?</li>
<li>What would you monitor, and what would page someone?</li>
<li>What's the rollback plan?</li>
</ol>

<h4>Phrases that signal architect-level thinking</h4>
<ul>
<li>"Before I design, let me confirm what we're optimising for."</li>
<li>"There are two viable approaches. Let me give you the trade-off and my recommendation."</li>
<li>"This is where the risk concentrates, so I'd prototype it first."</li>
<li>"I'm choosing X, and the price I'm paying is Y."</li>
<li>"If this fails at 3am, here's what the on-call sees."</li>
<li>"That's a build-vs-buy call. My instinct is buy — this isn't our differentiator."</li>
<li>"I'd want an ADR for this so the reasoning survives us."</li>
</ul>

<h4>Drill 1 — Design a URL shortener</h4>
<p><b>Do this now, timed at 35 minutes, before reading the model answer.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Phase 1 — Clarify:</b> How many URLs per day? (assume 100M writes/day, 10B reads/day — 100:1 read:write). Custom aliases? Analytics? Expiry? Do short links need to be unguessable?</p>
<p><b>Phase 2 — Numbers:</b> 100M writes/day ≈ 1,200 writes/s, peak 5,000/s. 10B reads/day ≈ 115,000 reads/s, peak 500,000/s. Storage: 100M × 500 bytes ≈ 50GB/year — small. Reads dominate massively.</p>
<p><b>Phase 3 — API:</b></p>
<pre><code>POST /urls {longUrl, customAlias?, ttl?} → {shortUrl, code}
GET /{code} → 302 redirect (or 301 for permanent)
GET /urls/{code}/stats → {clicks, referrers, geo}
DELETE /urls/{code}</code></pre>
<p><b>Phase 4 — High level:</b> Write path: API → ID generator → DB → cache. Read path: API → cache → DB → 302. The read path is the whole game — 500K reads/s can't hit a database.</p>
<p><b>Phase 5 — Deep dive on the two hard parts:</b></p>
<p><b>(a) ID generation.</b> Options: auto-increment (single point of failure, and sequential IDs are guessable), UUID (too long — 36 chars), hash of the URL (collisions, and the same URL gets the same code which may be undesirable), or a distributed counter. I'd use a <b>Snowflake-style ID</b> — 64-bit, timestamp + worker ID + sequence — encoded in base62 for a 7-character code. Base62 with 7 chars gives 62⁷ ≈ 3.5 trillion combinations. Each API node has a worker ID from a coordination service (etcd or ZooKeeper, allocated in blocks), so there's no coordination per request. IDs are roughly time-ordered, which keeps index inserts efficient.</p>
<p><b>(b) The read path.</b> 500K reads/s. Strategy: <b>cache-aside with Redis, and a CDN in front.</b> Redis holds the hot mappings — a small fraction of URLs get the vast majority of traffic (Zipf distribution). The CDN caches the 302 response itself, which means most reads never reach our infrastructure at all. I'd set a long CDN TTL because the mapping is immutable — a short code always points to the same URL. Cache-aside with a TTL of hours in Redis, and negative caching for unknown codes with a short TTL to prevent penetration attacks. For the DB, read replicas handle the misses, and the write volume (1,200/s) is trivial for a single primary.</p>
<p><b>(c) Analytics.</b> Don't do it synchronously. Publish a click event to Kafka and process it asynchronously. The redirect path must never wait on analytics.</p>
<p><b>Phase 6 — Failure modes:</b> Redis down → all reads hit the DB → the DB melts. Mitigations: local in-process cache in front of Redis, request coalescing, and rate limiting at the CDN. ID generator down → can't create new URLs, but existing redirects still work (acceptable degradation — reads dominate). DB primary down → writes fail, reads still work from replicas. CDN down → traffic hits origin, which is why the origin needs to survive a thundering herd.</p>
<p><b>Trade-off I'd state:</b> I'm choosing 302 (temporary) over 301 (permanent) so I can change the destination and still count clicks. The cost is that browsers don't cache it, so every click hits my infrastructure. If analytics didn't matter, 301 would offload almost everything to the browser.</p>
</div>
</details>

<h4>Self-assessment</h4>
<table><thead><tr><th>Dimension</th><th>Did you...</th></tr></thead><tbody>
<tr><td>Clarification</td><td>Ask at least 4 questions before drawing?</td></tr>
<tr><td>Numbers</td><td>Compute QPS and storage, and use them to drive decisions?</td></tr>
<tr><td>API</td><td>Define 4–6 endpoints with request/response shapes?</td></tr>
<tr><td>Depth</td><td>Pick 2 components and go three levels down?</td></tr>
<tr><td>Trade-offs</td><td>Name at least 3 explicit trade-offs?</td></tr>
<tr><td>Failure</td><td>Describe what happens when each component fails?</td></tr>
<tr><td>Monitoring</td><td>Name the metrics you'd alert on?</td></tr>
</tbody></table>`,

drill:["Do the URL shortener drill, timed at 35 minutes, without looking at the answer.",
"Write out the 6-phase framework from memory. Time yourself on each phase.",
"Record yourself answering 'how would you design a rate limiter' in 5 minutes. Watch it back."],

qa:[
["What do you do if you don't know how to approach a design problem?","Start with the requirements. Ask about scale, then compute the numbers — the numbers usually tell you where the complexity is. If writes are 1,000/s, you have a simple problem. If reads are 500,000/s, the read path is the whole design. Then work top-down: API, then data flow, then the components. If you get stuck on a component, say so explicitly and move on — 'I'd want to prototype this, but let me sketch the rest.' Interviewers prefer visible structured reasoning over silent struggle."],
["How deep should you go on any single component?","Until you've named a specific failure mode and what happens when it occurs. That's the signal you understand it. If you're describing a component at the level of 'it stores the data,' you haven't gone deep enough. If you're describing a specific configuration parameter and its trade-off, you've gone too deep for the time budget — pull back and cover the rest of the design."],
["What if the interviewer disagrees with your approach?","Engage with the substance, not the authority. 'That's possible — which part concerns you?' If they name a real problem, acknowledge it and revise visibly. If you think they're wrong, say so with a reason: 'I'd push back on that, because X. But if X isn't a constraint in your context, then your approach is better.' Visibly revising your own work under new information is one of the strongest signals you can send."],
["How do you handle a design you've never seen before?","Most design problems are combinations of patterns you know. Break it into: what's the write path, what's the read path, what's the consistency requirement, what's the scale. Then map each to a pattern. A ride-sharing system is a write path (location updates), a read path (matching), and a consistency requirement (a driver can't be matched to two riders). That decomposition makes an unfamiliar problem tractable."],
["What's the biggest mistake candidates make at architect level?","Over-engineering. Proposing Kafka, Cassandra, and a service mesh for a system that handles 100 requests per second. It signals you can't calibrate, which is a worse failure than not knowing a pattern. The fix is to always compute the numbers first and let them drive the complexity. If 1,000 requests per second, a single Postgres and a cache is the right answer, and saying so confidently is more impressive than a distributed system that isn't needed."]
],
exit:"Deliver the URL shortener design in 35 minutes, hitting all six phases, and name at least five trade-offs."},

{d:40,wk:6,prio:"P0",title:"Design Drill — Rate Limiter & Notification Service",
obj:"Two more full designs under time, focusing on the hard parts.",
core:`<h4>Drill 2 — Distributed Rate Limiter</h4>
<p><b>Do this in 30 minutes before reading.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Clarify:</b> Per-user, per-IP, per-API-key, or per-endpoint? What's the limit — requests per second, per minute? What happens when exceeded — reject, queue, or degrade? Is the limit global across all instances, or per-instance? Do different tiers get different limits?</p>
<p><b>Assume:</b> per-API-key, 1,000 requests/minute, global across all instances, reject with 429 and Retry-After.</p>
<p><b>Numbers:</b> 500K requests/s across all keys. If each request does a Redis call, that's 500K Redis ops/s. A single Redis node does ~100K ops/s, so I need a Redis cluster with ~5–10 shards, or a local cache that reduces Redis calls by 90%.</p>
<p><b>The algorithms:</b></p>
<table><thead><tr><th>Algorithm</th><th>Behaviour</th><th>Memory</th><th>Accuracy</th></tr></thead><tbody>
<tr><td>Fixed window</td><td>Counter resets every minute</td><td>1 counter per key</td><td>Allows 2× at the boundary</td></tr>
<tr><td>Sliding window log</td><td>Store every timestamp</td><td>O(requests) per key</td><td>Exact</td></tr>
<tr><td>Sliding window counter</td><td>Weighted average of two windows</td><td>2 counters per key</td><td>Close approximation</td></tr>
<tr><td>Token bucket</td><td>Refill at a steady rate, allow bursts</td><td>2 values per key</td><td>Exact, allows bursts</td></tr>
<tr><td>Leaky bucket</td><td>Constant drain rate</td><td>Queue</td><td>Smooths bursts entirely</td></tr>
</tbody></table>
<p><b>My choice: token bucket.</b> It's the standard for API rate limiting because it allows legitimate bursts while enforcing a steady-state rate, and it's O(1) memory per key. Users don't behave uniformly — a burst of 10 requests in a second is normal and shouldn't be throttled if the minute average is fine.</p>
<p><b>The implementation — Redis with Lua:</b></p>
<pre><code>-- KEYS[1] = bucket key
-- ARGV[1] = capacity, ARGV[2] = refill rate/sec, ARGV[3] = now (ms), ARGV[4] = requested
local bucket = redis.call('HMGET', KEYS[1], 'tokens', 'last')
local tokens = tonumber(bucket[1]) or tonumber(ARGV[1])
local last = tonumber(bucket[2]) or tonumber(ARGV[3])

local elapsed = math.max(0, tonumber(ARGV[3]) - last) / 1000
tokens = math.min(tonumber(ARGV[1]), tokens + elapsed * tonumber(ARGV[2]))

local allowed = 0
if tokens &gt;= tonumber(ARGV[4]) then
tokens = tokens - tonumber(ARGV[4])
allowed = 1
end

redis.call('HMSET', KEYS[1], 'tokens', tokens, 'last', ARGV[3])
redis.call('EXPIRE', KEYS[1], 60) -- cleanup idle keys
return {allowed, math.floor(tokens)}</code></pre>
<div class="box o"><div class="t">Why Lua</div>The read-modify-write must be atomic. Doing GET, computing, and SET in three round trips has a race — two concurrent requests can both read the same token count and both be allowed. Lua scripts execute atomically in Redis, so the whole check-and-decrement is one operation. This is the correct answer and interviewers look for it.</div>
<p><b>Reducing Redis load — the two-tier approach:</b></p>
<p>A local in-process token bucket per instance, refilling from Redis every N seconds. The instance allows requests locally and periodically syncs its allowance from the global bucket. This reduces Redis calls by 10–100× at the cost of approximate global accuracy — the instance might allow a few extra requests in the sync window. For most rate limiting that's acceptable; for strict limits it isn't.</p>
<pre><code>Global bucket: 1000 tokens/minute
10 instances → each gets 100 tokens/minute locally
Each instance refills from Redis every 5 seconds (12 times/minute)
Worst case overshoot: 10 instances × (100/12) ≈ 83 extra requests</code></pre>
<p><b>Failure mode:</b> Redis down. Options: fail open (allow everything — risks overload), fail closed (reject everything — outage), or fall back to local-only limits. I'd fail open with a local per-instance limit as a backstop, because a rate limiter outage shouldn't become a service outage. But if the limiter protects against a genuine attack, fail closed might be correct. That's a business decision, and I'd flag it as one.</p>
<p><b>Where to enforce:</b> at the API gateway for fairness across all clients, and optionally at each service for defence in depth. The gateway is the primary; the service-level limit protects against a misconfigured gateway.</p>
<p><b>What I'd monitor:</b> rejection rate per key (a spike means either an attack or a misconfigured client), Redis latency, the ratio of local to global decisions, and the overshoot — the difference between the intended limit and the actual allowed rate.</p>
</div>
</details>

<h4>Drill 3 — Notification Service</h4>
<p><b>Do this in 30 minutes before reading.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Clarify:</b> Which channels — email, SMS, push, in-app? Volume? Latency requirement — seconds or minutes? Delivery guarantees — at-least-once? Do users have preferences and quiet hours? Is it transactional (a receipt) or marketing (a promotion)?</p>
<p><b>The distinction that matters most:</b> transactional notifications must be delivered reliably and quickly; marketing notifications are bulk, can be batched and rate-limited, and must respect unsubscribe and quiet hours. These are different pipelines with different SLAs, and conflating them is the classic mistake.</p>
<p><b>Architecture:</b></p>
<pre><code>Producer services
↓ (publish event)
Kafka: notifications.requested
↓
Notification Orchestrator
- deduplication (idempotency key)
- user preferences check
- quiet hours check
- rate limiting per user per channel
- template rendering
- channel routing
↓
┌───────┬───────┬───────┬────────┐
Email SMS Push In-App
↓ ↓ ↓ ↓
Provider Provider Provider DB
↓ ↓ ↓
└───────┴──────┴──→ Delivery status events → Kafka → Analytics</code></pre>
<p><b>Why Kafka rather than direct calls:</b> a notification failure must never fail the business operation. If the email provider is down, the order still completes. Kafka decouples and buffers. Each channel gets its own consumer group so a slow SMS provider doesn't block email.</p>
<p><b>Idempotency:</b> the producer supplies a key — typically <code>eventType:entityId:userId</code> — and the orchestrator dedupes. Otherwise a retried order event sends two receipts. Store keys with a TTL in Redis or a database with a unique constraint.</p>
<p><b>User preferences:</b> a per-user record of which channels are enabled for which notification types, plus quiet hours and timezone. Checked at the orchestrator, not at the producer — the producer shouldn't need to know about preferences.</p>
<p><b>Retry and DLQ per channel:</b></p>
<pre><code>Email: retry 3× with exponential backoff; DLQ after
SMS: retry 2× (costs money per attempt); DLQ
Push: retry 3×; if the token is invalid, remove it
In-App: write to DB; retry is unnecessary (it's just a row)</code></pre>
<p><b>Provider failover:</b> for SMS especially, having two providers with automatic failover is standard. Route by health, and track delivery rates per provider — a provider silently degrading is worse than one that fails loudly.</p>
<p><b>Rate limiting per user:</b> essential. A bug that fires 1,000 notifications to one user is a real incident. Cap per user per channel per hour, and alert when the cap is hit — it usually means a producer bug.</p>
<p><b>Delivery tracking:</b> providers send webhooks for delivered/bounced/opened. Consume them, update the notification record, and publish to Kafka for analytics. This gives you the delivery rate per channel per provider — the metric that matters operationally.</p>
<p><b>Scale numbers:</b> if the system sends 10M notifications/day, that's ~120/s average, ~600/s peak. Easily handled by a handful of consumers. The bottleneck is the provider's rate limit, not your infrastructure — which is why the consumers must be rate-limited to the provider's capacity, not autoscaled to infinity.</p>
<p><b>Failure modes:</b> Kafka down → producers buffer or drop (depends on the criticality). Orchestrator down → notifications queue in Kafka and drain when it recovers; nothing is lost. Provider down → circuit breaker opens, retries go to the secondary provider, or the message goes to a retry queue. Preference store down → fail closed (don't send) if compliance matters, or use a cached copy.</p>
<p><b>Trade-off:</b> I'm choosing at-least-once delivery with deduplication rather than exactly-once. The cost is that a user might occasionally receive a duplicate in the rare window where dedupe fails. The alternative — exactly-once — would require coordination with external providers, which is impossible. For notifications, a rare duplicate is acceptable; for payments it wouldn't be.</p>
</div>
</details>

<h4>Self-assessment for both drills</h4>
<table><thead><tr><th>Dimension</th><th>Rate limiter</th><th>Notifications</th></tr></thead><tbody>
<tr><td>Did you ask clarifying questions?</td><td></td><td></td></tr>
<tr><td>Did you compute the numbers and let them drive decisions?</td><td></td><td></td></tr>
<tr><td>Did you name the algorithm/pattern and justify it against alternatives?</td><td></td><td></td></tr>
<tr><td>Did you handle the failure modes?</td><td></td><td></td></tr>
<tr><td>Did you name the metrics you'd monitor?</td><td></td><td></td></tr>
<tr><td>Did you state an explicit trade-off?</td><td></td><td></td></tr>
</tbody></table>`,

drill:["Rate limiter — 30 minutes timed, then compare against the model answer. Note what you missed.",
"Notification service — 30 minutes timed. Focus on the transactional-vs-marketing distinction.",
"Re-do the URL shortener from Day 39 without notes. Measure whether you improved."],

qa:[
["Why is the token bucket the standard choice for API rate limiting?","Because it matches how clients actually behave. Real clients burst — a page load fires 8 requests in 200ms — and then go quiet. A sliding window would reject the burst even though the client is well within its minute average. A token bucket allows the burst up to the bucket size and then enforces the steady rate. It's also O(1) memory per key, which matters at scale, and it's simple to reason about: capacity equals burst tolerance, refill rate equals sustained rate."],
["How do you handle rate limiting across multiple data centres?","Either a globally shared store with higher latency (Redis in one region, accepting the round trip) or per-region limits that sum to the global limit, with the risk of uneven distribution. The pragmatic answer for most systems is per-region limits with a generous global cap, accepting that a client could get 2× the limit by hitting two regions. For strict global limits, you need a shared store and you pay the latency — which is why strict global rate limiting is rare. It's usually more important to be approximately right and fast than exactly right and slow."],
["Why separate transactional and marketing notifications?","Because they have opposite requirements. A payment receipt must arrive in seconds, reliably, and must never be dropped. A promotional email can arrive over hours, can be batched, and must respect unsubscribe and quiet hours. If they share a pipeline, a marketing campaign that floods the queue delays payment receipts — a real incident I've seen. Separating them means a marketing backlog can't delay a receipt, and you can rate-limit and batch the marketing path aggressively without affecting the transactional path."],
["How do you prevent a notification storm from a buggy producer?","Three layers. First, per-user rate limiting — no user should ever receive more than N notifications per channel per hour, regardless of what the producer asks for. Second, a global circuit breaker on the notification volume — if the system is sending 100× the normal rate, something is wrong, and pausing is better than spamming every user. Third, alerting on the per-user cap being hit, because it almost always indicates a producer bug rather than legitimate traffic. The per-user cap is the last line of defence and it must be enforced at the orchestrator, not trusted to producers."],
["Why use Kafka for notifications instead of a direct call?","Because a notification failure must never fail the business operation. If the email provider is down and the order service calls it synchronously, the order fails — which is absurd. Kafka decouples them: the order completes, the notification queues, and it's sent when the provider recovers. It also gives you buffering during a spike, replay capability if a consumer has a bug, and independent scaling per channel. The cost is that you now have Kafka in the path, so you need to handle its failure too — but a Kafka outage is far less likely than a provider outage."]
],
exit:"Deliver both designs in 30 minutes each, and articulate the transactional-vs-marketing distinction without prompting."},

{d:41,wk:6,prio:"P0",title:"Design Drill — News Feed & Payment Success-Rate Drop",
obj:"One classic design and one incident response — both are common at architect level.",
core:`<h4>Drill 4 — News Feed (Twitter/Instagram style)</h4>
<p><b>30 minutes timed.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Clarify:</b> How many users? How many follow? Is the feed chronological or ranked? How fresh must it be? What's the read:write ratio?</p>
<p><b>Assume:</b> 500M users, 200M daily active. Average 200 follows. 500M posts/day. Read:write is enormous — each user checks their feed ~10× per day.</p>
<p><b>Numbers:</b> 500M posts/day ≈ 5,800 writes/s, peak ~20,000/s. Feeds: 200M DAU × 10 reads = 2B feed reads/day ≈ 23,000 reads/s, peak ~100,000/s. Each feed read returns ~50 posts, so ~5B post-hydrations per day.</p>
<p><b>The core decision — fan-out on write vs fan-out on read:</b></p>
<table><thead><tr><th></th><th>Fan-out on write (push)</th><th>Fan-out on read (pull)</th></tr></thead><tbody>
<tr><td>How</td><td>On post, write to every follower's feed</td><td>On read, query all followed users' posts</td></tr>
<tr><td>Write cost</td><td>High — one post × 200 followers = 200 writes</td><td>Low — one write</td></tr>
<tr><td>Read cost</td><td>Low — read the precomputed feed</td><td>High — query 200 users, merge, sort</td></tr>
<tr><td>Latency</td><td>Fast reads</td><td>Slow reads</td></tr>
<tr><td>Celebrity problem</td><td>Catastrophic — 100M followers = 100M writes</td><td>Fine</td></tr>
</tbody></table>
<p><b>The answer is a hybrid.</b> Fan-out on write for normal users (the vast majority, with modest follower counts) and fan-out on read for celebrities (a tiny fraction with enormous follower counts). On read, merge the precomputed feed with a pull from the celebrities you follow.</p>
<pre><code>On post (normal user):
→ write post to posts store
→ push post ID to each follower's feed list (Redis sorted set, capped at 800 entries)

On post (celebrity, &gt; 100K followers):
→ write post to posts store
→ do NOT fan out
→ mark as celebrity post

On feed read:
1. Read precomputed feed from Redis (fast)
2. Read recent posts from followed celebrities (a small query)
3. Merge, sort by timestamp/score, take top 50
4. Hydrate post details (batch fetch)
5. Return</code></pre>
<p><b>Storage:</b> the feed is a Redis sorted set per user, scored by timestamp, capped at 800 entries. 200M users × 800 entries × 8 bytes ≈ 1.3TB. That's large but manageable across a Redis cluster. Older entries fall out of the cache and are reconstructed from the posts store on demand if the user scrolls deep.</p>
<p><b>Hydration:</b> the feed stores post IDs, not full posts. On read, batch-fetch the post details. Use a multi-get or a pipeline rather than 50 individual calls. This is where most of the read latency goes, and it's where a cache for hot posts pays off enormously — a viral post is read millions of times.</p>
<p><b>Ranking (if needed):</b> if the feed is ranked rather than chronological, the ranking happens at read time on the 50 candidates, using a model. The candidate generation is the same; only the ordering changes. Keep the candidate set small — ranking 800 posts per read is expensive.</p>
<p><b>Failure modes:</b> Redis down → fall back to fan-out on read for everyone, which is slower but correct. If that's too slow at peak, degrade to showing a chronological feed with fewer candidates. Post store down → can't hydrate; return the feed with placeholder content or an error. The fan-out workers falling behind → feeds get stale; monitor fan-out lag as a primary metric.</p>
<p><b>Trade-off:</b> I'm accepting staleness in the feed for most users — a post might take a few seconds to appear in a follower's feed because of the async fan-out. For a social feed that's fine. For a messaging app it wouldn't be, which is why chat uses a different architecture entirely.</p>
</div>
</details>

<h4>Drill 5 — Incident response: payment success rate dropped 3%</h4>
<p><b>This is a different kind of question. It tests diagnosis, not design. Do it in 20 minutes.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>First, the meta-finding.</b> No alerts fired. That's the primary finding — our alerting measures infrastructure health (CPU, memory, 5xx rates) and a payment that gets declined returns a healthy HTTP 200. The 3% drop is invisible to every metric we have. So there are two problems: restore the success rate, and fix the observability gap.</p>
<p><b>Triage order:</b></p>
<ol>
<li><b>Confirm it's real and correlated.</b> Pull success rate by hour for 7 days. If it stepped down at the deploy timestamp, that's the cause. If it's a gradual slope, it's probably not.</li>
<li><b>Segment before theorising.</b> Split by PSP, by issuer/BIN, by card type, by geography, by API version, by amount band. A 3% overall drop is usually a much larger drop in one narrow segment. This step usually hands you the answer.</li>
<li><b>Separate declines from technical failures.</b> A rise in technical failures (timeouts, 5xx from the PSP) points at the integration. A rise in declines points at data or fraud rules. Completely different investigations.</li>
<li><b>Check the diff for the usual suspects.</b></li>
<li><b>Canary compare.</b> If a previous version is still running, compare its success rate in the same window. That isolates deploy vs. external.</li>
</ol>
<p><b>The most likely culprits, in my experience:</b></p>
<table><thead><tr><th>Culprit</th><th>Why it's invisible</th></tr></thead><tbody>
<tr><td><b>Timeout reduced</b> (5s → 2s)</td><td>Slow-but-successful authorizations become failures. No error rate change — they're timeouts, not errors.</td></tr>
<tr><td><b>Retry removed or broken</b></td><td>Transient blips that were retried now surface as failures.</td></tr>
<tr><td><b>Connection pool resized</b></td><td>Queuing pushes latency past the timeout only under peak — fine in staging.</td></tr>
<tr><td><b>New validation rule</b></td><td>Rejects valid edge cases: unusual card formats, non-ASCII names, zero-decimal currencies like JPY.</td></tr>
<tr><td><b>Serialization change</b></td><td>A field renamed or a null omitted, causing the PSP to reject a request that used to be valid.</td></tr>
<tr><td><b>TLS/cipher config</b></td><td>A subset of PSP endpoints negotiate differently and fail.</td></tr>
</tbody></table>
<p><b>Immediate mitigation:</b> roll back. Don't debug in production while customers are failing payments. Then reproduce in staging with production-shaped traffic.</p>
<p><b>The observability fix — the more important deliverable:</b></p>
<ul>
<li><b>Alert on business metrics, not infrastructure.</b> Payment success rate by PSP and card network, with a burn-rate threshold. "&lt;96% over 15 minutes" is an SLO alert.</li>
<li><b>Alert on p99 latency per dependency</b>, not just error rate. Slow is the leading indicator; errors are the lagging one.</li>
