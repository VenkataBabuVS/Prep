<li><b>Track timeouts as a first-class metric.</b> They currently vanish into a generic error bucket, which is why this was invisible.</li>
<li><b>Automated canary analysis.</b> Compare the new version's success rate against the baseline as part of the deploy pipeline, with auto-rollback on a statistically significant drop.</li>
<li><b>Structured decline reasons end-to-end</b> — the PSP's raw code, mapped to our taxonomy, preserved for support.</li>
</ul>
<p><b>The point I'd make to the interviewer:</b> a 3% drop in a payments system is a revenue event measured in real money per hour, and our alerting didn't see it because we were monitoring machines instead of the business. That's the lesson — and the fix is to alert on what the business cares about, not on what's easy to measure.</p>
</div>
</details>

<h4>What these two drills teach</h4>
<div class="box o"><div class="t">The pattern</div>
<b>Design questions</b> test whether you can decompose and make justified choices under ambiguity. The scoring is on reasoning, trade-offs, and failure modes — not on whether you name the same components as the interviewer.<br><br>
<b>Incident questions</b> test whether you can debug systematically under pressure and whether you can identify the systemic problem behind the immediate symptom. The scoring is on triage order, hypothesis generation, and whether you fix the class of problem rather than the instance.</div>`,

drill:["News feed — 30 minutes timed. Focus on the celebrity problem and the hybrid fan-out decision.",
"Incident response — 20 minutes. Write your triage order before reading the answer.",
"Do one more design of your choice (chat, search, file store) and record the trade-offs you state."],

qa:[
["Why is fan-out on write bad for celebrities?","Because the write cost is proportional to the follower count. A user with 100 million followers posting once generates 100 million feed writes. At even 10,000 writes/s that's nearly three hours of work for one post. And it happens on every post. The hybrid approach — push for normal users, pull for celebrities — means the expensive case is handled at read time, where you only pull for the celebrities a given user actually follows, which is typically a handful."],
["How do you decide when a user becomes a 'celebrity' for fan-out purposes?","By follower count, with a threshold. The threshold is a tuning parameter — set it where the fan-out cost per post exceeds the pull cost per read. In practice: if a user has 100K followers, pushing one post is 100K writes. Pulling for readers costs one query per reader who follows them. If a user has 100K followers and posts 10× a day, that's 1M writes/day for one user. Compare that to the pull cost, which is amortised across reads. The threshold is usually somewhere between 10K and 100K followers, and it should be monitored — if the celebrity set grows, the read path gets slower."],
["Why store post IDs in the feed rather than the full post content?","Three reasons. First, storage — 800 full posts per user × 200M users is enormous; 800 IDs is manageable. Second, consistency — if a post is edited or deleted, you'd need to update every feed it appears in. With IDs, you just change the post. Third, cache efficiency — a viral post is read millions of times, and storing it once in a post cache is far better than duplicating it into millions of feeds. The cost is a hydration step on read, which is why batch-fetching matters."],
["In the incident drill, why roll back before investigating?","Because the impact is ongoing and measured in money per hour. Every minute spent investigating is another minute of failed payments. Rolling back restores service, and then you can investigate without pressure — with production-shaped traffic in a safe environment, which is a far better place to debug than a live payments system. The only exception is if you can't roll back (a database migration that isn't reversible), in which case you mitigate forward — disable the feature flag, revert the config, or route around the problem."],
["What's the difference between a design interview and an incident interview at architect level?","Design tests whether you can create structure from ambiguity and make defensible choices. Incident tests whether you can work within an existing, partially-understood system under time pressure, and whether you can distinguish the immediate cause from the systemic cause. In an incident interview, the interviewer is watching your triage order — do you confirm the problem before theorising, do you segment before diagnosing, do you mitigate before investigating. Jumping to a hypothesis is the failure mode."]
],
exit:"Deliver both drills — the feed design in 30 minutes and the incident in 20 — and articulate the systemic finding in the incident."},

{d:42,wk:6,prio:"P0",title:"Week 6 Integration — Full Mock Design Interview",
obj:"Deliver a complete design under interview conditions and score yourself honestly.",
core:`<h4>The mock — do this properly</h4>
<p><b>Setup:</b> 45 minutes, a blank page or whiteboard, no notes. Record yourself if you can — watching the recording is where most of the learning happens.</p>

<h4>Prompt A — Design a payment processing system</h4>
<p><b>Use this prompt. It's the closest to what you'll actually be asked.</b></p>
<pre><code>"Design a system that lets merchants accept card payments online.
Merchants integrate via an API, customers pay on the merchant's site,
and you settle funds to the merchant's bank account daily.

Requirements:
- 10,000 merchants, ranging from 10 to 1,000,000 transactions per day
- You integrate with 3 card networks via 2 PSPs
- Must handle refunds, chargebacks, and partial captures
- Merchants see a real-time dashboard of their transactions
- Regulatory: PCI-DSS, must not store card data"</code></pre>

<h4>What a strong answer covers</h4>
<table><thead><tr><th>Area</th><th>What to cover</th></tr></thead><tbody>
<tr><td><b>Clarify</b></td><td>Volume, latency, consistency, PCI scope, settlement timing, currencies, failure tolerance</td></tr>
<tr><td><b>Numbers</b></td><td>Peak TPS, storage/year, PSP rate limits</td></tr>
<tr><td><b>API</b></td><td>Payment intent, capture, refund, webhook, idempotency</td></tr>
<tr><td><b>Data model</b></td><td>Append-only ledger, merchant balances, idempotency keys, outbox</td></tr>
<tr><td><b>Payment flow</b></td><td>Auth → capture, PSP integration, retry, reconciliation</td></tr>
<tr><td><b>PCI</b></td><td>Tokenization at the edge; card data never touches your servers</td></tr>
<tr><td><b>Settlement</b></td><td>Daily batch, ledger entries, bank file generation</td></tr>
<tr><td><b>Dashboard</b></td><td>CQRS read model, eventual consistency, caching</td></tr>
<tr><td><b>Failure modes</b></td><td>PSP down, duplicate charge, timeout-then-success, reconciliation</td></tr>
<tr><td><b>Trade-offs</b></td><td>At least 5 explicit ones</td></tr>
</tbody></table>

<details><summary>Model outline</summary>
<div class="dbody">
<p><b>Clarify:</b> Assume 10,000 merchants, aggregate 50M transactions/day (≈580/s average, ≈3,000/s peak). Latency: the customer is waiting, so authorization must complete in &lt;3s p99. Consistency: the ledger must be linearizable; the dashboard can be eventually consistent. PCI: we never store PAN or CVV — tokenize via the PSP's SDK in the browser. Settlement is T+1 to the merchant's bank.</p>
<p><b>PCI scope reduction:</b> the single most important architectural decision. The merchant's page loads the PSP's JavaScript SDK, which collects card details and exchanges them for a token directly with the PSP. Our servers only ever see the token. This removes almost all of our PCI audit scope — we handle tokens, not cards. Saying this first signals you understand the domain.</p>
<p><b>Payment flow:</b></p>
<pre><code>1. Client → POST /payment-intents {amount, currency, merchantId, idempotencyKey}
→ validate, atomic insert idempotency key, return intentId

2. Client → PSP SDK → token (card data never reaches us)

3. Client → POST /payment-intents/{id}/confirm {token}
→ synchronous call to PSP: authorize
→ PSP returns: approved (authCode) | declined (reason) | error

4. On approval:
→ ledger entries (debit PSP_SUSPENSE, credit MERCHANT_PAYABLE)
→ outbox event PaymentAuthorized
→ return 200 with authCode

5. Later: capture (immediate or delayed)
→ PSP capture call
→ ledger entries (clear suspense)
→ outbox event PaymentCaptured

6. Webhooks from PSP for async status changes
→ verify HMAC signature
→ dedupe by PSP event ID
→ update ledger via compensating entries

7. Daily settlement
→ aggregate merchant balances
→ generate bank file
→ ledger entries moving MERCHANT_PAYABLE → MERCHANT_BANK
→ reconcile against the bank's settlement file</code></pre>
<p><b>Idempotency:</b> every mutating endpoint requires an idempotency key. Stored with a hash of the request body and the response. Atomic insert with a unique constraint before any PSP call. This is non-negotiable — without it, a client retry double-charges.</p>
<p><b>Ledger:</b> append-only double-entry. Every entry sums to zero. Balances are derived, with a materialized cache validated by a periodic job. Corrections are compensating entries, never updates.</p>
<p><b>PSP integration:</b> two PSPs for failover and rate-limit headroom. Route by merchant (sticky, so reconciliation is simpler) with automatic failover on health. Circuit breaker per PSP. Timeout budgets: 2s for authorize, well under the customer's 3s expectation.</p>
<p><b>The dashboard:</b> CQRS. The write path is the ledger. The read path is a denormalized view built from ledger events, stored in a read-optimized database, cached in Redis. Eventual consistency of a few hundred milliseconds is invisible for a dashboard. For a merchant checking a specific transaction right after creating it, read-your-writes applies — route that specific read to the write model, or return the transaction details in the create response.</p>
<p><b>Reconciliation:</b> daily settlement files from each PSP and the bank. Match on their transaction reference. Categorize breaks: missing in theirs, missing in ours, amount mismatch, status mismatch, duplicate. Auto-resolve known patterns; manual queue with an SLA for the rest. Never silently mutate the ledger.</p>
<p><b>Failure modes:</b></p>
<ul>
<li><b>PSP down:</b> circuit breaker opens, route to the secondary PSP, or return a retryable error. The customer sees "try again" rather than a hang.</li>
<li><b>Timeout with unknown outcome:</b> the transaction goes to an UNKNOWN state. A sweeper queries the PSP for the actual status. Never assume success or failure.</li>
<li><b>Duplicate charge:</b> prevented by idempotency. If it happens, a compensating credit plus a notification.</li>
<li><b>Ledger inconsistency:</b> a continuous integrity check verifies every entry sums to zero. A violation is a P1 — it means a code path is writing bad data.</li>
<li><b>Webhook delivery failure:</b> the PSP retries; we dedupe. If webhooks are lost entirely, the daily reconciliation file catches it.</li>
</ul>
<p><b>Trade-offs to state explicitly:</b></p>
<ol>
<li><b>At-least-once delivery with idempotent consumers</b> rather than trying for exactly-once across system boundaries — which is impossible.</li>
<li><b>Eventual consistency on the dashboard</b> — bounded staleness of ~200ms, which is invisible to users but lets the read path scale independently.</li>
<li><b>Sticky PSP routing by merchant</b> — simpler reconciliation, but a merchant is affected by their PSP's outage rather than being spread across both.</li>
<li><b>Append-only ledger</b> — more storage and more complex queries, but complete auditability and no lost updates.</li>
<li><b>Synchronous authorization</b> — the customer waits, but the UX requires knowing the result immediately. Capture and settlement are async.</li>
<li><b>Tokenization at the edge</b> — less control over the payment form, but drastically reduced PCI scope.</li>
</ol>
</div>
</details>

<h4>Self-scoring rubric</h4>
<table><thead><tr><th>Area</th><th>0 — missed</th><th>1 — mentioned</th><th>2 — covered with justification</th></tr></thead><tbody>
<tr><td>Clarifying questions before designing</td><td></td><td></td><td></td></tr>
<tr><td>Back-of-envelope numbers</td><td></td><td></td><td></td></tr>
<tr><td>API contract</td><td></td><td></td><td></td></tr>
<tr><td>PCI scope reduction (tokenization)</td><td></td><td></td><td></td></tr>
<tr><td>Idempotency with atomic claim</td><td></td><td></td><td></td></tr>
<tr><td>Append-only double-entry ledger</td><td></td><td></td><td></td></tr>
<tr><td>Transaction boundaries (no external calls inside)</td><td></td><td></td><td></td></tr>
<tr><td>Outbox for event publishing</td><td></td><td></td><td></td></tr>
<tr><td>Reconciliation and break handling</td><td></td><td></td><td></td></tr>
<tr><td>CQRS for the dashboard</td><td></td><td></td><td></td></tr>
<tr><td>Failure modes for each component</td><td></td><td></td><td></td></tr>
<tr><td>Explicit trade-offs (5+)</td><td></td><td></td><td></td></tr>
<tr><td>Metrics and alerting</td><td></td><td></td><td></td></tr>
</tbody></table>
<div class="box o"><div class="t">Scoring</div><b>22+ / 26:</b> you're ready for a payments-focused interview. Focus the remaining weeks on behavioral and negotiation.<br>
<b>16–21:</b> solid. Identify the two lowest-scoring areas and drill those specifically.<br>
<b>Under 16:</b> re-do Week 7 (fintech) before continuing. The payments domain content is the highest-value material in this entire programme.</div>

<h4>Watch your recording and answer these</h4>
<ol>
<li>How long before you asked your first question? (Should be under 30 seconds.)</li>
<li>Did you draw anything before clarifying? (Should be no.)</li>
<li>How many trade-offs did you state explicitly? (Should be 5+.)</li>
<li>Did you fill silences with "um" or with reasoning? (Should be reasoning.)</li>
<li>Did you ever say "I don't know" and then reason from first principles? (Should be at least once — it's a strong signal.)</li>
<li>Did you finish all six phases, or run out of time in the deep dive?</li>
<li>Did you state what you'd monitor and what would page someone?</li>
</ol>`,

drill:["Do the payment processing mock, 45 minutes, recorded. Score yourself against the rubric.",
"Watch the recording. Note every filler word and every place you could have stated a trade-off.",
"Re-do the weakest section of the design — usually the deep dive or the failure modes."],

qa:[
["Why is PCI scope reduction the first architectural decision in a payments system?","Because it determines the audit burden, the compliance cost, and the blast radius of a breach. If card data touches your servers, you're in scope for the full PCI-DSS assessment — network segmentation, encryption, access controls, quarterly scans, annual audits. If you tokenize at the edge and never see the card number, your scope shrinks dramatically. That's an order-of-magnitude difference in compliance cost and risk. It's the first decision because it constrains everything else."],
["How do you handle a payment that times out with an unknown outcome?","Never assume. The transaction goes into an UNKNOWN state in the ledger. A sweeper job queries the PSP for the actual status using the PSP's transaction reference. If the PSP says approved, we complete the flow. If declined, we fail it. If the PSP has no record, we retry. The state machine has UNKNOWN as a first-class state with a resolution path, not as an error to be swallowed. And the daily reconciliation file is the backstop for anything the sweeper misses."],
["Why is the ledger append-only rather than a balance column you update?","Because updating a balance is a read-modify-write, which needs locking, creates contention on hot accounts, and loses the audit trail. An append-only ledger means every change is an insert — no locks, no contention, and a complete history. The balance is derived, and a periodic job validates the derived balance against the journal. If they disagree, you have a bug and you know immediately. The cost is that balance queries are more expensive, which is why you materialize and cache them — but the journal remains the source of truth."],
["How do you prevent double charging when a client retries?","An idempotency key generated by the client, once per logical payment attempt. The server does an atomic insert into an idempotency table with a unique constraint on the key before any PSP call. If the insert succeeds, this request owns the operation. If it fails with a constraint violation, a duplicate exists — return the stored response, or 409 if still in progress. The critical detail is that it must be a database constraint, not a check-then-act in application code, because that has a race."],
["What's the trade-off between sticky PSP routing and round-robin?","Sticky routing by merchant means all of a merchant's transactions go to one PSP. Reconciliation is simpler because you reconcile with one PSP per merchant. But if that PSP has an outage, the merchant is fully affected. Round-robin spreads the risk — a PSP outage only affects a fraction of each merchant's traffic — but reconciliation is more complex and you need per-transaction routing records. I'd choose sticky with health-based failover: normal operation is sticky, and if a PSP's circuit breaker opens, traffic moves. That gets most of the simplicity with a failover path."]
],
exit:"Score 22+ on the rubric, or identify the two weakest areas and schedule them for this week."},

/* ================= WEEK 7 — FINTECH ================= */
{d:43,wk:7,prio:"P0",title:"The Six Fintech Constraints",
obj:"Recite all six constraints and lead with them in every fintech design.",
core:`<div class="box o"><div class="t">Open every fintech design with this</div><em>"Money can never be lost, duplicated, or created. That single constraint dictates every design choice below. It means idempotency is not optional, the ledger write must be strongly consistent, and I need a reconciliation process because I cannot guarantee atomicity with external systems."</em><br><br>This one paragraph reframes the entire interview. It tells the interviewer you understand that fintech is not generic system design with different nouns.</div>

<h4>Constraint 1 — Idempotency</h4>
<p><b>The problem:</b> networks time out. Clients retry. Users double-tap. A payment that succeeded server-side but timed out client-side will be retried, and without protection, charged twice.</p>
<p><b>The design:</b> the client generates a UUID per logical payment attempt (not per HTTP request). The server, <em>before any downstream call</em>, attempts an atomic insert into a table with a unique constraint on the key.</p>
<pre><code>INSERT INTO idempotency_keys (key, request_hash, status, response, created_at)
VALUES (:key, :hash, 'IN_PROGRESS', NULL, now())
ON CONFLICT (key) DO NOTHING;
-- 0 rows affected → key exists → return stored response or 409 IN_PROGRESS</code></pre>
<div class="box b"><div class="t">The answer that fails</div>"I'd check if the transaction exists, and if not, create it." That's a check-then-act race. Two concurrent requests both see "not exists" and both create. You must rely on a database uniqueness constraint, not application logic.</div>

<h4>Constraint 2 — Consistency where it counts</h4>
<p><b>The mistake:</b> treating "the system" as having one consistency model. Real fintech systems have several, deliberately layered.</p>
<table><thead><tr><th>Data</th><th>Model</th><th>Why</th></tr></thead><tbody>
<tr><td>Ledger entries, balance debit</td><td><b>Linearizable</b></td><td>Money correctness — cannot read a stale balance</td></tr>
<tr><td>Idempotency key lookup</td><td><b>Linearizable</b></td><td>A stale read means a duplicate charge</td></tr>
<tr><td>Fraud score cache</td><td><b>Eventual (seconds)</b></td><td>Best-effort signal; blocking is worse than staleness</td></tr>
<tr><td>Transaction history in app</td><td><b>Eventual (~200ms)</b></td><td>Nobody's money depends on it</td></tr>
<tr><td>Analytics, reporting</td><td><b>Eventual (hours)</b></td><td>Batch/warehouse is fine</td></tr>
</tbody></table>
<p><b>Read-your-writes for the app:</b> after a payment, pin the user's session to the primary for a few seconds, or return the authoritative balance in the payment response so the client doesn't re-read.</p>

<h4>Constraint 3 — Downstream rate limits are the real ceiling</h4>
<p>Your service can autoscale to 10,000 pods. The bank's gateway still accepts 1,200 TPS. Autoscaling past that converts pods into threads blocked on a rate-limited dependency, then into a queue that grows until you OOM.</p>
<p><b>The design:</b></p>
<ul>
<li><b>Decouple sync from async.</b> The API validates, checks idempotency, enqueues, and returns <code>202 Accepted</code>. The client polls or receives a webhook.</li>
<li><b>Queue as a shock absorber.</b> Size it for the peak burst and monitor depth as the primary saturation signal.</li>
<li><b>Rate-limit the consumer</b> to the downstream's permitted rate, using a shared token bucket if the limit is global.</li>
<li><b>Reject early when full.</b> A fast 503 with Retry-After is honest and recoverable. Queueing past capacity converts a spike into a multi-hour outage.</li>
</ul>
<div class="box o"><div class="t">Say this</div>"The bottleneck is outside my boundary, so autoscaling is the wrong lever. My levers are queue depth, consumer concurrency matched to the downstream's limit, and honest backpressure to the client."</div>

<h4>Constraint 4 — Retry storms</h4>
<p><b>How 10× becomes 30×:</b> downstream slows → clients time out at 2s → clients retry → each retry adds load → downstream slows further → more timeouts. A modest spike becomes a self-sustaining outage.</p>
<p><b>The four defences:</b></p>
<ol>
<li><b>Idempotency</b> — so retries are safe and therefore bounded.</li>
<li><b>Exponential backoff with full jitter.</b> <code>sleep = random(0, min(cap, base * 2^attempt))</code>. Jitter is the part people forget.</li>
<li><b>Circuit breaker</b> — after N failures, stop calling for a cooldown. Fail fast rather than pile up doomed requests.</li>
<li><b>Retry budgets</b> — cap retries as a percentage of traffic (10%). Once exhausted, stop retrying entirely.</li>
</ol>
<p><b>Also:</b> only retry idempotent operations, and only on retryable errors (timeouts, 5xx, 429). Never retry a 400 or a hard decline.</p>

<h4>Constraint 5 — Reconciliation</h4>
<p><b>Accept this upfront:</b> your system and the bank's will disagree. Network partitions, timeouts at the moment of commit, clock skew, and human error guarantee it. The question is not whether you'll be inconsistent — it's whether you'll detect and correct it.</p>
<ul>
<li><b>Daily settlement file</b> from each counterparty.</li>
<li><b>Matching engine</b> joining your records to theirs on their reference.</li>
<li><b>Break categories:</b> MISSING_IN_THEIRS, MISSING_IN_OURS, AMOUNT_MISMATCH, STATUS_MISMATCH, DUPLICATE.</li>
<li><b>Automated resolution</b> for known patterns; <b>manual queue</b> with an SLA for the rest, plus an audit trail of every adjustment.</li>
<li><b>Never silently mutate a ledger entry.</b> Corrections are new compensating entries.</li>
</ul>
<div class="box o"><div class="t">Interview gold</div>Mentioning reconciliation unprompted is one of the strongest signals you've actually worked in payments. Most candidates never bring it up — and it's the single most important operational process in any payment system.</div>

<h4>Constraint 6 — Auditability, immutability, money representation</h4>
<div class="grid g2">
<div class="card"><h4>Ledger &amp; audit</h4>
<ul>
<li><b>Append-only journal.</b> Never UPDATE a financial record. Corrections are new entries.</li>
<li><b>Double-entry.</b> Every transaction's debits and credits sum to zero — free integrity checking.</li>
<li><b>Audit trail</b> on every state change: who, what, when, from, to, under which request ID.</li>
<li><b>Immutability enables replay.</b> Rebuild any derived state from the journal.</li>
<li><b>Retention:</b> typically 7 years. Plan storage accordingly.</li>
</ul></div>
<div class="card"><h4>Money representation</h4>
<ul>
<li><b>Never <code>double</code> or <code>float</code>.</b> <code>0.1 + 0.2 != 0.3</code>. This is the fastest way to fail a fintech interview.</li>
<li><b>Store minor units as integers</b> (cents, paise) — simplest and fastest.</li>
<li>Or <b><code>BigDecimal</code></b> with explicit scale and <code>RoundingMode.HALF_EVEN</code>.</li>
<li><b>Currency is part of the amount.</b> <code>Money</code> is (amount, currency), never a bare number.</li>
<li><b>Rounding must be deliberate</b> and land in a dedicated rounding/suspense account.</li>
</ul></div>
</div>

<h4>The bonus signals</h4>
<ul>
<li><b>PCI-DSS:</b> never store PAN or CVV; tokenize at the edge; card data never touches your servers.</li>
<li><b>PSD2/SCA:</b> strong customer authentication for EU payments.</li>
<li><b>PII in logs:</b> hash account numbers; never log request bodies containing them.</li>
<li><b>Idempotency key retention:</b> long enough to cover the client's retry window, typically 24–72 hours.</li>
<li><b>Never make an external call inside a database transaction.</b> You hold locks for the duration of a network round trip.</li>
</ul>`,

drill:["Recite all six constraints from memory, with an example of each.",
"Take a non-fintech design you've done and identify which constraints would change.",
"Write the opening paragraph you'd use in a fintech design interview, then say it aloud 5 times."],

qa:[
["Why is idempotency more critical in fintech than in other domains?","Because the cost of a duplicate is asymmetric and irreversible. In most systems, a duplicate operation is wasteful — you send two emails, you create two log entries. In payments, a duplicate is money taken from a customer who didn't authorize it, which requires a refund, a support ticket, and possibly a chargeback. And it damages trust permanently. The cost of preventing duplicates is a table and a unique constraint; the cost of not preventing them is a customer who never comes back."],
["How do you decide which operations need idempotency keys?","Every operation that moves money or creates a financial record. That includes payment authorization, capture, refund, payout, and any balance adjustment. For read operations, no key is needed — they're naturally idempotent. For operations that are naturally idempotent by design — like a PUT that sets a value — the key is redundant but harmless. The rule I'd use: if calling it twice produces a different result than calling it once, it needs a key."],
["What's the difference between strong consistency and linearizability in a payment system?","Linearizability is the practical requirement: every read sees the latest committed write, and operations appear to take effect instantaneously in real-time order. Strong consistency in the CAP sense is roughly the same thing. The distinction matters because you can't achieve linearizability across a distributed system without consensus, which costs latency. So the design question is: which operations genuinely need it? The ledger write does. The dashboard read doesn't. Applying linearizability everywhere would make the system slow for no benefit."],
["Why is reconciliation unavoidable?","Because you cannot make two independent systems atomic. Even with the best design, there's a window where your system has committed and the bank's hasn't, or vice versa. A timeout at the exact moment of commit leaves you with an unknown outcome. A network partition means you can't confirm. So you build the system assuming reconciliation will be needed, and you make it a first-class process rather than an afterthought. The alternative — assuming perfect consistency — means discrepancies accumulate silently until someone notices the books don't balance."],
["How do you represent money and why?","As a value object containing an integer amount in minor units (cents) and a currency code. Integers avoid floating-point representation errors entirely — 0.1 + 0.2 != 0.3 in binary floating point, and that error compounds. Currency must be part of the value because an amount without a currency is meaningless and mixing them is a category error. If I need fractional minor units (some currencies have three decimal places, and FX rates have many), I'd use BigDecimal with an explicit scale and RoundingMode.HALF_EVEN, and make the rounding explicit rather than implicit."]
],
exit:"Recite all six constraints with an example of each, then state the opening paragraph of a fintech design in 45 seconds."},

{d:44,wk:7,prio:"P0",title:"Idempotency — The Complete Implementation",
obj:"Design and defend an idempotency layer end to end.",
core:`<h4>The full lifecycle</h4>
<pre><code>1. Client generates a key (UUID v4) once per logical attempt
2. Server receives the request with the key
3. Atomic claim: INSERT ... ON CONFLICT DO NOTHING
4. If claimed → process → store the response → mark SUCCEEDED
5. If not claimed → read the existing record and respond accordingly</code></pre>

<h4>The schema</h4>
<pre><code>CREATE TABLE idempotency_keys (
key text PRIMARY KEY,
request_hash text NOT NULL, -- SHA-256 of the canonical request body
status text NOT NULL, -- IN_PROGRESS | SUCCEEDED | FAILED
response_code int,
response_body jsonb,
locked_until timestamptz, -- for stale IN_PROGRESS detection
created_at timestamptz NOT NULL DEFAULT now(),
updated_at timestamptz NOT NULL DEFAULT now()
);

CREATE INDEX ON idempotency_keys (created_at); -- for cleanup partitioning

-- Partition by day so old keys can be dropped instantly
-- CREATE TABLE idempotency_keys_2025_01 PARTITION OF idempotency_keys
-- FOR VALUES FROM ('2025-01-01') TO ('2025-02-01');</code></pre>

<h4>The atomic claim</h4>
<pre><code>// CORRECT — single statement, no race
INSERT INTO idempotency_keys (key, request_hash, status)
VALUES (:key, :hash, 'IN_PROGRESS')
ON CONFLICT (key) DO NOTHING;

if (rowsAffected == 1) {
// We own this operation
try {
var result = process(request);
updateKey(key, 'SUCCEEDED', result);
return result;
} catch (Exception e) {
updateKey(key, 'FAILED', errorResponse(e));
throw e;
}
} else {
// A record already exists
var existing = loadKey(key);

// Guard against key reuse with a different payload
if (!existing.requestHash.equals(hash)) {
throw new ConflictException("idempotency key reused with a different request body");
}

return switch (existing.status) {
case "SUCCEEDED" -> existing.response; // replay
case "FAILED" -> throw toException(existing.response); // replay the failure
case "IN_PROGRESS" -> throw new ConflictException(
"request in progress — retry after a short delay"); // 409
default -> throw new IllegalStateException(existing.status);
};
}</code></pre>
<div class="box b"><div class="t">The three states and why IN_PROGRESS matters</div><b>SUCCEEDED</b> → return the exact stored response, including the same transaction ID. The client cannot tell it was a replay, which is the point.<br>
<b>FAILED</b> → return the stored failure. The client can retry with a new key if appropriate.<br>
<b>IN_PROGRESS</b> → return 409 with Retry-After. <b>Do not start a second attempt.</b> This is the case people get wrong — they see IN_PROGRESS and process again, defeating the entire mechanism.</div>

<h4>Payload integrity — the request hash</h4>
<pre><code>// Canonicalize before hashing: sort keys, normalize whitespace, exclude volatile fields
String canonical = canonicalJson(request);
String hash = sha256(canonical);

// Same key + different body → 422
if (!existing.requestHash.equals(hash)) {
throw new UnprocessableEntityException(
"This idempotency key was used with a different request body");
}</code></pre>
<p><b>Why this matters:</b> a client bug could send the same key with a different amount. Without the hash check, you'd silently return the first transaction's result for a completely different request. This is exactly what Stripe does, and mentioning it signals you've read real payment API documentation.</p>

<h4>Stale IN_PROGRESS — the sweeper</h4>
<pre><code>// A process crashed mid-flight, leaving the key locked forever
SELECT * FROM idempotency_keys
WHERE status = 'IN_PROGRESS'
AND locked_until &lt; now() - interval '5 minutes'
LIMIT 100;

-- For each: query the downstream for the ACTUAL status
-- NEVER assume success or failure
-- Resolve to SUCCEEDED or FAILED based on what the downstream says
-- If the downstream has no record, mark FAILED and let the client retry</code></pre>
<div class="box w"><div class="t">Why you can't just time out IN_PROGRESS</div>You don't know whether the operation happened. If you mark it FAILED and the client retries, you might double-charge. If you mark it SUCCEEDED, you might report a payment that never happened. The only correct resolution is to ask the downstream system what actually occurred — which is the reconciliation hook, and why idempotency and reconciliation are the same problem viewed from different angles.</div>

<h4>Key generation — client or server?</h4>
<table><thead><tr><th></th><th>Client-generated</th><th>Server-generated</th></tr></thead><tbody>
<tr><td>How</td><td>Client sends a UUID it created</td><td>Server returns a key; client uses it on retry</td></tr>
<tr><td>Retry-safe</td><td>Yes — the client already has the key</td><td>Only if the client received the first response</td></tr>
<tr><td>Failure mode</td><td>Client must persist the key across retries</td><td>If the first response is lost, the client has no key and retries create a new one</td></tr>
<tr><td>Verdict</td><td><b>The standard.</b> Stripe, Adyen, and most payment APIs work this way.</td><td>Rarely used — it doesn't solve the lost-response case</td></tr>
</tbody></table>
<p><b>The client must persist the key</b> — in local storage or a database — for the duration of the retry window. If the client generates a new key on each retry, idempotency is defeated. This is the client's responsibility and it's worth stating explicitly, because it shows you understand the whole system, not just your half.</p>

<h4>Retention and cleanup</h4>
<pre><code>Retention window = longest possible client retry window + safety margin

Typical: 24 hours for synchronous APIs, 7 days for settlement-critical flows

-- Partition by day and drop old partitions
DROP TABLE idempotency_keys_2025_01; -- instant, no vacuum, no WAL

-- vs DELETE, which is slow and generates enormous WAL on a large table</code></pre>
<p><b>The trade-off:</b> too short a retention and a very late retry double-charges. Too long and the table grows without bound. Partitioning by time and dropping partitions is the answer — it's O(1) instead of O(n).</p>

<h4>Idempotency in the ledger</h4>
<pre><code>-- Belt and braces: the ledger also enforces idempotency
CREATE TABLE journal_entries (
id uuid PRIMARY KEY,
idempotency_key text UNIQUE, -- ← second line of defence
event_type text NOT NULL,
occurred_at timestamptz NOT NULL
);</code></pre>
<p><b>Why two layers:</b> the idempotency key table protects the API surface. The unique constraint on the ledger protects against a bug in the API layer that somehow processes the same key twice — a retry loop with a bug, a manual replay, a migration error. Defence in depth is cheap here and the failure mode is expensive.</p>

<h4>What idempotency does NOT solve</h4>
<ul>
<li><b>Two different keys for the same logical payment.</b> If the client generates a new key on retry (a bug), you get two charges. Idempotency keys are only as good as the client's discipline.</li>
<li><b>Partial failure.</b> The payment succeeds at the PSP but the response is lost. The key is marked SUCCEEDED but the client never sees it. This is why the sweeper and reconciliation exist.</li>
<li><b>Non-idempotent side effects.</b> Sending an email, publishing to Kafka — these have their own delivery semantics and need their own idempotency (dedupe by event ID at the consumer).</li>
<li><b>Semantic duplicates.</b> A user genuinely making two identical payments. Same amount, same merchant, seconds apart. Only a human or a fraud system can distinguish this from a duplicate.</li>
</ul>

<h4>The interview answer, condensed</h4>
<div class="box o"><div class="t">Say this in 90 seconds</div>"The client generates a UUID per logical payment attempt and sends it as a header. Before any downstream call, the server does an atomic insert into an idempotency table with a unique constraint on that key. If the insert succeeds, this request owns the operation — process it, store the response, mark it succeeded. If it fails with a constraint violation, a duplicate exists: return the stored response if succeeded, the stored failure if failed, or a 409 if still in progress.<br><br>
I also store a hash of the request body, so the same key with a different payload returns 422 rather than silently returning the wrong transaction's result.<br><br>
For records stuck in IN_PROGRESS because a process died, a sweeper queries the downstream for the actual status — never assuming. That's the reconciliation hook.<br><br>
Keys live 24–72 hours, partitioned by day so old ones drop instantly rather than being deleted. And the ledger has its own unique constraint on the key, so even a bug in the API layer can't produce a duplicate entry."</div>`,

drill:["Implement the idempotency layer: schema, atomic claim, three-state handling, request hash check.",
"Write a test that fires 100 concurrent requests with the same key and asserts exactly one transaction is created.",
"Implement the stale IN_PROGRESS sweeper with a mock downstream that reports actual status."],

qa:[
["Why must the idempotency check be a database constraint rather than application logic?","Because application logic has a race window. A SELECT followed by an INSERT is two operations; two concurrent requests can both execute the SELECT, both see no record, and both INSERT. The database's unique constraint is atomic — only one insert can succeed, and the other gets a constraint violation immediately. This is the difference between a design that works under concurrency and one that works in a test."],
["What status code should a duplicate in-progress request return?","409 Conflict, with a Retry-After header. It's not a 200 because the operation hasn't completed. It's not a 5xx because nothing is broken. 409 communicates "this conflicts with an existing operation" which is exactly right, and the Retry-After tells the client to try again shortly. Some APIs return 425 Too Early, but 409 is more widely understood."],
["How long should idempotency keys be retained?","Long enough to cover the client's maximum retry window, plus a safety margin. For a synchronous API where the client retries within seconds or minutes, 24 hours is generous. For settlement-critical flows where a batch job might retry a day later, 7 days. The cost of too short is a double charge; the cost of too long is storage. Since storage is cheap and double charges are not, I'd err long — and use time-based partitioning so retention is a DROP rather than a DELETE."],
["What happens if the same idempotency key is used for two genuinely different payments?","The request hash check catches it. The second request has the same key but a different body, so the hash doesn't match the stored one, and the server returns 422 Unprocessable Entity rather than returning the first payment's result. Without that check, the client would receive a success response referencing a completely different transaction — a silent, very confusing bug. The hash check is what makes the key safe to reuse accidentally."],
["How does idempotency interact with retries at the network layer?","They're complementary and both are needed. A network-level retry (the client's HTTP library retrying a timeout) is safe only if the request is idempotent. The idempotency key is what makes it safe. Without the key, the network retry is dangerous — it might double-charge. With the key, the retry is harmless because the server recognizes it as a duplicate. This is why the key must be generated <em>before</em> the first request, not on retry — otherwise the retry carries a different key and the whole mechanism fails."]
],
exit:"Design the idempotency layer end to end in 10 minutes on paper, including all three states and the sweeper."},

{d:45,wk:7,prio:"P0",title:"Ledger Design & Reconciliation",
obj:"Design an append-only double-entry ledger and the reconciliation process around it.",
core:`<h4>The core decision: derive, don't store</h4>
<p>The wallet balance is a <b>derived</b> value, not a stored source of truth. This is the foundational choice — everything else follows.</p>
<pre><code>accounts(
id uuid PK,
owner_id uuid,
account_type enum(USER_WALLET, FEE_INCOME, PSP_SUSPENSE, FX_ROUNDING, ...),
currency char(3), -- ISO 4217; one currency per account
created_at timestamptz
)

journal_entries( -- one row per financial event
id uuid PK,
idempotency_key text UNIQUE,
event_type text,
occurred_at timestamptz,
metadata jsonb
)

postings( -- the double-entry lines
id bigserial PK,
entry_id uuid FK → journal_entries,
account_id uuid FK → accounts,
amount_minor bigint, -- signed; debit negative, credit positive
currency char(3),
created_at timestamptz
)

-- INVARIANT: for every entry_id, SUM(amount_minor) = 0</code></pre>

<h4>Why these choices</h4>
<ul>
<li><b>Integer minor units.</b> No floating point near money. <code>bigint</code> handles far more than needed.</li>
<li><b>Signed amounts.</b> Debits negative, credits positive. The zero-sum invariant becomes a single <code>SUM()</code> check.</li>
<li><b>Currency on the account, not the posting.</b> An account holds one currency; FX is modelled as postings across accounts plus a rounding account. FX gains and losses become explicit.</li>
<li><b>Append-only.</b> No UPDATE, no DELETE. Corrections are new entries. Complete audit trail for free, and the ledger is replayable.</li>
</ul>

<h4>Core operations</h4>
<pre><code>-- Transfer 100 USD from Alice to Bob
INSERT INTO journal_entries (id, event_type) VALUES (:id, 'TRANSFER');
INSERT INTO postings (entry_id, account_id, amount_minor, currency) VALUES
(:id, :aliceWallet, -10000, 'USD'),
(:id, :bobWallet, +10000, 'USD');
-- SUM = 0 ✓

-- Card top-up: money in flight
INSERT INTO postings (entry_id, account_id, amount_minor, currency) VALUES
(:id, :pspSuspense, -10000, 'USD'),
(:id, :userWallet, +10000, 'USD');
-- The suspense account represents money not yet settled

-- FX: USD → EUR with spread
-- 4 postings: debit USD wallet, credit USD FX pool,
-- debit EUR FX pool, credit EUR wallet,
-- + a rounding posting to FX_ROUNDING
-- Every entry still sums to zero in its own currency</code></pre>

<h4>Balance computation</h4>
<pre><code>-- On demand (correct, slow as history grows)
SELECT SUM(amount_minor) FROM postings WHERE account_id = :id;

-- Materialised (fast) + periodic validation
UPDATE balances
SET amount_minor = amount_minor + :delta,
version = version + 1
WHERE account_id = :id;

-- Nightly: verify materialised balances match the journal
SELECT b.account_id, b.amount_minor, j.journal_sum
FROM balances b
JOIN (SELECT account_id, SUM(amount_minor) journal_sum
FROM postings GROUP BY account_id) j USING (account_id)
WHERE b.amount_minor &lt;&gt; j.journal_sum;
-- Any row returned is a P1 — a code path is writing bad data</code></pre>
<div class="box o"><div class="t">The framing that wins</div>"The journal is the source of truth; the balance is a cache. If they disagree, the journal wins and I have a bug. That's why I run the validation continuously rather than hoping the cache stays correct."</div>

<h4>Preventing overdraft without a hot row lock</h4>
<pre><code>-- Instead of SELECT ... FOR UPDATE on the balance row (hotspot, serialises)
UPDATE balances
SET amount_minor = amount_minor - :amt,
version = version + 1
WHERE account_id = :id
AND amount_minor &gt;= :amt;

-- 0 rows updated → insufficient funds → abort the whole entry
-- 1 row updated → success, no explicit lock needed</code></pre>
<p><b>Why this is better:</b> a single atomic statement. The <code>amount_minor &gt;= :amt</code> predicate is the business rule enforced in the database. No read-modify-write window, no explicit lock held, fails cleanly with 0 rows rather than throwing.</p>
<p><b>The limitation:</b> under extreme contention on one account, you still serialise on that row. For a single user's wallet that's acceptable — one user isn't generating thousands of concurrent debits. If it became a problem, you'd shard the balance or queue the operations.</p>

<h4>Partitioning and scale</h4>
<pre><code>-- Partition postings by month
CREATE TABLE postings (...) PARTITION BY RANGE (created_at);

Benefits:
- Old partitions become read-only and can be moved to cheaper storage
- Retention is DROP TABLE, not DELETE — instant, no vacuum
- Queries with a date filter prune partitions automatically
- Index size per partition stays manageable</code></pre>

<h4>Reconciliation — the full process</h4>
<pre><code>1. INGEST
- Daily settlement file from each PSP, bank, or counterparty
- Format varies: CSV, ISO 20022 XML, proprietary
- Load into a staging table with the raw record preserved

2. MATCH
- Join on the counterparty's transaction reference
- Our ledger entry ↔ their settlement record
- Match on: reference, amount, currency, direction

3. CLASSIFY BREAKS
MISSING_IN_THEIRS we have a transaction they don't
MISSING_IN_OURS they have one we don't
AMOUNT_MISMATCH both have it, amounts differ
STATUS_MISMATCH both have it, states differ (e.g. we say failed, they say settled)
DUPLICATE they have it twice
TIMING they have it in a different settlement window

4. RESOLVE
- Automated: known patterns with deterministic resolution
· timeout-then-success → resolve to SUCCESS
· timing differences → move to the next window
- Manual: everything else, into a queue with an SLA
- Every resolution writes a compensating ledger entry with a reason code

5. REPORT
- Break rate by category, by counterparty, over time
- A rising break rate is an early warning of a systemic problem
- Finance sees the suspense account balance — it should trend to zero</code></pre>

<div class="box b"><div class="t">Never silently mutate a ledger entry</div>Every correction is a new compensating entry linked to the original, with a reason code and an audit trail. If you UPDATE a posting, you've destroyed the ability to reconstruct what happened. The whole point of an append-only ledger is that the history is intact — corrections are part of the history, not a rewrite of it.</div>

<h4>The suspense account</h4>
<p>Money in flight lives in a suspense account — a real ledger account, not a status field. When funds are captured but not yet settled, they sit in <code>PSP_SUSPENSE</code>. When settlement confirms, a compensating entry moves them out. If the suspense balance grows, something is stuck, and it's visible in the accounts rather than hidden in a status column.</p>
<pre><code>-- Monitor: is money stuck in flight?
SELECT currency, SUM(amount_minor)
FROM postings p JOIN accounts a ON a.id = p.account_id
WHERE a.account_type = 'PSP_SUSPENSE'
GROUP BY currency;
-- A growing balance means settlements aren't clearing</code></pre>

<h4>Why double-entry specifically</h4>
<ul>
<li><b>Free integrity checking.</b> If the entries don't sum to zero, you have a bug. This catches an entire class of errors automatically.</li>
<li><b>Every transaction has a source and a destination.</b> There's no "money appeared" — it always came from somewhere.</li>
<li><b>It maps to how finance thinks.</b> Your finance team already understands debits and credits. Reconciling with them is a conversation about the same model, not a translation.</li>
<li><b>It makes fees and spreads explicit.</b> A fee is a posting to a fee account, not an unexplained difference. FX spread is a posting to an FX account. Everything is visible.</li>
</ul>

<h4>The interview answer, condensed</h4>
<div class="box o"><div class="t">Say this in 2 minutes</div>"I'd model this as an append-only double-entry ledger. Three tables: accounts, journal entries, and postings. Every entry has postings that sum to zero — debits negative, credits positive. Balances are derived from the journal and cached for performance, with a nightly job that validates the cache against the journal. Any mismatch is a P1 because it means a code path is writing bad data.<br><br>
Money is stored as integer minor units with an explicit currency. Never floating point.<br><br>
Corrections are compensating entries, never updates. That gives me a complete audit trail and makes the ledger replayable — I can reconstruct any state at any point in time.<br><br>
For the overdraft check, I'd use an atomic conditional UPDATE rather than SELECT FOR UPDATE, so there's no hot row lock and it fails cleanly with zero rows affected.<br><br>
And I'd build reconciliation from day one, not as an afterthought. Daily settlement files, a matching engine, categorized breaks, automated resolution for known patterns, and a manual queue for the rest. Because the one thing I can guarantee is that my ledger and the bank's will disagree somewhere — the question is whether I detect it."</div>`,

drill:["Design the ledger schema from scratch. Implement a transfer, a top-up, and an FX conversion.",
"Write the nightly integrity check that validates materialised balances against the journal.",
"Design the reconciliation process for a PSP settlement file. List every break category and the resolution for each."],

qa:[
["Why is the ledger append-only rather than a balance column you update?","Because updating a balance is a read-modify-write that needs locking, creates contention on hot accounts, and destroys the audit trail. An append-only ledger means every change is an insert — no locks, no contention, complete history, and the ability to reconstruct any past state. The cost is that balance queries are more expensive, which is why you materialize and cache them. But the journal remains the source of truth, and you validate the cache against it continuously."],
["How do you handle a correction when a payment was recorded incorrectly?","With a new compensating entry, linked to the original by a reference and a reason code. You never update or delete the original posting. The corrected state is the sum of both entries, and anyone reviewing the account later can see the full story: the original error, the correction, and why. This is what makes the ledger auditable — a regulator asking 'what happened here?' gets a complete answer rather than a current value with no history."],
["What is the suspense account and why does it matter?","It's a real ledger account representing money in flight — captured from the customer but not yet settled to the merchant. Modelling it as an account rather than a status field means the money is always somewhere. The balance of the suspense account tells you how much is in transit, and a growing balance means settlements aren't clearing. Without it, money would appear to exist in two places or nowhere during the settlement window."],
["How do you reconcile when the counterparty's file uses a different reference than yours?","That's the most common reconciliation problem. You need a mapping — usually the counterparty returns their reference in the response to your original request, and you store both. If they don't, you match on a combination of attributes: amount, timestamp within a window, card last-4, merchant ID. This is heuristic and produces false matches, so you need a confidence score and a manual queue for ambiguous cases. The right fix is to negotiate a stable reference into the integration contract from day one — it's much cheaper than building heuristics later."],
["What's the difference between reconciliation and settlement?","Settlement is the actual movement of funds between institutions — the bank transfers money to your account. Reconciliation is verifying that your records match theirs. They're related but distinct: settlement happens on the counterparty's schedule, reconciliation is your process of checking. You can have settlement without reconciliation (you get the money but don't verify the detail) and reconciliation without settlement (you verify the records but the money hasn't moved yet). You need both, and reconciliation is what tells you settlement was correct."]
],
exit:"Design the ledger and reconciliation process end to end in 12 minutes, including the integrity check and every break category."},

{d:46,wk:7,prio:"P0",title:"Case Drill — UPI Spike & Double Debit",
obj:"Two of the most commonly asked fintech scenarios, with full model answers.",
core:`<h4>Case 1 — The payment spike</h4>
<p><b>Prompt:</b> "During a flash sale, transaction volume goes from 1,000 to 10,000 TPS in 90 seconds. Your bank PSP is contractually capped at 1,200 TPS and cannot be raised. Design the system so we don't lose transactions or fall over."</p>
<p><b>Write your answer before reading. 25 minutes.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Clarifying questions:</b> Is the cap global or per-merchant/per-BIN? What's the acceptable latency for the user to see a final status — 2 seconds or 2 minutes? Can we shed load with a retryable error, or must we accept everything? Is the spike predictable?</p>
<p><b>Assume:</b> global cap, 2-minute final-status latency is acceptable, load shedding is allowed, the spike is a scheduled flash sale.</p>
<p><b>The core insight:</b> the PSP is the bottleneck and it's outside my control, so autoscaling my API is the wrong lever — it just moves the queue from my pods to my heap.</p>
<p><b>Ingest path:</b> the API does four things and nothing else — authenticate, validate, write the idempotency key (atomic insert with unique constraint), and enqueue. Then it returns <code>202 Accepted</code> with a transaction ID. That's sub-50ms with no downstream dependency, so it stays fast under any load.</p>
<p><b>The queue:</b> Kafka with partitions keyed by account ID so all of one user's transactions stay ordered. Size the topic to absorb ~10 minutes of peak — about 6 million messages at 10K TPS. Retention of 24 hours gives replay capability.</p>
<p><b>The consumer:</b> drains at exactly 1,200 TPS using a Redis-backed token bucket shared across instances, so the limit is global not per-pod. Concurrency tuned to the PSP's latency — if the PSP takes 200ms, ~240 in-flight requests sustain 1,200 TPS. Hard timeout at 3s with a circuit breaker, because a slow PSP is worse than a failed one.</p>
<p><b>Backpressure — the part that decides survival:</b> monitor queue depth and consumer lag as the primary saturation signals. When the queue exceeds ~15 minutes of drain capacity, stop accepting new work and return 503 with Retry-After. That's honest — the user retries in 30 seconds. Queueing indefinitely means a user waits four minutes for a payment that then fails, converting a spike into a multi-hour outage.</p>
<p><b>Client contract:</b> the app polls <code>GET /transactions/{id}</code> with backoff, or better, receives a webhook or push notification. Either way the user sees "Processing" immediately rather than a spinner.</p>
<p><b>Reconciliation:</b> any transaction that times out at the PSP goes into an UNKNOWN state. Never assumed failed, never assumed successful. A sweeper queries the PSP for status; the daily settlement file catches anything the sweeper misses.</p>
<p><b>The cost of this design:</b> users get a delayed final status instead of an immediate one, and Kafka becomes a critical dependency. Mitigate the second with multi-AZ, replication factor 3, and <code>min.insync.replicas=2</code>.</p>
<p><b>Follow-ups:</b></p>
<ul>
<li><em>"The queue is full — what exactly do you return?"</em> → 503 with Retry-After and jitter guidance. Clients back off. Idempotency keys make retries safe.</li>
<li><em>"Kafka goes down?"</em> → Fail closed for new payments (503) rather than accept work you can't durably store. Accepting and dropping is the worst outcome.</li>
<li><em>"How do you test this?"</em> → Load test at 3× expected peak, chaos-test the PSP with injected latency and 5xx, verify the circuit breaker and queue drain behaviour.</li>
</ul>
</div>
</details>

<h4>Case 2 — The double debit</h4>
<p><b>Prompt:</b> "A user's payment request times out on the client but succeeds on the backend. They retry. How do you prevent a double debit — and how do you fix it if it already happened?"</p>
<p><b>Write your answer before reading. 25 minutes.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Prevention:</b> the idempotency layer, described in full in Day 44. The three states, the atomic claim, the request hash, the sweeper. The critical points:</p>
<ul>
<li>The client generates the key once per logical attempt, not per HTTP request.</li>
<li>The atomic insert with a unique constraint — not a check-then-act.</li>
<li>IN_PROGRESS returns 409, not a second attempt.</li>
<li>The request hash catches key reuse with a different payload.</li>
</ul>
<p><b>If it already happened:</b> the corrective action is <b>not</b> to delete the extra debit. Financial records are append-only. You post a compensating credit entry, linked to the original transaction ID with a reason code, and notify the customer.</p>
<pre><code>Original: debit $100 (txn-123)
Erroneous: debit $100 (txn-456)
Correction: credit $100 (txn-456-reversal, ref: txn-456, reason: DUPLICATE)

The account balance is correct.
The audit trail shows the full story.
Any reviewer can reconstruct exactly what happened and why.</code></pre>
<p><b>Detection:</b> a daily job that flags any account with two debits for the same merchant and amount within a short window. That's a heuristic, not proof, so it goes to a human queue — but it catches cases the idempotency layer missed, like a client that generated two different keys.</p>
<p><b>The honest admission:</b> idempotency only works if the client is disciplined. If the client generates a new key on retry — a bug on their side — you get two charges. That's why detection and reconciliation exist as a backstop. No prevention mechanism is perfect, and the design has to assume some duplicates will occur.</p>
<p><b>Follow-ups:</b></p>
<ul>
<li><em>"What if the client doesn't send a key?"</em> → Some APIs synthesize one from a hash of the request body plus user ID plus a time bucket. Weaker — legitimate identical payments get deduped — so only for low-value operations. Money movement requires explicit keys.</li>
<li><em>"Two requests with the same key arrive 5ms apart on different pods?"</em> → The unique constraint on the database handles it. One insert wins, the other gets a constraint violation. Exactly why you don't SELECT first.</li>
<li><em>"How do you handle a partial refund on a duplicated charge?"</em> → The compensation is a credit for the duplicated amount, which is a new ledger entry. If the customer also received goods, the merchant may need to be debited — that's a business process, not an engineering one, but the ledger supports it with another pair of postings.</li>
</ul>
</div>
</details>

<h4>What these two cases teach together</h4>
<div class="box o"><div class="t">The pattern</div><b>The spike case</b> tests whether you understand that the bottleneck is often outside your boundary, and whether you can design backpressure that degrades honestly. The answer isn't "scale more" — it's "decouple, rate-limit the consumer, and shed load honestly."<br><br>
<b>The double debit case</b> tests whether you understand that prevention and correction are different problems. Prevention is the idempotency layer. Correction is compensating entries plus detection. You need both, because prevention is never perfect — a client bug can defeat it, and the system must handle the consequences.</div>

<h4>The combined scenario — do this one too</h4>
<p><b>Prompt:</b> "During the flash sale, your PSP starts timing out. 30% of requests time out after 3 seconds. You don't know whether those transactions succeeded. What do you do?"</p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Immediately:</b></p>
<ol>
<li><b>Stop the bleeding.</b> Circuit breaker opens after the failure threshold. All new PSP calls fail fast rather than consuming threads for 3 seconds each.</li>
<li><b>Shed load honestly.</b> Return 503 with Retry-After for new payment requests. Do not queue indefinitely — the queue would grow faster than it drains and you'd lose the ability to recover cleanly.</li>
<li><b>Protect the in-flight transactions.</b> The ones already sent to the PSP and awaiting a response — let them time out but record them as UNKNOWN, not failed.</li>
</ol>
<p><b>Then — the critical part:</b></p>
<ol>
<li><b>Do not assume failure.</b> A timeout means the PSP didn't respond in 3 seconds. It does not mean the transaction failed. It might have succeeded.</li>
<li><b>Sweep.</b> A background job queries the PSP for the actual status of every UNKNOWN transaction, using the PSP's own reference. It runs continuously, not just daily, because a timeout storm produces a large batch of UNKNOWNs.</li>
<li><b>Resolve each one.</b> If the PSP says approved, complete the flow — the customer's payment succeeded and they should get their goods. If declined, fail it and notify. If the PSP has no record, mark it failed and let the client retry with the same idempotency key (which is now safe).</li>
<li><b>Reconcile at the daily settlement.</b> Anything the sweeper missed gets caught by the settlement file comparison.</li>
</ol>
<p><b>The idempotency interaction:</b> every one of these transactions has an idempotency key. If the client retries while the sweeper is still resolving, the retry gets a 409 IN_PROGRESS — it doesn't create a second charge. This is exactly why the IN_PROGRESS state exists.</p>
<p><b>What I'd monitor during this:</b> the count of UNKNOWN transactions (this is the number that matters — it's potential money in limbo), the sweeper's resolution rate, the suspense account balance, and the PSP's error rate. If UNKNOWN count is growing faster than the sweeper resolves, I need to scale the sweeper.</p>
<p><b>The post-incident work:</b> the sweeper is a mitigation, but the real fix is understanding why the PSP timed out. Was it our request volume? A change on their side? A network issue? And the observability gap — did we have an alert on PSP latency p99, or did we only notice when timeouts started? A latency alert would have caught this before the timeouts began.</p>
</div>
</details>`,

drill:["Case 1 — 25 minutes timed, then compare and note what you missed.",
"Case 2 — 25 minutes timed. Focus on the correction path and detection.",
"Combined scenario — 20 minutes. Focus on the UNKNOWN state and the sweeper."],

qa:[
["Why is returning 503 better than queueing indefinitely?","Because queueing indefinitely means the user waits a long time for a result that will probably fail. A four-minute wait followed by an error is worse than a two-second wait followed by a clear 'try again in 30 seconds.' It also protects the system: an unbounded queue consumes memory, holds threads, and prevents recovery because new work keeps arriving. Honest, fast rejection is a feature."],
["What's the difference between a timeout and a failure?","A timeout means you didn't get a response in time — the outcome is unknown. A failure means you got a response indicating the operation didn't succeed. Conflating them is dangerous: treating a timeout as a failure means you might retry a transaction that actually succeeded, producing a duplicate. The correct handling is a third state — UNKNOWN — with an explicit resolution process."],
["How do you scale a sweeper that can't keep up with the UNKNOWN backlog?","Add workers. The sweeper is querying the PSP for status, so its throughput is limited by the PSP's rate limit, not by CPU. So the question is whether the PSP will accept more status queries — often it's a different rate limit than transaction submission. If not, prioritize: resolve the oldest UNKNOWNs first (they've been in limbo longest), and resolve high-value ones ahead of low-value. And reduce the inflow by fixing the underlying cause, which is usually more effective than scaling the sweeper."],
["Why does idempotency not fully solve the duplicate problem?","Because it depends on the client sending the same key on retry. If the client generates a new key — because of a bug, or because it stores keys in memory and the process restarted — the server sees two different keys and processes both. Idempotency is a contract: the server provides the mechanism, the client must use it correctly. That's why detection and reconciliation exist as a backstop. No prevention mechanism can be perfect when the other party has to cooperate."],
["What would you change about the architecture after this incident?","Three things. First, add a latency alert on the PSP — p99 above a threshold, which would have caught the degradation before it became timeouts. Second, make the UNKNOWN count a first-class dashboard metric and alert on its growth rate. Third, add a load-shedding policy that's explicit rather than emergent — decide in advance what gets rejected when the queue fills, rather than discovering it during an incident. And I'd write an ADR documenting the UNKNOWN state and the sweeper, so the next engineer understands why it exists."]
],
exit:"Deliver both cases plus the combined scenario in under 70 minutes total, with the UNKNOWN state handled correctly."},

{d:47,wk:7,prio:"P0",title:"Case Drill — Cross-Border & Fraud Detection",
obj:"Two more complex fintech scenarios with full model answers.",
core:`<h4>Case 3 — Cross-border payment</h4>
<p><b>Prompt:</b> "Design a system that lets a user in the US send money to a recipient in India, arriving in INR."</p>
<p><b>Write your answer before reading. 30 minutes.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Clarify:</b> Is the FX rate locked at quote time or execution time? Who bears the rate risk in between? Acceptable delivery time — minutes, hours, T+1? Who are the payout partners in India? What compliance obligations — KYC, AML, sanctions, purpose codes? What's the value range?</p>
<p><b>The framing:</b> this isn't a distributed transaction — it's a long-running business process with compensations. There are at least four independent systems involved (our ledger, an FX liquidity provider, a correspondent banking rail, and a local payout partner) and they cannot be made atomic.</p>
<p><b>The flow:</b></p>
<ol>
<li><b>Quote.</b> User requests a quote. We lock a rate for 30 seconds with a rate-lock ID. The rate includes our spread. This is a real financial exposure — if the market moves against us in those 30 seconds, we eat it.</li>
<li><b>Compliance gate.</b> KYC on the sender, sanctions screening on both parties, AML transaction monitoring, and for India, purpose codes and FEMA compliance. A synchronous gate with an async fallback for manual review. Failures here are business outcomes, not errors.</li>
<li><b>Funds capture.</b> Debit the sender's USD wallet. Money moves to a suspense account — not yet sent.</li>
<li><b>FX execution.</b> Call the liquidity provider to convert USD → INR at or near the locked rate. Record the actual rate obtained.</li>
<li><b>Payout instruction.</b> Send INR to the local partner for delivery via UPI, IMPS, or NEFT depending on amount and speed.</li>
<li><b>Settlement &amp; reconciliation.</b> The partner confirms delivery. Clear the suspense account. Post final ledger entries.</li>
</ol>
<p><b>The state machine — the heart of the answer:</b></p>
<pre><code>QUOTED → COMPLIANCE_PENDING → COMPLIANCE_APPROVED
→ FUNDS_HELD → FX_EXECUTED → PAYOUT_INITIATED
→ PAYOUT_CONFIRMED → SETTLED

Exception states:
COMPLIANCE_REJECTED → REFUNDED
FX_FAILED → REFUNDED
PAYOUT_FAILED → retry or REFUNDED
IN_MANUAL_REVIEW → any terminal state</code></pre>
<p>Every transition is persisted, idempotent, and emits an event. The transfer ID is the idempotency key threaded through every external call. If we crash, a recovery job reads the state and resumes or compensates.</p>
<p><b>Compensations:</b></p>
<table><thead><tr><th>Failure</th><th>Compensation</th><th>Cost</th></tr></thead><tbody>
<tr><td>Compliance rejected after funds held</td><td>Refund the sender</td><td>Clean</td></tr>
<tr><td>FX executed but payout failed</td><td>Retry with another partner; if that fails, convert back and refund</td><td>Round-trip FX loss</td></tr>
<tr><td>Payout initiated, no confirmation</td><td><b>Never assume.</b> Query the partner; escalate to manual review</td><td>A duplicate payout is a real loss</td></tr>
</tbody></table>
<p><b>The hard parts I'd call out:</b></p>
<ul>
<li><b>Rate risk.</b> The window between quote and execution is uncompensated exposure. Mitigations: short lock windows, hedging the aggregate position, or passing the risk to the user with a rate that refreshes at execution. This is a business decision as much as a technical one.</li>
<li><b>Partial information.</b> The partner's API will sometimes return "pending" forever. You need an SLA-based escalation: after N hours, a human investigates.</li>
<li><b>Regulatory variance.</b> Rules differ by corridor and change. Model compliance as a pluggable rules engine per corridor rather than hardcoding — otherwise every regulatory change is a deploy.</li>
<li><b>Rounding.</b> Converting USD → INR involves rounding to paise. The fractional difference must land in a rounding account and be visible in reporting.</li>
</ul>
<p><b>The summary line:</b> "This isn't a distributed transaction — it's a long-running business process with compensations. I'd rather have an explicit, observable state machine with manual intervention points than an elegant design that assumes external systems behave. In cross-border payments, they don't."</p>
</div>
</details>

<h4>Case 4 — Real-time fraud detection</h4>
<p><b>Prompt:</b> "Design a fraud detection system that scores every transaction in under 100ms and can incorporate new rules without a deploy."</p>
<p><b>Write your answer before reading. 30 minutes.</b></p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>The two constraints:</b> the 100ms budget, and the fact that fraud is adversarial — patterns change, so the system must change faster than a release cycle.</p>
<p><b>Budget allocation:</b> 15ms for feature retrieval, 30ms for model scoring, 15ms for rule evaluation, the rest as headroom for network and GC.</p>
<p><b>Two-tier architecture:</b></p>
<p><b>Tier 1 — synchronous, in the payment path (&lt;100ms).</b> Returns ALLOW, REVIEW, or BLOCK. Uses:</p>
<ul>
<li><b>Pre-computed features</b> from a feature store: velocity counters (transactions in the last 1m/1h/24h), device and IP reputation, merchant risk score, historical chargeback rate for this card BIN, account age. In Redis or an in-process cache — never a database query.</li>
<li><b>A gradient-boosted model</b> (XGBoost/LightGBM) exported to a fast inference runtime. 5–20ms typically. Complex deep models rarely fit the latency budget and rarely beat GBM enough to justify it.</li>
<li><b>A rules engine</b> with hot-reloadable rules stored in a config service. This is how fraud analysts ship changes without engineering — and it's the answer to the "without a deploy" requirement.</li>
<li><b>Fallback behaviour:</b> if the fraud service times out, what happens? A business decision. Default to ALLOW with post-hoc review if the fraud rate is low; default to REVIEW if the loss rate is high. Never let a fraud service outage become a payments outage unless the business explicitly chooses that.</li>
</ul>
<p><b>Tier 2 — asynchronous, seconds to minutes.</b> Consumes the full transaction stream from Kafka and does the expensive work:</p>
<ul>
<li>Graph analysis: is this card linked to a known fraud ring through a shared device, address, or phone?</li>
<li>Behavioural models over longer windows: is this inconsistent with the user's six-month pattern?</li>
<li>Cross-merchant correlation: is this card at 12 merchants in 3 minutes?</li>
<li>Model retraining and backtesting against labelled outcomes.</li>
</ul>
<p>Tier 2 can retroactively flag a transaction and trigger a hold or step-up authentication on the next one. It can't un-charge a completed transaction, but it can stop the follow-up.</p>
<p><b>Feature computation:</b> velocity features need streaming aggregation. Kafka Streams with a windowed state store, Flink, or Redis with expiring counters and Lua for atomicity. <b>The critical requirement:</b> offline training features and online serving features must be computed by the same logic. Training/serving skew is the most common reason fraud models silently degrade in production.</p>
<p><b>The feedback loop:</b> the system is only as good as its labels. Labels come from chargebacks (30–90 days, slow), manual review decisions (fast), and customer reports.</p>
<div class="box w"><div class="t">The bias problem worth naming</div>You only get labels for what you chose to review. The model never learns about what it allowed. This means the training data is biased toward the decision policy, and the model can't discover that it's systematically wrong about a category of transaction it always allows. The mitigation is a small random sample of allowed transactions sent to review — deliberately sacrificing a little precision to keep the training data unbiased. Most candidates never mention this; it signals real ML systems experience.</div>
<p><b>What I'd monitor:</b></p>
<table><thead><tr><th>Metric</th><th>Why</th></tr></thead><tbody>
<tr><td>False positive rate</td><td>The business cost — every FP is a declined legitimate customer</td></tr>
<tr><td>Fraud capture rate and dollar loss</td><td>The benefit</td></tr>
<tr><td>Decision latency p99</td><td>The hard constraint</td></tr>
<tr><td>Feature drift</td><td>Are distributions shifting away from training?</td></tr>
<tr><td>Rule hit rates</td><td>A rule firing on 30% of traffic is wrong; one never firing is dead weight</td></tr>
<tr><td>Review queue depth and SLA</td><td>Are we resolving cases in time?</td></tr>
</tbody></table>
<p><b>The trade-off to state explicitly:</b> every increase in fraud capture costs legitimate customers. There's no setting where you catch all fraud and decline nobody. The job is to make that trade-off visible and tunable by the business, with the numbers in front of them — not to make it silently inside a model.</p>
<p><b>Why the rules engine matters:</b> a model can't explain itself to a regulator. When a transaction is blocked and the customer complains, you need to say why. A rules engine produces an auditable reason; a neural network doesn't. In a regulated domain, explainability is a requirement, not a nice-to-have.</p>
</div>
</details>

<h4>The four cases together — what they test</h4>
<table><thead><tr><th>Case</th><th>Core skill being tested</th></tr></thead><tbody>
<tr><td>UPI spike</td><td>Backpressure and honest degradation when the bottleneck is external</td></tr>
<tr><td>Double debit</td><td>Prevention vs correction — and knowing prevention is never perfect</td></tr>
<tr><td>Cross-border</td><td>Long-running processes with compensations and business-level trade-offs</td></tr>
<tr><td>Fraud detection</td><td>Latency budgets, adversarial adaptation, and explainability in a regulated domain</td></tr>
</tbody></table>
<div class="box o"><div class="t">The meta-skill</div>Every one of these cases has a moment where the right answer is "this is a business decision, not a technical one." The rate-lock window, the fraud fallback policy, the acceptable staleness on the dashboard. Naming those moments — and asking the business to decide rather than deciding for them — is what separates an architect from a senior engineer. It's also what interviewers are listening for.</div>`,

drill:["Cross-border — 30 minutes timed. Focus on the state machine and the compensations.",
"Fraud detection — 30 minutes. Focus on the latency budget and the rules engine.",
"Re-do the double debit case from Day 46 without notes and compare."],

qa:[
["Why is the FX rate lock window a business decision rather than a technical one?","Because it's a direct trade-off between customer experience and financial risk, and only the business knows the acceptable cost. A longer lock window is better for the customer — they see a stable rate — but exposes the company to more market movement. A shorter window reduces risk but frustrates users. The engineering answer is 'make the window configurable'; the business answer is 'here's the number.' The architect's job is to make the trade-off explicit with the numbers, not to pick."],
["Why can't you use deep learning for the fraud model?","You can, but it rarely justifies the cost at the latency budget. A gradient-boosted tree is 5–20ms and typically within a few points of a deep model on tabular fraud data. A deep model might be 50–200ms, which blows the budget, and needs a GPU. The exceptions: sequence models for behavioural patterns (RNN/Transformer over transaction history) where the structure genuinely helps. But those usually run in Tier 2, not in the 100ms path."],
["How do you handle a rules engine that's hot-reloadable without breaking transactions in flight?","Version the rules. Each evaluation loads the current ruleset version, so a transaction being scored during a reload uses a consistent set. Store the ruleset version on the decision record — so when you're investigating why a transaction was blocked six months ago, you know exactly which rules were active. And validate new rules against historical transactions before activating them, in shadow mode: run the new ruleset alongside the current one and compare decisions without acting on them."],
["What happens if the fraud service is down and you default to ALLOW?","You accept fraud you would have blocked. The magnitude depends on your base fraud rate and the value of the transactions. The mitigation is post-hoc review — Tier 2 still runs, and you can flag accounts and step up authentication on subsequent transactions. For high-value transactions you might default to REVIEW instead of ALLOW, accepting the customer friction because the loss exposure is larger. The point is that this is a deliberate, documented policy, not an accident discovered during an incident."],
