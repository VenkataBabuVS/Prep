<li><b>Move the largest tenants to a dedicated shard.</b> The <code>tenant_id</code> on every table makes this a routing change, not a schema change.</li>
</ol>

<p><b>The activity feed query:</b></p>
<pre><code>SELECT c.id, c.body, c.created_at, u.name AS author, t.title
FROM comments c
JOIN tasks t ON t.id = c.task_id AND t.tenant_id = c.tenant_id
JOIN users u ON u.id = c.author_id
WHERE c.tenant_id = :tenantId
AND t.project_id = :projectId
ORDER BY c.created_at DESC
LIMIT 50;</code></pre>
<p><b>Note the join condition:</b> <code>t.tenant_id = c.tenant_id</code>. Including <code>tenant_id</code> in the join predicate lets the planner use the composite indexes and makes cross-tenant leakage structurally impossible — a bug in the WHERE clause can't produce cross-tenant rows.</p>

<h4>Scoring</h4>
<table><thead><tr><th>Dimension</th><th>What good looks like</th></tr></thead><tbody>
<tr><td>Schema</td><td>Tenant on every table; unique constraints scoped correctly</td></tr>
<tr><td>Indexes</td><td>One per hot query, leading with tenant_id, justified individually</td></tr>
<tr><td>Isolation</td><td>Row-level security mentioned, not just application-level filtering</td></tr>
<tr><td>Skew</td><td>Acknowledged, with a plan but not premature optimisation</td></tr>
<tr><td>Query</td><td>Tenant in the join predicate, not just the WHERE</td></tr>
<tr><td>Future</td><td>Sharding path clear because of the tenant_id design</td></tr>
</tbody></table>

<div class="box o"><div class="t">End of Week 4 checkpoint</div>You should now be able to walk into any system design round and reason confidently about data: schema, indexes, isolation, replication, and scaling. That's half the technical score in an architect interview. Week 5 moves to distributed systems — consistency, messaging, and resilience.</div>`,

drill:["Answer all 10 retrieval questions out loud, timed.",
"Complete the schema design on paper in 30 minutes before checking the model answer.",
"Take a real slow query from your work and optimise it using the full checklist. Write down the before and after plans."],

qa:[
["Why put tenant_id on every table even when it's derivable through a join?","Three reasons. First, row-level security needs it locally — a policy can't easily reference a joined table. Second, every index leading with tenant_id means no query can accidentally scan across tenants, which makes leakage structurally impossible rather than a code-review concern. Third, it makes future sharding by tenant a routing change rather than a schema migration. The cost is a few extra bytes per row and one more column in each index. That's cheap insurance."],
["How would you test that tenant isolation actually works?","Write a test that creates two tenants, writes data to both, and then queries as tenant A while asserting that no row from tenant B ever appears. Run it against every repository method. Better: enable row-level security and have the test use a non-superuser role, so a policy violation is a database error rather than a silently-wrong result. The most valuable version is a test that attempts a cross-tenant read with a deliberately wrong tenant_id and asserts the result is empty."],
["Why use a partial index for 'my open tasks'?","Because most tasks are done, so an index over all tasks is mostly wasted space — the query never asks for done tasks. A partial index on <code>status &lt;&gt; 'DONE'</code> might be 10% of the size, which means fewer pages to read, better cache hit rate, and faster index maintenance on writes. The condition in the index must match the condition in the query, otherwise the planner won't use it. This is a case where understanding the data distribution makes the index dramatically better."],
["What would change if you needed to shard this by tenant?","The <code>tenant_id</code> on every table makes it a routing change. I'd add a routing layer that maps tenant_id to a shard, either by range (tenants 1–10,000 on shard A) or hash. Cross-tenant queries — admin reporting, aggregate metrics — would need scatter-gather. The unique constraint on <code>(tenant_id, email)</code> still works because it's within a shard. The one thing that breaks is any global sequence — so I'd use UUIDs, which the schema already does."],
["How do you decide between row-level security and application-level filtering?","Row-level security is defence in depth. Application filtering is the primary mechanism — it's explicit and visible in the query. RLS is the backstop that catches the query someone forgot to scope. I'd use both: the application filters by tenant because that's what a developer expects to see, and RLS enforces it so a missed WHERE clause returns an empty result rather than another tenant's data. The cost is that RLS adds a predicate to every query, which the planner handles but you should verify with EXPLAIN."]
],
exit:"Complete the schema design in 30 minutes and defend your index choices, then answer all 10 retrieval questions in under 15 minutes total."},

/* ================= WEEK 5 — DISTRIBUTED SYSTEMS ================= */
{d:29,wk:5,prio:"P0",title:"Consistency Models, CAP & PACELC",
obj:"Choose a consistency model per operation, not per system.",
core:`<h4>The consistency ladder — weakest to strongest</h4>
<table><thead><tr><th>Model</th><th>Guarantee</th><th>Real use</th></tr></thead><tbody>
<tr><td><b>Eventual</b></td><td>Replicas converge given no new writes</td><td>Feeds, analytics, search indexes</td></tr>
<tr><td><b>Read-your-writes</b></td><td>You see your own prior writes</td><td>Profile updates, posting a comment</td></tr>
<tr><td><b>Monotonic reads</b></td><td>You never see older data after newer</td><td>Prevents "time going backwards" in a UI</td></tr>
<tr><td><b>Causal</b></td><td>Causally-related ops are seen in order</td><td>Comment threads, collaborative editing</td></tr>
<tr><td><b>Sequential</b></td><td>All ops in one total order consistent with program order</td><td>Rarely chosen explicitly</td></tr>
<tr><td><b>Linearizable</b></td><td>Every op appears atomic and instant, in real-time order</td><td>Balances, locks, leader election</td></tr>
</tbody></table>

<div class="box"><div class="t">The sentence that signals seniority</div>"Consistency isn't a system-wide property — it's a per-operation decision. In a payment system the ledger write is linearizable, but the transaction history the customer sees in the app can be eventually consistent with a 200ms lag, because nobody's money depends on that read being fresh. Choosing one model for the whole system is almost always wrong."</div>

<h4>CAP — what it actually says</h4>
<pre><code>In the presence of a network Partition, you must choose:
Consistency — every read sees the latest write, or errors
Availability — every request gets a non-error response

You cannot have both. When there is no partition, you can have both.</code></pre>
<p><b>What CAP does NOT say:</b></p>
<ul>
<li>That you pick two of three permanently. P is not optional in a distributed system — partitions happen. You choose C or A <em>when</em> a partition occurs.</li>
<li>Anything about normal operation. That's what PACELC adds.</li>
<li>That "consistent" means ACID-consistent. CAP's C is about linearizability of reads and writes.</li>
</ul>

<h4>PACELC — the useful extension</h4>
<pre><code>if (Partition) {
choose Availability or Consistency
} else {
choose Latency or Consistency
}</code></pre>
<table><thead><tr><th>System</th><th>PACELC</th><th>What it means in practice</th></tr></thead><tbody>
<tr><td>Cassandra, DynamoDB</td><td>PA / EL</td><td>Always writable, tunably consistent, lowest latency</td></tr>
<tr><td>Spanner, CockroachDB</td><td>PC / EC</td><td>Always consistent, higher latency (consensus per write)</td></tr>
<tr><td>MongoDB (majority)</td><td>PC / EC</td><td>Consistent when configured for it</td></tr>
<tr><td>PostgreSQL async replica</td><td>PC / EL</td><td>Fast writes; replica reads can be stale</td></tr>
<tr><td>PostgreSQL sync replica</td><td>PC / EC</td><td>Consistent but writes block if replica is down</td></tr>
<tr><td>Redis (default)</td><td>PA / EL</td><td>Fast; can lose recent writes on failover</td></tr>
</tbody></table>

<h4>Linearizability — what it costs</h4>
<p>To guarantee that a read always sees the latest write, you need either:</p>
<ul>
<li><b>A single node</b> handling all reads and writes for that key. Simple, but that node is a bottleneck and a SPOF.</li>
<li><b>Consensus per write.</b> A majority must acknowledge before the write commits. Latency is the round-trip to the median (not the fastest) node.</li>
<li><b>Physical clock bounds.</b> Spanner's TrueTime uses GPS and atomic clocks to bound clock uncertainty, letting it order transactions globally without consensus on every read. This is why Spanner needs custom hardware.</li>
</ul>
<p><b>The latency cost:</b> a quorum write across three availability zones in one region is ~5–15ms. Across continents it's 100–300ms. That's why globally-distributed linearizable systems are expensive and why most systems relax consistency for the operations that can tolerate it.</p>

<h4>Conflict resolution — what happens when replicas disagree</h4>
<table><thead><tr><th>Strategy</th><th>How</th><th>Risk</th></tr></thead><tbody>
<tr><td><b>Last-write-wins</b></td><td>Highest timestamp wins</td><td>Silent data loss; depends on clock sync</td></tr>
<tr><td><b>Vector clocks</b></td><td>Track causal history; detect concurrent writes</td><td>Metadata grows; concurrent writes still need resolution</td></tr>
<tr><td><b>CRDTs</b></td><td>Data structures that merge deterministically</td><td>Only work for specific data types (counters, sets, registers)</td></tr>
<tr><td><b>Application merge</b></td><td>Store both versions, let the app decide</td><td>Requires application logic; complex</td></tr>
<tr><td><b>Avoid conflicts</b></td><td>Route all writes for a key to one node</td><td>Limits availability during partition</td></tr>
</tbody></table>
<div class="box w"><div class="t">The honest answer on LWW</div>"Last-write-wins is the most common conflict resolution and the most dangerous. It silently discards data, and it depends on client clocks being synchronised — which they aren't. If I were building a system where conflicting writes are possible, I'd rather detect the conflict and surface it than silently lose a write. That's why I prefer single-writer-per-key partitioning — it makes conflicts impossible by design."</div>

<h4>Choosing a consistency model per operation</h4>
<table><thead><tr><th>Operation</th><th>Model</th><th>Why</th></tr></thead><tbody>
<tr><td>Debit an account</td><td>Linearizable</td><td>Money correctness — cannot read a stale balance</td></tr>
<tr><td>Idempotency key lookup</td><td>Linearizable</td><td>A stale read means a duplicate charge</td></tr>
<tr><td>Read your own profile</td><td>Read-your-writes</td><td>User expects to see their own edit</td></tr>
<tr><td>Fraud score lookup</td><td>Eventual (seconds)</td><td>Best-effort signal; blocking is worse than a stale score</td></tr>
<tr><td>Transaction history in app</td><td>Eventual (~200ms)</td><td>Nobody's money depends on it</td></tr>
<tr><td>Analytics dashboard</td><td>Eventual (minutes)</td><td>Batch/warehouse is fine</td></tr>
<tr><td>Inventory count for display</td><td>Eventual</td><td>"Only 3 left!" being off by one is acceptable</td></tr>
<tr><td>Inventory reservation</td><td>Linearizable</td><td>Overselling is not acceptable</td></tr>
</tbody></table>

<h4>Monotonic reads — the one people forget</h4>
<pre><code>// User sees: "Your order has shipped" (from replica A, lagging)
// Refresh:
// User sees: "Your order is being packed" (from replica B, further behind)
// Time appears to go backwards. User is confused and calls support.</code></pre>
<p><b>Monotonic reads</b> guarantee that once you've seen a value, you'll never see an older one. Achieved by pinning a user to a replica for a session, or by tracking a read timestamp and requiring replicas to be at least that fresh.</p>

<h4>How to talk about this in an interview</h4>
<div class="box o"><div class="t">The template</div>"Let me go through the operations and pick a consistency model for each, because it's not a system-wide choice.<br><br>
The <b>ledger write</b> is linearizable — I'll use a single-writer-per-account pattern or a quorum write. The <b>idempotency key check</b> is also linearizable, because a stale read there means a duplicate charge.<br><br>
The <b>transaction history</b> the app displays is eventually consistent from a read replica, with read-your-writes applied for a two-second window after a write so the user sees their own payment.<br><br>
The <b>fraud score</b> is eventual — a 30-second-old score is fine, and blocking the payment path on a fraud service outage would be worse.<br><br>
That gives me linearizability where money depends on it, and availability and low latency everywhere else."</div>`,

drill:["Write out the consistency model for eight operations in a payment system, with justification for each.",
"Configure a PostgreSQL replica with artificial lag. Demonstrate read-your-writes failing. Implement the fix with a read-from-primary window.",
"Explain why Spanner needs atomic clocks, in three sentences."],

qa:[
["Is CAP really 'pick two of three'?","No, and repeating that marks you as someone who read a blog post. P is not optional — networks partition. The real statement is: when a partition occurs, you must choose between consistency and availability for that duration. And CAP says nothing about the 99.9% of the time when there's no partition, which is why PACELC exists — it adds the latency-versus-consistency trade-off that applies during normal operation."],
["What's the difference between linearizability and serializability?","Linearizability is about single operations: each read or write appears to take effect instantaneously at some point between its invocation and response, respecting real-time order. Serializability is about transactions: the combined effect of concurrent transactions is equivalent to some serial order. They're orthogonal — you can have one without the other. Strict serializability combines both, and it's what people usually mean when they say 'strongly consistent transactions'."],
["How does a system achieve linearizable reads without consensus on every read?","By using leases. The leader holds a time-limited lease, and during that lease it's guaranteed to be the only leader. A read can be served by the leader without a round of consensus, because the lease proves no other node can be accepting writes. This requires bounded clock skew — the lease is only safe if clocks don't drift more than the lease margin. It's how many Raft implementations make reads cheap."],
["When is eventual consistency genuinely acceptable?","When the cost of a stale read is low and the cost of unavailability or latency is high. Activity feeds, view counts, like counts, search indexes, analytics, recommendation inputs. The test: if this value were 5 seconds old, would anyone make a worse decision or notice? If no, eventual is fine. If a customer would be charged twice, or an item would be oversold, it's not."],
["How do you implement read-your-writes in a system with read replicas?","Track the write. Either store the last-write timestamp per user in a session or cache, and route reads to the primary while that timestamp is within the replication lag window (typically 1–3 seconds). Or use a log position token — the write returns the LSN, and the read requires a replica that has reached that LSN. The first is simpler and works when lag is bounded; the second is correct even when lag isn't."]
],
exit:"Choose a consistency model for eight operations in a payments system, justifying each in one sentence — under 3 minutes total."},

{d:30,wk:5,prio:"P0",title:"Consensus — Raft You Can Whiteboard",
obj:"Draw and explain Raft leader election and log replication without notes.",
core:`<h4>Why consensus matters</h4>
<p>Consensus is agreeing on a single value across a set of nodes that can fail and whose messages can be delayed. It's the foundation of every strongly-consistent distributed system: leader election, distributed locks, configuration management, distributed transactions.</p>

<h4>The problem consensus solves</h4>
<pre><code>Three nodes. A client writes X=1.
Node A receives it. Before A can replicate, it crashes.
Did the write happen?

If A had replied "success" before replicating, the write is lost when A restarts.
If A waited for replication, it couldn't reply until it heard from others.
Consensus is the mechanism that makes this decision safely.</code></pre>

<h4>Raft — the three states</h4>
<pre><code>Follower → passive; responds to leader and candidate requests
Candidate → requesting votes to become leader
Leader → accepts client writes, replicates to followers</code></pre>

<h4>Terms — the logical clock</h4>
<p>Every Raft message carries a <b>term</b> — a monotonically increasing integer. A node that sees a higher term immediately updates its own and reverts to follower. Terms are how the cluster agrees on which election is current and detect stale leaders.</p>

<h4>Leader election — step by step</h4>
<ol>
<li><b>Followers expect heartbeats</b> from the leader. Each has a randomized election timeout (150–300ms typical).</li>
<li><b>If no heartbeat arrives before the timeout</b>, the follower becomes a candidate, increments its term, and votes for itself.</li>
<li><b>It sends RequestVote to all peers</b> with its term and the index/term of its last log entry.</li>
<li><b>A peer grants the vote if:</b> it hasn't voted in this term, AND the candidate's log is at least as up-to-date (higher last log term, or same term with a longer log).</li>
<li><b>If the candidate gets a majority</b>, it becomes leader and immediately sends heartbeats to establish authority.</li>
<li><b>If the election times out</b> (split vote), a new election starts with a new randomized timeout.</li>
</ol>
<div class="box"><div class="t">Why randomized timeouts</div>If all followers timed out simultaneously, they'd all become candidates, all vote for themselves, and no one would get a majority. The election would repeat forever. Randomising the timeout means one node usually fires first, wins the election, and the others get a heartbeat before their own timeout expires. It's a simple, elegant solution to a real problem.</div>

<h4>Log replication — step by step</h4>
<ol>
<li><b>Client sends a write to the leader.</b></li>
<li><b>The leader appends the entry to its log</b> with the current term and index.</li>
<li><b>The leader sends AppendEntries</b> to all followers with the entry plus the index/term of the previous entry (for consistency checking).</li>
<li><b>Followers verify:</b> does my log have an entry at <code>prevLogIndex</code> with <code>prevLogTerm</code> matching? If yes, append. If no, reject — the leader backs up and retries.</li>
<li><b>Once a majority has appended</b> the entry, the leader marks it <b>committed</b>, applies it to its state machine, and replies to the client.</li>
<li><b>The leader tells followers the commit index</b> in the next AppendEntries, and they apply it too.</li>
</ol>
<div class="box b"><div class="t">The key safety property</div>A candidate can only win an election if its log is at least as up-to-date as a majority of the cluster. Combined with the requirement that a commit needs a majority, this guarantees <b>any committed entry is present in every future leader's log</b>. That's what prevents committed writes from being lost. It's the entire correctness argument for Raft and interviewers do ask for it.</div>

<h4>Quorum arithmetic</h4>
<table><thead><tr><th>Cluster size</th><th>Quorum</th><th>Failures tolerated</th></tr></thead><tbody>
<tr><td>1</td><td>1</td><td>0</td></tr>
<tr><td>2</td><td>2</td><td>0 — worse than 1!</td></tr>
<tr><td>3</td><td>2</td><td>1</td></tr>
<tr><td>4</td><td>3</td><td>1 — same as 3, more cost</td></tr>
<tr><td>5</td><td>3</td><td>2</td></tr>
<tr><td>7</td><td>4</td><td>3</td></tr>
</tbody></table>
<p><b>The rule:</b> odd cluster sizes. An even size gives no additional fault tolerance but adds latency (the quorum is larger) and cost. Always 3, 5, or 7.</p>

<h4>Network partitions in Raft</h4>
<pre><code>5 nodes. Network splits 3 + 2.

The 3-node partition: has a quorum (3 of 5) → can elect a leader, accepts writes.
The 2-node partition: no quorum → cannot elect, cannot commit, rejects writes.

When the partition heals, the 2-node side discovers a higher term,
reverts to follower, and its uncommitted entries are discarded.</code></pre>
<p><b>This is CP behaviour.</b> The minority partition is unavailable for writes. That's the deliberate trade-off — you cannot have both consistency and availability during a partition, and Raft chooses consistency.</p>

<h4>Reads in Raft</h4>
<p>Naively, every read would need a log entry, which is expensive. Two optimisations:</p>
<ul>
<li><b>Read index:</b> the leader records its commit index, confirms it's still leader via a heartbeat round, then serves the read from its state machine if it's applied up to that index.</li>
<li><b>Lease reads:</b> the leader holds a time-bounded lease during which it's guaranteed to be the only leader. Reads are served locally without any round trip. Requires bounded clock skew.</li>
</ul>
<p><b>Lease reads are the fast path</b> and what production systems use. The cost is the clock assumption — if clocks drift more than the lease margin, two leaders can serve reads simultaneously and you lose linearizability.</p>

<h4>Where you encounter Raft</h4>
<ul>
<li><b>etcd</b> — Kubernetes cluster state. Every <code>kubectl apply</code> goes through Raft.</li>
<li><b>Consul</b> — service discovery and KV store.</li>
<li><b>ZooKeeper</b> — uses ZAB, a Raft-like protocol.</li>
<li><b>Patroni</b> — PostgreSQL HA failover.</li>
<li><b>CockroachDB, TiKV</b> — per-range consensus.</li>
<li><b>Kafka KRaft</b> — the controller quorum, replacing ZooKeeper.</li>
</ul>

<h4>Raft vs Paxos</h4>
<table><thead><tr><th></th><th>Raft</th><th>Paxos</th></tr></thead><tbody>
<tr><td>Understandability</td><td>Designed explicitly for it</td><td>Notoriously hard</td></tr>
<tr><td>Structure</td><td>Strong leader, sequential terms</td><td>Leaderless in basic form</td></tr>
<tr><td>Log</td><td>Built in — it's a replicated log protocol</td><td>Multi-Paxos needs extension for a log</td></tr>
<tr><td>Production use</td><td>etcd, Consul, TiKV</td><td>Chubby, Spanner (variants)</td></tr>
</tbody></table>
<p><b>The interview answer:</b> "Raft and Paxos solve the same problem. Raft was designed to be understandable — it decomposes into leader election, log replication, and safety, each of which can be explained separately. Paxos is more general and theoretically elegant but harder to implement correctly. In practice, most modern systems use Raft or a Raft-derived protocol."</p>

<h4>Whiteboard practice</h4>
<div class="box o"><div class="t">What to draw in an interview</div>
Draw five boxes labelled with node IDs and states (L, F, F, F, F). Then:<br><br>
<b>1.</b> Show the leader sending heartbeats with arrows.<br>
<b>2.</b> Erase the leader. Show one follower becoming candidate, incrementing term, sending RequestVote.<br>
<b>3.</b> Show the votes coming back, and the new leader.<br>
<b>4.</b> Show a client write arriving, being appended to the leader's log, replicated to two followers.<br>
<b>5.</b> Mark the entry committed once the majority acknowledges.<br><br>
Label every message with its term number. That's the whole protocol in five steps.</div>`,

drill:["Draw Raft leader election and log replication on paper, labelling every message with its term.",
"Work through the partition scenario for a 5-node cluster split 3+2. What happens on each side? What happens on heal?",
"Explain why even-sized clusters are pointless, with the quorum arithmetic."],

qa:[
["Why does a candidate need its log to be at least as up-to-date as a majority to win?","Because otherwise a node with a stale log could become leader and overwrite committed entries. The requirement guarantees that any future leader has every committed entry — because a committed entry exists on a majority, and a candidate needs a majority of votes, so at least one voter has the entry. And that voter would refuse to vote for a candidate whose log is behind. This is the core safety argument."],
["What happens to uncommitted entries when a leader is deposed?","They're discarded. When a new leader is elected, its log becomes authoritative. Followers whose logs contain entries that conflict with the new leader's log have those entries overwritten. This is safe because uncommitted entries were never acknowledged to the client — they never happened, from the client's perspective. The guarantee is only about committed entries."],
["Why is Raft's log replication described as a 'replicated state machine'?","Because the log is a sequence of commands, and every node applies them in the same order to its own copy of the state machine. Same commands, same order, same starting state → same resulting state. That's why the log is the replication mechanism: you replicate the sequence of operations rather than the resulting state. It's more compact and it makes the correctness argument simpler."],
["How does Raft handle a slow follower?","The leader keeps sending AppendEntries and retries. It doesn't block on the slow follower — the commit only requires a majority. If the follower falls far behind, the leader sends a snapshot of the state machine at a known index, and the follower installs it and resumes from there. This is called log compaction, and without it the log would grow forever."],
["What's the difference between a Raft cluster and a primary-replica database setup?","A primary-replica setup replicates data but the failover decision is often external and not consensus-based — which is how split-brain happens. Raft makes the failover decision part of the protocol: leadership is elected by quorum, with a term number that orders all decisions. That's why Raft-based systems don't split-brain, and why naive primary-replica setups do. The cost is that Raft requires a majority to be available, whereas a primary-replica setup can keep the primary accepting writes even when isolated — at the cost of correctness."]
],
exit:"Whiteboard Raft — election and replication — in under 8 minutes, then explain the safety argument in 60 seconds."},

{d:31,wk:5,prio:"P0",title:"Kafka — Ordering, Delivery Semantics & Operations",
obj:"Explain partitioning, exactly-once, rebalancing, and consumer lag without notes.",
core:`<h4>The core model</h4>
<pre><code>Topic: orders
├── Partition 0: [msg0, msg1, msg5, msg9, ...] ← ordered within partition
├── Partition 1: [msg2, msg3, msg6, ...]
└── Partition 2: [msg4, msg7, msg8, ...]

Producer → partitioner → partition → append to log → replicas
Consumer group → each partition assigned to exactly one consumer</code></pre>
<ul>
<li><b>Ordering is guaranteed within a partition, not across a topic.</b> This is the single most important fact.</li>
<li><b>Partitions are the unit of parallelism.</b> More partitions = more consumers can work in parallel.</li>
<li><b>Offset</b> is the consumer's position in a partition. Commit it to track progress.</li>
<li><b>Retention</b> is time or size based, independent of consumption. Messages aren't deleted on read.</li>
</ul>

<h4>Partitioning — getting it right</h4>
<pre><code>// Default partitioner: hash(key) % numPartitions
producer.send(new ProducerRecord&lt;&gt;("orders", order.getAccountId(), order));

// All messages for one account go to the same partition → ordered per account
// Messages for different accounts may be in different partitions → no cross-account order</code></pre>
<div class="box b"><div class="t">The partition-count trap</div>If you increase the partition count, <code>hash(key) % numPartitions</code> changes for every key. Messages for the same key that were going to partition 3 may now go to partition 7. <b>Ordering breaks for in-flight keys</b> during the transition. This is why you should over-provision partitions at creation — changing them later is a migration, not a config change.</div>

<h4>Delivery semantics</h4>
<table><thead><tr><th>Guarantee</th><th>How</th><th>Risk</th><th>Use when</th></tr></thead><tbody>
<tr><td><b>At-most-once</b></td><td>Commit offset before processing</td><td>Message loss on crash</td><td>Metrics, logs — loss is acceptable</td></tr>
<tr><td><b>At-least-once</b></td><td>Process, then commit offset</td><td>Duplicates on retry</td><td>The default. Requires idempotent consumers.</td></tr>
<tr><td><b>Exactly-once</b></td><td>Transactions + idempotent producer + read_committed</td><td>Complexity; only within Kafka</td><td>Financial events where duplicates are costly</td></tr>
</tbody></table>
<div class="box o"><div class="t">The practical truth</div>You will get at-least-once. Design idempotent consumers and stop chasing exactly-once end-to-end — it doesn't exist across system boundaries. The correct architecture is <b>at-least-once delivery + idempotent processing = effectively-once</b>. Saying this in an interview signals you've shipped real systems.</div>

<h4>Exactly-once — what it actually requires</h4>
<pre><code>// Producer
enable.idempotence = true // dedupe retries via sequence numbers
transactional.id = "tx-1" // enables transactions
acks = all

// Consumer
isolation.level = read_committed // don't read uncommitted transactional messages

// Producer code
producer.initTransactions();
try {
producer.beginTransaction();
producer.send(record1);
producer.send(record2);
producer.commitTransaction();
} catch (Exception e) {
producer.abortTransaction();
}</code></pre>
<p><b>What this gives you:</b> atomic writes across multiple partitions and topics, and deduplication of producer retries. <b>What it doesn't give you:</b> atomicity with an external system. The moment you write to a database, you're back to at-least-once and need idempotent writes or the outbox pattern.</p>

<h4>Producer configuration that matters</h4>
<table><thead><tr><th>Config</th><th>Effect</th><th>Trade-off</th></tr></thead><tbody>
<tr><td><code>acks=0</code></td><td>Fire and forget</td><td>Fastest; can lose messages</td></tr>
<tr><td><code>acks=1</code></td><td>Leader acknowledges</td><td>Fast; loses messages if leader dies before replication</td></tr>
<tr><td><code>acks=all</code></td><td>All in-sync replicas acknowledge</td><td>Slowest; strongest durability</td></tr>
<tr><td><code>enable.idempotence=true</code></td><td>Dedupe producer retries</td><td>Slight overhead; prevents duplicate writes on retry</td></tr>
<tr><td><code>max.in.flight.requests</code></td><td>Concurrent requests per connection</td><td>Higher = more throughput; with idempotence, ≤5 preserves order</td></tr>
<tr><td><code>compression.type=lz4</code></td><td>Compress batches</td><td>Less network and disk; slight CPU</td></tr>
<tr><td><code>linger.ms</code></td><td>Wait to fill batches</td><td>Higher = better throughput, more latency</td></tr>
</tbody></table>

<h4>Consumer configuration that matters</h4>
<pre><code>enable.auto.commit = false // commit manually after processing
max.poll.records = 100 // smaller batches, more frequent commits
max.poll.interval.ms = 300000 // increase if processing is slow
auto.offset.reset = earliest // or latest — depends on the use case
isolation.level = read_committed // if using transactional producers</code></pre>

<h4>The infinite rebalance loop</h4>
<div class="box b"><div class="t">The failure mode</div>If processing a batch takes longer than <code>max.poll.interval.ms</code>, the consumer is considered dead. A rebalance is triggered, the partition is reassigned, and the same thing happens to the next consumer. It looks like a hang and never makes progress.<br><br><b>Diagnosis:</b> consumer lag grows, rebalances happen constantly, and no progress is made. Check the logs for <code>Rebalance in progress</code> or <code>Member removed from group</code>.<br><br><b>Fixes:</b> increase <code>max.poll.interval.ms</code>, reduce <code>max.poll.records</code>, move slow processing off the poll thread, or make the processing faster.</div>

<h4>Rebalancing strategies</h4>
<table><thead><tr><th>Strategy</th><th>Behaviour</th><th>Use</th></tr></thead><tbody>
<tr><td><b>Range</b></td><td>Assign contiguous partition ranges per topic</td><td>Default; can be unbalanced with multiple topics</td></tr>
<tr><td><b>RoundRobin</b></td><td>Distribute evenly across consumers</td><td>Better balance; more rebalancing</td></tr>
<tr><td><b>Sticky</b></td><td>Minimize partition movement</td><td>Fewer rebalances, but eager</td></tr>
<tr><td><b>CooperativeSticky</b></td><td>Incremental — only revoke what moves</td><td><b>Use this.</b> Much less disruptive.</td></tr>
</tbody></table>
<p><b>Static membership</b> (<code>group.instance.id</code>) lets a consumer restart without triggering a rebalance — useful for rolling deployments.</p>

<h4>Consumer lag — the metric that matters</h4>
<pre><code># Check lag per partition
kafka-consumer-groups.sh --bootstrap-server localhost:9092 \
--describe --group order-processor

# Output
# TOPIC PARTITION CURRENT-OFFSET LOG-END-OFFSET LAG
# orders 0 1523847 1523901 54
# orders 1 984221 1204883 220662 ← problem</code></pre>
<p><b>Alert on lag growth rate, not absolute lag.</b> A stable lag of 10,000 is fine if it's constant. A growing lag of 100 is a problem. The rate of change tells you whether you're keeping up.</p>
<p><b>Options when lag grows:</b></p>
<ul>
<li>Add consumers — but only up to the partition count. Beyond that, extra consumers sit idle.</li>
<li>Increase partitions — breaks ordering for existing keys, so plan for it.</li>
<li>Reduce work per message — batch database writes, cache lookups.</li>
<li>Scale the downstream — if the consumer is blocked on a slow database, more consumers make it worse.</li>
</ul>

<h4>Dead letter queues</h4>
<pre><code>// After N retries, publish to a DLQ and commit the offset
for (int attempt = 0; attempt &lt; MAX_RETRIES; attempt++) {
try {
process(record);
consumer.commitSync();
return;
} catch (RetryableException e) {
backoff(attempt);
} catch (NonRetryableException e) {
break; // don't retry — go straight to DLQ
}
}
dlqProducer.send(new ProducerRecord&lt;&gt;("orders-dlq", record.key(),
new DlqEnvelope(record.value(), failureReason, attemptCount, originalOffset)));
consumer.commitSync(); // commit so we don't reprocess forever</code></pre>
<p><b>DLQ best practices:</b> include the original message, the failure reason, the attempt count, and the original topic/partition/offset. Provide a replay mechanism. Monitor DLQ depth as a first-class metric — a growing DLQ means something is systematically broken.</p>

<h4>The outbox pattern with Kafka</h4>
<pre><code>-- Same transaction
BEGIN;
INSERT INTO payments(id, amount, status) VALUES (...);
INSERT INTO outbox(id, aggregate_id, event_type, payload, created_at)
VALUES (gen_random_uuid(), :paymentId, 'PaymentCreated', :json, now());
COMMIT;

-- Separate relay (poller or Debezium CDC)
SELECT * FROM outbox WHERE published_at IS NULL ORDER BY created_at LIMIT 100;
-- for each: publish to Kafka, then UPDATE outbox SET published_at = now();</code></pre>
<p><b>Why this is the right answer:</b> it makes the impossible (atomic DB + Kafka write) into two independent operations, each of which can be retried safely. The cost is at-least-once delivery, which you handle with idempotent consumers.</p>`,

drill:["Create a topic with 3 partitions. Produce messages with keys. Verify that the same key always lands in the same partition.",
"Simulate the infinite rebalance loop by setting max.poll.interval.ms very low and sleeping in the consumer. Observe the logs.",
"Implement a consumer with manual commit and a DLQ. Send a poison message and verify it lands in the DLQ."],

qa:[
["Why does Kafka guarantee ordering within a partition but not across a topic?","Because a partition is a single append-only log written by a single leader — there's a total order by construction. Across partitions there's no coordination between leaders, so no global order. This is deliberate: global ordering would require a single partition, which would eliminate parallelism. The design choice is: you get ordering where you need it by choosing a key, and parallelism everywhere else."],
["What's the difference between the consumer offset and the log-end offset?","The log-end offset is the position of the last message written to the partition. The consumer offset is where this consumer group has committed its progress. The difference is the lag — how far behind the consumer is. Both are per-partition, which is why lag is reported per partition and a single slow partition can hold up an entire consumer."],
["How does idempotent production work?","The producer attaches a producer ID and a monotonic sequence number to each message. The broker tracks the highest sequence number it has seen per producer per partition. If a message arrives with a sequence number it has already seen (a retry), the broker discards it and returns success. This makes producer retries safe — you can set retries to a high number without risking duplicates."],
["Why should you never increase partition count on a live topic?","Because the default partitioner is <code>hash(key) % numPartitions</code>. Changing numPartitions changes the mapping for every key, so messages for the same key that were going to partition 3 may now go to partition 7. During the transition, messages for the same key are in different partitions and ordering is broken. If you must increase, you need a migration: stop producers, drain, increase, resume — or use a custom partitioner with a stable mapping."],
["What happens if a consumer commits an offset for a message it hasn't finished processing?","If the consumer then crashes, that message is lost — it was marked as processed but never was. This is the at-most-once failure mode, and it's why <code>enable.auto.commit=true</code> is dangerous: it commits on a timer, independent of whether processing succeeded. The correct pattern is manual commit after processing completes, which gives at-least-once and requires idempotent processing."]
],
exit:"Explain partitioning and ordering, then the exactly-once requirements and why it doesn't span systems, in 2 minutes."},

{d:32,wk:5,prio:"P0",title:"Distributed Transactions — Saga, Outbox, 2PC",
obj:"Know why 2PC fails at scale and which pattern replaces it.",
core:`<h4>Why 2PC fails at scale</h4>
<pre><code>Phase 1 (prepare): coordinator asks all participants "can you commit?"
Phase 2 (commit): if all say yes, coordinator says "commit"; else "abort"</code></pre>
<table><thead><tr><th>Problem</th><th>Detail</th></tr></thead><tbody>
<tr><td><b>Blocking</b></td><td>Participants hold locks between phases. If the coordinator dies after prepare, they block indefinitely — the "in-doubt" state.</td></tr>
<tr><td><b>Latency</b></td><td>The slowest participant sets the pace. Every participant must be reachable and fast.</td></tr>
<tr><td><b>Availability</b></td><td>It's CP. A partition stalls the entire transaction. No partial progress.</td></tr>
<tr><td><b>Trust boundaries</b></td><td>You cannot 2PC with an external bank. They won't hold locks for you.</td></tr>
<tr><td><b>Scale</b></td><td>The coordinator becomes a bottleneck and a SPOF.</td></tr>
</tbody></table>
<div class="box"><div class="t">Where 2PC is fine</div>Inside a single database (it's how ACID works), or within a tightly-coupled cluster of databases from the same vendor (XA transactions). It is <b>not</b> fine across microservices or across organisational boundaries. Saying this distinction is what marks you as having real experience.</div>

<h4>Saga — the replacement</h4>
<p>A saga is a sequence of local transactions. Each step commits independently. If a later step fails, you run <b>compensating transactions</b> to semantically undo the earlier steps.</p>
<pre><code>Order saga:
1. Create order → compensate: cancel order
2. Reserve inventory → compensate: release inventory
3. Charge payment → compensate: refund payment
4. Arrange shipping → compensate: cancel shipment
5. Mark order complete → (no compensation needed — terminal)

If step 3 fails:
run compensate(2): release inventory
run compensate(1): cancel order
The saga ends in a defined failure state.</code></pre>

<h4>Choreography vs orchestration</h4>
<table><thead><tr><th></th><th>Choreography</th><th>Orchestration</th></tr></thead><tbody>
<tr><td>How</td><td>Services emit and react to events</td><td>A central orchestrator directs each step</td></tr>
<tr><td>Coupling</td><td>Low in code, high in event contracts</td><td>Orchestrator knows all steps</td></tr>
<tr><td>Debugging</td><td>Hard — the flow is implicit across services</td><td>Easy — one state machine to read</td></tr>
<tr><td>Visibility</td><td>No single place shows the flow</td><td>The orchestrator is the flow</td></tr>
<tr><td>Best for</td><td>Simple 2–4 step flows, autonomous teams</td><td>Complex flows, compliance and audit needs</td></tr>
<tr><td>Risk</td><td>Emergent, unobservable complexity</td><td>Orchestrator becomes a god service</td></tr>
</tbody></table>
<div class="box o"><div class="t">The honest recommendation</div>"For anything beyond three steps, or anything with a compliance requirement, I'd orchestrate. Choreography looks elegant in a diagram and becomes unmaintainable in production — no one can answer 'where is order 12345 stuck?' without reading six services. An orchestrator with a persisted state machine gives you a single place to look, a natural place for timeouts and retries, and an audit trail for free."</div>

<h4>Orchestrator state machine</h4>
<pre><code>PENDING
→ INVENTORY_RESERVED
→ PAYMENT_CHARGED
→ SHIPPING_ARRANGED
→ COMPLETED

Failure paths:
INVENTORY_FAILED → CANCELLED
PAYMENT_FAILED → COMPENSATING_INVENTORY → CANCELLED
SHIPPING_FAILED → COMPENSATING_PAYMENT → COMPENSATING_INVENTORY → CANCELLED

Every transition:
- persisted
- idempotent (keyed by saga ID + step)
- emits an event
- has a timeout that triggers escalation</code></pre>

<h4>Compensations — the hard part</h4>
<p><b>Compensations are not rollbacks.</b> They're new transactions that semantically undo a previous one. They can fail, they can have side effects, and they're not always possible.</p>
<table><thead><tr><th>Step</th><th>Compensation</th><th>Problem</th></tr></thead><tbody>
<tr><td>Charge a card</td><td>Refund</td><td>Takes days to settle; the customer sees both transactions</td></tr>
<tr><td>Send an email</td><td>Send a correction</td><td>You can't unsend</td></tr>
<tr><td>Reserve inventory</td><td>Release reservation</td><td>Usually clean</td></tr>
<tr><td>Create a ledger entry</td><td>Post a reversing entry</td><td>Clean — this is why append-only ledgers work</td></tr>
<tr><td>Call an external API</td><td>Call the inverse API</td><td>May not exist, or may fail</td></tr>
</tbody></table>
<div class="box b"><div class="t">The point to make in an interview</div>"Compensations are semantically weaker than rollbacks. A refund is not the same as never having charged — it takes days, it appears on the customer's statement, and it can itself fail. So the design goal is to <b>order the steps so the irreversible ones come last</b>. Charge the card after you've verified inventory, not before. Any step that can't be compensated should be the final step or should be idempotent and retryable until it succeeds."</div>

<h4>The Transactional Outbox — in full</h4>
<pre><code>-- The problem: you can't write to the DB and Kafka atomically
db.save(order); -- succeeds
kafka.send(orderCreated); -- fails → order exists, no event
-- or the reverse: event published, DB rollback → phantom event

-- The solution: two independent, retryable operations
BEGIN;
INSERT INTO orders(...) VALUES (...);
INSERT INTO outbox(id, aggregate_id, event_type, payload, created_at)
VALUES (gen_random_uuid(), :orderId, 'OrderCreated', :json, now());
COMMIT;

-- A separate relay process (never in the request path):
-- poller: SELECT ... WHERE published_at IS NULL ORDER BY created_at LIMIT 100
-- or CDC: Debezium reads the WAL and publishes
-- For each: publish to Kafka, then UPDATE outbox SET published_at = now();</code></pre>
<p><b>Why it works:</b> the DB write and the outbox write are in one local transaction — atomic by definition. Publishing is a separate operation that can be retried indefinitely. If the relay crashes, it resumes. If Kafka is down, the outbox accumulates and drains when it recovers.</p>
<table><thead><tr><th></th><th>Poller</th><th>CDC (Debezium)</th></tr></thead><tbody>
<tr><td>Latency</td><td>Poll interval (100ms–5s)</td><td>Near real-time</td></tr>
<tr><td>DB load</td><td>Repeated SELECTs</td><td>Reads the replication log</td></tr>
<tr><td>Complexity</td><td>Low — a scheduled job</td><td>Higher — a connector to run and monitor</td></tr>
<tr><td>Ordering</td><td>Order by created_at</td><td>Log order — natural</td></tr>
</tbody></table>

<h4>TCC — Try-Confirm-Cancel</h4>
<pre><code>TRY: reserve the resource (hold the funds, reserve the inventory)
CONFIRM: commit the reservation (capture the funds)
CANCEL: release the reservation (release the hold)

If any TRY fails → CANCEL all previous TRYs.
If all TRYs succeed → CONFIRM all.</code></pre>
<p><b>Why TCC over Saga:</b> TCC reserves resources up front, so the confirm step is very unlikely to fail. It's used in payments (authorization hold, then capture) and inventory (reserve, then commit).</p>
<p><b>The cost:</b> you need an explicit reservation concept in every participating service, and reservations must expire. It's more work than a saga with compensations, but it moves the failure to the try phase where it's cheap to handle.</p>

<h4>Choosing a pattern</h4>
<table><thead><tr><th>Scenario</th><th>Pattern</th></tr></thead><tbody>
<tr><td>Single DB + Kafka publish</td><td>Transactional Outbox</td></tr>
<tr><td>2–3 steps, autonomous teams</td><td>Saga, choreography</td></tr>
<tr><td>4+ steps, or compliance/audit required</td><td>Saga, orchestration</td></tr>
<tr><td>Resource reservation is meaningful</td><td>TCC</td></tr>
<tr><td>Single database</td><td>Just use a local transaction</td></tr>
<tr><td>Same vendor, XA-capable, low volume</td><td>2PC — but reconsider</td></tr>
</tbody></table>

<h4>Idempotency — the prerequisite</h4>
<div class="box w"><div class="t">Every step must be idempotent</div>Because delivery is at-least-once and retries happen. Each step needs an idempotency key — typically <code>sagaId + stepName</code> — and must check before acting.<br><br>
<pre><code>if (alreadyProcessed(sagaId, "RESERVE_INVENTORY")) return previousResult;
// ... do the work ...
markProcessed(sagaId, "RESERVE_INVENTORY", result);</code></pre>
Without this, a retry double-charges. The idempotency check must be atomic — usually a unique constraint on <code>(saga_id, step_name)</code>.</div>`,

drill:["Design a Saga state machine for 'book a flight + hotel + car' on paper. List every compensation.",
"Implement a Transactional Outbox with a poller relay. Kill the relay mid-batch and verify it resumes without duplicating.",
"Write the idempotency check for a saga step using a unique constraint."],

qa:[
["Why can't you just use XA transactions across microservices?","Because XA requires all participants to hold locks between prepare and commit, and it requires a transaction coordinator that everyone trusts. Across services owned by different teams, you get: (1) one slow service blocking all others, (2) a coordinator that's a single point of failure, (3) locks held across network calls, which is exactly what you're told never to do, and (4) no way to participate if the service is external. It also doesn't scale — the coordinator becomes a bottleneck. XA is designed for a handful of databases in one data centre, not for a distributed service architecture."],
["What do you do when a compensating transaction fails?","Retry it — compensation failures are usually transient. If it keeps failing after N attempts, escalate to a manual queue with an alert. The saga stays in a COMPENSATION_FAILED state, which is a first-class state, not an error to swallow. A human investigates. The key point is that you never silently give up — an incomplete compensation is a real financial or operational problem and must be visible."],
["Why does ordering the steps matter in a saga?","Because compensations are weaker than rollbacks and some can't be undone at all. If you charge the card first and then discover inventory is unavailable, you have to refund — which takes days and appears on the customer's statement. If you reserve inventory first and the charge fails, you just release the reservation, which is instant and invisible. Put the irreversible steps last. This is a design principle, not a technical constraint, and it's what an experienced architect brings."],
["How do you handle a saga that's been running for hours?","With timeouts on each step. Every step has a deadline; when it expires, the saga treats that step as failed and begins compensation. The orchestrator persists the deadline as part of the state, so a restart doesn't lose it. Without timeouts, a saga with a stuck step runs forever and its resources stay reserved indefinitely — which in an inventory system means stock that can never be sold."],
["What's the difference between the outbox pattern and just publishing to Kafka inside the transaction?","You can't publish to Kafka inside a database transaction. They're different systems with no shared transaction. If you publish first and the DB rolls back, you've announced an event for something that didn't happen. If you commit first and the publish fails, you've lost the event. The outbox pattern makes the event part of the database write, so it's atomic with the business data, and publishing becomes a separate retryable operation."]
],
exit:"Explain why 2PC fails at scale, then design a saga for a payment flow with every compensation, in 3 minutes."},

{d:33,wk:5,prio:"P0",title:"Resilience, Retries & SLOs",
obj:"Design a system that degrades gracefully instead of cascading.",
core:`<h4>The cascade — how it actually happens</h4>
<pre><code>t=0 Service D slows from 50ms to 2s
t=1s Service C's threads block on D. Its pool fills.
t=5s Service B's threads block on C. Its pool fills.
t=10s Service A's threads block on B. Its pool fills.
t=15s The load balancer times out. Users see errors.
t=20s Health checks fail. Instances are killed and restarted.
t=25s Cold instances can't handle the traffic. Full outage.

A single slow dependency, 25 seconds, complete outage.</code></pre>
<div class="box b"><div class="t">The insight</div>The cascade isn't caused by the slow service. It's caused by <b>unbounded waiting</b>. Every service in the chain waits indefinitely for the one below it, and waiting consumes a thread, a connection, and a slot in a pool. Bounded waiting is the fix — everything else is refinement.</div>

<h4>Timeouts — the first line of defence</h4>
<pre><code>// WRONG — no timeout, waits forever
HttpResponse response = client.execute(request);

// RIGHT — bounded
RequestConfig config = RequestConfig.custom()
.setConnectTimeout(500) // TCP connect
.setConnectionRequestTimeout(200) // wait for a pool connection
.setSocketTimeout(2000) // wait for the response
.build();</code></pre>
<table><thead><tr><th>Timeout</th><th>What it bounds</th><th>Typical value</th></tr></thead><tbody>
<tr><td>Connect</td><td>TCP handshake</td><td>200–1000ms</td></tr>
<tr><td>Connection request</td><td>Waiting for a pooled connection</td><td>100–500ms</td></tr>
<tr><td>Socket / read</td><td>Waiting for response bytes</td><td>1–5s depending on the operation</td></tr>
<tr><td>Overall request</td><td>The whole call including retries</td><td>Must be less than the caller's timeout</td></tr>
</tbody></table>
<div class="box w"><div class="t">The timeout budget rule</div>Your timeout must be <b>less than your caller's timeout</b>. If service A times out at 3s and calls B, B's timeout must be under 3s. Otherwise A gives up while B is still working, and B's work is wasted. This applies down the entire chain. Calculate the budget explicitly: if the user-facing SLA is 2s and you have 4 hops, each hop gets a fraction, with retries accounted for.</div>

<h4>Retries — with jitter, always</h4>
<pre><code>// WRONG — synchronized retries create a thundering herd
sleep(1000 * attempt);

// RIGHT — exponential with full jitter
long backoff = Math.min(cap, base * (1L &lt;&lt; attempt));
long sleep = ThreadLocalRandom.current().nextLong(0, backoff + 1);
sleep(sleep);

// base=100ms, cap=10s:
// attempt 0: 0–100ms
// attempt 1: 0–200ms
// attempt 2: 0–400ms
// attempt 3: 0–800ms
// ...</code></pre>
<p><b>Why jitter is essential:</b> without it, all clients retry at the same moment. A brief blip becomes a sustained overload as every client retries in lockstep. With full jitter, retries spread across the window and the load is smooth.</p>

<h4>What to retry</h4>
<table><thead><tr><th>Response</th><th>Retry?</th><th>Why</th></tr></thead><tbody>
<tr><td>Connection timeout</td><td>Yes</td><td>The request may not have reached the server</td></tr>
<tr><td>Read timeout</td><td>Only if idempotent</td><td>The server may have processed it</td></tr>
<tr><td>500, 502, 503, 504</td><td>Yes</td><td>Transient server-side issues</td></tr>
<tr><td>429</td><td>Yes, honour Retry-After</td><td>Rate limited — back off</td></tr>
<tr><td>400, 422</td><td>No</td><td>Bad request — retrying won't help</td></tr>
<tr><td>401, 403</td><td>No</td><td>Auth problem — retrying won't help</td></tr>
<tr><td>404</td><td>No</td><td>The resource doesn't exist</td></tr>
</tbody></table>

<h4>Retry budgets</h4>
<div class="box o"><div class="t">The Google SRE approach</div>Cap retries as a percentage of total requests — typically 10%. Once 10% of your traffic is retries, stop retrying entirely. This prevents a retry storm from consuming all capacity: if every request fails and retries three times, you've turned a 1× load into a 4× load, and the failing service can never recover.<br><br>
Track retries as a first-class metric. A retry rate above 5% means something is wrong even if the success rate looks fine.</div>

<h4>Circuit breaker — three states</h4>
<pre><code>CLOSED → normal operation, requests pass through
count failures; if failure rate &gt; threshold → OPEN

OPEN → fail fast, don't call the dependency
after a cooldown period → HALF_OPEN

HALF_OPEN → allow a limited number of trial requests
if they succeed → CLOSED
if they fail → OPEN again</code></pre>
<pre><code>CircuitBreaker cb = CircuitBreaker.ofDefaults("paymentGateway");

Supplier&lt;PaymentResult&gt; decorated = CircuitBreaker
.decorateSupplier(cb, () -&gt; gateway.charge(request));

try {
return decorated.get();
} catch (CallNotPermittedException e) {
// Circuit is open — fail fast with a sensible fallback
throw new ServiceUnavailableException("Payment gateway unavailable");
}</code></pre>
<p><b>Why it works:</b> when a dependency is failing, calling it wastes threads and time. Failing fast frees those resources and gives the dependency room to recover. Without a circuit breaker, you keep hammering a broken service and prevent its recovery.</p>
<p><b>What to configure:</b> failure-rate threshold (50%), minimum calls before evaluating (20), wait duration in OPEN (60s), permitted calls in HALF_OPEN (5).</p>

<h4>Bulkhead — isolating resources</h4>
<pre><code>// Separate thread pools per dependency
ExecutorService paymentPool = Executors.newFixedThreadPool(20);
ExecutorService searchPool = Executors.newFixedThreadPool(50);
ExecutorService notifyPool = Executors.newFixedThreadPool(10);</code></pre>
<p><b>Without bulkheads:</b> one shared pool. A slow payment gateway consumes all threads, and search requests — which are perfectly healthy — get queued behind them. Total outage from a partial failure.</p>
<p><b>With bulkheads:</b> the payment pool fills, payment requests fail fast, but search continues to work. Partial degradation instead of total failure.</p>
<p><b>The cost:</b> more pools means more threads and more memory. Size each pool to the dependency's actual concurrency limit, not arbitrarily.</p>

<h4>Backpressure and load shedding</h4>
<pre><code>// Bounded queue with a rejection policy
ThreadPoolExecutor executor = new ThreadPoolExecutor(
coreSize, maxSize, 60, TimeUnit.SECONDS,
new ArrayBlockingQueue&lt;&gt;(1000), // BOUNDED — this is the point
new ThreadPoolExecutor.AbortPolicy() // reject when full
);

// Reject with a retryable status
catch (RejectedExecutionException e) {
response.setStatus(503);
response.setHeader("Retry-After", "5");
}</code></pre>
<div class="box o"><div class="t">The honest failure</div>Returning 503 with Retry-After is <b>better</b> than queueing indefinitely. A fast rejection lets the client retry in 5 seconds and succeed. An unbounded queue means the client waits 30 seconds for a timeout — and you've consumed memory and threads to deliver a worse experience. Load shedding is a feature, not a failure.</div>

<h4>Fallbacks and graceful degradation</h4>
<table><thead><tr><th>Dependency</th><th>Fallback</th></tr></thead><tbody>
<tr><td>Recommendation service</td><td>Show popular items instead</td></tr>
<tr><td>Fraud score</td><td>Allow with post-hoc review, or block — a business decision</td></tr>
<tr><td>Personalisation</td><td>Show a generic homepage</td></tr>
<tr><td>Inventory display</td><td>Show "check availability" instead of a count</td></tr>
<tr><td>Currency conversion</td><td>Use a cached rate with a staleness warning</td></tr>
<tr><td>Analytics</td><td>Drop events; buffer and retry later</td></tr>
</tbody></table>
<p><b>The question to ask:</b> "If this dependency is down, what's the best thing we can still do for the user?" Sometimes the answer is "fail" — but usually there's a degraded experience that's better than an error.</p>

<h4>SLOs and error budgets</h4>
<table><thead><tr><th>Term</th><th>Definition</th><th>Example</th></tr></thead><tbody>
<tr><td><b>SLI</b></td><td>What you measure</td><td>% of payment requests completing in &lt;800ms</td></tr>
<tr><td><b>SLO</b></td><td>Your internal target</td><td>99.95% over 30 days</td></tr>
<tr><td><b>SLA</b></td><td>Contractual commitment with penalties</td><td>99.9% or a service credit</td></tr>
<tr><td><b>Error budget</b></td><td>100% − SLO</td><td>0.05% of 30 days = ~21 minutes</td></tr>
</tbody></table>
<pre><code>Available minutes in 30 days = 43,200

99.9% → 43.2 minutes of allowed downtime
99.95% → 21.6 minutes
99.99% → 4.3 minutes
99.999% → 26 seconds</code></pre>
<p><b>The cultural point:</b> an error budget is a decision-making tool, not just a metric. Within budget, ship features fast. Budget exhausted, freeze features and fix reliability. It aligns engineering and product on one objective number and ends the argument about whether to invest in reliability.</p>

<h4>Burn-rate alerting</h4>
<pre><code>Fast burn: consuming error budget 14.4× faster than sustainable
→ 2% of budget in 1 hour → page immediately
Slow burn: consuming 6× faster than sustainable
→ 5% of budget in 6 hours → ticket, not a page

Alert on the RATE, not the current error percentage.
"The budget will be exhausted in 2 hours" is more useful
than "error rate is 1.5%".</code></pre>

<h4>The complete resilience checklist</h4>
<ol>
<li><b>Timeouts</b> on every network call, sized to a budget.</li>
<li><b>Retries</b> with exponential backoff and full jitter, only for retryable errors, only for idempotent operations.</li>
<li><b>Retry budget</b> — cap retries at ~10% of traffic.</li>
<li><b>Circuit breaker</b> on every remote dependency.</li>
<li><b>Bulkheads</b> — separate thread pools per dependency.</li>
<li><b>Bounded queues</b> everywhere. Never unbounded.</li>
<li><b>Load shedding</b> with honest 503 + Retry-After.</li>
<li><b>Fallbacks</b> for every non-critical dependency.</li>
<li><b>Idempotency</b> on every write so retries are safe.</li>
<li><b>SLOs</b> with burn-rate alerting.</li>
<li><b>Graceful shutdown</b> — drain in-flight requests before exiting.</li>
</ol>`,

drill:["Write a retry with exponential backoff and full jitter. Verify the distribution of sleep values over 10,000 samples.",
"Implement a circuit breaker from scratch with the three states. Test the transitions.",
"Calculate the error budget in minutes for 99.9%, 99.95%, and 99.99% over 30 days. Explain what each means operationally."],

qa:[
["Why is full jitter better than equal jitter?","Equal jitter uses <code>backoff/2 + random(0, backoff/2)</code>, so retries cluster around 75% of the backoff. Full jitter uses <code>random(0, backoff)</code>, spreading them uniformly across the entire window. Under a synchronized failure — a deploy, a cache flush — full jitter produces a much smoother retry curve. AWS published the comparison and full jitter won decisively at high concurrency."],
["When should you NOT use a circuit breaker?","When the dependency is critical and there's no meaningful fallback — a payment gateway in a payment flow. Opening the circuit just fails faster, which is fine for freeing resources but doesn't help the user. In that case you still want the breaker (to prevent resource exhaustion and let the gateway recover) but you need a deliberate strategy for what happens when it's open: queue the request, route to a secondary provider, or return an honest error and let the client retry later."],
["What's the difference between load shedding and rate limiting?","Rate limiting is per-client and usually a business or fairness decision — this API key gets 100 requests per minute. Load shedding is system-wide and a survival decision — the service is at capacity, so it rejects the lowest-priority work to protect the highest-priority work. Rate limiting is about who gets to use the system; load shedding is about the system staying alive."],
["How do you set a timeout value?","Work backwards from the user-facing SLA. If a request must complete in 2 seconds and the flow has three sequential calls, each gets a fraction — but not an equal one, because you need headroom. I'd budget 500ms for the first call, 800ms for the second, 500ms for the third, leaving 200ms for processing. Then the timeout on each call is the budget minus a safety margin. And critically, the timeout must be less than the caller's — otherwise the caller gives up while the callee is still working."],
["What does graceful shutdown mean and why does it matter?","On SIGTERM, the service stops accepting new requests, finishes in-flight ones, and then exits. Without it, a rolling deploy kills requests mid-flight — the user sees an error for a request that may have already been partially processed. In Kubernetes, this means a preStop hook with a sleep, plus a readiness probe that fails immediately so the load balancer stops routing. The sleep must be longer than the load balancer's deregistration delay, otherwise you still get killed requests."]
],
exit:"Explain the cascade and the four defences against it, then calculate error budgets for three SLO levels, in 3 minutes."},

{d:34,wk:5,prio:"P0",title:"Caching — Strategies, Failure Modes & Invalidation",
obj:"Choose a caching strategy and name every way it can go wrong.",
core:`<h4>The strategies</h4>
<table><thead><tr><th>Strategy</th><th>Flow</th><th>Pros</th><th>Cons</th></tr></thead><tbody>
<tr><td><b>Cache-aside</b> (lazy)</td><td>App reads cache; miss → read DB → write cache</td><td>Simple, resilient, only caches what's used</td><td>First request slow; race on concurrent miss</td></tr>
<tr><td><b>Read-through</b></td><td>Cache itself loads from DB on miss</td><td>App simpler</td><td>Needs provider support</td></tr>
<tr><td><b>Write-through</b></td><td>Write to cache and DB synchronously</td><td>Never stale</td><td>Double latency per write; caches unread data</td></tr>
<tr><td><b>Write-behind</b></td><td>Write to cache, async flush to DB</td><td>Very fast writes</td><td>Data loss on cache failure; complex</td></tr>
<tr><td><b>Refresh-ahead</b></td><td>Refresh before expiry</td><td>No cold misses for hot keys</td><td>Wasted refreshes if prediction is wrong</td></tr>
</tbody></table>
<div class="box o"><div class="t">The default recommendation</div><b>Cache-aside with a TTL.</b> Simple, resilient (cache down = slower, not broken), and handles most workloads. Add write-through or explicit invalidation only when you have a measured staleness problem a short TTL doesn't solve.</div>

<h4>Cache-aside — the code and the race</h4>
<pre><code>public Product getProduct(long id) {
Product cached = cache.get(id);
if (cached != null) return cached;

Product fromDb = db.findById(id);
cache.put(id, fromDb, ttl);
return fromDb;
}</code></pre>
<div class="box b"><div class="t">The stale-write race</div>
<pre><code>t=1 Reader misses cache, reads DB → value V1
t=2 Writer updates DB → value V2, deletes cache entry
t=3 Reader writes V1 to cache ← STALE

The cache now holds V1 forever (until TTL), even though the DB has V2.</code></pre>
<b>Mitigations:</b><br>
• Use a TTL as a backstop — bound the staleness window<br>
• Delete cache <em>after</em> the DB write, not before<br>
• Use versioned keys — the reader writes to <code>product:123:v7</code>, so a stale write goes to an old key<br>
• Accept it — if the data is not critical, a bounded staleness is fine</div>

<h4>The six failure modes</h4>
<table><thead><tr><th>Failure</th><th>What happens</th><th>Fix</th></tr></thead><tbody>
<tr><td><b>Stampede</b> (thundering herd)</td><td>Many requests miss the same key simultaneously; all hit the DB</td><td>Request coalescing (one loader, others wait), probabilistic early expiry</td></tr>
<tr><td><b>Penetration</b></td><td>Requests for keys that don't exist — every one hits the DB</td><td>Cache negative results with short TTL; bloom filter; validate input</td></tr>
<tr><td><b>Avalanche</b></td><td>Many keys expire at the same instant; wave of DB load</td><td>Jitter the TTL: <code>ttl = base + random(0, base*0.1)</code></td></tr>
<tr><td><b>Hot key</b></td><td>One key gets disproportionate traffic; one Redis node saturates</td><td>Local in-process cache in front; replicate the key with random suffixes</td></tr>
<tr><td><b>Big key</b></td><td>One key holds megabytes; single-threaded Redis blocks on it</td><td>Split into smaller keys; use a hash with field-level access</td></tr>
<tr><td><b>Inconsistency</b></td><td>Cache and DB disagree indefinitely</td><td>TTL backstop; invalidate on write; versioned keys</td></tr>
</tbody></table>

<h4>Stampede — the code</h4>
<pre><code>// Naive — every thread on a miss hits the DB
Product p = cache.get(id);
if (p == null) { p = db.load(id); cache.put(id, p); }

// Coalesced — one thread loads, others wait
Product p = cache.get(id);
if (p == null) {
String lockKey = "lock:product:" + id;
if (tryLock(lockKey, 5, SECONDS)) {
try {
p = cache.get(id); // double-check
if (p == null) {
p = db.load(id);
cache.put(id, p, ttlWithJitter());
}
} finally { unlock(lockKey); }
} else {
// Didn't get the lock — wait briefly and re-read
Thread.sleep(50);
p = cache.get(id);
if (p == null) p = db.load(id); // fallback
}
}</code></pre>
<p><b>The double-check is essential</b> — between the first miss and acquiring the lock, another thread may have populated the cache.</p>

<h4>TTL jitter — the one-line fix for avalanche</h4>
<pre><code>// WRONG — every key written at the same time expires at the same time
cache.put(key, value, Duration.ofMinutes(10));

// RIGHT — spread the expiry
long base = 600; // 10 minutes in seconds
long jitter = ThreadLocalRandom.current().nextLong(0, 60); // 0–60s
cache.put(key, value, Duration.ofSeconds(base + jitter));</code></pre>

<h4>Eviction policies</h4>
<table><thead><tr><th>Policy</th><th>Evicts</th><th>Best for</th><th>Weakness</th></tr></thead><tbody>
<tr><td><b>LRU</b></td><td>Least recently used</td><td>General purpose; temporal locality</td><td>A scan of cold data evicts hot data</td></tr>
<tr><td><b>LFU</b></td><td>Least frequently used</td><td>Stable hot set</td><td>New items can't displace old favourites without aging</td></tr>
<tr><td><b>FIFO</b></td><td>Oldest inserted</td><td>Rarely optimal</td><td>Ignores usage entirely</td></tr>
<tr><td><b>TTL</b></td><td>Expired by time</td><td>Data with natural freshness bounds</td><td>Doesn't adapt to access patterns</td></tr>
<tr><td><b>W-TinyLFU</b></td><td>Window + frequency sketch</td><td>Near-optimal hit rate (Caffeine)</td><td>More complex</td></tr>
</tbody></table>
<p><b>Redis options:</b> <code>noeviction</code>, <code>allkeys-lru</code>, <code>volatile-lru</code>, <code>allkeys-lfu</code>, <code>volatile-lfu</code>, <code>allkeys-random</code>, <code>volatile-random</code>, <code>volatile-ttl</code>. Use <code>allkeys-lru</code> for a pure cache; <code>volatile-*</code> if you mix cache and persistent data.</p>

<h4>Redis data structures and their uses</h4>
<table><thead><tr><th>Structure</th><th>Use</th></tr></thead><tbody>
<tr><td>String</td><td>Simple cache, counters, distributed locks (SET NX EX)</td></tr>
<tr><td>Hash</td><td>Objects — update one field without rewriting the whole value</td></tr>
<tr><td>List</td><td>Queues, recent items, capped activity feeds (LTRIM)</td></tr>
<tr><td>Set</td><td>Tags, unique visitors, set operations (intersection for "similar users")</td></tr>
<tr><td>Sorted Set</td><td>Leaderboards, rate limiting (sliding window), priority queues</td></tr>
<tr><td>Bitmap</td><td>Daily active users, feature flags — 1 bit per user per day</td></tr>
<tr><td>HyperLogLog</td><td>Approximate unique counts in 12KB regardless of cardinality</td></tr>
<tr><td>Stream</td><td>Event log with consumer groups — a lightweight Kafka</td></tr>
</tbody></table>
<pre><code>// Distributed lock — the atomic way
SET lock:order:12345 "owner-id" NX EX 30
// NX = only if not exists, EX = expire in 30s
// Delete only if you own it, using a Lua script for atomicity:
if redis.call("get", KEYS[1]) == ARGV[1] then
return redis.call("del", KEYS[1])
else return 0 end</code></pre>
<div class="box w"><div class="t">Redis locks are not a substitute for consensus</div>A Redis lock with a single instance fails if the instance dies. Redis Cluster with a majority quorum (Redlock) is debated and complex. For anything where correctness matters — financial operations — use a consensus-based lock (etcd, ZooKeeper) or design so you don't need a distributed lock at all. Most "distributed lock" requirements are better served by a database unique constraint.</div>

<h4>Two-tier caching</h4>
<pre><code>L1: Caffeine (in-process) → nanoseconds, per-instance, can be stale
L2: Redis (distributed) → ~0.5ms, shared, consistent view
L3: Database

Read: L1 → L2 → DB
Write: invalidate L1 (local), then L2 (publish an invalidation event)</code></pre>
<p><b>Why L1:</b> it absorbs the hottest keys entirely — no network hop at all. For a hot key hit 100,000 times per second across 20 instances, L1 removes 100,000 Redis calls per second. <b>The cost:</b> invalidation. Each instance must be told to evict, usually via a pub/sub channel. And there's a window where instances disagree.</p>

<h4>Cache invalidation — the taxonomy</h4>
<ol>
<li><b>TTL-based.</b> Simplest. Stale for at most the TTL. Fine for most cases.</li>
<li><b>Write-invalidate.</b> Delete the key on write. Simple and effective — the default for cache-aside.</li>
<li><b>Event-based.</b> Publish an invalidation event. Scales across services but adds a dependency and a failure mode (missed events).</li>
<li><b>Versioned keys.</b> Include a version in the key. Invalidate by bumping the version. Avoids the delete race entirely.</li>
<li><b>CDC.</b> Read the database replication log and invalidate based on committed changes. Most accurate; most infrastructure.</li>
</ol>
<div class="box o"><div class="t">The line to use</div>"Cache invalidation is the hard problem, and the honest answer is that you don't solve it — you bound it. Every strategy either gives you a staleness window (TTL) or adds a failure mode (events can be missed). The design decision is which one you can tolerate for which data."</div>`,

drill:["Reproduce a cache stampede with 100 threads hitting an expired key. Measure the DB load. Fix it with coalescing.",
"Implement a Redis distributed lock with the Lua delete script. Test that one holder can't delete another's lock.",
"Set up two-tier caching with Caffeine and Redis. Measure the L1 hit rate."],

qa:[
["Why is cache-aside more resilient than write-through?","Because a cache failure in cache-aside means every request misses and goes to the database — slower, but functional. In write-through, every write goes to the cache and the database; if the cache is down, writes either fail or you need complex fallback logic. Cache-aside treats the cache as an optimisation; write-through makes it part of the write path. The latter is a stronger consistency guarantee at the cost of availability."],
["How do you choose a TTL?","By asking how stale the data can be before it causes a problem. A product catalog can be an hour stale. A price can be minutes. A balance cannot be stale at all. Then add jitter and check that the resulting cache hit rate is acceptable — if a TTL of 60 seconds gives 95% hit rate and 5 minutes gives 96%, take the shorter one. Measure the hit rate against the TTL and pick the knee of the curve."],
["What's the danger of caching negative results?","If you cache 'not found' for a key that's about to be created, the client gets a stale 404 for the duration of the TTL. This is particularly bad for idempotency keys — you'd reject a legitimate retry. The mitigation is a very short TTL for negative results (10–60 seconds) and invalidation on write. Also, don't cache negative results for keys that are likely to be created soon."],
["Why does Redis use a single thread for command execution?","Because it makes every command atomic without locks, and the bottleneck is almost always network or memory, not CPU. A single thread can serve 100,000+ operations per second when the operations are O(1). The cost is that one slow command — a large <code>KEYS</code> scan, a big set intersection — blocks everything. That's why big keys and expensive commands are dangerous: they stall the entire server."],
["How do you handle cache warming after a deploy or restart?","Gradually. A cold cache means every request misses, and if you're serving production traffic you'll stampede the database. Options: (1) pre-warm from a script before adding the instance to the load balancer, (2) ramp traffic slowly, (3) enable request coalescing so concurrent misses for the same key produce one database query. I'd do all three — pre-warm the top 1,000 keys, ramp over 60 seconds, and always have coalescing as a backstop."]
],
exit:"Name the six failure modes and the fix for each, then explain the stale-write race and three mitigations, in 3 minutes."},

{d:35,wk:5,prio:"P1",title:"Networking, HTTP & API Design",
obj:"Reason about the network as a first-class concern and choose the right API style.",
core:`<h4>HTTP versions — what changed and why</h4>
<table><thead><tr><th>Version</th><th>Transport</th><th>Key feature</th><th>Problem solved</th></tr></thead><tbody>
<tr><td>1.0</td><td>TCP</td><td>One request per connection</td><td>Baseline</td></tr>
<tr><td>1.1</td><td>TCP</td><td>Keep-alive, chunked encoding, Host header</td><td>Connection reuse; virtual hosting</td></tr>
<tr><td>2</td><td>TCP</td><td>Multiplexing, binary framing, HPACK, server push</td><td>HTTP-level head-of-line blocking; header overhead</td></tr>
<tr><td>3</td><td>QUIC (UDP)</td><td>Independent streams, 0-RTT, connection migration</td><td>TCP-level head-of-line blocking; slow handshake on lossy links</td></tr>
</tbody></table>
<div class="box"><div class="t">The nuance that earns points</div>HTTP/2 solved <em>application-level</em> HOL blocking — multiple requests share one connection. But TCP-level HOL blocking remains: one lost packet stalls <em>all</em> multiplexed streams, because TCP delivers bytes in order. HTTP/3 fixes this because QUIC streams are independent at the transport layer. This is why HTTP/3 is meaningfully faster on mobile networks with packet loss.</div>

<h4>Status codes — the ones that matter</h4>
<table><thead><tr><th>Code</th><th>Meaning</th><th>When to use</th></tr></thead><tbody>
<tr><td>200</td><td>OK</td><td>Standard success</td></tr>
<tr><td>201</td><td>Created</td><td>POST that creates — include a Location header</td></tr>
<tr><td>202</td><td>Accepted</td><td>Async processing started — <b>perfect for payments</b></td></tr>
<tr><td>204</td><td>No Content</td><td>DELETE success</td></tr>
<tr><td>400</td><td>Bad Request</td><td>Malformed syntax</td></tr>
<tr><td>401</td><td>Unauthorized</td><td>Not authenticated</td></tr>
<tr><td>403</td><td>Forbidden</td><td>Authenticated but not authorised</td></tr>
<tr><td>409</td><td>Conflict</td><td>Duplicate idempotency key, concurrent modification</td></tr>
<tr><td>422</td><td>Unprocessable Entity</td><td>Well-formed but semantically invalid</td></tr>
<tr><td>429</td><td>Too Many Requests</td><td>Rate limited — include Retry-After</td></tr>
<tr><td>503</td><td>Service Unavailable</td><td>Overloaded — include Retry-After</td></tr>
<tr><td>504</td><td>Gateway Timeout</td><td>Upstream didn't respond in time</td></tr>
</tbody></table>
<div class="box o"><div class="t">202 Accepted is the fintech status</div>When you accept a payment and queue it for async processing, <b>202</b> is the correct response, not 200. It tells the client "I've received this and will process it" — which is exactly true. The client then polls or receives a webhook. Using 200 implies the work is done, which it isn't. This distinction comes up in every payments design interview.</div>

<h4>REST vs gRPC vs GraphQL</h4>
<table><thead><tr><th></th><th>REST</th><th>gRPC</th><th>GraphQL</th></tr></thead><tbody>
<tr><td>Transport</td><td>HTTP/1.1 or 2</td><td>HTTP/2 required</td><td>HTTP/1.1 or 2</td></tr>
<tr><td>Payload</td><td>JSON</td><td>Protobuf (binary)</td><td>JSON</td></tr>
<tr><td>Schema</td><td>OpenAPI (optional)</td><td>Protobuf (required)</td><td>SDL (required)</td></tr>
<tr><td>Strengths</td><td>Ubiquitous, cacheable, human-readable</td><td>Fast, compact, streaming, code-gen</td><td>Client-specified queries, no over-fetching</td></tr>
<tr><td>Weaknesses</td><td>Over/under-fetching, multiple round trips</td><td>Not human-readable, limited browser support</td><td>Complex caching, N+1 risk, query complexity attacks</td></tr>
