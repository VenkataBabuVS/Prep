["Why is explainability a requirement in fraud detection?","Two reasons. Regulatory: in many jurisdictions a customer has the right to know why they were declined, and an automated decision needs an auditable basis. Operational: a fraud analyst investigating a case needs to know which rule or feature drove the decision, otherwise they can't judge whether it was correct. A model that outputs 0.87 with no explanation is unusable for both. This is why the rules engine sits alongside the model — the rules provide explainable decisions, and the model provides the score."]
],
exit:"Deliver both cases in under 60 minutes total, naming at least two places where the answer is a business decision."},

{d:48,wk:7,prio:"P0",title:"Week 7 Integration — Full Fintech Mock",
obj:"A complete fintech design under interview conditions, scored honestly.",
core:`<h4>The mock — 45 minutes, recorded, no notes</h4>
<p><b>Prompt:</b></p>
<pre><code>"Design a wallet platform for a fintech startup.
Users can hold balances in USD and EUR, top up from a card or bank,
send money to other users, and withdraw to a bank account.

Requirements:
- 500,000 users, growing to 5M in 2 years
- 1M transactions/day, peak 5× average
- Real-time balance display in the app
- Regulatory: KYC on signup, AML monitoring, PCI for card top-ups
- You must be able to answer 'where is my money?' definitively</code></pre>

<h4>Scoring rubric</h4>
<table><thead><tr><th>Area</th><th>0</th><th>1</th><th>2</th></tr></thead><tbody>
<tr><td>Clarifying questions before designing</td><td></td><td></td><td></td></tr>
<tr><td>Back-of-envelope numbers driving decisions</td><td></td><td></td><td></td></tr>
<tr><td>API contract with idempotency</td><td></td><td></td><td></td></tr>
<tr><td>Append-only double-entry ledger</td><td></td><td></td><td></td></tr>
<tr><td>Money as integer minor units + currency</td><td></td><td></td><td></td></tr>
<tr><td>Idempotency: atomic claim, three states, request hash</td><td></td><td></td><td></td></tr>
<tr><td>Transaction boundaries — no external calls inside</td><td></td><td></td><td></td></tr>
<tr><td>Suspense accounts for money in flight</td><td></td><td></td><td></td></tr>
<tr><td>Multi-currency handling and FX rounding</td><td></td><td></td><td></td></tr>
<tr><td>Outbox for event publishing</td><td></td><td></td><td></td></tr>
<tr><td>Reconciliation with break categories</td><td></td><td></td><td></td></tr>
<tr><td>CQRS for real-time balance display</td><td></td><td></td><td></td></tr>
<tr><td>PCI scope reduction via tokenization</td><td></td><td></td><td></td></tr>
<tr><td>KYC/AML as a gate with async fallback</td><td></td><td></td><td></td></tr>
<tr><td>Failure modes for each component</td><td></td><td></td><td></td></tr>
<tr><td>Metrics and alerting</td><td></td><td></td><td></td></tr>
<tr><td>Explicit trade-offs (5+)</td><td></td><td></td><td></td></tr>
</tbody></table>

<details><summary>Model outline</summary>
<div class="dbody">
<p><b>Clarify:</b> Assume 500K users, 1M txn/day ≈ 12 TPS average, peak 60 TPS. That's small — a single well-tuned Postgres handles it. The complexity is correctness, not scale. This is important to say: recognising that the problem is not a scale problem is itself a senior signal.</p>
<p><b>Numbers:</b> 1M transactions/day. At ~1KB per ledger entry with indexes, ~2GB/day, ~700GB/year. Trivial. The peak of 60 TPS is nothing for Postgres. So the design should optimise for correctness, auditability, and operational simplicity — not for scale.</p>
<p><b>Data model:</b></p>
<pre><code>users (id, email, kyc_status, created_at)
accounts (id, owner_id, type, currency, created_at)
journal_entries (id, idempotency_key UNIQUE, event_type, occurred_at, metadata)
postings (id, entry_id, account_id, amount_minor, currency, created_at)
idempotency_keys (key PK, request_hash, status, response, created_at)

Account types:
USER_WALLET_USD, USER_WALLET_EUR
CARD_SUSPENSE, BANK_SUSPENSE -- money in flight
FEE_INCOME, FX_ROUNDING -- fees and rounding differences
PLATFORM_EQUITY -- the counterparty for every user balance</code></pre>
<p><b>API:</b></p>
<pre><code>POST /users → create user (triggers KYC)
GET /users/{id}/balances → real-time balances (CQRS read)
POST /topups → {amount, currency, paymentMethodId, idempotencyKey}
→ 202 Accepted, or 200 if synchronous
POST /transfers → {toUserId, amount, currency, idempotencyKey}
POST /withdrawals → {amount, currency, bankAccountId, idempotencyKey}
GET /transactions/{id} → status
GET /transactions?cursor=... → paginated history
POST /webhooks/psp → PSP status callbacks (signature verified)</code></pre>
<p><b>Top-up flow (card):</b></p>
<ol>
<li>Client → PSP SDK → token. Card data never touches our servers. This is the PCI scope reduction.</li>
<li><code>POST /topups</code> with the token and an idempotency key.</li>
<li>Atomic insert into idempotency_keys. If duplicate, return the stored response.</li>
<li>Call the PSP to charge. This is outside the database transaction.</li>
<li>On approval: open a transaction, post ledger entries (debit CARD_SUSPENSE, credit USER_WALLET_USD), insert an outbox event. Commit.</li>
<li>Return 200 with the new balance (read-your-writes — the client doesn't need to re-read).</li>
<li>A relay publishes the outbox event to Kafka. Consumers update the read model, notify, and feed AML monitoring.</li>
</ol>
<p><b>Transfer flow:</b></p>
<pre><code>BEGIN;
-- debit sender with an atomic conditional update
UPDATE balances SET amount_minor = amount_minor - :amt
WHERE account_id = :sender AND amount_minor &gt;= :amt;
-- 0 rows → insufficient funds → ROLLBACK, return 422

INSERT INTO journal_entries (...) VALUES (...);
INSERT INTO postings VALUES (entry, sender, -amt, currency),
(entry, recipient, +amt, currency);
INSERT INTO outbox (...) VALUES (...);
COMMIT;</code></pre>
<p><b>FX flow:</b> four postings plus a rounding posting. Debit sender's USD wallet, credit USD FX pool, debit EUR FX pool, credit recipient's EUR wallet, plus a posting to FX_ROUNDING for the fractional difference. The entry still sums to zero in each currency.</p>
<p><b>Real-time balance display:</b> CQRS. The write model is the ledger. The read model is a materialized balance per account, updated by consuming ledger events, cached in Redis. For read-your-writes, the write response includes the authoritative balance, so the client doesn't need to re-read immediately. The dashboard can tolerate a ~200ms lag for aggregate views.</p>
<p><b>The "where is my money?" requirement:</b> this is the requirement that drives the whole design. Every cent is in a ledger account at all times. Money in flight sits in a suspense account. The reconciliation process compares our suspense balances against the PSP's settlement files daily. If a user asks, we can produce the exact sequence of entries that moved their money, with timestamps and counterparties. That's the answer, and it's only possible because the ledger is append-only and double-entry.</p>
<p><b>KYC/AML:</b> KYC is a gate on account creation with an async fallback for manual review. Accounts are created in a PENDING state with limits; full functionality requires KYC approval. AML monitoring consumes the transaction stream and scores for suspicious patterns — structuring, rapid in-and-out, unusual geography. Alerts go to a compliance queue, not to an automated block, because a false positive on a legitimate customer is expensive.</p>
<p><b>Failure modes:</b></p>
<ul>
<li><b>PSP down:</b> circuit breaker opens, top-ups return 503 with Retry-After. Transfers and withdrawals still work because they use the ledger, not the PSP.</li>
<li><b>PSP timeout:</b> UNKNOWN state, sweeper resolves. Never assumed.</li>
<li><b>Ledger integrity check fails:</b> P1 alert. A code path is writing unbalanced entries. Fail closed on new writes until resolved.</li>
<li><b>Redis down:</b> balance display falls back to the database. Slower but correct. Never serve a stale balance from a cache without a fallback.</li>
<li><b>Kafka down:</b> outbox accumulates, relay retries. Nothing is lost.</li>
</ul>
<p><b>Metrics:</b> transaction success rate by type, p99 latency per operation, ledger integrity check status (must be green), suspense account balances (must trend to zero), UNKNOWN transaction count, reconciliation break rate by category, idempotency duplicate rate.</p>
<p><b>Trade-offs to state:</b></p>
<ol>
<li><b>Eventual consistency on aggregate views</b> but strong consistency on balances — the read-your-writes pattern handles the user-visible case.</li>
<li><b>Synchronous PSP call for top-ups</b> — the user waits, but the UX requires knowing whether the card was charged.</li>
<li><b>Append-only ledger</b> — more storage and more complex queries, but complete auditability.</li>
<li><b>Card data never touches our servers</b> — less control over the payment form, drastically reduced PCI scope.</li>
<li><b>PostgreSQL, not a distributed database</b> — 60 TPS peak doesn't need sharding, and a single ACID store makes correctness trivially easier.</li>
<li><b>Manual compliance queue</b> rather than automated blocking — more operational cost, far fewer false positives.</li>
</ol>
<p><b>The meta-point:</b> the hardest part of this design is not scale — it's proving that every cent is accounted for at every moment. The ledger design, the suspense accounts, and the reconciliation process are all in service of that one requirement. Everything else follows.</p>
</div>
</details>

<h4>Self-assessment questions</h4>
<ol>
<li>Did you recognise that 60 TPS is not a scale problem?</li>
<li>Did you put <code>currency</code> on the account rather than the posting?</li>
<li>Did you model suspense accounts, or did you leave money in limbo?</li>
<li>Did you put the PSP call outside the database transaction?</li>
<li>Did you mention the outbox without being prompted?</li>
<li>Did you handle the FX rounding explicitly?</li>
<li>Did you answer "where is my money?" directly?</li>
<li>Did you name at least five trade-offs?</li>
</ol>

<div class="box o"><div class="t">Week 7 complete</div>You should now be able to walk into any fintech design interview and lead with the six constraints, design a ledger, handle idempotency, and describe reconciliation. That's the domain expertise that distinguishes you from a generalist architect — and it's the highest-leverage material in this programme.</div>`,

drill:["Do the wallet mock, 45 minutes recorded. Score against the rubric.",
"Watch the recording. Count how many times you stated a trade-off and how many times you asked a clarifying question.",
"Re-do the model outline from memory on paper. Note any element you forgot."],

qa:[
["Why is 'this is not a scale problem' a strong thing to say?","Because it shows calibration. An architect who proposes Kafka and sharding for 60 TPS is signalling they can't size a problem — which is worse than not knowing a pattern. Recognising that the complexity here is correctness and auditability, not throughput, means you focus the design effort where it matters. And it builds credibility: if you correctly identify this as a small-scale problem, the interviewer trusts your judgement when you say something else is a large-scale problem."],
["Why put currency on the account rather than the posting?","Because an account holds one currency by definition, and putting it there makes the schema enforce that. If currency were on the posting, you could accidentally post a EUR amount to a USD account. With currency on the account, the posting's currency must match — and the database can enforce it with a foreign key or a check. It also makes FX modelling explicit: converting between currencies is a transaction across two accounts in different currencies, with the FX pool accounts holding the position."],
["What does the platform equity account represent?","It's the counterparty for every user balance. In double-entry, every credit needs a debit. When a user tops up, the debit is the card suspense account. But the sum of all user wallets must equal something — and in a real system that something is the platform's liability to users, offset by the assets it holds. The equity account is where that nets out. It's not strictly necessary for the application to function, but it makes the books balance at the platform level, which finance and auditors will want."],
["How do you handle a withdrawal to a bank account that fails?","The funds were debited from the user's wallet when the withdrawal was initiated, moving to a BANK_SUSPENSE account. If the bank transfer fails, the funds move back from suspense to the user's wallet via a compensating entry. The user sees the money return, and the ledger shows the full story: debit, attempt, reversal. Never leave money in suspense indefinitely — a growing suspense balance is a P1, because it means funds are stuck."],
["Why is a manual compliance queue better than automated blocking?","Because a false positive on a legitimate customer is expensive — they can't access their money, they call support, and they may leave. A false negative on a suspicious transaction is caught later by AML monitoring, and the loss is usually bounded. So the asymmetry favours human review for ambiguous cases. Automated blocking is appropriate only for clear-cut cases: a sanctions match, a known fraud pattern. Everything else goes to a queue with an SLA, where a human makes the call with context the system doesn't have."]
],
exit:"Score 28+ out of 34 on the rubric, or identify the three weakest areas and schedule them."},

{d:49,wk:7,prio:"P0",title:"Fintech Weakness Audit & Targeted Repair",
obj:"Find and fix the specific gaps in your fintech knowledge before moving to behavioral.",
core:`<h4>The audit — score yourself honestly 0–3</h4>
<table><thead><tr><th>Topic</th><th>0 = blank</th><th>1 = recognise</th><th>2 = can use</th><th>3 = can teach</th></tr></thead><tbody>
<tr><td>The six fintech constraints, recited</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Idempotency: atomic claim, three states, request hash</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Stale IN_PROGRESS resolution via downstream query</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Idempotency key retention and partitioning</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Double-entry ledger schema</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Why append-only rather than a balance column</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Atomic conditional UPDATE for overdraft</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Suspense accounts and money in flight</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Balance as a derived value with validation</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Money as integer minor units + currency</td><td></td><td></td><td></td><td></td></tr>
<tr><td>FX: four postings plus rounding</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Downstream rate limits as the real ceiling</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Retry storms and the four defences</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Reconciliation: break categories and resolution</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Never make external calls inside a transaction</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Outbox pattern for event publishing</td><td></td><td></td><td></td><td></td></tr>
<tr><td>PCI scope reduction via tokenization</td><td></td><td></td><td></td><td></td></tr>
<tr><td>UNKNOWN state and the sweeper</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Cross-border state machine and compensations</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Fraud: latency budget, rules engine, explainability</td><td></td><td></td><td></td><td></td></tr>
</tbody></table>
<div class="box b"><div class="t">The rule</div>Any topic scored 0 or 1 gets 20 minutes today. Any scored 2 gets 5 minutes of flash review. Scored 3 means leave it alone — it'll be reinforced in the final mock on Day 55.</div>

<h4>The rapid-fire drill</h4>
<p>Answer each in under 30 seconds, out loud. If you can't, that's your study list.</p>
<ol>
<li>Why can't you use <code>double</code> for money?</li>
<li>What are the three idempotency states and what does each return?</li>
<li>Why must the idempotency claim be a unique constraint?</li>
<li>What do you do with a stale IN_PROGRESS record?</li>
<li>Why is the ledger append-only?</li>
<li>What's a suspense account and why does it matter?</li>
<li>How do you prevent overdraft without a lock?</li>
<li>What is the zero-sum invariant and what does it give you?</li>
<li>Why is the PSP the bottleneck, not your API?</li>
<li>Name the four defences against a retry storm.</li>
<li>What are the five reconciliation break categories?</li>
<li>Why must you never make an external call inside a transaction?</li>
<li>What does the outbox pattern make atomic?</li>
<li>How does tokenization reduce PCI scope?</li>
<li>What is the UNKNOWN state and who resolves it?</li>
<li>Why is the FX rate-lock window a business decision?</li>
<li>Why does fraud detection need a rules engine alongside a model?</li>
<li>What's the training-serving skew problem?</li>
</ol>

<h4>The integrated scenario — the one that ties everything together</h4>
<p><b>Prompt:</b> "A customer says they were charged twice for the same order. Walk me through how you'd investigate and resolve it, and what you'd change so it doesn't happen again."</p>
<details><summary>Model answer</summary>
<div class="dbody">
<p><b>Investigate:</b></p>
<ol>
<li><b>Find both transactions.</b> Query the ledger by customer and amount within a time window. The append-only ledger means both are there with full context.</li>
<li><b>Check the idempotency keys.</b> Are they the same key or different keys? <b>This is the diagnostic question.</b></li>
<li><b>If the same key:</b> a bug in the idempotency layer — a race, or the IN_PROGRESS state not being respected. That's a serious bug requiring a code fix.</li>
<li><b>If different keys:</b> the client generated two keys. That's a client-side bug, or the user genuinely submitted twice. Check whether the client persisted the key across the retry.</li>
<li><b>Check the timing.</b> How far apart? 5ms apart with different keys suggests a client bug — two requests fired concurrently. 30 seconds apart suggests a retry where the key wasn't reused.</li>
<li><b>Check whether the PSP was involved.</b> A timeout-then-success pattern can produce two PSP references for one logical payment if the retry wasn't idempotent.</li>
</ol>
<p><b>Resolve:</b></p>
<ol>
<li><b>Never delete the extra charge.</b> Post a compensating credit entry linked to the original, with a reason code (DUPLICATE_CHARGE).</li>
<li><b>Notify the customer</b> with a clear explanation and the reference numbers. A silent correction is worse than the original error — they'll notice the extra debit on their statement and lose trust.</li>
<li><b>Audit trail.</b> The ledger now shows: original debit, erroneous second debit, reversal. Anyone reviewing can reconstruct exactly what happened and why.</li>
</ol>
<p><b>Prevent:</b></p>
<ol>
<li><b>If it's a same-key bug:</b> fix the race. Add a test that fires 100 concurrent requests with the same key and asserts exactly one transaction.</li>
<li><b>If it's a different-key client bug:</b> that's a contract issue. Add client-side guidance, and consider server-side deduplication heuristics for the narrow case — same user, same amount, same merchant, within N seconds, different keys → flag for review rather than auto-charge. But be careful: legitimate duplicate purchases exist, so this must be a review flag, not a block.</li>
<li><b>Add detection regardless:</b> a daily job that flags accounts with two debits for the same merchant and amount within a short window. It's a heuristic, so it goes to a human queue — but it catches what prevention missed.</li>
<li><b>Monitor the duplicate rate.</b> If it's above zero, there's a systemic problem. Track it per client, per endpoint.</li>
</ol>
<p><b>The honest conclusion:</b> "Idempotency is a contract. The server provides the mechanism; the client has to use it correctly. So the design has to assume some duplicates will slip through, which is why detection and reconciliation exist as a backstop. No prevention mechanism is perfect, and pretending otherwise is how you end up with an angry customer and no process for handling them."</p>
</div>
</details>

<h4>The three things to fix today</h4>
<div class="box o"><div class="t">Prioritise these three</div>
If you can do these three things fluently, you can hold your own in any fintech interview:<br><br>
<b>1. Design the idempotency layer on a whiteboard in 5 minutes</b> — schema, atomic claim, three states, request hash, sweeper.<br>
<b>2. Draw the ledger schema and walk through a transfer, a top-up, and an FX conversion</b> — every posting, and the zero-sum check at the end.<br>
<b>3. Explain reconciliation end to end</b> — ingest, match, classify, resolve, report. Name every break category.<br><br>
Everything else in this week is elaboration on those three.</div>`,

drill:["Take the audit honestly. List every topic scored 0 or 1.",
"Answer all 18 rapid-fire questions out loud in under 10 minutes total.",
"Work the integrated scenario, then read the model answer and note what you missed."],

qa:[
["What's the single most common fintech interview mistake at senior level?","Treating it as generic system design. Proposing microservices, Kafka, and sharding for a system that handles 100 transactions per second, and never mentioning idempotency, reconciliation, or the ledger. The interviewer is listening for domain fluency — the specific constraints of money — not for whether you can draw a scalable architecture. A candidate who says 'this is 60 TPS, so a single Postgres, and here's my idempotency layer and reconciliation process' beats one who draws a beautiful distributed system with no mention of double-entry."],
["How do you demonstrate domain fluency without having worked in fintech?","By naming the constraints and the operational processes unprompted. Idempotency keys, the atomic claim, the three states. Double-entry with the zero-sum invariant. Suspense accounts. Reconciliation with break categories. PCI scope reduction via tokenization. These are the specific, checkable markers of someone who understands the domain. You don't need to have shipped a payment system to know that a timeout is not a failure and that UNKNOWN needs a sweeper — you need to have studied it."],
["Why is 'never make an external call inside a transaction' especially critical in fintech?","Because the external call is usually to a bank or PSP, which is the slowest and least reliable part of the system. Holding a database transaction open across a network round trip to a third party means holding locks and a connection for an unbounded time — and if the PSP is slow, you hold them for seconds. Under load, every thread ends up holding a connection while waiting, the pool exhausts, and the service becomes unresponsive. It's the most common cause of production outages in payment systems."],
["What's the difference between a ledger and a transaction table?","A transaction table records business events — this order was placed, this payment was made. A ledger records the movement of money with double-entry bookkeeping, where every movement has a source and a destination and the entries sum to zero. A transaction table tells you what happened; a ledger tells you where the money is. You need both, and they're linked — a transaction produces one or more journal entries. The distinction matters because a transaction table alone can't answer 'where is my money?' definitively."],
["Why is the suspense account balance a key operational metric?","Because it represents money in flight — captured from a customer or counterparty but not yet settled. A stable, small balance is normal. A growing balance means settlements aren't clearing: a PSP is slow, a payout partner is stuck, or a process is broken. It's the single best early warning that something in the money movement pipeline is degrading, and it's visible in the accounts rather than hidden in a status column. Alerting on its growth rate catches problems before they become customer-visible."]
],
exit:"Answer all 18 rapid-fire questions in under 10 minutes, and design the idempotency layer plus the ledger schema on a whiteboard in 10 minutes."},

{d:50,wk:8,prio:"P0",title:"Story Bank — Writing All Ten",
obj:"Write ten STAR-L stories with real numbers, ready to deploy.",
core:`<h4>Why this is the highest-leverage day in the programme</h4>
<p>Behavioral rounds decide senior offers. At architect level, the technical bar is assumed — they're hiring for judgment, influence, and the ability to operate in ambiguity. A candidate with perfect designs and vague stories loses to one with good designs and specific, quantified stories.</p>

<h4>The STAR-L format</h4>
<table><thead><tr><th>Element</th><th>Length</th><th>Content</th></tr></thead><tbody>
<tr><td><b>Situation</b></td><td>1–2 sentences</td><td>Business context with stakes — money, time, risk, customers</td></tr>
<tr><td><b>Task</b></td><td>1 sentence</td><td>What <em>you</em> owned. Not "the team" — "I was accountable for"</td></tr>
<tr><td><b>Action</b></td><td>60% of the answer</td><td>Your reasoning, the options considered, who you influenced, the trade-off</td></tr>
<tr><td><b>Result</b></td><td>2 sentences</td><td>Quantified. Before and after. Business outcome, not technical output</td></tr>
<tr><td><b>Learning</b></td><td>1–2 sentences</td><td>What you'd do differently. The architect differentiator.</td></tr>
</tbody></table>
<div class="box b"><div class="t">The two failure modes</div><b>1. No numbers.</b> "It went much faster" is not a result. "Deploy lead time went from three weeks to two days" is.<br><br>
<b>2. No "I".</b> "We decided to..." tells the interviewer nothing about your contribution. Use "I proposed", "I was accountable for", "I pushed back on". Then credit the team for execution.</div>

<h4>The ten stories — write them now</h4>

<details><summary>Story 1 — Major architecture decision</summary>
<div class="dbody">
<p><b>Structure to follow:</b></p>
<ol>
<li>Constraints: latency, regulatory, team size, existing investment</li>
<li>Three options considered, with the real reason each was rejected</li>
<li>The decision criteria that broke the tie</li>
<li>The trade-off you knowingly accepted</li>
<li>Outcome, quantified</li>
<li>What you'd revisit</li>
</ol>
<div class="script">"We were [context]. The constraints were [list the real ones]. I considered three options.<br><br>
[A] would have given us the best [attribute], but required [cost or org change] we couldn't absorb.<br>
[B] was the safe choice and the team already knew it, but it wouldn't have survived [the growth projection].<br>
I chose [C].<br><br>
The trade-off I explicitly accepted was [higher operational complexity / a harder hiring bar / a short-term delivery slowdown]. I documented it in an ADR so that when it started hurting, we'd all remember it was a deliberate choice and not an accident.<br><br>
[Time period] on, [what actually happened — with numbers]. What I'd revisit is [specific aspect] — I think I underweighted [X]."</div>
<p><b>Write yours now. Aim for 300 words. Then say it aloud in 2 minutes.</b></p>
</div>
</details>

<details><summary>Story 2 — Business-IT alignment</summary>
<div class="dbody">
<p><b>The test:</b> can you connect technology to revenue, cost, or risk with numbers?</p>
<div class="script">"The business wanted to [increase X / reduce Y / enter Z market]. I mapped the constraint back to technology: [specific bottleneck], which was costing us [quantified impact — X days of delay, $Y in manual processing, Z% of applications abandoned].<br><br>
I proposed [approach]. The technology was the easy part — the hard part was getting [finance/ops/compliance] comfortable, because it changed [their process / their risk exposure]. I ran a [pilot] with [specific scope] and brought back numbers, not architecture diagrams.<br><br>
The result was [metric moved from A to B], which translated to roughly [$X annually / Y% improvement]. What I'd do differently is [bring the ops team in earlier — we lost three weeks to a process objection I could have surfaced in week one]."</div>
</div>
</details>

<details><summary>Story 3 — Influencing without authority</summary>
<div class="dbody">
<p><b>The test:</b> can you move someone who doesn't report to you?</p>
<div class="script">"[Stakeholder] was resistant to [change]. I assumed the resistance was legitimate until proven otherwise — it usually comes from one of three places: they've been burned before, they have a constraint I don't know about, or they're protecting something real.<br><br>
I asked what would have to be true for this to work for them. The answer was [the real constraint]. So I changed my approach: [the revised proposal that addressed their concern].<br><br>
The move that worked was giving them a bounded, low-risk way to say yes. Not 'approve this programme' but 'let us prove it on this one service over six weeks.'<br><br>
[Outcome with numbers]. What I learned is that resistance is almost always information, not obstruction."</div>
</div>
</details>

<details><summary>Story 4 — Failure you owned</summary>
<div class="dbody">
<p><b>The test:</b> accountability without deflection, and evidence the lesson stuck.</p>
<div class="script">"I approved [decision]. At the time it looked right because [genuine reasoning — do not retroactively make yourself stupid]. What I missed was [specific blind spot].<br><br>
The consequence was [real impact — be honest about the size]. I was the one who had to tell [stakeholder].<br><br>
What I did immediately: [remediation]. What I changed afterwards: [systemic fix — a review step, a checklist, a design principle].<br><br>
The thing I took from it is [principle]. It's the reason I now [specific current behaviour]."</div>
<p><b>The killer detail:</b> connecting it to a current behaviour proves the lesson stuck. "It's why I now insist on load-testing before every peak event" is worth more than any amount of reflection.</p>
</div>
</details>

<details><summary>Story 5 — Conflict resolution</summary>
<div class="dbody">
<p><b>The test:</b> can you disagree productively and preserve the relationship?</p>
<div class="script">"[Person] and I disagreed about [decision]. I started by asking what would have to be true for their approach to be better — sometimes the answer reveals a constraint I didn't know about.<br><br>
The crux was [the actual assumption we disagreed about]. I named it: 'I think we disagree about whether [X] is likely. If you're right, your approach wins.'<br><br>
We settled it with [a spike / a data point / a bounded experiment]. [Outcome].<br><br>
The part I'd emphasise is that once the decision was made, I committed fully — even though it wasn't my preferred option. Half-hearted execution of a decision you opposed is the worst of both worlds."</div>
</div>
</details>

<details><summary>Story 6 — Technical debt / modernization</summary>
<div class="dbody">
<p><b>The test:</b> can you make the business case for paying down debt amid feature pressure?</p>
<div class="script">"[System] was costing us [quantified: 30% of every sprint / three-week deploy lead time / X incidents per quarter]. The problem with debt arguments is they never have a deadline or a customer, so they always lose.<br><br>
So I reframed it in business terms: [the cost in money or speed]. Once it was a business statement, it competed for budget on equal terms.<br><br>
I also attached repayment to work that was already funded — the boy-scout rule at the architecture level. If we were touching [domain] for a feature anyway, that's when we fixed the specific debt in the same change.<br><br>
Result: [metric]. What I learned is that not all debt is bad — some of it bought us speed we needed. The problem is unmanaged debt."</div>
</div>
</details>

<details><summary>Story 7 — Mentoring / raising the bar</summary>
<div class="dbody">
<p><b>The test:</b> do you multiply other engineers?</p>
<div class="script">"At architect level, my output is supposed to be the team's output, not my own commits. So I think about leverage.<br><br>
The highest-leverage things I've done: [introduced ADRs] so reasoning survived the meeting; [ran a weekly design review] where anyone could challenge anyone including me; [paired with engineers on their first production incident] because that's where judgment forms; [wrote the internal guides] that cut onboarding from [N weeks] to [M].<br><br>
A specific example: [engineer] was strong technically but froze in design reviews. Rather than tell them to speak up, I asked them to present my design to the wider team — so the stakes were on me, not them. They now lead design reviews for [domain].<br><br>
The measure I care about isn't how many people I mentored. It's how many decisions get made well when I'm not in the room."</div>
</div>
</details>

<details><summary>Story 8 — Production crisis</summary>
<div class="dbody">
<p><b>The test:</b> composure, prioritisation, and blameless post-mortem thinking.</p>
<div class="script">"[What broke, and the customer impact — with numbers if possible].<br><br>
My first move was to [mitigate before investigating — roll back, disable the feature, route around it]. Debugging in production while customers are affected is the wrong order.<br><br>
Then I [organised the response: who was investigating what, a comms channel, a status page update]. The hardest part was [the specific thing — resisting the urge to debug before mitigating / keeping the team calm / making the call to roll back].<br><br>
Root cause was [specific]. The post-mortem was blameless — we focused on the systemic gap, not the individual. The changes were [specific: an alert that would have caught it earlier, a test, a process step].<br><br>
The thing I'd emphasise: the alerting gap was the real finding. We had monitoring on the machines but not on the business metric that actually mattered."</div>
</div>
</details>

<details><summary>Story 9 — Saying no / killing a project</summary>
<div class="dbody">
<p><b>The test:</b> judgment about what not to build. Very senior signal.</p>
<div class="script">"[Stakeholder] wanted [feature/project]. I said no — but not 'no, we can't.' It was 'yes, and here's what it costs — it displaces [X], and I don't think you want that trade.'<br><br>
I brought the numbers: [N engineer-months], which meant [specific commitment] slips, plus the ongoing operational cost of [Y]. Once the trade was visible, the conversation changed from 'why won't you do this' to 'which of these do we actually want.'<br><br>
We ended up [not doing it / doing a much smaller version]. [Time] later, [evidence it was right].<br><br>
What I try to avoid is the soft no — agreeing in principle and then never prioritising it. That destroys trust more than a clear no does."</div>
</div>
</details>

<details><summary>Story 10 — Ambiguity / undefined problem</summary>
<div class="dbody">
<p><b>The test:</b> do you create structure where none exists?</p>
<div class="script">"I was asked to [vague mandate]. Nobody could tell me what success looked like.<br><br>
My first move was to write down my assumptions in a one-page document and circulate it. That converted 'I'm not sure what they want' into 'here's what I'm assuming; disagree in the next 48 hours.' Most ambiguity dies at that step, because people will correct a written assumption but won't volunteer one.<br><br>
Then I separated the ambiguities that were expensive to reverse — data model, external contracts, security boundaries — and resolved those first. Anything cheap to reverse, I made a call and moved, using feature flags so it was genuinely reversible.<br><br>
[Outcome]. The thing I learned is that ambiguity is usually not a lack of information — it's a lack of decision. Someone hasn't chosen. My job is to make the decision explicit and cheap to reverse."</div>
</div>
</details>

<h4>Finding your numbers</h4>
<table><thead><tr><th>Category</th><th>What to look for</th></tr></thead><tbody>
<tr><td><b>Scale</b></td><td>TPS/QPS peak and average, data volume, users, transactions, services, teams, regions</td></tr>
<tr><td><b>Latency</b></td><td>Before and after, p99 not average</td></tr>
<tr><td><b>Cost</b></td><td>$ per year saved, % reduction, infrastructure cost, headcount avoided</td></tr>
<tr><td><b>Revenue</b></td><td>Enabled, protected, accelerated</td></tr>
<tr><td><b>Reliability</b></td><td>Incidents per quarter, MTTR, uptime %, error budget consumed</td></tr>
<tr><td><b>Velocity</b></td><td>Deploy frequency, lead time, change failure rate, onboarding time</td></tr>
<tr><td><b>Risk</b></td><td>Compliance findings, audit scope reduction, security issues closed</td></tr>
</tbody></table>
<div class="box w"><div class="t">If you can't remember the exact number</div>Use a defensible range and say so: <em>"I don't have the exact figure in front of me, but it was on the order of 2,000 TPS at peak."</em> Interviewers respect calibrated uncertainty. They do not respect confident fabrication, and they <em>will</em> probe.</div>

<h4>The rehearsal protocol</h4>
<ol>
<li><b>Write all ten.</b> 300 words each. This takes 2–3 hours.</li>
<li><b>Say each aloud, timed at 2 minutes.</b> Cut anything that doesn't fit.</li>
<li><b>Record yourself.</b> Watch with the sound off first — are you animated, or reciting?</li>
<li><b>Cut every sentence</b> that starts with "So basically…" or ends with "…and yeah."</li>
<li><b>Cut the throat-clearing.</b> Start with the situation, not "That's a great question, so what happened was…"</li>
<li><b>Practise the transitions.</b> The end of the Result should lead naturally into the Learning.</li>
</ol>`,

drill:["Write all ten stories, 300 words each. This will take 2–3 hours. Do it in one sitting.",
"Say each aloud, timed. Cut anything over 2 minutes.",
"Record stories 1, 4, and 9 (the hardest three) and watch them back."],

qa:[
["How long should a behavioral answer be?","Two minutes, with the Action taking about 60% of that. Under 90 seconds usually means you're missing the reasoning — the interviewer can't see your judgment. Over three minutes means you're rambling and they'll stop listening. The discipline is to write it, time it, and cut until it fits. Most first drafts are 4 minutes and need to lose half."],
["What if I don't have a good example for a question?","Use an adjacent one and be honest about the fit: 'I haven't had exactly that situation, but the closest was [X], and here's how I'd approach it.' Interviewers prefer an honest adjacent example over a fabricated perfect one. And prepare ten stories precisely so you always have something — with ten well-chosen stories you can answer almost any behavioral question by picking the closest one and framing it appropriately."],
["How do I handle a story where the outcome was bad?","Own it fully and make the learning concrete. The structure is: the decision, why it seemed right at the time, what you missed, the consequence, what you did, and the systemic change. The failure mode is blaming circumstances or other people. The strongest version connects the learning to a current behaviour — 'it's why I now insist on X' — which proves it stuck rather than being a rehearsed line."],
["Should I mention company names and specific technologies in behavioral answers?","Yes to technologies if they're relevant and you can defend them. Yes to scale and impact. Be careful with company names only if the information is confidential — but "a payments company processing X transactions per day" is fine and specific enough. The detail is what makes it credible; vagueness is what makes it sound rehearsed or invented."],
["How do I avoid sounding rehearsed?","By knowing the story, not the script. Write it out to get the structure and the numbers right, then practise telling it conversationally rather than reciting. The test: if you can tell it slightly differently each time and still hit the same beats, you know it. If you're reciting word for word, it'll sound like a recitation. And record yourself — you'll hear the difference immediately."]
],
exit:"Write all ten stories with real numbers, then deliver three of them — including the failure story — under 2 minutes each."},

{d:51,wk:8,prio:"P0",title:"Behavioral Drill — The Twelve Architect Questions",
obj:"Deliver all twelve answers aloud, timed, and score yourself.",
core:`<h4>The drill</h4>
<p>Answer each aloud, timed at 90 seconds. Record if you can. Score each 0–2 on: <b>structure</b> (did you use STAR-L?), <b>specificity</b> (numbers, names, real detail), <b>ownership</b> (did you say "I"?), and <b>learning</b> (did you extract a principle?).</p>

<div class="qa"><div class="q">1. Tell me about a time you aligned IT strategy with business objectives.</div>
<div class="a"><p><b>Why they ask:</b> this is <em>the</em> architect question. It separates people who take orders from people who shape direction. The failure mode is answering with technology.</p>
<p><b>The tell:</b> if your answer has no number and no business stakeholder, it's not an architect answer yet.</p></div></div>

<div class="qa"><div class="q">2. Tell me about a critical architectural decision you made.</div>
<div class="a"><p><b>What earns points:</b> naming a trade-off you <em>knowingly</em> accepted, and showing you understand the cost is real. Three options considered, not two — a binary choice suggests you didn't explore.</p></div></div>

<div class="qa"><div class="q">3. Explain your last big architecture decision the way you'd explain it to our CFO.</div>
<div class="a"><p><b>Key moves:</b> no acronyms, a phased investment with an exit, and the explicit statement that "do nothing" has a cost. That last one is what CFOs respond to. Most engineers present the solution; the architect presents the choice.</p></div></div>

<div class="qa"><div class="q">4. Tell me about a time you talked a team out of the technically better option.</div>
<div class="a"><p><b>Why they ask:</b> it's a trap for engineers who equate "best technology" with "right decision." They're testing whether you optimise for the organisation, not the artifact.</p>
<p><b>The three questions that work:</b> Who operates this at 3am? How many people can debug it under pressure? What's the second-order cost of a second paradigm in an org that already has one?</p></div></div>

<div class="qa"><div class="q">5. How do you handle ambiguity in requirements?</div>
<div class="a"><p><b>The framing that lands:</b> "Ambiguity is usually not a lack of information — it's a lack of <em>decision</em>. Someone hasn't chosen. My job is to make the decision explicit and cheap to reverse."</p>
<p><b>The tactic:</b> write down your assumptions in a one-page document and circulate it. People will correct a written assumption but won't volunteer one.</p></div></div>

<div class="qa"><div class="q">6. How do you handle pushback from skeptical stakeholders?</div>
<div class="a"><p><b>The move:</b> assume the skepticism is legitimate. It comes from one of three places — they've been burned before, they have a constraint you don't know about, or they're protecting something real. Find out which.</p>
<p><b>Then change the medium:</b> technical diagrams don't persuade business stakeholders; outcomes do. And give them a bounded, low-risk way to say yes.</p></div></div>

<div class="qa"><div class="q">7. Tell me about a time you had to say no to a project or feature.</div>
<div class="a"><p><b>The structure:</b> not "no, we can't" but "yes, and here's what it costs — it displaces X, and I don't think you want that trade." Once the trade is visible, the conversation changes from "why won't you" to "which of these do we want."</p>
<p><b>What to avoid:</b> the soft no. Agreeing in principle and never prioritising destroys trust more than a clear no.</p></div></div>

<div class="qa"><div class="q">8. How do you make build-vs-buy decisions?</div>
<div class="a"><p><b>The first question:</b> is this our differentiator? If not, lean hard toward buying — building non-differentiating software is how engineering capacity disappears.</p>
<p><b>Five axes:</b> total cost over three years (not sticker price), time to value, lock-in and exit cost, regulatory fit, and whether you have the skills to run it.</p>
<p><b>Insist on:</b> a documented exit path. "We could migrate in six months" is a conversation to have before signing, not after.</p></div></div>

<div class="qa"><div class="q">9. How do you balance technical debt against feature delivery?</div>
<div class="a"><p><b>Refuse the framing:</b> treating it as a balance makes debt reduction a permanent loser — it never has a deadline or a customer.</p>
<p><b>The reframe:</b> make debt visible in business terms. "We spend 30% of every sprint working around X" is a business statement. Then it competes for budget on equal terms.</p>
<p><b>The tactic:</b> attach repayment to work that's already funded — the boy-scout rule at the architecture level.</p></div></div>

<div class="qa"><div class="q">10. Describe a time you mentored someone or raised the technical bar.</div>
<div class="a"><p><b>The framing:</b> at architect level, your output is the team's output, not your own commits. So think in leverage.</p>
<p><b>The measure:</b> not how many people you mentored, but how many decisions get made well when you're not in the room.</p></div></div>

<div class="qa"><div class="q">11. Where do you see the biggest risk in our current architecture?</div>
<div class="a"><p><b>Do 30 minutes of research first</b> — engineering blog, talks, job postings. Frame any critique as a question, not a verdict.</p>
<p><b>The winning combination:</b> humility plus specific curiosity. Never walk into this with a confident diagnosis of a system you've never seen.</p></div></div>

<div class="qa"><div class="q">12. Why are you leaving after 20+ years, and why us?</div>
<div class="a"><p><b>Never:</b> criticise your employer, mention money as the primary driver, or say "looking for a new challenge."</p>
<p><b>The structure:</b> what's changed structurally (not a complaint), what you want next (specific), and why this company is on a short list rather than one of twenty applications.</p>
<p><b>The line that lands:</b> "I'm looking for a role where 20 years of pattern recognition is an asset rather than overhead. I'd rather be the person who prevents the expensive mistake than the person who's fast at writing code."</p></div></div>

<h4>Scoring sheet</h4>
<table><thead><tr><th>#</th><th>Structure</th><th>Specificity</th><th>Ownership</th><th>Learning</th><th>Time</th></tr></thead><tbody>
<tr><td>1</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>2</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>3</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>4</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>5</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>6</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>7</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>8</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>9</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>10</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>11</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><td>12</td><td></td><td></td><td></td><td></td><td></td></tr>
</tbody></table>
<div class="box o"><div class="t">Target</div><b>40+ / 48:</b> ready. Focus remaining time on negotiation and logistics.<br>
<b>30–39:</b> solid. Identify the three lowest-scoring and rewrite them.<br>
<b>Under 30:</b> your stories need more specificity. Go back to Day 50 and find the numbers.</div>

<h4>The five phrases that weaken any answer</h4>
<ul>
<li><b>"We decided…"</b> → Use "I proposed…" or "I was accountable for…". Credit the team for execution, but own the judgment.</li>
<li><b>"It went much better"</b> → Give the number. "Deploy lead time went from three weeks to two days."</li>
<li><b>"I'm a perfectionist"</b> → The classic non-weakness. Name a real one with a real consequence.</li>
<li><b>"So basically…"</b> → Cut it. Every time.</li>
<li><b>"…and that's kind of how we did it"</b> → End on the Result or the Learning, not on a trailing-off.</li>
</ul>

<h4>The pressure questions — expect these</h4>
<details><summary>"That's not really a failure — tell me about something that actually went wrong."</summary>
<div class="dbody">
<p><b>What they're testing:</b> whether your prepared failure story is real. Many candidates pick something that turned out fine — a "failure" that was actually a learning opportunity with a happy ending.</p>
<p><b>Response:</b> have a second, genuinely bad one ready. And when you tell it, don't soften it. "We lost $X" or "we missed the regulatory deadline" is more credible than "it was a challenge but we got through it."</p>
</div></details>
<details><summary>"What would your critics say about you?"</summary>
<div class="dbody">
<p><b>What they're testing:</b> self-awareness. "I have no critics" is a failing answer.</p>
<p><b>Response:</b> name a real pattern with a real cost. "I've been told I move too fast on decisions and don't always bring people along. It's cost me buy-in on two occasions, and I've since started writing a one-page decision doc before I commit — which is slower upfront but means the decision actually sticks."</p>
</div></details>
<details><summary>"Why should we hire you over someone with more recent hands-on coding?"</summary>
<div class="dbody">
<p><b>Response:</b> don't compete on the wrong axis. "At this level, the value isn't typing speed — it's preventing the expensive mistake. I've seen the patterns that lead to outages, the architectures that don't survive growth, and the trade-offs that look good on a diagram and hurt in production. I'd expect to still write code, but my main output is the team's judgment."</p>
</div></details>`,

drill:["Answer all twelve aloud, timed at 90 seconds each, and score them.",
"Identify the three lowest-scoring and rewrite them with more specificity.",
"Have someone ask you the three pressure questions without warning."],

qa:[
["What if the interviewer keeps interrupting my answer?","It usually means they've heard enough and want to probe a specific part, or you're taking too long. Don't fight it — answer their question and let them steer. If they interrupt early, it often means you've buried the interesting part; lead with the result next time. If they interrupt repeatedly, they may be testing whether you can be concise under pressure."],
["How do I answer 'tell me about yourself' at architect level?","Three sentences: what you do now and the scale you operate at, the through-line of your career, and why you're here. "I'm an architect at a payments company, currently responsible for a platform processing X transactions per day. I've spent 20 years in enterprise Java, moving from development into architecture about eight years ago, mostly in regulated domains. I'm here because I want to work on [specific thing], which is what drew me to this role." Then stop. Let them ask."],
["Should I prepare questions to ask them?","Yes, and they should signal seniority. Not "what's the culture like" but: How are architecture decisions made, and who has the final call when there's disagreement? What's the biggest technical risk on the roadmap in the next 18 months? How is technical debt funded — a standing budget or competing with features? What happened to the last person in this role? Those questions tell the interviewer you're evaluating them, which changes the dynamic."],
["How do I handle a question about a technology I don't know?","Say so directly, then reason from what you do know. "I haven't worked with X, but based on [similar thing], I'd expect [reasoned guess]. The questions I'd ask are [specific questions]." That demonstrates the ability to reason about unfamiliar technology — which is more valuable at architect level than knowing any specific tool. The failure mode is bluffing, because a senior interviewer detects it instantly."],
["What if I get a behavioral question I haven't prepared for?","Pick the closest story from your ten and reframe it. With ten well-chosen stories covering leadership, conflict, failure, ambiguity, influence, and execution, almost any behavioral question maps to one of them. If genuinely nothing fits, be honest: "I haven't had exactly that situation. The closest was [X], and here's how I'd approach it." Then reason through it aloud — which is itself a strong signal."]
],
exit:"Score 40+ across the twelve questions, or rewrite the three weakest and re-deliver them."},

{d:52,wk:8,prio:"P0",title:"Failure, Pushback & Pressure Handling",
obj:"Handle the five pressure tactics without becoming defensive or caving.",
core:`<h4>The five tactics and your response</h4>

<details><summary>Tactic 1 — "I don't think that would work." (no reason given)</summary>
<div class="dbody">
<p><b>Testing:</b> do you fold under vague authority, or seek the substance?</p>
<div class="script">"That's possible — can you tell me which part concerns you? If it's [component A], I'd agree, that's the weakest part of my design and here's how I'd shore it up. If it's [component B], I'd push back, because [reason]."</div>
<p><b>Never:</b> immediately abandon your design to please them — that reads as no convictions. <b>Also never:</b> dig in defensively. The posture is curious and specific.</p>
</div></details>

<details><summary>Tactic 2 — "That's expensive. Would you really do that?"</summary>
<div class="dbody">
<p><b>Testing:</b> cost awareness, a genuine architect competency.</p>
<div class="script">"It is. Two things. First, I'd want to check the cost against the alternative — the current [process or outage] costs roughly [X], so the comparison matters more than the absolute number. Second, if the budget genuinely isn't there, the phased version is [specific cheaper path], which gets [partial benefit] for [lower cost], and I'd accept that as a starting point."</div>
<p><b>Having a cheaper fallback ready</b> is what makes this land.</p>
</div></details>

<details><summary>Tactic 3 — "What if I told you [constraint] makes that impossible?"</summary>
<div class="dbody">
<p><b>Testing:</b> adaptability. Can you re-derive a design under new constraints, live?</p>
<div class="script">"Then the [X] part of my design is out. Let me rework it — with that constraint, I'd [new approach], which costs me [trade-off] but still satisfies [the core requirement]. The parts that survive are [Y and Z]."</div>
<p><b>Visibly revising your own work in real time, without ego, is one of the strongest signals you can send.</b></p>
</div></details>

<details><summary>Tactic 4 — "Tell me about a failure." (then silence)</summary>
<div class="dbody">
<p><b>Testing:</b> whether you deflect or own it.</p>
<p><b>Structure:</b> the decision → why it seemed right at the time → what you missed → the consequence → what you did → the systemic change.</p>
<div class="script">"I approved [decision]. At the time it looked right because [genuine reasoning — don't retroactively make yourself stupid]. What I missed was [specific blind spot].<br><br>
The consequence was [real impact — be honest about the size]. I was the one who had to tell [stakeholder].<br><br>
What I did: [immediate remediation]. What I changed afterwards: [systemic fix]. The thing I took from it is [principle]. It's the reason I now [specific current behaviour]."</div>
<p><b>The killer detail:</b> connecting it to a current behaviour. That proves the lesson stuck.</p>
</div></details>

<details><summary>Tactic 5 — "A colleague disagrees with your approach. What do you do?"</summary>
<div class="dbody">
<ol>
<li><b>Understand their model.</b> "What would have to be true for their approach to be better?" Sometimes the answer is "nothing" — but usually it reveals a constraint you didn't know about.</li>
<li><b>Find the crux.</b> Most disagreements are about different assumptions, not different conclusions. Name it: "I think we disagree about whether [X] is likely. If you're right, your approach wins."</li>
<li><b>Make it testable.</b> "Can we settle this with a spike? Two days to see whether [metric] behaves the way each of us expects."</li>
<li><b>Escalate on principle, not personality.</b> Take the decision to whoever owns it with both options and their trade-offs — not a lobbying campaign.</li>
<li><b>Commit and support.</b> "I've disagreed and lost before and I commit completely. Half-hearted execution of a decision you opposed is the worst of both worlds."</li>
</ol>
</div></details>

<h4>Behaviour under live design pressure</h4>
<div class="grid g2">
<div class="card"><h4>Do</h4>
<ul>
<li>Think out loud — they're scoring reasoning, not conclusions</li>
<li>Say "I'm not sure, let me reason about it" — a strong signal, not a weakness</li>
<li>Write down their constraint before responding to it</li>
<li>Summarise the trade-off before making a choice</li>
<li>Ask "does that answer your question, or should I go deeper?"</li>
<li>Admit when you're at the edge of your knowledge — and say how you'd find out</li>
</ul></div>
<div class="card"><h4>Don't</h4>
<ul>
<li>Go silent for 60 seconds — they can't score silence</li>
<li>Bluff. Senior interviewers detect it instantly and it's fatal to trust</li>
<li>Argue with the premise instead of engaging</li>
<li>Over-engineer — Kafka and Cassandra for 100 users is a red flag</li>
<li>Mention technology you can't defend when challenged</li>
<li>Apologise repeatedly. One acknowledgement, then move on</li>
</ul></div>
</div>

<h4>The hardest question — "what's your biggest weakness?"</h4>
<div class="box b"><div class="t">The three failing answers</div>
<b>"I'm a perfectionist."</b> — The interviewer has heard it 500 times. It's a strength disguised as a weakness, and it signals you're not self-aware.<br><br>
<b>"I work too hard."</b> — Same problem, worse.<br><br>
<b>"I don't have any real weaknesses."</b> — Fatal. Either you're not reflective or you're not honest.</div>
<p><b>The answer that works</b> has three parts: a real pattern, the specific cost it has caused, and what you now do about it.</p>
<div class="script">"I've been told I move too fast on decisions and don't always bring people along. It's cost me buy-in twice — once on a platform decision where the team felt it was imposed rather than agreed, and we lost about six weeks to resistance I could have avoided.<br><br>
What I do now is write a one-page decision doc before I commit to anything significant and circulate it for 48 hours. It's slower upfront, but the decisions actually stick. My last three architecture decisions went through without a single objection."</div>
<p><b>Why it works:</b> the weakness is real, the cost is specific and quantified, and the mitigation is a concrete behaviour change. It also demonstrates you've reflected on it, which is what they're actually testing.</p>

<h4>Handling the "tell me about a time you disagreed with your manager"</h4>
<div class="script">"My manager wanted to [decision]. I thought it was wrong because [specific reason].<br><br>
I didn't argue in the meeting. I went away, wrote up both options with the trade-offs and the numbers, and asked for 30 minutes. Presenting it in writing meant the conversation was about the substance, not about who was more senior in the room.<br><br>
[Outcome — either they changed their mind, or I was overruled and committed fully]. Either way, the important part is that once the decision was made, I supported it completely. I've disagreed and lost before, and half-hearted execution of a decision you opposed is the worst of both worlds."</div>
<p><b>What this demonstrates:</b> you can disagree without being difficult, you escalate on substance not personality, and you commit fully once the decision is made. Those three things are exactly what a senior interviewer is checking for.</p>

<h4>The composure checklist</h4>
<ol>
<li><b>Pause before answering hard questions.</b> Two seconds of thought reads as consideration, not hesitation.</li>
<li><b>Breathe.</b> Anxiety shows in a rushed, high-pitched delivery. Deliberate breathing fixes it.</li>
<li><b>If you don't know, say so early.</b> "I haven't encountered that" is better than three minutes of circling.</li>
<li><b>Never argue with the premise.</b> Engage with the question as asked, even if you think it's the wrong question. You can add "the question I'd also ask is…" after answering.</li>
<li><b>Take notes during the question.</b> It shows engagement and gives you a beat to think.</li>
<li><b>Watch your last sentence.</b> Don't trail off. End on the Result or the Learning.</li>
</ol>

<h4>The failure story you must have ready</h4>
<p>Most candidates pick a "failure" that turned out fine. Interviewers see through this instantly. Have a genuine one — something that cost money, time, or trust — and tell it without softening.</p>
<div class="box o"><div class="t">The structure that works</div>
<b>1. The decision and why it seemed right.</b> "We chose [X] because [genuine reasoning]." Don't make past-you stupid.<br>
<b>2. The blind spot.</b> "What I missed was [specific]." This is the self-awareness the interviewer is buying.<br>
<b>3. The consequence, unsoftened.</b> "We lost [X]." Or "we missed [deadline]." Real numbers.<br>
<b>4. The immediate remediation.</b> What you did in the moment.<br>
<b>5. The systemic change.</b> The process, checklist, or principle you introduced.<br>
<b>6. The current behaviour.</b> "It's why I now insist on [specific thing]." This is what proves the lesson stuck.</div>`,

drill:["Have someone hit you with all five pressure tactics in sequence, without warning.",
"Write and rehearse your genuine failure story. Time it at 2 minutes.",
"Write your 'biggest weakness' answer with a real cost and a concrete behaviour change."],

qa:[
["What do I do if I genuinely can't answer a technical question?","Say so early and pivot to reasoning. "I haven't worked with that specifically. Based on [adjacent thing], I'd expect [reasoned guess]. The questions I'd ask to figure it out are [specific questions]." That demonstrates the ability to reason about unfamiliar problems, which at architect level is more valuable than knowing any specific technology. The failure mode is pretending, because a senior interviewer detects it instantly and it destroys trust for the rest of the interview."],
["How do I handle a hostile interviewer?","First, assume it's a deliberate pressure test rather than genuine hostility — architect interviews often include someone playing the skeptic. Stay calm, engage with the substance, and don't take the bait. If it's genuinely hostile, it's information about the company. And remember: you're evaluating them too. An interviewer who's rude in a 45-minute conversation is likely to be difficult to work with."],
["What if I disagree with the interviewer's technical approach?","Engage with the substance. "That's an interesting approach — the trade-off I'd worry about is [X]. How do you handle that?" This frames it as curiosity rather than challenge, which is both more collaborative and harder to dismiss. If they have an answer, you've learned something. If they don't, you've demonstrated judgment without being confrontational."],
["How do I recover if I give a bad answer?","Don't dwell on it and don't apologise repeatedly. One acknowledgement and move on: "Let me reframe that." Then give the better answer. Interviewers are assessing the whole conversation, not each answer individually. And a good recovery is itself a signal — composure under a mistake is exactly what they want in an architect."],
["Should I ask for feedback at the end?","Ask about the process and next steps, not for a verdict on your performance. "What are the next steps, and is there anything you'd like me to clarify or expand on?" That gives them a chance to probe further if something was unclear, without putting them in the awkward position of giving you a score."]
],
exit:"Handle all five pressure tactics in one conversation without becoming defensive or caving, and deliver your genuine failure story in 2 minutes."},

{d:53,wk:8,prio:"P0",title:"Machine Coding — Three Drills with Tests",
obj:"Produce clean, tested, working code under time pressure.",
core:`<h4>What architect-level coding rounds actually look like</h4>
<table><thead><tr><th>Format</th><th>Prompt</th><th>What's scored</th></tr></thead><tbody>
<tr><td>Machine coding (90 min)</td><td>Build a working rate limiter / parking lot / wallet with tests</td><td>Working code, class design, extensibility, tests, edge cases</td></tr>
<tr><td>Pairing (60 min)</td><td>Extend an existing small codebase</td><td>Reading code, incremental change, not rewriting</td></tr>
<tr><td>Design-flavoured (45 min)</td><td>LRU cache, token bucket, consistent hash ring</td><td>Data structure choice + concurrency awareness</td></tr>
<tr><td>Code review (45 min)</td><td>"Here's a PR, review it"</td><td>Spotting concurrency bugs, N+1s, resource leaks</td></tr>
</tbody></table>

<h4>The code-quality checklist they're actually scoring</h4>
<ol>
<li><b>Did you clarify before coding?</b> Inputs, outputs, constraints, edge cases.</li>
<li><b>Did you state your approach and complexity before writing?</b></li>
<li><b>Is the code clean?</b> Meaningful names, no dead code, small methods.</li>
<li><b>Are edge cases handled?</b> Empty input, single element, null, overflow.</li>
<li><b>Are there tests?</b> Even two or three, even informally.</li>
<li><b>Did you discuss trade-offs?</b> "O(n) time, O(n) space — if memory were tight I'd..."</li>
<li><b>Did you test it aloud?</b> Walk a small example through the code.</li>
</ol>

<h4>Drill 1 — LRU Cache (both ways)</h4>
<pre><code>// Version A — LinkedHashMap. 10 lines. Say this first.
class LRUCache&lt;K,V&gt; extends LinkedHashMap&lt;K,V&gt; {
private final int cap;
LRUCache(int cap) {
super(cap, 0.75f, true); // accessOrder = true
this.cap = cap;
}
@Override
protected boolean removeEldestEntry(Map.Entry&lt;K,V&gt; eldest) {
return size() &gt; cap;
}
}

// Version B — the manual version. They WILL ask for this.
class LRUCache&lt;K,V&gt; {
private static class Node&lt;K,V&gt; {
K key; V value;
Node&lt;K,V&gt; prev, next;
Node(K k, V v) { key = k; value = v; }
}

private final int capacity;
private final Map&lt;K, Node&lt;K,V&gt;&gt; map = new HashMap&lt;&gt;();
private final Node&lt;K,V&gt; head = new Node&lt;&gt;(null, null); // sentinels
private final Node&lt;K,V&gt; tail = new Node&lt;&gt;(null, null);

LRUCache(int capacity) {
if (capacity &lt;= 0) throw new IllegalArgumentException("capacity must be positive");
this.capacity = capacity;
head.next = tail;
tail.prev = head;
}

public V get(K key) {
Node&lt;K,V&gt; n = map.get(key);
if (n == null) return null;
moveToFront(n);
return n.value;
}

public void put(K key, V value) {
if (key == null) throw new NullPointerException("key");
Node&lt;K,V&gt; existing = map.get(key);
if (existing != null) {
existing.value = value;
moveToFront(existing);
return;
}
if (map.size() == capacity) {
Node&lt;K,V&gt; lru = tail.prev;
remove(lru);
map.remove(lru.key);
}
Node&lt;K,V&gt; n = new Node&lt;&gt;(key, value);
addToFront(n);
map.put(key, n);
}

private void moveToFront(Node&lt;K,V&gt; n) { remove(n); addToFront(n); }

private void remove(Node&lt;K,V&gt; n) {
n.prev.next = n.next;
n.next.prev = n.prev;
}

private void addToFront(Node&lt;K,V&gt; n) {
n.next = head.next;
n.prev = head;
head.next.prev = n;
head.next = n;
}
}</code></pre>
<div class="box o"><div class="t">What makes this a strong answer</div>
<b>Sentinel nodes</b> eliminate the null checks at the boundaries — the most common source of bugs in linked-list code. Say why you're using them.<br><br>
<b>O(1) for both get and put</b> because the map holds node references, so you never traverse the list to find a node.<br><br>
<b>Input validation</b> on capacity and key. Cheap, and it shows you think about contracts.<br><br>
<b>The ordering</b>: LinkedHashMap version first (pragmatic), then the manual version (depth). Offer the first, deliver the second.</div>

<h4>Drill 2 — Rate limiter (token bucket, thread-safe)</h4>
<pre><code>public final class TokenBucket {
private final double capacity;
private final double refillPerNano;
private final Object lock = new Object();
private double tokens;
private long lastRefillNanos;

public TokenBucket(double capacity, double refillPerSecond) {
if (capacity &lt;= 0 || refillPerSecond &lt;= 0)
throw new IllegalArgumentException("capacity and rate must be positive");
this.capacity = capacity;
this.refillPerNano = refillPerSecond / 1_000_000_000d;
this.tokens = capacity;
this.lastRefillNanos = System.nanoTime();
}

/** @return nanos until the next token is available, or 0 if acquired. */
public long tryAcquire() { return tryAcquire(1); }

public long tryAcquire(int permits) {
if (permits &lt;= 0) throw new IllegalArgumentException("permits must be positive");
synchronized (lock) {
refill();
if (tokens &gt;= permits) {
tokens -= permits;
return 0L;
}
double deficit = permits - tokens;
return (long) Math.ceil(deficit / refillPerNano);
}
}

private void refill() {
long now = System.nanoTime();
long elapsed = now - lastRefillNanos;
if (elapsed &lt;= 0) return;
tokens = Math.min(capacity, tokens + elapsed * refillPerNano);
lastRefillNanos = now;
}
}</code></pre>
<p><b>Design decisions to state aloud:</b></p>
<ul>
<li><b>Lazy refill</b> rather than a background thread — no scheduler, survives GC pauses, cheaper at low QPS.</li>
<li><b><code>System.nanoTime()</code></b> because it's monotonic; <code>currentTimeMillis()</code> can jump backwards on NTP correction and break the bucket.</li>
<li><b>The lock is only held for arithmetic</b> — no I/O, no allocation, no callbacks. Critical section measured in nanoseconds.</li>
<li><b>Returns the wait time</b> rather than blocking — pushes the policy decision to the caller.</li>
</ul>
<p><b>The follow-up you must be ready for:</b> "This is per-instance. If the limit must be global across pods, the bucket state moves to Redis and I'd use a Lua script to make refill-and-decrement atomic — at the cost of a network round trip per acquisition, which I'd amortise by having each instance acquire a batch of tokens and distribute them locally."</p>

<h4>Drill 3 — In-memory ledger with tests</h4>
<pre><code>public final class Ledger {
public record Entry(long id, String type, Instant at, List&lt;Posting&gt; postings) {}
public record Posting(String accountId, long amountMinor, String currency) {}

private final Map&lt;String, Long&gt; balances = new HashMap&lt;&gt;();
private final List&lt;Entry&gt; journal = new ArrayList&lt;&gt;();
private final Set&lt;String&gt; idempotencyKeys = new HashSet&lt;&gt;();
private long nextId = 1;

/** @throws IllegalStateException if the entry does not balance */
public synchronized Entry post(String idempotencyKey, String type, List&lt;Posting&gt; postings) {
Objects.requireNonNull(idempotencyKey);
Objects.requireNonNull(postings);
if (postings.isEmpty()) throw new IllegalArgumentException("no postings");
if (idempotencyKeys.contains(idempotencyKey))
throw new IllegalStateException("duplicate idempotency key: " + idempotencyKey);

// Validate the zero-sum invariant PER CURRENCY
Map&lt;String, Long&gt; sums = new HashMap&lt;&gt;();
for (Posting p : postings)
sums.merge(p.currency(), p.amountMinor(), Long::sum);
for (var e : sums.entrySet())
if (e.getValue() != 0L)
throw new IllegalStateException(
"entry does not balance in " + e.getKey() + ": " + e.getValue());

// Check sufficient funds for any debit
for (Posting p : postings) {
if (p.amountMinor() &lt; 0) {
long current = balances.getOrDefault(p.accountId(), 0L);
if (current + p.amountMinor() &lt; 0)
throw new IllegalStateException(
"insufficient funds in " + p.accountId());
}
}

// Apply
for (Posting p : postings)
balances.merge(p.accountId(), p.amountMinor(), Long::sum);

Entry e = new Entry(nextId++, type, Instant.now(), List.copyOf(postings));
journal.add(e);
idempotencyKeys.add(idempotencyKey);
return e;
}

public synchronized long balance(String accountId) {
return balances.getOrDefault(accountId, 0L);
}

public synchronized List&lt;Entry&gt; journal() { return List.copyOf(journal); }
}

// ---- Tests ----
class LedgerTest {
@Test void transferBalances() {
var l = new Ledger();
l.post("k1", "TRANSFER", List.of(
new Ledger.Posting("alice", -10000, "USD"),
new Ledger.Posting("bob", +10000, "USD")));
assertEquals(-10000, l.balance("alice"));
assertEquals( 10000, l.balance("bob"));
}

@Test void rejectsUnbalancedEntry() {
var l = new Ledger();
assertThrows(IllegalStateException.class, () -&gt; l.post("k1", "BAD", List.of(
new Ledger.Posting("alice", -10000, "USD"),
new Ledger.Posting("bob", +9000, "USD"))));
}

@Test void rejectsDuplicateIdempotencyKey() {
var l = new Ledger();
l.post("k1", "T", List.of(
new Ledger.Posting("a", -100, "USD"),
new Ledger.Posting("b", +100, "USD")));
assertThrows(IllegalStateException.class, () -&gt; l.post("k1", "T", List.of(
new Ledger.Posting("a", -100, "USD"),
new Ledger.Posting("b", +100, "USD"))));
}

@Test void rejectsOverdraft() {
var l = new Ledger();
assertThrows(IllegalStateException.class, () -&gt; l.post("k1", "T", List.of(
new Ledger.Posting("alice", -100, "USD"),
new Ledger.Posting("bob", +100, "USD"))));
}

@Test void multiCurrencyBalancesPerCurrency() {
var l = new Ledger();
l.post("k1", "FX", List.of(
new Ledger.Posting("usdPool", -10000, "USD"),
new Ledger.Posting("eurPool", +9000, "EUR")));
assertEquals(-10000, l.balance("usdPool"));
assertEquals( 9000, l.balance("eurPool"));
}
}</code></pre>
<div class="box o"><div class="t">What this demonstrates</div>
<b>The invariant is enforced in code.</b> The zero-sum check runs on every post, per currency. That's the whole point of a ledger and it's the first thing an interviewer looks for.<br><br>
<b>Idempotency is in the model.</b> The key set, the duplicate rejection. Even in an in-memory implementation, showing you thought about it matters.<br><br>
<b>Overdraft is checked before applying.</b> Not after — you never leave the ledger in an inconsistent state.<br><br>
<b>Tests cover the invariants, not just the happy path.</b> Unbalanced entries, duplicates, overdrafts, multi-currency. That's what "tested" means at this level.</div>

<h4>The 15 problems worth solving</h4>
<div class="grid g2">
<div class="card"><h4>Concurrency &amp; data structures</h4>
<ol>
<li>LRU cache (both ways)</li>
<li>Thread-safe bounded blocking queue</li>
<li>Token bucket rate limiter</li>
<li>Sliding window rate limiter</li>
<li>Consistent hash ring</li>
<li>Thread-safe counter with sharding</li>
<li>Delayed/scheduled task executor</li>
</ol></div>
<div class="card"><h4>Design-flavoured</h4>
<ol start="8">
<li>In-memory double-entry ledger</li>
<li>Idempotency key registry with TTL</li>
<li>In-memory pub/sub with backpressure</li>
<li>Circuit breaker</li>
<li>Retry with exponential backoff + jitter</li>
<li>Payment state machine engine</li>
<li>Connection pool from scratch</li>
<li>Snowflake-style ID generator</li>
</ol></div>
</div>

<h4>Code review round — what to look for</h4>
<ul>
<li><b>Concurrency:</b> shared mutable state, non-atomic check-then-act, missing <code>volatile</code>, lock ordering that could deadlock, locks held across I/O</li>
<li><b>Resources:</b> unclosed streams or connections, missing try-with-resources, ThreadLocal not cleared in a pooled thread</li>
<li><b>Persistence:</b> N+1 queries, missing index on a filter column, unbounded query without pagination, transaction spanning an external call</li>
<li><b>Correctness:</b> floating-point money, off-by-one, null handling, timezone-naive dates, string comparison with <code>==</code></li>
<li><b>Security:</b> SQL built by concatenation, secrets in code, PII in logs, missing authorisation check</li>
<li><b>Design:</b> a class doing three things, a method with seven parameters, a public setter that breaks an invariant</li>
</ul>
<div class="box w"><div class="t">The most common failure at senior level</div>Over-abstraction. Twenty-year veterans sometimes produce <code>AbstractPaymentProcessorFactoryStrategyImpl</code> for a problem that needed three classes. Interviewers read this as "will slow the team down." <b>Start concrete. Add abstraction only when you can name the second concrete case it serves.</b></div>`,

drill:["LRU cache both ways, timed at 20 minutes total. Then write 3 tests.",
"Token bucket with tests, 15 minutes. Then explain the Redis-backed global version in 2 minutes.",
"In-memory ledger with the five tests, 25 minutes. All tests must pass."],

qa:[
["Should I write tests unprompted in a coding round?","Yes, if time allows. Even two or three assertions at the end demonstrate that you think about verification, which is a senior signal. And they take two minutes. If you're short on time, write them as comments: "// then assert balance is -100". What you must not do is skip verification entirely — walking a small example through the code aloud is the minimum, and it's what catches off-by-one errors."],
["How do I handle a coding problem I can't solve?","Say what you'd do even if you can't write it. "I'd use a heap here to get O(log n) insert, but I'm not going to get the implementation right in the time. Let me write the structure and the key method, and talk through the rest." Getting 70% of a solution with clear reasoning beats a complete solution you can't explain. And interviewers would rather see you scope a problem honestly than thrash."],
["What's the right level of abstraction for a 90-minute machine coding round?","Three to five classes. One or two interfaces if there's a genuine second implementation coming. No factories, no builders, no strategy patterns unless you can name the second concrete case. The test is: if you removed the abstraction, would anything be harder? If not, the abstraction is ceremony. Most strong solutions to these problems are 150–250 lines of straightforward code."],
