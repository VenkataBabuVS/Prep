/* ================= WEEK 1 — JAVA & CS FOUNDATIONS ================= */
{d:1,wk:1,prio:"P0",title:"Complexity, Arrays & Sorting in Java",
obj:"Say the Big-O of any loop in under three seconds, and explain why Java ships two different sorts.",
core:`<h4>Big-O — the reflex table</h4>
<table><thead><tr><th>Complexity</th><th>Looks like</th><th>Examples</th></tr></thead><tbody>
<tr><td><b>O(1)</b></td><td>No loop over input</td><td>Array index, hash lookup (avg), push/pop, heap peek</td></tr>
<tr><td><b>O(log n)</b></td><td>Halving each step</td><td>Binary search, balanced tree ops, heap insert</td></tr>
<tr><td><b>O(n)</b></td><td>One pass</td><td>Linear scan, hash build, prefix sum, two pointers</td></tr>
<tr><td><b>O(n log n)</b></td><td>Sort, or n × log</td><td>Comparison sort, heap build + n extracts</td></tr>
<tr><td><b>O(n²)</b></td><td>Nested loop, same input</td><td>Naive pair search, bubble/insertion sort</td></tr>
<tr><td><b>O(2ⁿ)</b></td><td>Two branches per call</td><td>Subsets, naive recursion without memo</td></tr>
</tbody></table>
<p><b>Amortized vs worst case.</b> <code>ArrayList.add</code> is O(1) <em>amortized</em> — a resize is O(n) but happens geometrically (1.5×), so the average is constant. Say "amortized" out loud. It signals you know the difference.</p>

<h4>Java's two sorts — the question that catches people</h4>
<pre><code>int[] a = ...;
Arrays.sort(a); // primitives → dual-pivot QUICKSORT
// O(n log n) avg, O(n²) worst, NOT stable
// no object overhead, no stability needed

String[] s = ...;
Arrays.sort(s); // objects → TimSort
// O(n log n) guaranteed, STABLE
// stable because equal objects must keep order

Collections.sort(list); // delegates to TimSort</code></pre>
<p><b>Why the difference?</b> Primitives have no identity — two <code>5</code>s are indistinguishable, so stability is meaningless and quicksort's lower constant wins. Objects have identity — if you sort orders by date, equal dates must preserve insertion order, so you pay for stability.</p>

<h4>Amortized growth of ArrayList</h4>
<p>Default capacity 10. On overflow: new capacity = <code>old + (old >> 1)</code> = 1.5×. Copying n elements costs O(n), but the sum of all resizes across n adds is O(n), so each add is O(1) amortized. Pre-size with <code>new ArrayList&lt;&gt;(n)</code> when you know n — it eliminates the copies entirely.</p>

<div class="box"><div class="t">The line that lands</div>"ArrayList is 1.5× growth, not 2×, because doubling wastes up to 50% of the array and 1.5× is the empirically good trade-off between wasted memory and copy frequency."</div>

<h4>Space complexity — the part people forget</h4>
<p>Always state it. "O(n) time, O(1) space" beats "O(n) time" every time. Recursion costs O(depth) stack space even if you allocate nothing.</p>`,

drill:["Write out the Big-O for 10 code snippets you remember from your own codebase — no looking up. Then check.",
"Implement a dynamic array from scratch: add, get, remove, with 1.5× growth. Measure the resize count for 1M adds.",
"Time <code>Arrays.sort(int[])</code> vs <code>Arrays.sort(Integer[])</code> on 1M elements. Explain the gap."],

qa:[
["Why is quicksort O(n²) worst case, and why does Java use it anyway?","Worst case is when the pivot is always the min or max — each partition splits into 0 and n-1, giving n levels of O(n) work. Java uses dual-pivot quicksort on primitives because (a) the worst case requires adversarial input which random pivots make vanishingly unlikely, and (b) it has a much lower constant factor than mergesort — no auxiliary array, better cache behaviour."],
["Is <code>ArrayList.get(i)</code> O(1)? Always?","O(1) — direct array index. There is no hashing, no traversal. This is the one operation where ArrayList is unambiguously better than LinkedList."],
["What is the space complexity of merge sort, and why does it matter in Java?","O(n) auxiliary — merge sort needs a temporary array. TimSort optimises this by reusing one buffer and detecting existing runs in real data, which is why it's fast on partially-sorted input (common in practice)."],
["If I call <code>list.add(x)</code> 1 million times into an ArrayList with default capacity, how many array copies happen?","About 30–32. Capacity goes 10 → 15 → 22 → 33 → ... → ~1.1M, which is log base 1.5 of (1M/10) ≈ 32 resizes. Total elements copied ≈ 2× final size, hence O(1) amortized."],
["Why does <code>Collections.sort</code> require a total order?","Because TimSort's merge step relies on transitivity to produce a correct result. An inconsistent comparator (violating transitivity) can throw <code>IllegalArgumentException: Comparison method violates its general contract</code> — a real production bug."]
],
exit:"Say the Big-O of a nested loop, a sort, and a hash lookup out loud in under 10 seconds, then explain Java's dual-sort decision to an imaginary colleague in 60 seconds."},

{d:2,wk:1,prio:"P1",title:"Two Pointers & Sliding Window",
obj:"Recognise these two patterns instantly and write them from memory without off-by-one bugs.",
core:`<h4>How to recognise the pattern</h4>
<ul>
<li><b>Sorted array + find a pair/triplet</b> → two pointers converging.</li>
<li><b>Contiguous subarray/substring + a constraint</b> → sliding window.</li>
<li><b>In-place partition or dedup</b> → two pointers, same direction, different speeds.</li>
</ul>

<h4>Pattern 1 — Converging two pointers</h4>
<pre><code>// Two Sum II on a SORTED array. O(n) time, O(1) space.
int l = 0, r = n - 1;
while (l &lt; r) {
int sum = a[l] + a[r];
if (sum == target) return new int[]{l, r};
if (sum &lt; target) l++; // need bigger → move left pointer right
else r--; // need smaller → move right pointer left
}</code></pre>
<p><b>Why it works:</b> the array is sorted, so moving <code>l</code> right can only increase the sum, and moving <code>r</code> left can only decrease it. Every step eliminates a whole row or column of the pair matrix. That's why it beats the O(n²) brute force.</p>
<p><b>The classic extension — 3Sum:</b> sort, then for each index i, run two pointers on <code>[i+1, n-1]</code> looking for <code>-a[i]</code>. Skip duplicates by checking <code>i &gt; 0 &amp;&amp; a[i] == a[i-1]</code>. O(n²) total.</p>

<h4>Pattern 2 — Sliding window</h4>
<pre><code>// Longest substring without repeating characters. O(n).
int[] last = new int[128];
Arrays.fill(last, -1);
int l = 0, best = 0;
for (int r = 0; r &lt; s.length(); r++) {
char c = s.charAt(r);
if (last[c] &gt;= l) l = last[c] + 1; // shrink past the duplicate
last[c] = r;
best = Math.max(best, r - l + 1);
}</code></pre>
<p><b>The invariant:</b> the window <code>[l, r]</code> is always valid. You expand <code>r</code> every iteration, and shrink <code>l</code> only as much as needed. Because neither pointer ever moves backwards, total work is O(n) — not O(n²).</p>

<h4>The general template</h4>
<pre><code>int l = 0;
for (int r = 0; r &lt; n; r++) {
add(a[r]); // expand
while (!valid()) { // shrink until valid
remove(a[l]);
l++;
}
best = Math.max(best, r - l + 1);
}</code></pre>
<div class="box w"><div class="t">The bug that costs you the round</div>Using <code>while (valid())</code> instead of <code>while (!valid())</code>, or forgetting that <code>l</code> must never exceed <code>r</code>. Also: for "at most K distinct", the shrink condition is <code>distinct &gt; K</code>, not <code>&gt;= K</code>. Read the prompt twice.</div>

<h4>Fixed-size window</h4>
<pre><code>// Max sum of any subarray of size k. O(n).
int sum = 0;
for (int i = 0; i &lt; k; i++) sum += a[i];
int best = sum;
for (int i = k; i &lt; n; i++) {
sum += a[i] - a[i - k]; // slide: add new, drop old
best = Math.max(best, sum);
}</code></pre>
<p>The slide is the whole trick — you never recompute the window sum.</p>`,

"Write 'minimum window substring'. This is the hardest window problem — allow 25 minutes."],

qa:[
["Why is sliding window O(n) and not O(n²) when there's a nested while loop?","Because the inner while loop only ever advances <code>l</code>, and <code>l</code> goes from 0 to n across the entire algorithm. Each element is added once and removed at most once. Total operations ≤ 2n. The nested loop looks quadratic but the amortized cost is linear — this is exactly the kind of reasoning interviewers want to hear."],
["When can you NOT use two pointers on a sorted array?","When you need all pairs, not just one — two pointers finds a single pair efficiently but enumerating all pairs is inherently O(n²). Also, if the array isn't sorted and you can't sort it (e.g. you need original indices and can't afford O(n) extra space), use a hash map instead."],
["For 'minimum window substring', why do you need a separate <code>formed</code> counter instead of comparing maps?","Comparing two maps is O(alphabet size) per iteration, which is fine but noisy. A running counter of how many required characters currently meet their target frequency makes the validity check O(1). It's the difference between O(n·k) and O(n)."],
["What's the difference between 'longest subarray with sum ≤ K' and 'exactly K'?","'≤ K' works with a sliding window because the predicate is monotonic — adding elements only increases the sum. 'Exactly K' is not monotonic with negative numbers, so you need prefix sums plus a hash map. This distinction is a favourite interview probe."],
["Two pointers on a linked list — how does that differ?","Same idea, but you can't index. You keep two node references and advance them by different amounts. For cycle detection, slow moves 1 and fast moves 2; they meet inside the cycle if one exists. To find the cycle start, reset one to head and advance both by 1."]
],
exit:"Write the sliding-window template from memory on paper, then explain to a colleague why the nested loop is still O(n)."},

{d:3,wk:1,prio:"P1",title:"Binary Search (3 Variants) & Fast/Slow Pointers",
obj:"Never write a buggy binary search again. Know when to search the value instead of the array.",
core:`<h4>The three variants — and why mixing them breaks everything</h4>
<pre><code>// VARIANT 1 — exact match. lo &lt;= hi, hi = mid-1 / lo = mid+1
int lo = 0, hi = n - 1;
while (lo &lt;= hi) {
int mid = lo + (hi - lo) / 2; // never (lo+hi)/2 — overflow
if (a[mid] == target) return mid;
if (a[mid] &lt; target) lo = mid + 1;
else hi = mid - 1;
}
return -1;

// VARIANT 2 — lower bound: first index where a[i] &gt;= target
int lo = 0, hi = n; // hi is EXCLUSIVE
while (lo &lt; hi) {
int mid = lo + (hi - lo) / 2;
if (a[mid] &lt; target) lo = mid + 1;
else hi = mid; // keep mid, it might be the answer
}
return lo; // may equal n if all &lt; target

// VARIANT 3 — upper bound: first index where a[i] &gt; target
// same as variant 2 but condition is a[mid] &lt;= target</code></pre>
<div class="box b"><div class="t">The rule</div><b>Variant 1 uses <code>lo &lt;= hi</code> with <code>hi = mid - 1</code>. Variants 2/3 use <code>lo &lt; hi</code> with <code>hi = mid</code>.</b> Mixing them — e.g. <code>lo &lt;= hi</code> with <code>hi = mid</code> — gives an infinite loop. This single sentence prevents 90% of binary search bugs.</div>

<h4>Binary search on the answer — the high-value variant</h4>
<p>If the problem asks for a <b>minimum or maximum value satisfying a monotonic condition</b>, binary search the <i>value</i>, not an array index.</p>
<pre><code>// "Minimum ship capacity to deliver all packages in D days"
int lo = max(packages); // must carry the heaviest
int hi = sum(packages); // one day, one trip
while (lo &lt; hi) {
int mid = lo + (hi - lo) / 2;
if (canShip(packages, mid, D)) hi = mid;
else lo = mid + 1;
}
return lo;</code></pre>
<p><b>Why it's monotonic:</b> if capacity C works, any C' &gt; C also works. That's the precondition. Problems: Koko eating bananas, split array largest sum, minimum days to make bouquets, capacity to ship in D days.</p>

<h4>Fast &amp; slow pointers (Floyd's)</h4>
<pre><code>// Cycle detection
ListNode slow = head, fast = head;
while (fast != null &amp;&amp; fast.next != null) {
slow = slow.next;
fast = fast.next.next;
if (slow == fast) return true;
}
return false;

// Finding the cycle START — the part people forget
// After they meet, reset one pointer to head.
// Advance both by 1. Where they meet again is the cycle entry.
slow = head;
while (slow != fast) { slow = slow.next; fast = fast.next; }
return slow;</code></pre>
<p><b>Why the reset works:</b> if the distance from head to cycle start is <code>a</code>, and from cycle start to the meeting point is <code>b</code>, then the slow pointer travelled <code>a + b</code> and the fast travelled <code>2(a + b)</code>. The difference <code>a + b</code> is a whole number of cycle lengths. So walking <code>a</code> more steps from the meeting point lands on the cycle start — and walking <code>a</code> from head also lands there. That's the proof, and interviewers ask for it.</p>

<h4>Other uses of the two-speed pattern</h4>
<ul>
<li><b>Middle of a linked list:</b> when fast reaches the end, slow is at the middle. For even length, slow lands on the second middle — handle by checking <code>fast.next != null</code>.</li>
<li><b>Happy number:</b> the sequence either reaches 1 or enters a cycle. Floyd's detects the cycle without a HashSet.</li>
<li><b>Find the duplicate number</b> (LeetCode 287): treat the array as a linked list where <code>i → nums[i]</code>. The duplicate is the cycle entry.</li>
</ul>
<div class="box o"><div class="t">Why O(1) space matters</div>The hash-set version is O(n) space and easier. The Floyd's version is O(1) space, which is what the follow-up question always asks for. Know both; offer the O(1) one when asked to optimise.</div>`,

drill:["Implement all three binary search variants. Test each on an empty array, a single element, a target below all, a target above all.",
"Solve 'Koko eating bananas' — binary search on the answer. Time yourself at 20 minutes.",
"Implement cycle detection with start-of-cycle finding on a linked list you build yourself."],

qa:[
["Why <code>mid = lo + (hi - lo) / 2</code> instead of <code>(lo + hi) / 2</code>?","Integer overflow. If lo and hi are both near Integer.MAX_VALUE, their sum wraps to negative and mid becomes negative, giving an ArrayIndexOutOfBounds. The subtraction form never overflows because hi - lo is bounded by the array size."],
["Can you binary search an unsorted array?","Not directly. But you can binary search on a monotonic <em>predicate</em> over a rotated sorted array — that's 'Search in Rotated Sorted Array'. The trick is determining which half is sorted, then checking whether the target lies in that half. The array isn't sorted, but the decision is still binary."],
["When does binary search on the answer apply?","When three things hold: (1) you're looking for a numeric value, not an array index; (2) there's a predicate over candidate values; (3) the predicate is monotonic — once true, it stays true as the value increases (or once false, stays false). If it's non-monotonic, binary search gives a wrong answer silently."],
["Why does the fast/slow reset find the cycle start?","Because the distance from head to cycle start equals the distance from the meeting point to cycle start, measured in the forward direction. Both pointers then advance by 1 per step, so they must meet at the cycle entry. This is the standard Floyd's proof and interviewers do ask for it."],
["What's the space complexity of recursive binary search vs iterative?","Recursive is O(log n) stack space. Iterative is O(1). In an interview, write the iterative version — it's shorter and doesn't need a base case discussion."]
],
exit:"Explain the lower-bound variant to a colleague in 90 seconds, including why <code>hi = mid</code> and not <code>hi = mid - 1</code>."},

{d:4,wk:1,prio:"P0",title:"HashMap Internals — The Complete Picture",
obj:"Explain bucket arrays, treeification, load factor, and resize cost without hesitating.",
core:`<h4>The structure</h4>
<pre><code>Node&lt;K,V&gt;[] table; // array of buckets, length = power of 2
// each bucket: null | single Node | linked list | red-black TreeNode (Java 8+)

int hash(Object key) {
int h = key.hashCode();
return h ^ (h &gt;&gt;&gt; 16); // spread high bits into low bits
}
int index = hash(key) &amp; (table.length - 1); // because length is a power of 2</code></pre>
<p><b>Why <code>&amp; (n-1)</code> instead of <code>% n</code>?</b> Bitwise AND is a single CPU instruction; modulo is a division. The trick only works when n is a power of 2, which is why HashMap always doubles capacity.</p>
<p><b>Why the XOR shift?</b> Without it, only the low bits of the hash determine the index. Keys whose hashCodes differ only in the high bits (common with poorly-designed hashCodes and sequential IDs) would collide constantly. XORing the top 16 bits down makes the index depend on all the bits.</p>

<h4>The numbers that matter</h4>
<table><thead><tr><th>Constant</th><th>Value</th><th>Why</th></tr></thead><tbody>
<tr><td>Initial capacity</td><td>16</td><td>Power of 2, small enough to be cheap</td></tr>
<tr><td>Load factor</td><td>0.75</td><td>Trade-off: lower = fewer collisions but more memory. 0.75 is empirically balanced.</td></tr>
<tr><td>Resize trigger</td><td><code>size &gt; capacity × 0.75</code></td><td>At 16 capacity, resize at 13 elements</td></tr>
<tr><td>Resize factor</td><td>2×</td><td>Keeps capacity a power of 2 for the AND trick</td></tr>
<tr><td>Treeify threshold</td><td>8</td><td>Convert bucket chain to red-black tree</td></tr>
<tr><td>Untreeify threshold</td><td>6</td><td>Convert back below this — hysteresis prevents thrashing</td></tr>
<tr><td>Min capacity for treeify</td><td>64</td><td>Below this, resize instead of treeify — cheaper</td></tr>
</tbody></table>

<h4>Why treeify at 8 specifically?</h4>
<p>Under a good hash function, the number of collisions in a bucket follows a Poisson distribution with λ = 0.5 (since load factor is 0.75 and capacity is a power of 2). The probability of 8 collisions in one bucket is about <b>0.00000006</b>. So treeification is a safety net for pathological hash functions, not a common path. The cost of a tree (more memory, slower for small counts) isn't worth paying until it's clearly needed.</p>

<h4>Resize mechanics</h4>
<p>When the threshold is exceeded, a new table of 2× size is allocated and every entry is rehashed. Because capacity doubles, each element either stays at its current index or moves to <code>index + oldCapacity</code> — determined by a single bit test. This is much cheaper than a full rehash computation.</p>
<pre><code>// Java 8 resize optimization
if ((e.hash &amp; oldCap) == 0) keep in place;
else move to index + oldCap;</code></pre>
<div class="box w"><div class="t">Pre-sizing</div>If you know you'll insert n entries, use <code>new HashMap&lt;&gt;((int)(n / 0.75f) + 1)</code>. This eliminates all resizes and their associated rehashing. For a 1M-entry map, this is the difference between ~20 resizes and zero.</div>

<h4>equals / hashCode — the contract</h4>
<ul>
<li><b>If <code>a.equals(b)</code> then <code>a.hashCode() == b.hashCode()</code>.</b> The reverse is not required — collisions are allowed.</li>
<li>Breaking this silently breaks HashMap. Two "equal" keys land in different buckets and the map contains duplicates.</li>
<li><b>Never use mutable fields in hashCode.</b> If you mutate a key after insertion, its hash changes but its bucket doesn't. The entry becomes unreachable — a memory leak that looks like a lookup bug.</li>
<li>Use <code>Objects.hash(a, b, c)</code> or a record (which generates both correctly).</li>
</ul>

<h4>Thread safety</h4>
<p>HashMap is not thread-safe. Concurrent puts can corrupt the internal structure. Pre-Java 8, this could create a cycle in a bucket's linked list, causing an infinite loop on <code>get</code> — a famously nasty production bug. Modern Java doesn't loop forever, but you still lose updates and can get wrong results. Use <code>ConcurrentHashMap</code>, which uses CAS for empty buckets and locks only the bin head for collisions — far finer granularity than the old segment-based design.</p>`,

drill:["Write a HashMap from scratch: put, get, resize, with linear chaining. No looking at the JDK.",
"Create a class with equals but no hashCode. Put two 'equal' instances in a HashMap. Observe the bug.",
"Create a mutable key, insert it, mutate it, then try to get it. Explain what happened."],

qa:[
["Why is the load factor 0.75 and not 0.5 or 1.0?","It balances two costs. Lower load factor means fewer collisions (faster lookups) but more memory and more frequent resizes. Higher means better memory use but more collisions. 0.75 is the empirically-derived sweet spot, and it also gives the Poisson collision math a nice λ=0.5, which makes 8 collisions vanishingly unlikely."],
["What happens if two keys have the same hashCode but are not equal?","They land in the same bucket. The bucket becomes a linked list (or tree), and <code>equals</code> is used to find the right one within the bucket. Lookup becomes O(k) where k is the chain length — which is why treeification caps the worst case at O(log k)."],
["Why does ConcurrentHashMap forbid null keys and values?","Because in a concurrent context, <code>get</code> returning null is ambiguous — it could mean 'key absent' or 'key present with null value'. In a single-threaded map you can disambiguate with <code>containsKey</code>, but that's a race under concurrency. Forbidding nulls removes the ambiguity entirely."],
["What's the worst-case lookup complexity of HashMap, and how does Java bound it?","Without treeification, O(n) — all keys in one bucket. With treeification at 8 entries (and capacity ≥ 64), it becomes O(log n). This is why a deliberately bad hashCode can no longer be used as a denial-of-service vector (the 'hashDoS' attack that affected pre-Java-8 servers)."],
["How does <code>computeIfAbsent</code> differ from a get-then-put?","<code>computeIfAbsent</code> is atomic — the mapping function runs at most once for a given key under concurrency, and the whole check-and-insert is a single operation. A get-then-put is two operations with a race window: two threads can both see 'absent' and both compute. On ConcurrentHashMap the difference is correctness, not just performance."]
],
exit:"Draw the HashMap structure from memory on paper — bucket array, chain, tree — and annotate every constant (16, 0.75, 8, 6, 64) with why it has that value."},

{d:5,wk:1,prio:"P1",title:"Collections: Lists, Sets, Deques & Choosing Correctly",
obj:"Given any requirement, name the right collection in under five seconds with a justification.",
core:`<h4>The decision table — memorise this</h4>
<table><thead><tr><th>Need</th><th>Use</th><th>Why</th></tr></thead><tbody>
<tr><td>Key → value, no order</td><td><code>HashMap</code></td><td>O(1) average, simplest</td></tr>
<tr><td>Key → value, sorted keys</td><td><code>TreeMap</code></td><td>O(log n) guaranteed, range queries</td></tr>
<tr><td>Key → value, insertion order</td><td><code>LinkedHashMap</code></td><td>Predictable iteration</td></tr>
<tr><td>Key → value, concurrent</td><td><code>ConcurrentHashMap</code></td><td>Lock-free reads, fine-grained writes</td></tr>
<tr><td>Unique elements</td><td><code>HashSet</code></td><td>Backed by HashMap</td></tr>
<tr><td>Unique + sorted</td><td><code>TreeSet</code></td><td>NavigableSet operations</td></tr>
<tr><td>Stack or queue</td><td><code>ArrayDeque</code></td><td>Faster than LinkedList or legacy Stack</td></tr>
<tr><td>Priority ordering</td><td><code>PriorityQueue</code></td><td>O(log n) insert, O(1) peek</td></tr>
<tr><td>Blocking producer/consumer</td><td><code>ArrayBlockingQueue</code></td><td>Bounded — built-in backpressure</td></tr>
<tr><td>Read-heavy, rare writes</td><td><code>CopyOnWriteArrayList</code></td><td>Lock-free iteration over a snapshot</td></tr>
<tr><td>LRU cache</td><td><code>LinkedHashMap</code></td><td>Override <code>removeEldestEntry</code></td></tr>
</tbody></table>

<h4>ArrayList vs LinkedList — the honest answer</h4>
<table><thead><tr><th></th><th>ArrayList</th><th>LinkedList</th></tr></thead><tbody>
<tr><td>get(i)</td><td>O(1)</td><td>O(n)</td></tr>
<tr><td>add(end)</td><td>O(1) amortized</td><td>O(1)</td></tr>
<tr><td>add(0, x)</td><td>O(n) — shift</td><td>O(1) — relink</td></tr>
<tr><td>Memory per element</td><td>~4–8 bytes (reference)</td><td>~24+ bytes (node + 2 pointers)</td></tr>
<tr><td>Cache locality</td><td>Excellent — contiguous</td><td>Poor — scattered nodes</td></tr>
</tbody></table>
<div class="box o"><div class="t">Say this out loud</div>"LinkedList is almost never the right choice in modern Java. ArrayDeque beats it as a queue or stack, and ArrayList beats it as a list, because of cache locality and per-node allocation overhead. The one case where LinkedList wins is frequent insertion at arbitrary positions <em>when you already hold the node reference</em> — which is rare in practice. I've removed LinkedList from codebases far more often than I've added it."</div>

<h4>The LRU trick — LinkedHashMap</h4>
<pre><code>class LRUCache&lt;K,V&gt; extends LinkedHashMap&lt;K,V&gt; {
private final int cap;
LRUCache(int cap) {
super(cap, 0.75f, true); // accessOrder = true ← the key
this.cap = cap;
}
@Override
protected boolean removeEldestEntry(Map.Entry&lt;K,V&gt; eldest) {
return size() &gt; cap;
}
}</code></pre>
<p>With <code>accessOrder=true</code>, every <code>get</code> moves the entry to the tail. The head is therefore the least-recently-used, and <code>removeEldestEntry</code> evicts it automatically. Ten lines for a working LRU.</p>
<p><b>But know the manual version too.</b> The follow-up is always "now do it without LinkedHashMap." That's HashMap + a doubly-linked list, with the map storing node references so removal is O(1).</p>

<h4>PriorityQueue — binary heap in an array</h4>
<ul>
<li><b>Min-heap by default.</b> For max-heap: <code>new PriorityQueue&lt;&gt;(Comparator.reverseOrder())</code>.</li>
<li><b>Not sorted.</b> Only the head is guaranteed to be the minimum. Iterating gives heap order, not sorted order.</li>
<li><b>O(log n)</b> offer/poll, <b>O(1)</b> peek, <b>O(n)</b> contains or remove(arbitrary object).</li>
<li><b>Top-K trick:</b> for the K largest, use a <i>min</i>-heap of size K. Push each element; if size exceeds K, pop the smallest. The heap ends up holding the K largest. O(n log K) time, O(K) space.</li>
</ul>

<h4>Fail-fast vs fail-safe iterators</h4>
<table><thead><tr><th></th><th>Fail-fast</th><th>Fail-safe</th></tr></thead><tbody>
<tr><td>Behaviour on concurrent modification</td><td>Throws <code>ConcurrentModificationException</code></td><td>Iterates a snapshot; no exception</td></tr>
<tr><td>Examples</td><td>ArrayList, HashMap, HashSet</td><td>CopyOnWriteArrayList, ConcurrentHashMap</td></tr>
<tr><td>Mechanism</td><td><code>modCount</code> checked on each <code>next()</code></td><td>Separate snapshot / weakly consistent</td></tr>
<tr><td>Cost</td><td>None</td><td>Snapshot memory, or stale view</td></tr>
</tbody></table>
<pre><code>// WRONG — throws ConcurrentModificationException
for (String s : list) if (s.startsWith("x")) list.remove(s);

// RIGHT — iterator
Iterator&lt;String&gt; it = list.iterator();
while (it.hasNext()) if (it.next().startsWith("x")) it.remove();

// RIGHT — removeIf (Java 8+). Cleanest.
list.removeIf(s -&gt; s.startsWith("x"));</code></pre>

<h4>Four gotchas that appear in interviews</h4>
<ul>
<li><b><code>Arrays.asList(arr)</code></b> returns a fixed-size <i>view</i>. <code>set()</code> works; <code>add()</code>/<code>remove()</code> throw <code>UnsupportedOperationException</code>. Changes to the backing array are reflected.</li>
<li><b><code>List.of(...)</code></b> is truly immutable and rejects nulls. Different from <code>Arrays.asList</code>.</li>
<li><b><code>subList</code> is a view, not a copy.</b> <code>list.subList(1,4).clear()</code> removes those elements from the original. Use <code>new ArrayList&lt;&gt;(list.subList(1,4))</code> for a copy.</li>
<li><b>Array covariance:</b> <code>Object[] o = new String[1]; o[0] = 42;</code> compiles but throws <code>ArrayStoreException</code> at runtime. Generics fixed this by being invariant.</li>
</ul>`,

drill:["Implement LRU cache both ways: LinkedHashMap subclass, then HashMap + doubly-linked list.",
"Solve 'Top K Frequent Elements' with a min-heap. Then solve it with bucket sort for O(n).",
"Write code that throws ConcurrentModificationException, then fix it three different ways."],

qa:[
["Why is ArrayDeque better than Stack and LinkedList for stack/queue use?","<code>Stack</code> is legacy, extends Vector, and synchronizes every operation — unnecessary overhead. <code>LinkedList</code> allocates a node per element with two pointers, destroying cache locality. <code>ArrayDeque</code> is a circular array — contiguous memory, O(1) amortized at both ends, no per-element allocation. It's the default choice for both stacks and queues."],
["CopyOnWriteArrayList — when is it the right choice?","When reads vastly outnumber writes and iteration must never fail. Every write copies the entire backing array, so writes are O(n). Read-heavy configurations, listener registries, and small collections of observers are the canonical use cases. For anything write-heavy it's catastrophic."],
["How does TreeMap give you range queries?","It's a red-black tree, so keys are in sorted order. <code>subMap(from, to)</code>, <code>headMap</code>, <code>tailMap</code>, <code>floorKey</code>, <code>ceilingKey</code> all work in O(log n). This is why you'd pick it over HashMap — not the lookup time, the ordering operations."],
["What's the time complexity of <code>PriorityQueue.remove(Object)</code> and why?","O(n). It has to find the element first (linear scan, since there's no index), then sift to restore heap order (O(log n)). This is why you should never use a PriorityQueue if you need arbitrary removal — use a TreeSet or a custom indexed heap instead."],
["Why does HashSet use hashCode for lookup but TreeSet uses compareTo?","Because they're backed by different structures. HashSet is backed by HashMap (hash-based), so it uses hashCode/equals. TreeSet is backed by TreeMap (red-black tree), so it uses the comparator. Consequence: a TreeSet considers two elements equal if <code>compareTo</code> returns 0, <em>even if <code>equals</code> returns false</em>. That inconsistency causes real bugs."]
],
exit:"Given five different requirements read aloud, name the right collection and justify it in one sentence each — under 60 seconds total."},

{d:6,wk:1,prio:"P0",title:"Java Core: equals/hashCode, Generics & PECS",
obj:"Explain type erasure, PECS, and the equals contract without notes.",
core:`<h4>Type erasure — the fundamental fact</h4>
<p>Generics are a <b>compile-time</b> concept. At runtime, <code>List&lt;String&gt;</code> and <code>List&lt;Integer&gt;</code> are both just <code>List</code>. The type parameter is erased and replaced with <code>Object</code> (or the bound).</p>
<p><b>Consequences you must be able to recite:</b></p>
<ul>
<li>You cannot do <code>new T()</code>, <code>new T[]</code>, or <code>instanceof T</code>.</li>
<li>You cannot overload on generic type: <code>foo(List&lt;String&gt;)</code> and <code>foo(List&lt;Integer&gt;)</code> have the same erasure and won't compile.</li>
<li>Static fields cannot reference the class's type parameter.</li>
<li>Heap pollution is possible via raw types or unchecked casts.</li>
<li>Bridge methods are generated by the compiler to preserve polymorphism — that's why <code>getClass().getDeclaredMethods()</code> shows synthetic methods.</li>
</ul>

<h4>PECS — Producer Extends, Consumer Super</h4>
<pre><code>// src is a PRODUCER of T → ? extends T (you read from it)
// dest is a CONSUMER of T → ? super T (you write to it)
static &lt;T&gt; void copy(List&lt;? extends T&gt; src, List&lt;? super T&gt; dest) {
for (T t : src) dest.add(t);
}</code></pre>
<p><b>Why the restriction?</b> With <code>List&lt;? extends Number&gt;</code>, you know every element <i>is a</i> Number, so reading gives you a Number. But you can't add — the actual list might be <code>List&lt;Integer&gt;</code>, and adding a <code>Double</code> would corrupt it. With <code>List&lt;? super Integer&gt;</code>, the actual list is <code>List&lt;Integer&gt;</code> or <code>List&lt;Number&gt;</code> or <code>List&lt;Object&gt;</code> — all of which accept an Integer. So writing is safe; reading only gives Object.</p>
<div class="box"><div class="t">The mnemonic, stated properly</div><b>Producer Extends, Consumer Super.</b> If a parameter produces values you read, use <code>? extends</code>. If it consumes values you write, use <code>? super</code>. If it does both, use an exact type — no wildcard.</div>

<h4>equals / hashCode — the five rules</h4>
<ol>
<li><b>Reflexive:</b> <code>x.equals(x)</code> is true.</li>
<li><b>Symmetric:</b> <code>x.equals(y)</code> iff <code>y.equals(x)</code>.</li>
<li><b>Transitive:</b> x=y and y=z implies x=z.</li>
<li><b>Consistent:</b> repeated calls give the same result if no state changed.</li>
<li><b>Null-safe:</b> <code>x.equals(null)</code> is false, never throws.</li>
</ol>
<p>Plus: <b>equal objects must have equal hash codes.</b> The reverse is not required.</p>

<h4>The three classic violations</h4>
<ul>
<li><b>Overriding equals without hashCode.</b> Two "equal" objects get different hashes and land in different buckets. The map silently contains duplicates.</li>
<li><b>Mutable fields in hashCode.</b> Insert into a HashMap, mutate the key, and the entry becomes unreachable. Looks like a lookup bug; is actually a design bug.</li>
<li><b>Inheritance breaking symmetry.</b> The Effective Java <code>Point</code>/<code>ColorPoint</code> example: <code>point.equals(colorPoint)</code> is true but <code>colorPoint.equals(point)</code> is false. Fix: use <code>getClass()</code> instead of <code>instanceof</code> in equals, or prefer composition over inheritance.</li>
</ul>

<h4>Records give you all of this for free</h4>
<pre><code>public record Money(BigDecimal amount, Currency currency) {
public Money { // compact constructor
Objects.requireNonNull(amount);
Objects.requireNonNull(currency);
if (amount.scale() &gt; currency.getDefaultFractionDigits())
throw new IllegalArgumentException("scale too high for " + currency);
amount = amount.setScale(currency.getDefaultFractionDigits(),
RoundingMode.HALF_EVEN);
}
}</code></pre>
<p>The compiler generates the canonical constructor, accessors, <code>equals</code>, <code>hashCode</code>, and <code>toString</code> — all correct. Records are implicitly final and cannot have instance fields beyond the components.</p>

<h4>Comparable vs Comparator</h4>
<ul>
<li><code>Comparable&lt;T&gt;</code> — natural ordering, one per class, <code>compareTo</code>.</li>
<li><code>Comparator&lt;T&gt;</code> — external ordering, many possible, composable with <code>.thenComparing()</code>.</li>
<li><b>Never use subtraction</b> in compareTo: <code>a - b</code> overflows for large ints. Use <code>Integer.compare(a, b)</code>.</li>
<li><b>Inconsistency warning:</b> "strongly recommended but not required" that compareTo be consistent with equals. TreeMap/TreeSet use compareTo only — inconsistent ordering causes subtle bugs.</li>
</ul>`,

drill:["Write a Point class with equals and hashCode. Then write ColorPoint extending it and demonstrate the symmetry violation. Then fix it.",
"Implement a generic <code>max(List&lt;? extends Comparable&lt;? super T&gt;&gt;)</code> — work out why the wildcards are where they are.",
"Take a record with a validation rule and write the compact constructor. Test that invalid input throws."],

qa:[
["Why can't you create a generic array in Java?","Because arrays are covariant and reified (they know their component type at runtime), while generics are invariant and erased. If <code>new T[10]</code> were allowed, the runtime couldn't check what was being stored, and you could put a String into what was declared as an Integer array. The workaround is to use a <code>List&lt;T&gt;</code> or pass a <code>Class&lt;T&gt;</code> token and use <code>Array.newInstance</code>."],
["What is a bridge method and why does it exist?","When a class implements a generic interface with a concrete type, the compiler generates a synthetic bridge method that accepts the erased type (Object) and delegates to the concrete one. This preserves polymorphism at the bytecode level. You never call it directly, but you'll see it in stack traces and reflection output."],
["Why is <code>List&lt;Object&gt;</code> not a supertype of <code>List&lt;String&gt;</code>?","Because generics are invariant. If it were allowed, you could add an Integer to a <code>List&lt;Object&gt;</code> that was actually a <code>List&lt;String&gt;</code>, corrupting it. The wildcard <code>List&lt;? extends Object&gt;</code> gives you the read-only covariance safely."],
["When should you use <code>Objects.hash()</code> vs a manual hashCode?","<code>Objects.hash(a, b, c)</code> is convenient and correct but allocates a varargs array and autoboxes — measurably slower in hot paths. For a class used heavily as a map key, write it manually with a prime multiplier: <code>int result = 31 * a + b</code>. 31 is chosen because it's an odd prime and <code>31 * x</code> can be optimised to <code>(x &lt;&lt; 5) - x</code>."],
["Can a record implement an interface?","Yes. Records can implement interfaces, add static methods, add instance methods, and have compact constructors. They cannot extend a class (they already extend <code>java.lang.Record</code>) and cannot have additional instance fields."]
],
exit:"Explain PECS to a colleague in 60 seconds with a concrete example of why <code>? extends</code> can't be written to."},

<p>Six days of input without retrieval produces the illusion of knowledge. Today is pure retrieval. You will find gaps. That is the point.</p>

<div class="box b"><div class="t">Rule for the day</div>Any topic scored 0 or 1 gets 30 minutes today. Any topic scored 2 gets 10 minutes of flash review. Scored 3 means leave it alone — you'll revisit it in the Week 4 and Week 8 integration days.</div>

<h4>Retrieval drills (do these before checking any answer)</h4>
<ol>
<li>Write the sliding window template from a blank page. 3 minutes.</li>
<li>Write binary search lower-bound. 3 minutes. Test it mentally on <code>[1,2,4,4,5]</code> looking for 4 — you should get index 2.</li>
<li>Write Floyd's cycle detection including finding the start. 5 minutes.</li>
<li>Write an LRU cache with HashMap + doubly-linked list. 20 minutes.</li>
<li>Write a HashMap put/get/resize from scratch. 25 minutes. This is the hardest and the most valuable.</li>
</ol>

<h4>The one-line answers you must have ready</h4>
<ul>
<li><b>"Why is HashMap lookup O(1)?"</b> — Hash the key, spread high bits, mask to an index (power-of-2 trick), then compare at most a few entries in that bucket. Amortized constant because the load factor keeps chains short.</li>
<li><b>"What's the worst case?"</b> — O(log n) with treeification, O(n) without. Bounded by the red-black tree conversion at 8 collisions.</li>
<li><b>"Why not use LinkedList?"</b> — Cache locality and per-node allocation. ArrayDeque beats it for queue/stack; ArrayList beats it for list.</li>
<li><b>"When does binary search on the answer apply?"</b> — Numeric answer + monotonic predicate. If the predicate isn't monotonic, it silently gives the wrong answer.</li>
</ul>

<div class="box o"><div class="t">End of Week 1 checkpoint</div>If you scored 2+ on at least 9 of the 12 topics, proceed to Week 2. If you scored 0–1 on more than four, spend tomorrow morning re-doing the weak days rather than starting new material. Foundation debt compounds.</div>`,

qa:[
["How would you decide between a HashMap and a TreeMap in a real system?","Not by lookup speed — the difference between O(1) and O(log n) is negligible for realistic sizes. Decide by whether you need ordering: range queries, floor/ceiling lookups, or sorted iteration. If you need any of those, TreeMap. If you need a stable iteration order for debugging or serialization, LinkedHashMap. Otherwise HashMap."],
["You need a cache with 10,000 entries, LRU eviction, and concurrent access. What do you build?","Not a synchronized LinkedHashMap — that serializes all reads. I'd use ConcurrentHashMap plus a separate concurrent structure to track access order, or a Caffeine cache which handles this properly with a W-TinyLFU policy. If I had to build it, I'd shard the LRU into N segments, each independently locked, accepting that eviction is approximate rather than globally perfect. That's the standard trade-off — exact LRU under concurrency requires a global lock, which defeats the purpose."],
["Why does the sliding window template use a while loop for shrinking rather than an if?","Because a single new element can violate the constraint by more than one unit. For 'at most K distinct', adding a new character could require removing several characters before you drop below the limit. An <code>if</code> would only shrink once and leave the window invalid — the bug is silent and gives a wrong answer on specific inputs."],
["What's the difference between an interface and an abstract class, and when do you choose which?","Interfaces define a contract with no state and support multiple inheritance of type. Abstract classes can hold state and provide partial implementation, but single inheritance only. Choose an interface when you're defining capability (Comparable, Runnable). Choose an abstract class when you have shared state and template-method logic. Modern Java favours interfaces with default methods, which gets you most of the benefit without the inheritance constraint."]
],
exit:"Write a HashMap from scratch — put, get, resize — in 25 minutes without reference. If you can, Week 1 is genuinely done."},

{d:8,wk:2,prio:"P1",title:"BFS & DFS — Graphs and Grids",
obj:"Recognise graph problems and pick BFS vs DFS correctly, every time.",
core:`<h4>The selection rule</h4>
<table><thead><tr><th>Question asks for</th><th>Use</th><th>Why</th></tr></thead><tbody>
<tr><td>Shortest path, unweighted</td><td>BFS</td><td>Explores level by level; first arrival is shortest</td></tr>
<tr><td>Minimum steps / minimum moves</td><td>BFS</td><td>Same reason</td></tr>
<tr><td>Level-order anything</td><td>BFS</td><td>Natural fit</td></tr>
<tr><td>Any path / existence</td><td>DFS</td><td>Simpler, less memory on deep graphs</td></tr>
<tr><td>All paths / enumerate</td><td>DFS + backtracking</td><td>Need to undo choices</td></tr>
<tr><td>Cycle detection</td><td>DFS</td><td>Track recursion stack, or colours</td></tr>
<tr><td>Topological sort</td><td>DFS post-order, or BFS (Kahn)</td><td>Both work</td></tr>
<tr><td>Connected components</td><td>Either</td><td>Both O(V+E)</td></tr>
</tbody></table>

<h4>BFS template</h4>
<pre><code>int bfs(Node start, Node target) {
Queue&lt;Node&gt; q = new ArrayDeque&lt;&gt;();
Set&lt;Node&gt; seen = new HashSet&lt;&gt;();
q.offer(start);
seen.add(start);
int steps = 0;

while (!q.isEmpty()) {
int levelSize = q.size(); // ← capture BEFORE the inner loop
for (int i = 0; i &lt; levelSize; i++) {
Node cur = q.poll();
if (cur.equals(target)) return steps;
for (Node next : cur.neighbors()) {
if (seen.add(next)) q.offer(next); // add returns false if present
}
}
steps++;
}
return -1;
}</code></pre>
<div class="box w"><div class="t">The bug</div>Not capturing <code>q.size()</code> before the inner loop. If you write <code>for (int i = 0; i &lt; q.size(); i++)</code>, the size changes as you enqueue and you process the wrong number of nodes per level. Level counting becomes wrong, and step counts are off. This is the single most common BFS bug.</div>

<h4>Grid BFS — the pattern for "minimum steps in a maze"</h4>
<pre><code>int[][] DIRS = {{0,1},{0,-1},{1,0},{-1,0}};
Queue&lt;int[]&gt; q = new ArrayDeque&lt;&gt;();
boolean[][] seen = new boolean[R][C];
q.offer(new int[]{sr, sc});
seen[sr][sc] = true;
int dist = 0;

while (!q.isEmpty()) {
int sz = q.size();
for (int i = 0; i &lt; sz; i++) {
int[] cur = q.poll();
if (cur[0] == tr &amp;&amp; cur[1] == tc) return dist;
for (int[] d : DIRS) {
int nr = cur[0] + d[0], nc = cur[1] + d[1];
if (nr &lt; 0 || nr &gt;= R || nc &lt; 0 || nc &gt;= C) continue;
if (grid[nr][nc] == WALL || seen[nr][nc]) continue;
seen[nr][nc] = true;
q.offer(new int[]{nr, nc});
}
}
dist++;
}</code></pre>
<p><b>Mark seen when you enqueue, not when you dequeue.</b> If you mark on dequeue, the same node can be enqueued multiple times before it's processed — blowing up the queue size and, in some problems, giving wrong distances.</p>

<h4>DFS — recursive</h4>
<pre><code>void dfs(Node node, Set&lt;Node&gt; seen) {
if (!seen.add(node)) return; // add returns false if already present
// process node
for (Node next : node.neighbors()) dfs(next, seen);
}</code></pre>
<p><b>Recursion depth is a real constraint.</b> A graph with 100,000 nodes in a chain will blow the stack. For large inputs, use an explicit stack:</p>
<pre><code>Deque&lt;Node&gt; stack = new ArrayDeque&lt;&gt;();
stack.push(start);
Set&lt;Node&gt; seen = new HashSet&lt;&gt;();
while (!stack.isEmpty()) {
Node cur = stack.pop();
if (!seen.add(cur)) continue;
// process
for (Node next : cur.neighbors()) stack.push(next);
}</code></pre>
<p>Note: iterative DFS with a stack does not visit in the same order as recursive DFS unless you reverse the push order.</p>

<h4>Cycle detection — undirected vs directed</h4>
<pre><code>// UNDIRECTED: track parent. If you reach a visited node that isn't your parent, cycle.
boolean hasCycle(int v, int parent, List&lt;List&lt;Integer&gt;&gt; adj, boolean[] seen) {
seen[v] = true;
for (int next : adj.get(v)) {
if (!seen[next]) { if (hasCycle(next, v, adj, seen)) return true; }
else if (next != parent) return true;
}
return false;
}

// DIRECTED: three-colour DFS — white/gray/black
// gray = on the current recursion stack. Reaching a gray node = back edge = cycle.
boolean hasCycleDirected(int v, int[] color, List&lt;List&lt;Integer&gt;&gt; adj) {
color[v] = 1; // gray
for (int next : adj.get(v)) {
if (color[next] == 1) return true; // back edge
if (color[next] == 0 &amp;&amp; hasCycleDirected(next, color, adj)) return true;
}
color[v] = 2; // black
return false;
}</code></pre>
<div class="box b"><div class="t">Why parent-tracking fails on directed graphs</div>In a directed graph, reaching an already-visited node is not necessarily a cycle — it could be a diamond (A→B, A→C, B→D, C→D). D is visited twice but there's no cycle. Only a node on the <em>current recursion stack</em> indicates a cycle. This is exactly why the three-colour method exists, and interviewers ask about it.</div>

<h4>Connected components</h4>
<pre><code>int count = 0;
boolean[] seen = new boolean[n];
for (int i = 0; i &lt; n; i++) {
if (!seen[i]) { count++; dfs(i, seen, adj); }
}
return count;</code></pre>`,

drill:["Number of Islands — solve it with BFS and with DFS. Compare the code.",
"Word Ladder — pure BFS with a HashSet. 25 minutes.",
"Detect a cycle in a directed graph using three-colour DFS. Then explain why parent-tracking fails."],

qa:[
["Why does BFS give the shortest path in an unweighted graph?","Because it explores nodes in non-decreasing order of distance from the source. All nodes at distance d are processed before any node at distance d+1. So the first time you reach a node, it's via a shortest path. This property breaks the moment edges have different weights — then you need Dijkstra."],
["What's the space complexity of BFS vs DFS?","BFS is O(V) for the queue, but the frontier can be as wide as the graph — for a grid, O(min(R,C)) is common but worst case is O(R·C). DFS is O(V) for the recursion stack, but in practice it's O(depth), which for a deep narrow graph is also O(V). Neither strictly dominates. BFS usually uses more memory on wide graphs; DFS risks stack overflow on deep ones."],
["How do you reconstruct the actual path, not just the distance?","Keep a <code>parent</code> map. When you discover a neighbour, record <code>parent[next] = cur</code>. When you reach the target, walk backwards from target to start using the parent map and reverse. This works for BFS (gives shortest path) and DFS (gives some path, not necessarily shortest)."],
["Why mark nodes as seen when enqueuing rather than dequeuing?","If you mark on dequeue, a node can be enqueued multiple times before it's first processed. In a dense graph this can multiply the queue size dramatically, and in problems where you track distance, you might record a longer distance before the shorter one is processed. Marking on enqueue prevents duplicates entirely."],
["Topological sort — Kahn's algorithm vs DFS post-order. Which do you prefer?","Kahn's is easier to explain and detect cycles with (if the output has fewer than n nodes, there's a cycle). DFS post-order is shorter code but needs the three-colour cycle check separately. In an interview I'd write Kahn's — it's more obviously correct and the cycle detection falls out for free."]
],
exit:"Explain to a colleague why BFS finds shortest paths but DFS doesn't, and why parent-tracking is wrong for directed-graph cycle detection."},

{d:9,wk:2,prio:"P1",title:"Backtracking — Generate, Validate, Undo",
obj:"Write any backtracking solution from the template and never forget the undo.",
core:`<h4>The template — commit this to memory</h4>
<pre><code>void backtrack(State state, List&lt;Result&gt; out) {
if (isComplete(state)) {
out.add(snapshot(state)); // MUST copy, not reference
return;
}
for (Choice c : choices(state)) {
if (!isValid(state, c)) continue;
apply(state, c); // make the choice
backtrack(state, out); // recurse
undo(state, c); // ← THE LINE PEOPLE FORGET
}
}</code></pre>
<div class="box b"><div class="t">The two bugs that kill backtracking solutions</div>
<b>1. Forgetting the undo.</b> State accumulates and results are wrong. There's no compile error, no exception — just a wrong answer on specific inputs.<br>
<b>2. Adding a reference instead of a copy.</b> <code>out.add(currentList)</code> adds a live reference; every subsequent mutation changes every stored result. You must add <code>new ArrayList&lt;&gt;(currentList)</code>.</div>

<h4>Problem 1 — Subsets (the simplest case)</h4>
<pre><code>void subsets(int[] nums, int i, List&lt;Integer&gt; cur, List&lt;List&lt;Integer&gt;&gt; out) {
if (i == nums.length) { out.add(new ArrayList&lt;&gt;(cur)); return; }

// exclude nums[i]
subsets(nums, i + 1, cur, out);

// include nums[i]
cur.add(nums[i]);
subsets(nums, i + 1, cur, out);
cur.remove(cur.size() - 1); // undo
}</code></pre>
<p><b>Complexity:</b> 2ⁿ subsets, each copied in O(n) → O(n·2ⁿ) time, O(n) recursion depth.</p>

<h4>Problem 2 — Permutations (with a used[] array)</h4>
<pre><code>void permute(int[] nums, boolean[] used, List&lt;Integer&gt; cur, List&lt;List&lt;Integer&gt;&gt; out) {
if (cur.size() == nums.length) { out.add(new ArrayList&lt;&gt;(cur)); return; }
for (int i = 0; i &lt; nums.length; i++) {
if (used[i]) continue;
used[i] = true;
cur.add(nums[i]);
permute(nums, used, cur, out);
cur.remove(cur.size() - 1);
used[i] = false; // undo
}
}</code></pre>
<p><b>Complexity:</b> n! permutations × O(n) copy = O(n·n!).</p>

<h4>Problem 3 — Combination Sum (with pruning)</h4>
<pre><code>void combSum(int[] cand, int start, int remain, List&lt;Integer&gt; cur, List&lt;List&lt;Integer&gt;&gt; out) {
if (remain == 0) { out.add(new ArrayList&lt;&gt;(cur)); return; }
for (int i = start; i &lt; cand.length; i++) {
if (cand[i] &gt; remain) break; // PRUNE — requires sorted input
cur.add(cand[i]);
combSum(cand, i, remain - cand[i], cur, out); // i, not i+1 → reuse allowed
cur.remove(cur.size() - 1);
}
}</code></pre>
<p><b>Two key decisions:</b> passing <code>i</code> (not <code>i+1</code>) allows reuse of the same element. Passing <code>start</code> prevents duplicate combinations in different orders. Getting these wrong is the difference between correct and exponential-blowup.</p>

<h4>Problem 4 — Duplicate handling (Subsets II)</h4>
<pre><code>Arrays.sort(nums); // must sort first
void subsetsWithDup(int[] nums, int start, List&lt;Integer&gt; cur, List&lt;List&lt;Integer&gt;&gt; out) {
out.add(new ArrayList&lt;&gt;(cur));
for (int i = start; i &lt; nums.length; i++) {
if (i &gt; start &amp;&amp; nums[i] == nums[i - 1]) continue; // skip duplicate at this level
cur.add(nums[i]);
subsetsWithDup(nums, i + 1, cur, out);
cur.remove(cur.size() - 1);
}
}</code></pre>
<div class="box"><div class="t">The duplicate-skip rule, stated precisely</div><code>if (i &gt; start &amp;&amp; nums[i] == nums[i-1]) continue;</code><br><br>The <code>i &gt; start</code> is what makes it work. It allows the <em>first</em> occurrence at each level but skips subsequent duplicates. Without <code>i &gt; start</code>, you'd skip valid branches. This exact line appears in every duplicate-handling backtracking problem.</div>

<h4>Problem 5 — N-Queens (the classic)</h4>
<pre><code>void solve(int row, int n, int[] cols, List&lt;List&lt;String&gt;&gt; out) {
if (row == n) { out.add(buildBoard(cols, n)); return; }
for (int c = 0; c &lt; n; c++) {
if (isSafe(cols, row, c)) {
cols[row] = c;
solve(row + 1, n, cols, out);
cols[row] = -1; // undo
}
}
}
boolean isSafe(int[] cols, int row, int col) {
for (int r = 0; r &lt; row; r++) {
if (cols[r] == col) return false; // same column
if (Math.abs(cols[r] - col) == Math.abs(r - row)) return false; // diagonal
}
return true;
}</code></pre>
<p>Using <code>int[] cols</code> instead of a board is the key insight — you only need to know which column each row's queen is in. The diagonal check reduces to <code>|Δcol| == |Δrow|</code>.</p>

<h4>Pruning — where the real speed comes from</h4>
<p>Naive backtracking explores the full search tree. Pruning cuts branches early:</p>
<ul>
<li><b>Sort first</b> so you can break when a value exceeds a limit (as in Combination Sum).</li>
<li><b>Maintain a running sum</b> instead of recomputing.</li>
<li><b>Check validity before recursing</b>, not after.</li>
<li><b>Use bitmasks</b> for used-set tracking when n is small — replaces an array with an int.</li>
</ul>`,

drill:["Subsets, Permutations, Combination Sum — all three from memory. No reference.",
"Subsets II with duplicate skipping. Test on [1,2,2] — you should get 6 subsets, not 8.",
"N-Queens for n=8. Time it. It should complete in well under a second."],

qa:[
["Why is the copy <code>new ArrayList&lt;&gt;(cur)</code> necessary?","Because <code>cur</code> is a mutable object that you continue to modify after the recursive call returns. If you add the reference, every stored result points to the same list, and by the end of the recursion all of them reflect the final (empty) state. This is a silent bug — no exception, just wrong output."],
["What's the time complexity of generating all permutations, and why?","O(n × n!). There are n! permutations, and copying each one into the output list takes O(n). The recursion tree itself has n! leaves. If you're asked for the count only, it's O(n!) without the n factor."],
["How does <code>if (i &gt; start &amp;&amp; nums[i] == nums[i-1]) continue;</code> actually prevent duplicates?","After sorting, equal elements are adjacent. At each recursion level, you're choosing which element to place at position <code>start</code>. If you've already tried element <code>nums[i-1]</code> at this level and <code>nums[i]</code> equals it, choosing it produces an identical subtree. The <code>i &gt; start</code> guard ensures you still allow the first occurrence — otherwise you'd skip the element entirely and lose valid combinations."],
["When would you use bitmask DP instead of array-based backtracking?","When n is small (typically ≤ 20) and you're tracking a subset. A bitmask replaces a boolean array with a single int, which is faster and makes memoisation trivial — the mask is the DP state. Classic examples: Travelling Salesman (n ≤ 20), 'partition into K equal subsets', 'maximum students taking exam'. If n &gt; 20, the 2ⁿ states become infeasible and you need a different approach."],
["Why does sorting help backtracking beyond just duplicate handling?","It enables early termination. In Combination Sum, once <code>cand[i] &gt; remain</code>, every subsequent candidate is also too large, so you <code>break</code> instead of <code>continue</code>. That prunes an entire subtree. Without sorting you'd have to check every remaining candidate individually."]
],
exit:"Write Subsets II from a blank page in 10 minutes, and explain the duplicate-skip line to a colleague in 60 seconds."},

{d:10,wk:2,prio:"P1",title:"Dynamic Programming I — 1D & Knapsack",
obj:"Apply the 4-step DP method to any 1D problem without guessing.",
core:`<h4>The 4-step method — always in this order</h4>
<ol>
<li><b>Define the state.</b> What does <code>dp[i]</code> mean? Write it as a complete sentence. If you can't, you don't understand the problem yet.</li>
<li><b>Write the recurrence.</b> How does <code>dp[i]</code> relate to smaller states?</li>
<li><b>Base cases.</b> The smallest inputs where the answer is obvious.</li>
<li><b>Order of computation.</b> Make sure dependencies are computed first. Then optimise space if possible.</li>
</ol>
<div class="box"><div class="t">The sentence test</div>If your state definition is "dp[i] is the answer up to i", it's too vague. It must be precise: "<b>dp[i] is the length of the longest increasing subsequence ending exactly at index i</b>." That precision is what makes the recurrence obvious.</div>

<h4>Problem 1 — Climbing Stairs (the hello world)</h4>
<pre><code>// dp[i] = number of ways to reach step i
// dp[i] = dp[i-1] + dp[i-2] (you came from one step or two steps back)
// dp[0] = 1, dp[1] = 1
int climb(int n) {
if (n &lt;= 1) return 1;
int prev2 = 1, prev1 = 1;
for (int i = 2; i &lt;= n; i++) {
int cur = prev1 + prev2;
prev2 = prev1;
prev1 = cur;
}
return prev1;
}</code></pre>
<p><b>Space optimisation:</b> only two previous values are needed, so O(n) becomes O(1). Interviewers always ask this follow-up.</p>

<h4>Problem 2 — House Robber</h4>
<pre><code>// dp[i] = max money robbing houses 0..i
// dp[i] = max(dp[i-1], // skip house i
// dp[i-2] + nums[i]) // rob house i
int rob(int[] nums) {
int prev2 = 0, prev1 = 0;
for (int n : nums) {
int cur = Math.max(prev1, prev2 + n);
prev2 = prev1;
prev1 = cur;
}
return prev1;
}</code></pre>
<p><b>Why not greedy?</b> Because robbing the biggest house first can block two medium houses. Greedy is locally optimal, not globally. This is the classic "greedy fails, DP wins" example — interviewers love it.</p>

<h4>Problem 3 — Coin Change (unbounded knapsack)</h4>
<pre><code>// dp[a] = minimum coins to make amount a
// dp[a] = min over all coins c of (dp[a - c] + 1)
int coinChange(int[] coins, int amount) {
int[] dp = new int[amount + 1];
Arrays.fill(dp, amount + 1); // "infinity" — amount+1 is unreachable
dp[0] = 0;
for (int a = 1; a &lt;= amount; a++) {
for (int c : coins) {
if (c &lt;= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);
}
}
return dp[amount] &gt; amount ? -1 : dp[amount];
}</code></pre>
<p><b>The loop order matters.</b> Outer loop over amounts, inner over coins, gives <i>unbounded</i> knapsack (coins reusable). Swapping the loops gives <i>0/1</i> knapsack (each coin used once). This is the single most important structural fact about knapsack DP.</p>

<h4>Problem 4 — 0/1 Knapsack (the canonical form)</h4>
<pre><code>// dp[i][w] = max value using first i items with capacity w
// dp[i][w] = max(dp[i-1][w], // skip item i
// dp[i-1][w - wt[i]] + val[i]) // take item i (if it fits)
int knapsack(int[] wt, int[] val, int W) {
int n = wt.length;
int[][] dp = new int[n + 1][W + 1];
for (int i = 1; i &lt;= n; i++) {
for (int w = 0; w &lt;= W; w++) {
dp[i][w] = dp[i-1][w];
if (wt[i-1] &lt;= w)
dp[i][w] = Math.max(dp[i][w], dp[i-1][w - wt[i-1]] + val[i-1]);
}
}
return dp[n][W];
}</code></pre>
<p><b>Space optimisation to 1D — and the backwards loop:</b></p>
<pre><code>int[] dp = new int[W + 1];
for (int i = 0; i &lt; n; i++) {
for (int w = W; w &gt;= wt[i]; w--) { // ← BACKWARDS for 0/1
dp[w] = Math.max(dp[w], dp[w - wt[i]] + val[i]);
}
}
return dp[W];</code></pre>
<div class="box b"><div class="t">Why backwards?</div>Going backwards ensures each item is used at most once. When you compute <code>dp[w]</code>, <code>dp[w - wt[i]]</code> still refers to the state <em>before</em> item i was considered. Going forwards would allow item i to be used multiple times — that's unbounded knapsack, a different problem. This is the most-asked knapsack follow-up.</div>

<h4>Problem 5 — Longest Increasing Subsequence (O(n²) then O(n log n))</h4>
<pre><code>// O(n²): dp[i] = LIS ending exactly at i
int lis(int[] a) {
int n = a.length, best = 1;
int[] dp = new int[n];
Arrays.fill(dp, 1);
for (int i = 1; i &lt; n; i++) {
for (int j = 0; j &lt; i; j++) {
if (a[j] &lt; a[i]) dp[i] = Math.max(dp[i], dp[j] + 1);
}
best = Math.max(best, dp[i]);
}
return best;
}

// O(n log n): patience sorting — maintain a tails array
int lisFast(int[] a) {
int[] tails = new int[a.length];
int len = 0;
for (int x : a) {
int lo = 0, hi = len;
while (lo &lt; hi) { // lower_bound: first index with tails[i] >= x
int mid = lo + (hi - lo) / 2;
if (tails[mid] &lt; x) lo = mid + 1;
else hi = mid;
}
tails[lo] = x;
if (lo == len) len++;
}
return len;
}</code></pre>
<p><b>What <code>tails[i]</code> means:</b> the smallest possible tail value of an increasing subsequence of length <code>i+1</code>. It's not the LIS itself, but its length is correct. The binary search makes it O(n log n).</p>

<h4>The 1D patterns at a glance</h4>
<table><thead><tr><th>Pattern</th><th>State</th><th>Problems</th></tr></thead><tbody>
<tr><td>Linear recurrence</td><td><code>dp[i]</code> from <code>dp[i-1]</code>, <code>dp[i-2]</code></td><td>Climbing stairs, house robber, fibonacci</td></tr>
<tr><td>Choice at each step</td><td><code>dp[i] = max/min(take, skip)</code></td><td>House robber, stock trading</td></tr>
<tr><td>Unbounded knapsack</td><td><code>dp[w]</code>, forward loop, reuse allowed</td><td>Coin change, rod cutting</td></tr>
<tr><td>0/1 knapsack</td><td><code>dp[w]</code>, backward loop, each item once</td><td>Subset sum, partition equal subset</td></tr>
<tr><td>Subsequence</td><td><code>dp[i]</code> = best ending at i</td><td>LIS, max subarray (Kadane)</td></tr>
<tr><td>State machine</td><td><code>dp[i][state]</code></td><td>Stock with cooldown / transaction limit</td></tr>
</tbody></table>`,

drill:["Coin Change — write it, then swap the loops and explain what problem you're now solving.",
"0/1 Knapsack — write the 2D version, then optimise to 1D with the backward loop. Explain why backward.",
"LIS — write both the O(n²) and O(n log n) versions. Explain what <code>tails</code> represents."],

qa:[
["Why does greedy fail on House Robber?","Because a locally optimal choice can block a better global outcome. Robbing house 2 (value 10) when houses 1 and 3 are worth 8 each gives 10 instead of 16. Greedy has no mechanism to look ahead. DP considers both branches at every step, which is exactly what <code>max(take, skip)</code> encodes."],
["What's the difference between unbounded and 0/1 knapsack in the code?","Loop order and direction. For unbounded (items reusable), iterate capacity forward and the inner loop sees updated values — allowing reuse. For 0/1, iterate capacity backward so each item contributes at most once. Alternatively, swap the loops: outer over capacity and inner over items gives unbounded; outer over items and inner over capacity gives 0/1."],
["How do you decide between a 1D and 2D DP?","If the state depends on only one index, it's 1D. If it depends on two independent dimensions — two strings, or index plus a resource like capacity — it's 2D. The test: can you describe the state in one number? If not, you need two. Then check whether one dimension can be collapsed (as in knapsack) to save space."],
["What is Kadane's algorithm and how does it relate to DP?","Kadane's finds the maximum subarray sum in O(n). The DP formulation is <code>dp[i] = max(a[i], dp[i-1] + a[i])</code> — either start fresh at i, or extend the previous subarray. It's the simplest possible 1D DP, and interviewers use it as a warm-up before harder problems. The key insight is that you can discard any prefix whose sum has gone negative."],
["Can every DP problem be solved with memoisation instead of tabulation?","Functionally yes — they compute the same thing. Memoisation is top-down recursion plus a cache; tabulation is bottom-up iteration. Memoisation is often easier to write because it follows the natural recurrence, but it has recursion overhead and can blow the stack. Tabulation is faster and allows space optimisation. In an interview, I'd write memoisation first for correctness, then convert to tabulation if asked to optimise."]
],
exit:"Write Coin Change and 0/1 Knapsack from a blank page, and explain the backward loop in 60 seconds."},

{d:11,wk:2,prio:"P1",title:"Dynamic Programming II — 2D, Strings & Intervals",
obj:"Recognise 2D DP problems and derive the recurrence from the state definition.",
core:`<h4>How 2D DP differs</h4>
<p>You now have two indices. The recurrence relates <code>dp[i][j]</code> to neighbours — usually <code>[i-1][j]</code>, <code>[i][j-1]</code>, and <code>[i-1][j-1]</code>. Draw the table. Always draw the table.</p>

<h4>Problem 1 — Longest Common Subsequence</h4>
<pre><code>// dp[i][j] = LCS of s1[0..i-1] and s2[0..j-1]
// if s1[i-1] == s2[j-1]: dp[i][j] = dp[i-1][j-1] + 1
// else: dp[i][j] = max(dp[i-1][j], dp[i][j-1])
int lcs(String a, String b) {
int m = a.length(), n = b.length();
int[][] dp = new int[m + 1][n + 1];
for (int i = 1; i &lt;= m; i++) {
for (int j = 1; j &lt;= n; j++) {
if (a.charAt(i-1) == b.charAt(j-1))
dp[i][j] = dp[i-1][j-1] + 1;
else
dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
}
}
return dp[m][n];
}</code></pre>
<p><b>Why the +1 offset?</b> So that <code>dp[0][*]</code> and <code>dp[*][0]</code> represent empty prefixes, giving clean base cases of 0 without special handling in the loop.</p>

<h4>Problem 2 — Edit Distance (Levenshtein)</h4>
<pre><code>// dp[i][j] = min edits to turn a[0..i-1] into b[0..j-1]
// if equal: dp[i][j] = dp[i-1][j-1] (no edit)
// else: dp[i][j] = 1 + min(
// dp[i-1][j], // delete from a
// dp[i][j-1], // insert into a
// dp[i-1][j-1]) // replace
int editDistance(String a, String b) {
int m = a.length(), n = b.length();
int[][] dp = new int[m + 1][n + 1];
for (int i = 0; i &lt;= m; i++) dp[i][0] = i; // delete all
for (int j = 0; j &lt;= n; j++) dp[0][j] = j; // insert all
for (int i = 1; i &lt;= m; i++) {
for (int j = 1; j &lt;= n; j++) {
if (a.charAt(i-1) == b.charAt(j-1)) dp[i][j] = dp[i-1][j-1];
else dp[i][j] = 1 + Math.min(dp[i-1][j-1],
Math.min(dp[i-1][j], dp[i][j-1]));
}
}
return dp[m][n];
}</code></pre>
<div class="box"><div class="t">The interview question that always follows</div>"What does each of the three neighbours represent?" <b>Up</b> = delete from source. <b>Left</b> = insert into source. <b>Diagonal</b> = replace (or match). Being able to point at the table and say this is what separates memorisation from understanding.</div>

<h4>Problem 3 — Longest Palindromic Subsequence (interval DP)</h4>
<pre><code>// dp[i][j] = length of longest palindromic subsequence in s[i..j]
// if s[i] == s[j]: dp[i][j] = dp[i+1][j-1] + 2
// else: dp[i][j] = max(dp[i+1][j], dp[i][j-1])
// Base: dp[i][i] = 1
int lps(String s) {
int n = s.length();
int[][] dp = new int[n][n];
for (int i = 0; i &lt; n; i++) dp[i][i] = 1;
for (int len = 2; len &lt;= n; len++) {
for (int i = 0; i + len - 1 &lt; n; i++) {
int j = i + len - 1;
if (s.charAt(i) == s.charAt(j)) {
dp[i][j] = (len == 2) ? 2 : dp[i+1][j-1] + 2;
} else {
dp[i][j] = Math.max(dp[i+1][j], dp[i][j-1]);
}
}
}
return dp[0][n-1];
}</code></pre>
<p><b>The interval-DP loop structure</b> is different: you iterate by <em>length</em>, not by index. That's because <code>dp[i][j]</code> depends on <code>dp[i+1][j-1]</code>, which has a shorter interval. Compute short intervals first.</p>

<h4>Problem 4 — Matrix Chain / Burst Balloons (the hard interval pattern)</h4>
<pre><code>// Burst Balloons: dp[i][j] = max coins from bursting all balloons in (i,j) exclusive
// Choose k as the LAST balloon burst in the interval.
// dp[i][j] = max over k of (dp[i][k] + dp[k][j] + nums[i]*nums[k]*nums[j])
int maxCoins(int[] nums) {
int n = nums.length;
int[] a = new int[n + 2];
a[0] = a[n + 1] = 1;
for (int i = 0; i &lt; n; i++) a[i + 1] = nums[i];

int[][] dp = new int[n + 2][n + 2];
for (int len = 2; len &lt;= n + 1; len++) {
for (int i = 0; i + len &lt;= n + 1; i++) {
int j = i + len;
for (int k = i + 1; k &lt; j; k++) {
dp[i][j] = Math.max(dp[i][j],
dp[i][k] + dp[k][j] + a[i] * a[k] * a[j]);
}
}
}
return dp[0][n + 1];
}</code></pre>
<div class="box w"><div class="t">The insight that unlocks this problem</div>Thinking "which balloon do I burst first?" is hard, because bursting one changes the neighbours of everything else. Thinking "which balloon is burst <em>last</em> in this interval?" makes the subproblems independent — everything to the left and right is burst before it, so the neighbours at that moment are exactly the interval boundaries. <b>Reversing the order of reasoning is a recurring trick in interval DP.</b></div>

<h4>The 2D patterns at a glance</h4>
<table><thead><tr><th>Pattern</th><th>State</th><th>Loop order</th><th>Problems</th></tr></thead><tbody>
<tr><td>Two sequences</td><td><code>dp[i][j]</code> over prefixes</td><td>i then j</td><td>LCS, edit distance, wildcard matching</td></tr>
<tr><td>Interval</td><td><code>dp[i][j]</code> over subarray</td><td>by length</td><td>Palindromes, burst balloons, matrix chain</td></tr>
<tr><td>Grid path</td><td><code>dp[i][j]</code> from top/left</td><td>i then j</td><td>Unique paths, min path sum</td></tr>
<tr><td>Two-stock / state</td><td><code>dp[i][state]</code></td><td>i then state</td><td>Stock trading with cooldown/fees</td></tr>
<tr><td>Tree DP</td><td><code>dp[node][state]</code></td><td>post-order</td><td>House robber III, tree diameter</td></tr>
</tbody></table>

<h4>Space optimisation for 2D</h4>
<p>If <code>dp[i][j]</code> depends only on row <code>i-1</code>, you can reduce to two rows. If it depends on <code>[i-1][j-1]</code>, <code>[i-1][j]</code>, <code>[i][j-1]</code>, you need to keep one variable for the diagonal:</p>
<pre><code>int[] prev = new int[n + 1], cur = new int[n + 1];
for (int i = 1; i &lt;= m; i++) {
for (int j = 1; j &lt;= n; j++) {
if (a.charAt(i-1) == b.charAt(j-1)) cur[j] = prev[j-1] + 1;
else cur[j] = Math.max(prev[j], cur[j-1]);
}
int[] t = prev; prev = cur; cur = t;
}
return prev[n];</code></pre>`,

drill:["LCS and Edit Distance from memory. Draw the table for 'abc' vs 'abd' by hand.",
"Longest Palindromic Subsequence. Explain why the loop is by length, not index.",
"Burst Balloons — this is hard. Allow 40 minutes. If you get it, you understand interval DP."],

qa:[
["Why does the 0/1 knapsack use a backward loop but LCS works with a forward loop?","Because the dependency structure differs. In knapsack, <code>dp[w]</code> depends on <code>dp[w - wt]</code> in the <em>same</em> array, so direction controls whether items can be reused. In LCS, <code>dp[i][j]</code> depends on the <em>previous row</em> and the current row's left neighbour — different rows, so direction within a row doesn't cause reuse. The general rule: if the recurrence reads from the array you're writing to, direction matters."],
["How do you derive the recurrence for a 2D DP from scratch?","Write down what <code>dp[i][j]</code> means as a sentence. Then ask: if I know <code>dp[i-1][j-1]</code>, <code>dp[i-1][j]</code>, and <code>dp[i][j-1]</code>, can I compute <code>dp[i][j]</code>? The recurrence falls out of the state definition. If it doesn't, your state is wrong — redefine it."],
["What's the time and space complexity of Edit Distance, and can you do better?","O(mn) time, O(mn) space, reducible to O(min(m,n)) space with two rows. Time cannot be improved in general — there's no known subquadratic algorithm for exact edit distance. There are approximations (banded edit distance for similar strings, or the Four Russians method for a log factor), but they're beyond interview scope."],
["Why is Burst Balloons so much harder than the other interval DP problems?","Because the natural framing — 'which balloon do I burst first?' — creates dependent subproblems. Bursting one balloon changes which neighbours the others have, so the left and right subproblems aren't independent. Flipping to 'which balloon is burst last?' makes them independent, because at that moment the neighbours are exactly the interval boundaries. Recognising when to reverse the reasoning order is the skill being tested."],
["When would you use a 2D DP over memoised recursion?","When the recursion has clear overlapping subproblems and you want to avoid the overhead of a hash map and function calls. Tabulation is faster and allows space optimisation. Memoisation is easier to write and reason about. In an interview, I'd write memoisation first for correctness, verify it on a small example, then convert to tabulation if asked to optimise."]
],
exit:"Draw the DP table for Edit Distance on 'cat' → 'cut' by hand, filling every cell, and explain what each number means."},

{d:12,wk:2,prio:"P1",title:"Heap, Intervals, Trie, Union-Find & Bits",
obj:"Have a working template for each of these five patterns, ready to deploy.",
core:`<h4>1. Top-K with a heap</h4>
<pre><code>// K largest elements: use a MIN-heap of size K
PriorityQueue&lt;Integer&gt; minHeap = new PriorityQueue&lt;&gt;();
for (int x : nums) {
minHeap.offer(x);
if (minHeap.size() &gt; k) minHeap.poll(); // remove the smallest
}
// minHeap now holds the K largest

// K smallest: use a MAX-heap of size K
PriorityQueue&lt;Integer&gt; maxHeap = new PriorityQueue&lt;&gt;(Comparator.reverseOrder());</code></pre>
<div class="box"><div class="t">The counter-intuitive bit</div>To find the K <b>largest</b>, you use a <b>min</b>-heap. Every time you push, you evict the smallest — so the heap retains only the largest K. This inversion trips people up in interviews. Say it out loud as you write it.</div>
<p><b>Complexity:</b> O(n log K) time, O(K) space. Better than sorting (O(n log n)) when K ≪ n. For the Kth largest specifically, QuickSelect gives O(n) average.</p>

<h4>2. Merge Intervals</h4>
<pre><code>int[][] merge(int[][] intervals) {
Arrays.sort(intervals, (a, b) -&gt; Integer.compare(a[0], b[0]));
List&lt;int[]&gt; out = new ArrayList&lt;&gt;();
for (int[] cur : intervals) {
if (out.isEmpty() || out.get(out.size()-1)[1] &lt; cur[0]) {
out.add(cur); // no overlap
} else {
out.get(out.size()-1)[1] = Math.max( // extend
out.get(out.size()-1)[1], cur[1]);
}
}
return out.toArray(new int[0][]);
}</code></pre>
<p><b>Meeting Rooms II (max concurrent):</b> sort by start, use a min-heap of end times. For each meeting, pop all ended ones, push the end, track the max heap size.</p>
<pre><code>Arrays.sort(intervals, (a,b) -&gt; a[0] - b[0]);
PriorityQueue&lt;Integer&gt; ends = new PriorityQueue&lt;&gt;();
for (int[] iv : intervals) {
while (!ends.isEmpty() &amp;&amp; ends.peek() &lt;= iv[0]) ends.poll();
ends.offer(iv[1]);
maxRooms = Math.max(maxRooms, ends.size());
}</code></pre>

<h4>3. Trie</h4>
<pre><code>class Trie {
static class Node {
Node[] kids = new Node[26];
boolean end;
}
private final Node root = new Node();

void insert(String w) {
Node cur = root;
for (char c : w.toCharArray()) {
int i = c - 'a';
if (cur.kids[i] == null) cur.kids[i] = new Node();
cur = cur.kids[i];
}
cur.end = true;
}

boolean search(String w) {
Node cur = root;
for (char c : w.toCharArray()) {
int i = c - 'a';
if (cur.kids[i] == null) return false;
cur = cur.kids[i];
}
return cur.end; // must be a word end, not just a prefix
}

boolean startsWith(String p) {
Node cur = root;
for (char c : p.toCharArray()) {
int i = c - 'a';
if (cur.kids[i] == null) return false;
cur = cur.kids[i];
}
return true; // prefix found, don't check end
}
}</code></pre>
<p><b>Complexity:</b> O(m) per operation, where m is the key length — independent of how many keys are stored. <b>Space:</b> the trade-off. A <code>Node[26]</code> per node is 26 references even if most are null. For sparse alphabets, use a <code>HashMap&lt;Character, Node&gt;</code> instead.</p>
<p><b>When to use:</b> prefix search, autocomplete, word dictionaries, IP routing. If the problem says "prefix" or "starts with", reach for a trie.</p>

<h4>4. Union-Find (Disjoint Set Union)</h4>
<pre><code>class DSU {
int[] parent, rank;
DSU(int n) {
parent = new int[n];
rank = new int[n];
for (int i = 0; i &lt; n; i++) parent[i] = i;
}
int find(int x) {
if (parent[x] != x) parent[x] = find(parent[x]); // path compression
return parent[x];
}
boolean union(int a, int b) {
int ra = find(a), rb = find(b);
if (ra == rb) return false; // already connected
if (rank[ra] &lt; rank[rb]) { int t = ra; ra = rb; rb = t; }
parent[rb] = ra;
if (rank[ra] == rank[rb]) rank[ra]++;
return true;
}
}</code></pre>
<p><b>Complexity with both optimisations:</b> O(α(n)) per operation — effectively constant. Without path compression it degrades to O(log n); without union by rank it can become O(n).</p>
<p><b>Classic uses:</b> number of connected components, redundant connection, accounts merge, graph valid tree, Kruskal's MST, number of islands II (dynamic).</p>

<h4>5. Bit manipulation</h4>
<table><thead><tr><th>Operation</th><th>Meaning</th><th>Use</th></tr></thead><tbody>
<tr><td><code>n &amp; (n-1)</code></td><td>Clear lowest set bit</td><td>Count set bits</td></tr>
<tr><td><code>n &amp; -n</code></td><td>Isolate lowest set bit</td><td>Fenwick trees, bit tricks</td></tr>
<tr><td><code>n &amp; 1</code></td><td>Test odd/even</td><td>Parity check</td></tr>
<tr><td><code>n &gt;&gt; 1</code></td><td>Divide by 2</td><td>Shift instead of divide</td></tr>
<tr><td><code>n ^ n</code></td><td>0</td><td>Find single non-duplicate</td></tr>
<tr><td><code>n ^ 0</code></td><td>n</td><td>Identity</td></tr>
<tr><td><code>1 &lt;&lt; k</code></td><td>Set bit k</td><td>Bitmask states</td></tr>
<tr><td><code>mask | (1 &lt;&lt; k)</code></td><td>Set bit k in mask</td><td>Subset DP</td></tr>
<tr><td><code>mask &amp; (1 &lt;&lt; k)</code></td><td>Test bit k</td><td>Membership</td></tr>
</tbody></table>
<pre><code>// Count set bits — O(number of set bits), not O(32)
int countBits(int n) {
int c = 0;
while (n != 0) { n &amp;= (n - 1); c++; }
return c;
}

// Single Number — every element appears twice except one
int singleNumber(int[] nums) {
int x = 0;
for (int n : nums) x ^= n; // pairs cancel
return x;
}</code></pre>
