<div class="box w"><div class="t">The health check trap</div>A health check that calls a downstream service can cause cascading failure. If the downstream is slow, every health check times out, the orchestrator marks all instances unhealthy, restarts them, and the whole fleet goes down because of a degraded dependency. <b>Keep health checks local</b> — check your own resources (database connection, disk, thread pool) and report downstream status as informational, not as the liveness signal.</div>`,

drill:["Run a Spring Boot app with --debug and read the auto-configuration report. Find one negative match and explain which condition failed.",
"Create a @ConfigurationProperties class with validation. Verify startup fails on invalid config.",
"Expose only /health and /metrics. Write a health indicator that checks the database and the thread pool."],

qa:[
["What's the difference between @Component, @Service, @Repository, and @Controller?","Nothing functionally — they're all @Component specialisations. The differences are semantic (documentation) and one technical: @Repository adds exception translation, converting JDBC/Hibernate exceptions into Spring's DataAccessException hierarchy. Use the specific annotation for clarity; the container treats them the same."],
["How do you override a Spring Boot auto-configured bean?","Define your own bean of the same type. Auto-configuration classes are annotated with @ConditionalOnMissingBean, so if you provide one, the auto-configuration backs off. The order matters — user configuration is processed before auto-configuration, which is what makes this work. If you need to exclude the auto-configuration entirely, use @SpringBootApplication(exclude = X.class)."],
["Why is @Value considered a code smell in modern Spring Boot?","It scatters configuration across the codebase, has no type safety, no validation, and no IDE support. @ConfigurationProperties groups related config into a typed object with validation, relaxed binding, and a single place to see everything. The exception is a single value used in exactly one place — @Value is fine there."],
["What does the readiness probe check versus the liveness probe?","Liveness answers 'is the process alive and should it be restarted?' — it should be cheap and local, like checking the thread pool isn't deadlocked. Readiness answers 'should this instance receive traffic?' — it can check that the database connection is established and the application context is fully started. A failing liveness probe triggers a restart; a failing readiness probe just removes the instance from the load balancer. Conflating them causes restart storms."],
["How do you change a log level at runtime without restarting?","The actuator /loggers endpoint. POST to /loggers/com.example with <code>{\"configuredLevel\": \"DEBUG\"}</code>. This is enormously useful during an incident — you can turn on debug logging for a specific package, reproduce the issue, and turn it back off. I'd restrict it behind authentication but keep it available."]
],
exit:"Explain auto-configuration and the configuration precedence order in 90 seconds, then describe a health check that would cause cascading failure."},

{d:21,wk:3,prio:"P0",title:"Week 3 Integration — Concurrency & Spring Retrieval",
obj:"Prove you can explain transactions, proxies, and concurrency without notes.",
core:`<h4>The retrieval test</h4>
<p>Answer these from memory, out loud, in under 90 seconds each. Record yourself if you can.</p>

<h4>Concurrency</h4>
<ol>
<li>Explain happens-before in three rules, and why <code>volatile int count; count++</code> loses updates.</li>
<li>When do you use <code>LongAdder</code> over <code>AtomicLong</code>?</li>
<li>What is pinning and why does it matter for virtual threads?</li>
<li>Why shouldn't virtual threads be pooled?</li>
<li>What does StructuredTaskScope give you that CompletableFuture doesn't?</li>
</ol>

<h4>Spring</h4>
<ol>
<li>Walk through the bean lifecycle from instantiation to ready.</li>
<li>What is a proxy and why does self-invocation break <code>@Transactional</code>?</li>
<li>Why can't CGLIB advise private methods?</li>
<li>Explain propagation REQUIRED vs REQUIRES_NEW vs NESTED.</li>
<li>What are the four things <code>@Transactional</code> doesn't cover?</li>
<li>Why does <code>REQUIRES_NEW</code> cause connection pool deadlock?</li>
</ol>

<h4>JPA</h4>
<ol>
<li>Reproduce N+1 verbally — what triggers it?</li>
<li>Name the four fixes and when each applies.</li>
<li>Why does JOIN FETCH break pagination?</li>
<li>Optimistic vs pessimistic locking — when each?</li>
<li>Why does <code>GenerationType.IDENTITY</code> prevent batch inserts?</li>
</ol>

<div class="box o"><div class="t">Scoring</div>Each answer should take 60–90 seconds and contain at least one concrete example or number. If an answer takes longer than two minutes, you're reciting rather than explaining — that reads as uncertainty in an interview. If you can't answer in 30 seconds, you don't know it yet.</div>

<h4>The integrated scenario — do this properly</h4>
<p>You're building a service that processes payments. Design the flow and answer:</p>
<ol>
<li>Where does the transaction boundary go, and why?</li>
<li>How do you publish the <code>PaymentProcessed</code> event without a distributed transaction?</li>
<li>Two concurrent requests try to debit the same account. What happens with optimistic locking? With the conditional UPDATE?</li>
<li>You need to call an external fraud service during the flow. Where does that call go relative to the transaction?</li>
<li>The fraud service starts timing out. What breaks first?</li>
<li>You're running on virtual threads with a 10-connection pool. What's the actual concurrency limit?</li>
</ol>
<p><b>Answers to check against:</b></p>
<ol>
<li>Around the database write only. The external calls happen outside, so you don't hold a connection across a network call.</li>
<li>Transactional Outbox — business row and outbox row in the same local transaction, separate relay publishes.</li>
<li>Optimistic: one wins, the other gets <code>OptimisticLockException</code> and must retry (so the operation must be idempotent). Conditional UPDATE: one wins, the other gets 0 rows affected and returns "insufficient funds" — cleaner, no exception.</li>
<li><strong>Before</strong> the transaction, or in a separate short transaction. Never inside the database transaction — you'd hold a connection and potentially a row lock for the duration of a network call.</li>
<li>The thread pool fills with threads waiting on the fraud service. Then the connection pool fills because those threads are inside transactions. Then requests queue. Then the load balancer times out. Cascade complete.</li>
<li>10. Virtual threads don't create database connections. The pool is the real limit, and 10,000 virtual threads queuing for 10 connections is worse than 10 platform threads doing the same — you've added overhead without adding throughput.</li>
</ol>

<h4>Weakness audit</h4>
<table><thead><tr><th>Topic</th><th>0–3</th><th>Action</th></tr></thead><tbody>
<tr><td>happens-before / volatile / atomics</td><td></td><td>Day 14 if &lt; 2</td></tr>
<tr><td>Locks & StampedLock</td><td></td><td>Day 15 if &lt; 2</td></tr>
<tr><td>CompletableFuture composition</td><td></td><td>Day 15 if &lt; 2</td></tr>
<tr><td>Virtual threads & pinning</td><td></td><td>Day 16 if &lt; 2</td></tr>
<tr><td>Bean lifecycle & proxies</td><td></td><td>Day 17 if &lt; 2</td></tr>
<tr><td>@Transactional propagation & rollback</td><td></td><td>Day 18 if &lt; 2</td></tr>
<tr><td>N+1 and the four fixes</td><td></td><td>Day 19 if &lt; 2</td></tr>
<tr><td>Auto-configuration & config precedence</td><td></td><td>Day 20 if &lt; 2</td></tr>
</tbody></table>
<div class="box w"><div class="t">The one thing to fix today</div>If the REQUIRES_NEW pool deadlock and the "external calls inside a transaction" problem aren't crisp, fix them now. Both are fintech-critical and both come up in system design rounds, not just Spring rounds.</div>`,

drill:["Answer all 15 retrieval questions out loud. Time each one.",
"Work the integrated payment scenario end to end on paper. Write down your answers before checking.",
"Re-do the weakest two topics from the audit."],

qa:[
["Why is 'never make external calls inside a transaction' such a strong statement?","Because you hold a database connection and potentially row locks for the duration of a network call, which is unbounded in the failure case. Under load, every thread ends up holding a connection while waiting on a network. The connection pool exhausts, new requests queue, and the service becomes unresponsive even though nothing is actually broken. It's one of the most common causes of production outages in Java services."],
["How would you structure a payment flow that needs fraud checking?","Fraud check first, in its own short transaction or with no transaction at all. It returns a decision. Then open a database transaction for the ledger write and the outbox insert. This keeps the transaction short, holds no locks during the network call, and means a slow fraud service degrades fraud checks rather than the whole payment path. If the fraud service is down, I'd apply a fallback policy — allow with post-hoc review, or block — depending on the risk tolerance, which is a business decision."],
["What's the actual concurrency limit for a Spring Boot service with 10 DB connections?","Ten concurrent database operations. That's it — regardless of thread count, virtual or platform. Virtual threads let you have 10,000 in-flight requests without 10,000 OS threads, but the 10 connections serialise all database work. The connection pool is the real throughput limit for database-bound work. This is a crucial point in system design: find the actual bottleneck, don't optimise the thing that isn't one."],
["How do you make a retry safe after an OptimisticLockException?","The operation must be idempotent, and the retry must re-read the current state. Re-reading is essential — retrying with the stale in-memory value just fails again. In practice: catch the exception, reload the entity (getting the new version), reapply the business logic, and try again with exponential backoff and a retry limit. If the business logic is 'debit X', the reapplication must check funds again, not assume the earlier check still holds."]
],
exit:"Answer the integrated payment scenario end to end in under 12 minutes, covering transaction boundaries, event publishing, concurrency, and the cascade."},

{d:22,wk:4,prio:"P0",title:"ACID, Isolation Levels & Anomalies",
obj:"Name every anomaly and the isolation level that prevents it.",
core:`<h4>ACID — the precise definitions</h4>
<table><thead><tr><th>Property</th><th>Guarantee</th><th>Implemented by</th></tr></thead><tbody>
<tr><td><b>Atomicity</b></td><td>All statements in a transaction take effect, or none do</td><td>Undo log — records how to reverse each change</td></tr>
<tr><td><b>Consistency</b></td><td>Constraints and invariants hold before and after</td><td>Constraints, triggers, application logic</td></tr>
<tr><td><b>Isolation</b></td><td>Concurrent transactions don't interfere</td><td>MVCC, locks, or both</td></tr>
<tr><td><b>Durability</b></td><td>Committed data survives a crash</td><td>Write-ahead log, fsync before acknowledgement</td></tr>
</tbody></table>
<div class="box"><div class="t">The definition people get wrong</div>Consistency in ACID is <em>not</em> the C in CAP. ACID's C means "the database moves from one valid state to another, respecting its invariants." CAP's C means "all nodes see the same data at the same time." They're unrelated concepts that happen to share a letter. Saying this out loud in an interview signals you know the difference.</div>

<h4>The five anomalies — with examples</h4>
<table><thead><tr><th>Anomaly</th><th>What happens</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Dirty read</b></td><td>Reading uncommitted data that later rolls back</td><td>T1 sets balance=0, T2 reads 0, T1 rolls back — T2 acted on a value that never existed</td></tr>
<tr><td><b>Non-repeatable read</b></td><td>Same row read twice gives different values</td><td>T1 reads balance=100, T2 updates to 200 and commits, T1 reads 200</td></tr>
<tr><td><b>Phantom read</b></td><td>Same query twice returns different <em>rows</em></td><td>T1 counts orders WHERE amount &gt; 100 → 5, T2 inserts one and commits, T1 counts again → 6</td></tr>
<tr><td><b>Lost update</b></td><td>Two read-modify-writes; one overwrites the other</td><td>Both read balance=100, both add 50, both write 150 — one increment vanished</td></tr>
<tr><td><b>Write skew</b></td><td>Two transactions each read a set, each writes based on it, together violating an invariant</td><td>Two doctors each check "at least 2 on call," each sees 2, each goes off call — now 0</td></tr>
</tbody></table>

<h4>Isolation levels — the full matrix</h4>
<table><thead><tr><th>Level</th><th>Dirty</th><th>Non-repeatable</th><th>Phantom</th><th>Lost update</th><th>Write skew</th></tr></thead><tbody>
<tr><td>READ UNCOMMITTED</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td></tr>
<tr><td>READ COMMITTED</td><td>✓</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td></tr>
<tr><td>REPEATABLE READ</td><td>✓</td><td>✓</td><td>✗*</td><td>✗*</td><td>✗</td></tr>
<tr><td>SERIALIZABLE</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr>
</tbody></table>
<p>*InnoDB's REPEATABLE READ uses next-key locks that prevent phantoms and often prevent lost updates. The SQL standard allows phantoms at this level; MySQL doesn't. PostgreSQL's REPEATABLE READ is snapshot isolation, which prevents lost updates via first-committer-wins but still allows write skew.</p>
<div class="box b"><div class="t">The critical fact about write skew</div>Write skew is prevented only by SERIALIZABLE (or by explicit locking in your application). Snapshot isolation — which is what PostgreSQL's REPEATABLE READ and Oracle's default actually implement — prevents lost updates but <em>not</em> write skew. Most engineers don't know this, and it's the source of subtle correctness bugs in systems where two rows must be consistent with each other.</div>

<h4>Database defaults — know these</h4>
<table><thead><tr><th>Database</th><th>Default isolation</th><th>Notes</th></tr></thead><tbody>
<tr><td>PostgreSQL</td><td>READ COMMITTED</td><td>REPEATABLE READ is snapshot isolation</td></tr>
<tr><td>MySQL / InnoDB</td><td>REPEATABLE READ</td><td>Next-key locks prevent phantoms</td></tr>
<tr><td>Oracle</td><td>READ COMMITTED</td><td>SERIALIZABLE is snapshot isolation + write conflict detection</td></tr>
<tr><td>SQL Server</td><td>READ COMMITTED</td><td>Can enable snapshot isolation per database</td></tr>
</tbody></table>

<h4>How isolation is actually implemented</h4>
<ul>
<li><b>Two-phase locking (2PL).</b> Acquire locks on read and write; release at commit. Correct but blocks heavily, and deadlocks are common.</li>
<li><b>MVCC.</b> Readers see a snapshot; writers create new versions. Readers never block writers. This is what PostgreSQL and InnoDB use. Isolation level controls how old the snapshot can be.</li>
<li><b>Serializable Snapshot Isolation (SSI).</b> PostgreSQL's SERIALIZABLE uses MVCC plus detection of dangerous patterns, aborting transactions that would violate serializability. Optimistic — you rarely block, but you can get serialization failures and must retry.</li>
</ul>

<h4>The retry requirement</h4>
<pre><code>// PostgreSQL SERIALIZABLE can abort with SQLSTATE 40001
for (int attempt = 0; attempt &lt; 3; attempt++) {
try {
return txTemplate.execute(status -&gt; doWork());
} catch (Exception e) {
if (!isSerializationFailure(e) || attempt == 2) throw e;
backoff(attempt); // exponential with jitter
}
}</code></pre>
<div class="box o"><div class="t">The architect-level point</div>"If I choose SERIALIZABLE, I must build retry logic into every write path — it's not optional. That's a real cost, and it's why most systems stay at READ COMMITTED and handle the specific races they care about with explicit locking or atomic conditional updates. Serializable is correct but it's not free."</div>

<h4>Choosing an isolation level</h4>
<ol>
<li><b>Start at the database default.</b> READ COMMITTED covers most OLTP.</li>
<li><b>Identify the specific race you care about.</b> Don't raise the global level for one operation.</li>
<li><b>Prefer targeted fixes:</b> an atomic conditional UPDATE, a <code>SELECT ... FOR UPDATE</code> on the specific row, or an optimistic version check.</li>
<li><b>Use SERIALIZABLE only when the invariant spans multiple rows</b> and you can't express it as a single statement — and build the retry loop.</li>
</ol>

<h4>The fintech answer</h4>
<p>"For a ledger, I'd avoid the isolation question entirely by making it append-only. Debits and credits are inserts, not updates, so there's no read-modify-write and therefore no lost update. The only place I need strictness is the balance check, and I'd express that as an atomic conditional UPDATE: <code>SET balance = balance - ? WHERE balance &gt;= ?</code>. That's a single statement with the invariant enforced in the database, needs no explicit isolation level, and fails cleanly with 0 rows affected on insufficient funds."</p>`,

drill:["Open two psql sessions and reproduce a non-repeatable read at READ COMMITTED, then at REPEATABLE READ.",
"Reproduce write skew: two transactions each check a condition on a set, then both write. Show the invariant breaking.",
"Reproduce a lost update with plain read-modify-write, then fix it three ways: SELECT FOR UPDATE, optimistic version, atomic conditional UPDATE."],

qa:[
["Why doesn't snapshot isolation prevent write skew?","Because each transaction reads from its own snapshot and writes to disjoint rows. There's no write-write conflict for the database to detect — the conflict is between a read in one transaction and a write in the other, which snapshot isolation doesn't track. Only SERIALIZABLE, which detects read-write dependencies (or uses explicit locking), catches it. This is the classic example of why snapshot isolation is weaker than serializability."],
["What's the difference between REPEATABLE READ in MySQL and PostgreSQL?","MySQL's InnoDB implements REPEATABLE READ with next-key locks, which block inserts into ranges you've read — so phantoms are prevented. PostgreSQL implements it as snapshot isolation, which doesn't prevent phantoms in the SQL-standard sense but does give you a consistent snapshot. In practice, PostgreSQL's REPEATABLE READ prevents non-repeatable reads and lost updates but allows write skew; MySQL's prevents phantoms too but can deadlock more."],
["When would you actually choose SERIALIZABLE?","When an invariant spans multiple rows and cannot be expressed as a single atomic statement. Example: 'the sum of all account balances in this ledger must equal the control total' — you can't check that with a single UPDATE predicate. Also for financial reconciliation jobs where correctness is worth the abort-and-retry cost. In practice, most systems avoid it by redesigning so invariants are per-row."],
["How does an atomic conditional UPDATE avoid the isolation question entirely?","Because it's a single statement. The database executes the read, the comparison, and the write atomically within one statement — there's no window for another transaction to interleave. Whether it's implemented via row locks or MVCC, the statement either affects 1 row or 0 rows, and the caller acts on that. No explicit isolation level, no retry loop on conflict, no lost update."],
["What's a serialization failure and how do you handle it?","A transaction abort caused by the database detecting that allowing it to commit would violate serializability. PostgreSQL returns SQLSTATE 40001. It's not an error in your logic — it means the transaction must be retried. The handling is: catch the exception, back off with jitter, re-read all state, and retry the whole transaction. A retry limit (3–5) prevents infinite loops under sustained contention."]
],
exit:"Name all five anomalies and the isolation level that prevents each, and explain why write skew survives snapshot isolation."},

{d:23,wk:4,prio:"P0",title:"MVCC, Locking & Deadlocks",
obj:"Explain how MVCC works in PostgreSQL and InnoDB, and diagnose a deadlock.",
core:`<h4>MVCC — the core idea</h4>
<p>Instead of overwriting a row, the database creates a new version. Each transaction sees a snapshot — the set of versions visible to it. Readers never block writers; writers never block readers. This is why a long SELECT doesn't stop an UPDATE.</p>

<h4>PostgreSQL's implementation</h4>
<pre><code>-- Every row version carries:
xmin -- transaction ID that created this version
xmax -- transaction ID that deleted/superseded it (0 if live)

-- Visibility rule (simplified): a version is visible if
-- xmin is committed and before my snapshot
-- AND (xmax is 0 OR xmax is not yet committed OR after my snapshot)</code></pre>
<p><b>The consequence: table bloat.</b> Every UPDATE creates a new version and marks the old one dead. Dead versions occupy space until VACUUM reclaims them. A table with heavy updates can be several times larger than its live data.</p>
<pre><code>-- Check bloat
SELECT relname, n_live_tup, n_dead_tup,
round(n_dead_tup::numeric / nullif(n_live_tup,0) * 100, 1) AS dead_pct
FROM pg_stat_user_tables
ORDER BY n_dead_tup DESC;</code></pre>
<div class="box b"><div class="t">The long-transaction problem</div>A long-running transaction holds an old snapshot. VACUUM cannot reclaim any row version that might still be visible to it — so the whole table accumulates dead versions. A single forgotten transaction left open overnight can bloat a database by gigabytes and cause a cascade of performance problems. This is one of the most common PostgreSQL production incidents and a great thing to mention in an interview.</div>

<h4>InnoDB's implementation</h4>
<p>InnoDB keeps the current version in the clustered index and older versions in the <b>undo log</b>. A transaction's read view determines which undo versions to apply. Old undo entries are purged once no read view needs them.</p>
<p><b>Difference from PostgreSQL:</b> the table itself stays compact; the undo tablespace grows instead. Both approaches have the same fundamental constraint — a long-running transaction prevents cleanup.</p>

<h4>Lock types</h4>
<table><thead><tr><th>Lock</th><th>Conflicts with</th><th>Acquired by</th></tr></thead><tbody>
<tr><td>FOR UPDATE</td><td>FOR UPDATE, FOR SHARE</td><td>Explicit, or UPDATE/DELETE</td></tr>
<tr><td>FOR SHARE (FOR UPDATE in MySQL's shared mode)</td><td>FOR UPDATE only</td><td>Explicit</td></tr>
<tr><td>FOR NO KEY UPDATE</td><td>FOR UPDATE, FOR SHARE</td><td>UPDATE on non-key columns (PostgreSQL)</td></tr>
<tr><td>FOR KEY SHARE</td><td>FOR UPDATE only</td><td>Foreign key checks (PostgreSQL)</td></tr>
</tbody></table>
<pre><code>-- PostgreSQL lock modes
SELECT * FROM accounts WHERE id = 1 FOR UPDATE; -- exclusive, blocks other FOR UPDATE
SELECT * FROM accounts WHERE id = 1 FOR NO KEY UPDATE; -- doesn't block FK checks
SELECT * FROM accounts WHERE id = 1 FOR SHARE; -- shared, blocks writers

-- Skip locked rows — useful for queue-like processing
SELECT * FROM jobs WHERE status = 'PENDING'
ORDER BY created_at
LIMIT 10
FOR UPDATE SKIP LOCKED;</code></pre>
<div class="box o"><div class="t">FOR UPDATE SKIP LOCKED — the pattern worth knowing</div>This lets multiple workers pull from a queue table without blocking each other. Each worker locks a batch of rows, skips the ones already locked by others, and processes them. It's a simple, transactional job queue that needs no external broker. Mention this in a design interview and you'll stand out — most candidates reach for Kafka when a table would do.</div>

<h4>Deadlocks — how they happen</h4>
<pre><code>-- Transaction 1 -- Transaction 2
BEGIN; BEGIN;
UPDATE accounts SET ... WHERE id=1; UPDATE accounts SET ... WHERE id=2;
UPDATE accounts SET ... WHERE id=2; -- waits for T1
-- waits for T2 UPDATE accounts SET ... WHERE id=1;
-- DEADLOCK
</code></pre>
<p>PostgreSQL detects the cycle and aborts one transaction with SQLSTATE 40P01. InnoDB does the same with error 1213.</p>
<p><b>The cause is lock ordering.</b> Both transactions acquire locks in different orders. The universal fix:</p>
<pre><code>// Always lock in a consistent order — e.g. by ascending account ID
public void transfer(long fromId, long toId, BigDecimal amount) {
long first = Math.min(fromId, toId);
long second = Math.max(fromId, toId);
Account a = repo.findForUpdate(first);
Account b = repo.findForUpdate(second);
// now apply the transfer using the correct direction
}</code></pre>

<h4>Preventing deadlocks — the checklist</h4>
<ol>
<li><b>Consistent lock ordering.</b> The single most effective measure. Sort by ID before locking.</li>
<li><b>Short transactions.</b> The longer a transaction runs, the wider the deadlock window. Never make external calls inside a transaction.</li>
<li><b>Atomic statements.</b> A single conditional UPDATE takes one lock for a moment; a read-modify-write takes locks for longer.</li>
<li><b>Lower isolation.</b> READ COMMITTED takes fewer locks than REPEATABLE READ in InnoDB.</li>
<li><b>Retry on deadlock.</b> Deadlocks are a normal occurrence in any system with concurrent writes. Handle them:</li>
</ol>
<pre><code>for (int attempt = 0; attempt &lt; 3; attempt++) {
try { return doTransfer(); }
catch (DeadlockException e) { // 40P01 or 1213
if (attempt == 2) throw e;
sleep(50L * (1L &lt;&lt; attempt) + random(50));
}
}</code></pre>
<div class="box w"><div class="t">Deadlocks are not bugs</div>They're a normal consequence of concurrent access with locking. The right posture is: minimise them through ordering and short transactions, and handle the ones that remain with a retry loop. A system with zero deadlock handling will fail in production.</div>

<h4>Diagnosing deadlocks</h4>
<ul>
<li><b>PostgreSQL:</b> <code>SELECT * FROM pg_stat_activity WHERE wait_event_type = 'Lock';</code> shows blocked queries. Enable <code>log_lock_waits = on</code> and <code>deadlock_timeout</code>. Deadlock details appear in the logs.</li>
<li><b>MySQL:</b> <code>SHOW ENGINE INNODB STATUS;</code> includes the last deadlock with the full lock graph — which transaction held what, which was waiting for what.</li>
<li><b>Both:</b> <code>pg_blocking_pids()</code> / <code>information_schema.innodb_trx</code> for live blocking chains.</li>
</ul>

<h4>Lock timeouts vs deadlocks</h4>
<pre><code>-- PostgreSQL: fail rather than wait forever
SET lock_timeout = '2s';
SET statement_timeout = '5s';</code></pre>
<p><b>Lock timeout</b> is a single transaction waiting too long for a lock — often caused by another transaction that's stuck. <b>Deadlock</b> is a cycle, detected immediately. Both should be handled with retries, but a lock timeout usually indicates a different problem (a hung transaction, a missing index causing a table lock).</p>

<h4>The missing-index lock escalation</h4>
<div class="box b"><div class="t">The subtle one</div>An <code>UPDATE ... WHERE non_indexed_column = x</code> may lock far more rows than it matches — potentially the whole table — because the database has to scan and lock as it goes. Adding an index on the WHERE column often eliminates deadlocks in production. This is a real incident pattern and a strong interview answer.</div>`,

drill:["Reproduce a deadlock with two psql sessions locking rows in opposite orders. Read the error.",
"Reproduce it again with consistent lock ordering. Verify it no longer deadlocks.",
"Create a table with a non-indexed column, run concurrent UPDATEs on different rows, and observe lock contention. Add the index and re-test."],

qa:[
["How does MVCC allow readers not to block writers?","Because the reader reads a snapshot — a set of row versions visible as of its start time. The writer creates new versions rather than modifying existing ones. They're operating on different physical data, so there's no lock conflict. The cost is that old versions must be kept alive and eventually cleaned up, which is what VACUUM (PostgreSQL) and the purge thread (InnoDB) do."],
["What happens if a transaction is left open for hours?","In PostgreSQL, it pins the visibility horizon — VACUUM can't remove any row version that might still be visible to that transaction. The table bloats continuously. It also holds locks, blocks DDL, and can prevent index-only scans from being effective. In severe cases, the database can run out of transaction IDs and shut down to prevent wraparound. The fix is a statement_timeout and idle_in_transaction_session_timeout to kill stuck transactions automatically."],
["Why is FOR UPDATE SKIP LOCKED useful?","It lets concurrent workers process a queue without blocking each other. Worker A locks rows 1–10; worker B skips those and locks 11–20. No contention, no coordination needed. It turns a table into a transactional work queue. The trade-off is that it's database-specific and doesn't scale to the throughput of a dedicated broker — but for moderate volumes it removes an entire piece of infrastructure."],
["Can a deadlock happen with a single-row UPDATE?","Yes, if the UPDATE is part of a larger transaction that already holds other locks. Any two transactions that acquire multiple locks in different orders can deadlock. Also, a single statement that updates multiple rows (e.g. a bulk UPDATE) acquires locks row by row, and the order is not guaranteed unless you add ORDER BY — which most databases don't support in UPDATE."],
["How does the database detect a deadlock?","It maintains a wait-for graph. When a transaction requests a lock it can't get, an edge is added from the requester to the holder. Periodically (or on each lock request), the database checks for cycles in this graph. If a cycle is found, one transaction is chosen as the victim and aborted. PostgreSQL checks after deadlock_timeout (default 1s) to avoid the overhead of checking on every lock wait."]
],
exit:"Explain MVCC in both databases, then describe how you'd prevent and handle deadlocks in a transfer service."},

{d:24,wk:4,prio:"P0",title:"Indexing I — B-trees, Selectivity & Composite Indexes",
obj:"Design the right index for any query, and know why an index isn't being used.",
core:`<h4>What a B-tree index actually is</h4>
<pre><code> [ 50 | 100 ]
/ | \\
[10|25] [60|80] [120|150]
/ | \\ / | \\ / | \\
leaf nodes hold (key → row pointer), linked left-to-right</code></pre>
<ul>
<li><b>Balanced</b> — all leaves at the same depth. Lookup is O(log n) with a high branching factor, so a 100M-row table is ~4 levels deep.</li>
<li><b>Sorted</b> — supports range scans, ORDER BY, and prefix matching.</li>
<li><b>Linked leaves</b> — range scans walk sideways rather than re-descending.</li>
<li><b>High fanout</b> — each node holds hundreds of keys, so the tree stays shallow. That's why the top levels stay in memory and lookups are often 1–2 disk reads.</li>
</ul>

<h4>Index types compared</h4>
<table><thead><tr><th>Type</th><th>Supports</th><th>Use when</th></tr></thead><tbody>
<tr><td><b>B-tree</b> (default)</td><td><code>=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>BETWEEN</code>, <code>LIKE 'x%'</code>, <code>ORDER BY</code></td><td>Default. Use unless you have a specific reason not to.</td></tr>
<tr><td><b>Hash</b></td><td><code>=</code> only</td><td>Rarely worth it — B-tree is nearly as fast for equality and far more flexible.</td></tr>
<tr><td><b>GIN</b></td><td>Arrays, JSONB, full-text, trigrams</td><td>Containment (<code>@&gt;</code>), full-text search, fuzzy matching</td></tr>
<tr><td><b>GiST</b></td><td>Geometric, range types, nearest-neighbour</td><td>PostGIS, range exclusion constraints</td></tr>
<tr><td><b>BRIN</b></td><td>Naturally-ordered large tables</td><td>Time-series and append-only logs — tiny index</td></tr>
<tr><td><b>Partial</b></td><td>Any type, with a WHERE clause</td><td>You only query a subset — much smaller and faster</td></tr>
<tr><td><b>Covering</b></td><td>Includes extra columns</td><td>The query can be answered from the index alone</td></tr>
</tbody></table>

<h4>Selectivity — the concept that drives everything</h4>
<pre><code>selectivity = distinct values / total rows

-- High selectivity (good for indexing)
email column: 1,000,000 distinct / 1,000,000 rows = 1.0

-- Low selectivity (bad for indexing)
status column with 3 values: 3 / 1,000,000 = 0.000003
is_active boolean: 2 / 1,000,000 = 0.000002</code></pre>
<p><b>Why it matters:</b> an index on a low-selectivity column rarely helps, because the query returns such a large fraction of the table that a sequential scan is cheaper than index lookups plus random I/O. A boolean column index is almost always useless.</p>
<div class="box"><div class="t">The exception</div>A <b>partial index</b> on a low-selectivity column can be excellent. <code>CREATE INDEX ON orders (created_at) WHERE status = 'PENDING'</code> indexes only pending orders — which is a tiny, highly selective subset. This is how you index a status column usefully.</div>

<h4>Composite indexes and the leftmost-prefix rule</h4>
<pre><code>CREATE INDEX idx_orders ON orders (customer_id, status, created_at);</code></pre>
<table><thead><tr><th>Query WHERE clause</th><th>Uses index?</th><th>Why</th></tr></thead><tbody>
<tr><td><code>customer_id = ?</code></td><td>✓</td><td>Leftmost prefix</td></tr>
<tr><td><code>customer_id = ? AND status = ?</code></td><td>✓</td><td>First two columns</td></tr>
<tr><td><code>customer_id = ? AND status = ? AND created_at &gt; ?</code></td><td>✓ fully</td><td>All three; range on last is fine</td></tr>
<tr><td><code>status = ?</code></td><td>✗</td><td>Skips the leftmost column</td></tr>
<tr><td><code>status = ? AND created_at &gt; ?</code></td><td>✗</td><td>Same</td></tr>
<tr><td><code>customer_id = ? AND created_at &gt; ?</code></td><td>Partial</td><td>Uses customer_id, then filters created_at</td></tr>
</tbody></table>
<p><b>Column order rule:</b> equality columns first (in any order among themselves), then range columns. Once a range condition is used, subsequent columns can't be used for seeking — only for filtering within the index.</p>
<pre><code>-- Good: equality then range
CREATE INDEX ON events (tenant_id, event_type, occurred_at);
-- WHERE tenant_id=? AND event_type=? AND occurred_at > ?

-- Bad: range before equality
CREATE INDEX ON events (occurred_at, tenant_id, event_type);
-- The range on occurred_at prevents seeking on the other columns</code></pre>

<h4>Covering indexes</h4>
<pre><code>-- Query
SELECT customer_id, total FROM orders WHERE customer_id = ? AND status = 'PAID';

-- Non-covering: index lookup, then heap fetch for `total`
CREATE INDEX ON orders (customer_id, status);

-- Covering: index contains everything needed
CREATE INDEX ON orders (customer_id, status) INCLUDE (total);

-- Or make it a key column (allows ordering by total too)
CREATE INDEX ON orders (customer_id, status, total);</code></pre>
<p><b>Why INCLUDE vs a key column:</b> INCLUDE columns aren't part of the sort order and don't count toward the key size limit. Use INCLUDE for columns you only need to read; use key columns for columns you filter or sort on. An index-only scan can be 10–100× faster than an index scan plus heap fetch on a large table.</p>

<h4>Why an index isn't used — the checklist</h4>
<ol>
<li><b>Function on the column.</b> <code>WHERE DATE(created_at) = '2025-01-01'</code> can't use an index on <code>created_at</code>. Rewrite as a range.</li>
<li><b>Leading wildcard.</b> <code>LIKE '%smith'</code> can't use a B-tree. Use a trigram index (GIN with <code>pg_trgm</code>) or full-text search.</li>
<li><b>Implicit type cast.</b> <code>WHERE user_id = '123'</code> when user_id is an integer may force a cast that prevents index use.</li>
<li><b>Low selectivity.</b> The planner correctly decides a seq scan is cheaper.</li>
<li><b>Stale statistics.</b> Run <code>ANALYZE</code>.</li>
<li><b>Leftmost-prefix violation.</b> Query doesn't include the first column.</li>
<li><b>OR conditions on different columns.</b> Often prevents index use; rewrite as UNION.</li>
<li><b>NOT IN / NOT EQUAL.</b> <code>!=</code> usually can't use an index effectively.</li>
</ol>
<pre><code>-- BAD: function on column
WHERE DATE(created_at) = '2025-01-01'

-- GOOD: sargable range
WHERE created_at &gt;= '2025-01-01' AND created_at &lt; '2025-01-02'

-- BAD: implicit cast
WHERE user_id = '123' -- user_id is integer

-- GOOD
WHERE user_id = 123

-- BAD: OR across columns
WHERE email = ? OR phone = ?

-- GOOD: UNION of two indexed lookups
SELECT ... WHERE email = ?
UNION
SELECT ... WHERE phone = ?</code></pre>
<p><b>"Sargable"</b> means Search ARGument able — the predicate can be used to seek in the index. This word is worth knowing; it appears in DBA interviews and marks you as someone who's read beyond the basics.</p>

<h4>Index costs</h4>
<ul>
<li><b>Write amplification.</b> Every INSERT/UPDATE/DELETE must update every affected index. A table with 8 indexes writes 9 times.</li>
<li><b>Storage.</b> Indexes can exceed the table size on wide tables with many indexes.</li>
<li><b>Vacuum cost.</b> More indexes means more work for autovacuum.</li>
<li><b>Planner time.</b> More indexes means more options to evaluate.</li>
</ul>
<div class="box o"><div class="t">The discipline</div>"I audit indexes quarterly. Any index with zero scans in <code>pg_stat_user_indexes</code> gets dropped — it's pure write overhead for no benefit. The rule is: every index must justify itself against a specific query pattern, and unused indexes are removed."</div>

<h4>Finding unused indexes</h4>
<pre><code>SELECT schemaname, relname, indexrelname, idx_scan
FROM pg_stat_user_indexes
WHERE idx_scan = 0
AND indexrelname NOT LIKE '%_pkey'
ORDER BY pg_relation_size(indexrelid) DESC;</code></pre>`,

drill:["Create a table with 1M rows. Add a composite index. Run EXPLAIN on five queries — three that use it, two that don't. Explain each.",
"Convert a non-sargable query to sargable and measure the difference with EXPLAIN ANALYZE.",
"Create a partial index on a status column. Compare its size and query performance against a full index."],

qa:[
["Why is an index on a boolean column usually useless?","Because it's the lowest possible selectivity — at most 2 distinct values across the whole table. A query for <code>is_active = true</code> might match 50% of rows. The planner correctly determines that reading 50% of the table via random index lookups is slower than a sequential scan, so it ignores the index. The exception is a partial index on the rare value: <code>WHERE is_active = false</code> might index only 0.1% of rows and be extremely effective."],
["What's the difference between a clustered and a non-clustered index?","A clustered index determines the physical order of rows on disk — there can only be one, and in InnoDB it's the primary key. In PostgreSQL, the CLUSTER command physically reorders a table to match an index once, but it's not maintained. A non-clustered index is a separate structure with pointers back to the rows. InnoDB's secondary indexes store the primary key value, so a secondary lookup requires a second traversal — unless the index is covering."],
["How does the query planner decide whether to use an index?","It estimates the cost of each plan using table statistics (row count, distinct values, histograms) and cost constants (random page cost, sequential page cost). For an index scan it estimates the number of matching rows, multiplies by the cost of random I/O, and adds the tree traversal. For a sequential scan it estimates the total pages and multiplies by sequential I/O cost. It picks the lower number. If statistics are stale or the estimate is wrong, you get a bad plan."],
["When would a query with a LIMIT not use an index?","When the ORDER BY doesn't match an index, so the database must sort everything before taking the first N. <code>SELECT * FROM orders ORDER BY total LIMIT 10</code> without an index on total does a full scan and sort. Adding <code>CREATE INDEX ON orders (total)</code> lets it walk the index and stop after 10 rows. This is one of the highest-value indexes you can add — a top-N query on a large table."],
["Why can more indexes make writes slower, and how do you manage that trade-off?","Every write must update every index that includes the changed columns, and an INSERT touches every index on the table. A table with 10 indexes does 11 writes per insert. The trade-off is: index the queries that matter, drop the ones that don't. I'd look at <code>pg_stat_user_indexes</code> for indexes with zero scans, check which indexes are redundant (a single-column index on <code>a</code> is redundant if you have a composite on <code>(a, b)</code>), and drop them. Quarterly index audits are worth the time."]
],
exit:"Explain the leftmost-prefix rule and name five reasons an index isn't used, in 90 seconds."},

{d:25,wk:4,prio:"P0",title:"Indexing II — Reading EXPLAIN Like a Pro",
obj:"Read any query plan and identify the bottleneck in under two minutes.",
core:`<h4>EXPLAIN vs EXPLAIN ANALYZE</h4>
<pre><code>EXPLAIN SELECT ...; -- estimates only, doesn't run the query
EXPLAIN ANALYZE SELECT ...; -- actually runs it, shows real timings and row counts
EXPLAIN (ANALYZE, BUFFERS) ...; -- + I/O statistics ← use this</code></pre>
<div class="box b"><div class="t">Never optimise from EXPLAIN alone</div>Estimates can be wildly wrong, especially with correlated columns or stale statistics. <code>EXPLAIN ANALYZE</code> shows what actually happened. A plan that looks expensive might be cheap in reality, and vice versa. Always use ANALYZE when you're investigating a real performance problem.</div>

<h4>Reading a plan — the structure</h4>
<pre><code>EXPLAIN (ANALYZE, BUFFERS)
SELECT c.name, count(o.id)
FROM customers c JOIN orders o ON o.customer_id = c.id
WHERE o.created_at &gt; now() - interval '30 days'
GROUP BY c.name;

HashAggregate (cost=1240.50..1250.50 rows=1000 width=40)
(actual time=45.2..46.1 rows=872 loops=1)
Group Key: c.name
Buffers: shared hit=520 read=34
-&gt; Hash Join (cost=120.00..1190.00 rows=10000 width=36)
(actual time=3.1..38.4 rows=9241 loops=1)
Hash Cond: (o.customer_id = c.id)
-&gt; Index Scan using idx_orders_created on orders o
(cost=0.43..980.00 rows=10000 width=16)
(actual time=0.02..22.1 rows=9241 loops=1)
Index Cond: (created_at &gt; (now() - '30 days'::interval))
Buffers: shared hit=180 read=28
-&gt; Hash (cost=80.00..80.00 rows=2000 width=36)
(actual time=2.8..2.8 rows=2000 loops=1)
-&gt; Seq Scan on customers c
(cost=0.00..80.00 rows=2000 width=36)
(actual time=0.01..1.9 rows=2000 loops=1)</code></pre>

<h4>What each number means</h4>
<table><thead><tr><th>Field</th><th>Meaning</th><th>What to watch for</th></tr></thead><tbody>
<tr><td><code>cost=0.43..980.00</code></td><td>Estimated startup..total cost in arbitrary units</td><td>Relative comparison only, not milliseconds</td></tr>
<tr><td><code>rows=10000</code></td><td>Estimated rows</td><td>Compare to actual — big gaps mean bad statistics</td></tr>
<tr><td><code>actual time=0.02..22.1</code></td><td>Real startup..total milliseconds</td><td>The number that matters</td></tr>
<tr><td><code>rows=9241</code></td><td>Actual rows returned</td><td>Estimate 10000 vs actual 9241 — good estimate</td></tr>
<tr><td><code>loops=1</code></td><td>How many times this node executed</td><td><b>Multiply actual time by loops</b> — a nested loop with loops=5000 and 0.1ms is 500ms total</td></tr>
<tr><td><code>Buffers: shared hit=180 read=28</code></td><td>Pages from cache vs from disk</td><td>High <code>read</code> means disk I/O — the real cost</td></tr>
</tbody></table>
<div class="box w"><div class="t">The loops trap</div>A node showing <code>actual time=0.05..0.05 rows=1 loops=5000</code> looks instant, but it ran 5000 times for a total of 250ms. <b>Always multiply by loops.</b> This is the most common mistake when reading plans and it hides the actual bottleneck in nested loop joins.</div>

<h4>Scan types — from best to worst</h4>
<table><thead><tr><th>Node</th><th>What it does</th><th>When it's fine</th><th>When it's a problem</th></tr></thead><tbody>
<tr><td><b>Index Only Scan</b></td><td>Reads only the index, never touches the table</td><td>Always good</td><td>Never</td></tr>
<tr><td><b>Index Scan</b></td><td>Walks the index, fetches rows from the heap</td><td>Selective queries</td><td>When it returns many rows — random I/O dominates</td></tr>
<tr><td><b>Bitmap Index Scan → Bitmap Heap Scan</b></td><td>Builds a bitmap of matching pages, then reads them in order</td><td>Medium selectivity — avoids random I/O</td><td>Very large result sets where the bitmap itself is expensive</td></tr>
<tr><td><b>Seq Scan</b></td><td>Reads the whole table</td><td>Small tables, or queries returning most rows</td><td>Large table with a selective filter — missing index</td></tr>
</tbody></table>
<p><b>Bitmap scans</b> are the middle ground and worth understanding. If a query matches 5% of a large table, an index scan does 5% of rows as random I/O — slow. A seq scan reads 100% sequentially — also slow. A bitmap scan reads the index, builds a bitmap of which pages contain matches, then reads those pages in physical order. Much better than random I/O, much less than a full scan.</p>

<h4>Join types</h4>
<table><thead><tr><th>Join</th><th>Algorithm</th><th>Best when</th><th>Watch for</th></tr></thead><tbody>
<tr><td><b>Nested Loop</b></td><td>For each row in outer, scan inner</td><td>Outer is small, inner has an index</td><td><code>loops</code> &gt; 1000 with non-trivial inner cost</td></tr>
<tr><td><b>Hash Join</b></td><td>Build a hash of the smaller side, probe with the larger</td><td>Large tables, equality join</td><td>Hash table doesn't fit in <code>work_mem</code> → spills to disk</td></tr>
<tr><td><b>Merge Join</b></td><td>Sort both sides, merge</td><td>Both inputs already sorted (indexed)</td><td>Sorting cost if inputs aren't sorted</td></tr>
</tbody></table>
<div class="box o"><div class="t">The nested loop diagnostic</div>If you see a nested loop with high <code>loops</code> and the inner side is a Seq Scan, that's an N+1 in SQL form — the database is scanning a table once per outer row. The fix is an index on the join column, or forcing a hash join by fixing statistics so the planner estimates correctly.</div>

<h4>The five things to look for, in order</h4>
<ol>
<li><b>Rows estimate vs actual.</b> If estimated 100 and actual 500,000, statistics are stale or the columns are correlated. Run <code>ANALYZE</code>; if it persists, consider extended statistics (<code>CREATE STATISTICS</code>).</li>
<li><b>Seq Scan on a large table with a selective filter.</b> Missing index, or a non-sargable predicate.</li>
<li><b>Nested Loop with high loops.</b> Missing index on the join column.</li>
<li><b>Sort with <code>Sort Method: external merge Disk</code>.</b> The sort spilled to disk. Increase <code>work_mem</code>, or add an index that provides the order.</li>
<li><b>High <code>read</code> in Buffers.</b> Disk I/O. Could be a cold cache, a large scan, or genuinely too much data.</li>
</ol>

<h4>Diagnosing the "estimated vs actual" gap</h4>
<pre><code>-- Refresh statistics
ANALYZE orders;

-- For correlated columns, create extended statistics
CREATE STATISTICS orders_city_state (dependencies, ndistinct)
ON city, state FROM orders;
ANALYZE orders;</code></pre>
<p><b>Why correlation matters:</b> if you have <code>city</code> and <code>state</code> columns, the planner assumes they're independent. It estimates <code>city='Portland' AND state='OR'</code> as (rows matching Portland) × (rows matching OR) / total. But Portland OR and Portland ME are different — the real selectivity is much higher than the estimate. Extended statistics tell the planner about the correlation, producing a correct estimate and a better plan.</p>

<h4>The workflow for a slow query</h4>
<ol>
<li><b>Get the actual plan</b> with <code>EXPLAIN (ANALYZE, BUFFERS)</code>.</li>
<li><b>Find the node with the highest actual time × loops.</b> That's your bottleneck.</li>
<li><b>Check if it's a scan or a join.</b> Scans → indexing. Joins → index on the join column or better statistics.</li>
<li><b>Check the estimates.</b> If they're off by 10×, fix statistics before doing anything else — a bad estimate produces a bad plan regardless of indexes.</li>
<li><b>Make one change and re-measure.</b> Never change multiple things at once.</li>
<li><b>Verify the plan changed.</b> If the planner still chooses the old plan, your index isn't usable or isn't selective enough.</li>
</ol>

<h4>Common fixes ranked by impact</h4>
<ol>
<li><b>Add a missing index</b> on the filter or join column. Usually the biggest win.</li>
<li><b>Fix statistics</b> — <code>ANALYZE</code>, or extended statistics for correlated columns.</li>
<li><b>Rewrite non-sargable predicates</b> so the index can be used.</li>
<li><b>Add a covering index</b> to eliminate heap fetches.</li>
<li><b>Increase <code>work_mem</code></b> for sorts and hash joins that spill to disk.</li>
<li><b>Partition the table</b> if queries are naturally scoped by a column.</li>
<li><b>Denormalise</b> — last resort, but sometimes correct for a hot read path.</li>
</ol>`,

drill:["Run EXPLAIN (ANALYZE, BUFFERS) on five queries from your own work. Identify the bottleneck node in each.",
"Create a nested loop with high loops. Add the missing index. Watch the plan change to a hash join.",
"Force an external merge sort by setting work_mem very low. Then raise it and observe the plan change."],

qa:[
["Why does the planner sometimes choose a seq scan even when an index exists?","Because it estimates the cost and finds the index more expensive. If a query matches 30% of a table, an index scan does 30% of rows as random I/O — far slower than reading the whole table sequentially. The planner is usually right. If you believe it's wrong, check the estimates: a bad row estimate is the most common cause of a bad plan choice."],
["What does 'Buffers: shared hit=1000 read=500' tell you?","1000 pages were served from the shared buffer cache (in memory), and 500 had to be read from disk. The read count is where the time goes — disk I/O is orders of magnitude slower than memory. A high read number means either a cold cache or a scan large enough that the data doesn't fit. Re-running the same query immediately will show mostly hits, which tells you the OS and database caches are working."],
["How do you diagnose a query that's fast in staging but slow in production?","First, compare the plans — use EXPLAIN (ANALYZE, BUFFERS) in both. The usual culprits: different data volumes (staging has 10,000 rows, production has 100 million, so the planner picks a different plan), different statistics, different indexes (someone added one in staging and forgot), or a cold cache. I'd also check whether the query is hitting a different plan due to parameter sniffing — PostgreSQL 12+ handles this better with generic plans, but it can still happen."],
["What's the difference between work_mem and shared_buffers?","<code>shared_buffers</code> is the database's page cache — how much of the data files it keeps in memory, shared across all connections. <code>work_mem</code> is per-operation memory for sorts and hash joins — each sort or hash gets its own allocation, per connection. Setting work_mem too high with many connections can exhaust server memory. A common mistake is setting work_mem to 1GB globally when 100 connections means potentially 100GB of allocation."],
["Why does the same query sometimes use an index and sometimes not?","Because the planner's cost estimate depends on the parameter values. A query for a rare value might use an index; the same query for a common value might prefer a seq scan. This is called parameter sensitivity, and it's why PostgreSQL 12 introduced plan caching heuristics. The practical implication: always test with realistic parameter values, not just one example."]
],
exit:"Read a real EXPLAIN ANALYZE plan aloud in 90 seconds — identify the bottleneck node, explain the estimates, and propose the fix."},

{d:26,wk:4,prio:"P0",title:"Query Optimization, Sharding & Partitioning",
obj:"Reduce a slow query to fast, and choose a shard key with justification.",
core:`<h4>The optimization checklist — in order</h4>
<ol>
<li><b>Measure.</b> <code>EXPLAIN (ANALYZE, BUFFERS)</code>. No guessing.</li>
<li><b>Fix the estimates.</b> If estimated vs actual rows differ by 10×, run <code>ANALYZE</code>. A bad estimate produces a bad plan regardless of indexes.</li>
<li><b>Add missing indexes</b> on filter and join columns.</li>
<li><b>Make predicates sargable.</b> No functions on indexed columns, no leading wildcards, no implicit casts.</li>
<li><b>Fix N+1 at the application layer.</b> No index saves you from 10,000 queries.</li>
<li><b>Reduce rows early.</b> Filter before joining when the planner doesn't do it for you.</li>
<li><b>Fetch only needed columns.</b> <code>SELECT *</code> prevents index-only scans and transfers data you don't use.</li>
<li><b>Consider a covering index.</b> If a hot query reads the same 4 columns, include them.</li>
<li><b>Denormalise for read-heavy paths</b> — but only after measuring and only with a plan to keep it consistent.</li>
<li><b>Partition large tables</b> when queries are naturally scoped by a column.</li>
</ol>

<h4>Rewriting queries that resist indexing</h4>
<pre><code>-- OR across columns → UNION
-- BAD
SELECT * FROM users WHERE email = ? OR phone = ?;
-- GOOD (two index lookups)
SELECT * FROM users WHERE email = ?
UNION
SELECT * FROM users WHERE phone = ?;

-- NOT IN with a subquery → NOT EXISTS (often faster, handles NULLs correctly)
-- BAD
SELECT * FROM orders WHERE customer_id NOT IN (SELECT id FROM blocked);
-- GOOD
SELECT o.* FROM orders o
WHERE NOT EXISTS (SELECT 1 FROM blocked b WHERE b.id = o.customer_id);

-- Correlated subquery → JOIN
-- BAD
SELECT c.name,
(SELECT count(*) FROM orders o WHERE o.customer_id = c.id) AS cnt
FROM customers c;
-- GOOD
SELECT c.name, coalesce(o.cnt, 0)
FROM customers c
LEFT JOIN (SELECT customer_id, count(*) cnt FROM orders GROUP BY customer_id) o
ON o.customer_id = c.id;

-- LIKE with leading wildcard → trigram index
CREATE EXTENSION pg_trgm;
CREATE INDEX ON users USING gin (name gin_trgm_ops);
-- now LIKE '%smith%' can use the index</code></pre>

<h4>Pagination — OFFSET is a trap</h4>
<pre><code>-- BAD: OFFSET 1000000 means the database reads and discards 1M rows
SELECT * FROM orders ORDER BY id LIMIT 20 OFFSET 1000000;

-- GOOD: keyset pagination — seek directly to the position
SELECT * FROM orders WHERE id &gt; :lastSeenId ORDER BY id LIMIT 20;</code></pre>
<div class="box o"><div class="t">Why keyset pagination is O(1) and OFFSET is O(n)</div>OFFSET requires the database to generate and discard all preceding rows. At offset 1,000,000, that's a million rows of work for 20 results. Keyset pagination uses the index to seek directly to the starting position — the cost is the same regardless of how deep you are. The trade-off: no random page access (you can't jump to page 500), and you need a stable, unique sort key. For infinite-scroll UIs and APIs, keyset is the correct choice.</div>

<h4>Partitioning</h4>
<pre><code>-- Range partitioning by month
CREATE TABLE orders (
id bigserial,
created_at timestamptz NOT NULL,
customer_id bigint NOT NULL,
total numeric(12,2)
) PARTITION BY RANGE (created_at);

CREATE TABLE orders_2025_01 PARTITION OF orders
FOR VALUES FROM ('2025-01-01') TO ('2025-02-01');
CREATE TABLE orders_2025_02 PARTITION OF orders
FOR VALUES FROM ('2025-02-01') TO ('2025-03-01');

-- Hash partitioning by tenant
CREATE TABLE events (...) PARTITION BY HASH (tenant_id);
CREATE TABLE events_p0 PARTITION OF events FOR VALUES WITH (MODULUS 4, REMAINDER 0);</code></pre>
<table><thead><tr><th>Strategy</th><th>Use when</th><th>Benefit</th></tr></thead><tbody>
<tr><td><b>Range (time)</b></td><td>Queries filter by date; old data can be archived</td><td>Partition pruning; drop old partitions instantly</td></tr>
<tr><td><b>Hash</b></td><td>Even distribution needed; no natural range</td><td>Balanced I/O; parallel maintenance</td></tr>
<tr><td><b>List</b></td><td>Discrete values (region, status)</td><td>Natural grouping</td></tr>
</tbody></table>
<p><b>Partition pruning</b> is the payoff: a query with <code>WHERE created_at &gt;= '2025-03-01'</code> only scans the March and later partitions. The planner skips the rest entirely. On a table with 60 monthly partitions, that's a 60× reduction in data scanned.</p>
<p><b>The retention benefit</b> is equally important: <code>DROP TABLE orders_2024_01</code> is instantaneous. <code>DELETE FROM orders WHERE created_at &lt; '2024-02-01'</code> on 100M rows takes hours and generates enormous WAL.</p>
<div class="box w"><div class="t">Partitioning gotchas</div>
<ul>
<li><b>Unique constraints must include the partition key.</b> You can't have a globally unique index on a non-partition column. This surprises people who want a global unique ID.</li>
<li><b>Too many partitions is worse than none.</b> PostgreSQL handles hundreds well; tens of thousands degrades planning time.</li>
<li><b>Cross-partition queries are slower.</b> A query without a partition-key filter must scan every partition.</li>
<li><b>Foreign keys across partitions</b> have limitations.</li>
</ul></div>

<h4>Sharding — when partitioning isn't enough</h4>
<p>Partitioning splits a table within one database. Sharding splits data across multiple databases. You shard when:</p>
<ul>
<li>Write throughput exceeds what a single primary can handle.</li>
<li>Data volume exceeds what fits on one machine (or one machine's backup window).</li>
<li>Geographic distribution requires data locality.</li>
</ul>

<h4>Choosing a shard key — the most consequential decision</h4>
<table><thead><tr><th>Key</th><th>Pros</th><th>Cons</th></tr></thead><tbody>
<tr><td><b>User ID</b></td><td>Even distribution; all of a user's data on one shard</td><td>Hot users; cross-user queries need scatter-gather</td></tr>
<tr><td><b>Tenant ID</b></td><td>Natural isolation; easy to move a tenant</td><td>Skewed if tenants differ wildly in size</td></tr>
<tr><td><b>Time</b></td><td>Natural for time-series; old shards become read-only</td><td>All writes hit the newest shard — hotspot</td></tr>
<tr><td><b>Geographic</b></td><td>Data residency compliance; low latency</td><td>Uneven population distribution</td></tr>
<tr><td><b>Hash of ID</b></td><td>Even distribution guaranteed</td><td>Range queries hit all shards</td></tr>
</tbody></table>
<div class="box"><div class="t">The shard-key criteria</div>A good shard key satisfies three things:<br>
<b>1. High cardinality</b> — enough distinct values to distribute evenly.<br>
<b>2. Even access distribution</b> — no single value dominates traffic.<br>
<b>3. Matches the query pattern</b> — most queries can be answered from one shard.<br><br>
Criterion 3 is the one people forget. If every query needs data from all shards, you've built a distributed system with none of the benefits.</div>

<h4>Resharding — the cost you must plan for</h4>
<pre><code>-- Naive modulo: adding one shard moves almost everything
shard = hash(key) % 4; → shard = hash(key) % 5; // ~80% of keys move

-- Consistent hashing: adding one node moves ~1/N of keys
// virtual nodes on a ring; each key maps to the next node clockwise
// adding a node takes over a slice from its neighbours only</code></pre>
<p><b>Consistent hashing</b> is the standard answer, but it has costs: more complex routing, and without virtual nodes the distribution can be uneven. The pragmatic alternative is a <b>directory service</b> — a lookup table mapping key ranges to shards — which allows arbitrary rebalancing but introduces a dependency and a single point of failure.</p>

<h4>Cross-shard operations — the hard parts</h4>
<ul>
<li><b>Cross-shard joins.</b> Not possible in the database. You either denormalise, or do the join in the application after fetching from both shards.</li>
<li><b>Cross-shard transactions.</b> No ACID across shards. You need Saga with compensations, or accept eventual consistency.</li>
<li><b>Cross-shard aggregations.</b> <code>SELECT count(*)</code> becomes a scatter-gather across all shards plus a merge. Expensive.</li>
<li><b>Global unique IDs.</b> Auto-increment doesn't work across shards. Use UUIDs, Snowflake IDs, or a sequence service.</li>
</ul>

<h4>The honest answer</h4>
<div class="box o"><div class="t">Say this</div>"Sharding is a last resort. Before sharding, I'd exhaust: indexing, query optimization, read replicas for read scaling, caching, partitioning within one database, and vertical scaling. A single well-tuned PostgreSQL instance with 64 cores and 512GB of RAM handles a surprising amount — well into the tens of thousands of writes per second. Sharding costs you joins, transactions, and a large amount of operational complexity. I'd only shard when I've measured that one machine genuinely cannot handle the load."</div>`,

drill:["Rewrite an OFFSET-based pagination as keyset pagination. Measure the difference at offset 1,000,000.",
"Convert a NOT IN subquery to NOT EXISTS. Compare plans.",
"Design a shard key for a multi-tenant SaaS. Justify it against three alternatives."],

qa:[
["Why is keyset pagination faster than OFFSET?","Because OFFSET requires generating and discarding all preceding rows. At offset 1,000,000, the database reads a million rows to return twenty. Keyset pagination uses <code>WHERE id &gt; lastSeenId</code>, which the index can seek to directly — constant cost regardless of depth. The trade-off is you can't jump to an arbitrary page number, which matters for some UIs but not for infinite scroll or API cursors."],
["What's the difference between partitioning and sharding?","Partitioning splits one logical table into multiple physical pieces within a single database. The database handles routing transparently, and you keep joins and transactions. Sharding splits data across multiple databases, which requires application-level routing and loses cross-shard joins and transactions. Partitioning is a performance and manageability tool; sharding is a scaling tool with significant costs."],
["How do you handle a global unique ID across shards?","Options: UUIDv7 (time-ordered, no coordination), Snowflake-style IDs (timestamp + machine ID + sequence, 64-bit, sortable), or a dedicated sequence service. I'd prefer UUIDv7 or Snowflake because they're generated locally without a network call and are roughly time-ordered, which keeps index inserts efficient. A central sequence service becomes a bottleneck and a single point of failure."],
["What's the biggest risk of a bad shard key?","A hotspot. If you shard by time, all writes hit the newest shard and the others sit idle. If you shard by customer and one customer is 40% of your traffic, one shard melts. The second risk is query patterns that don't match the key — if every query needs data from all shards, you've built a distributed system with none of the benefits and all of the costs. Choosing the key is the whole design."],
["When would you denormalise?","When a read path is hot enough that the join cost is the bottleneck, and when the data being duplicated changes rarely. I'd denormalise with a specific plan for keeping the copy consistent — either synchronously in the same transaction, or asynchronously via an event with a reconciliation job. Denormalising without a consistency plan is how you get data that silently drifts."]
],
exit:"Explain keyset pagination, the shard-key criteria, and why sharding is a last resort, in 2 minutes."},

{d:27,wk:4,prio:"P0",title:"Replication, SQL vs NoSQL & CAP in Practice",
obj:"Choose a database with justification, and explain replication lag and failover.",
core:`<h4>Replication modes</h4>
<table><thead><tr><th>Mode</th><th>Behaviour</th><th>Risk</th><th>Use when</th></tr></thead><tbody>
<tr><td><b>Asynchronous</b></td><td>Primary commits immediately; replicas catch up</td><td>Failover loses recent transactions</td><td>Default for most workloads</td></tr>
<tr><td><b>Synchronous</b></td><td>Primary waits for replica acknowledgement</td><td>Replica failure blocks writes</td><td>Zero data loss required, and you accept the latency</td></tr>
<tr><td><b>Quorum (semi-sync)</b></td><td>Wait for N of M replicas</td><td>Latency of the slowest of N</td><td>Balance of safety and speed — <code>synchronous_standby_names = ANY 1 (r1, r2)</code></td></tr>
</tbody></table>
<pre><code>-- PostgreSQL synchronous setup
synchronous_commit = on
synchronous_standby_names = 'ANY 1 (replica1, replica2)'
-- wait for at least one of the two replicas</code></pre>

<h4>Replication lag — the read-after-write problem</h4>
<pre><code>// User updates their profile
user.setName("New Name");
userRepo.save(user); // writes to primary

// Immediately redirects to the profile page, which reads from a replica
return userRepo.findById(user.getId()); // replica hasn't caught up → OLD NAME</code></pre>
<p><b>This is the single most common replication bug.</b> Users see their own writes disappear, refresh, and see them appear — an infuriating experience.</p>
<p><b>The fixes:</b></p>
<ol>
<li><b>Read from primary after a write</b> for a short window (a few hundred milliseconds to a few seconds), typically keyed by session or user.</li>
<li><b>Return the authoritative value in the write response</b> so the client doesn't need to re-read.</li>
<li><b>Monotonic read token</b> — track the last write's log position and require the replica to have caught up.</li>
<li><b>Sticky sessions to primary</b> for authenticated users, replicas for anonymous traffic.</li>
</ol>
<pre><code>// Spring's AbstractRoutingDataSource approach
boolean preferPrimary = lastWriteTime.isAfter(Instant.now().minusSeconds(2));</code></pre>

<h4>Failover and split-brain</h4>
<p><b>Split-brain</b> is the nightmare: two nodes both believe they're the primary, both accept writes, and the data diverges irreconcilably.</p>
<p><b>Prevention:</b></p>
<ul>
<li><b>Quorum.</b> A node can only become primary if it can reach a majority of the cluster. With 3 nodes, one partition of 1 can't elect; a partition of 2 can.</li>
<li><b>Fencing (STONITH).</b> Shoot The Other Node In The Head — forcibly power off the old primary before promoting a new one. Prevents the old primary from continuing to accept writes.</li>
<li><b>Lease-based leadership.</b> The leader holds a time-limited lease; if it can't renew, it stops accepting writes voluntarily.</li>
<li><b>Consensus-based coordination.</b> etcd, ZooKeeper, or Patroni managing the failover with a quorum.</li>
</ul>
<div class="box b"><div class="t">The classic incident</div>A network partition separates the primary from the replicas but the primary can still reach the application. The application keeps writing to it. Meanwhile, the orchestrator promotes a replica to primary and points new traffic there. Now two primaries accept writes. When the partition heals, the data conflicts are unresolvable — one set of writes must be discarded. <b>Fencing is what prevents this</b>, and it's why managed databases are worth the cost.</div>

<h4>SQL vs NoSQL — the decision framework</h4>
<table><thead><tr><th>Category</th><th>Examples</th><th>Best for</th><th>Avoid when</th></tr></thead><tbody>
<tr><td><b>Relational</b></td><td>PostgreSQL, MySQL, Oracle</td><td>Complex queries, joins, transactions, strong consistency</td><td>Extreme write scale, schema-less data</td></tr>
<tr><td><b>Document</b></td><td>MongoDB, Couchbase, Firestore</td><td>Flexible schema, nested data, catalogs</td><td>Multi-document transactions at scale</td></tr>
<tr><td><b>Key-value</b></td><td>Redis, DynamoDB, Riak</td><td>Caching, sessions, simple lookups, extreme scale</td><td>Complex queries, relationships</td></tr>
<tr><td><b>Wide-column</b></td><td>Cassandra, HBase, ScyllaDB</td><td>Time-series, write-heavy, known access patterns</td><td>Ad-hoc queries, frequent updates</td></tr>
<tr><td><b>Graph</b></td><td>Neo4j, Neptune</td><td>Relationship-heavy: social, recommendations, fraud rings</td><td>Simple CRUD, tabular data</td></tr>
<tr><td><b>Search</b></td><td>Elasticsearch, OpenSearch</td><td>Full-text search, log analytics, faceted search</td><td>Primary data store — not durable enough</td></tr>
<tr><td><b>Time-series</b></td><td>InfluxDB, TimescaleDB, Prometheus</td><td>Metrics, IoT, monitoring</td><td>Transactional workloads</td></tr>
</tbody></table>

<div class="box o"><div class="t">The default answer</div>"I default to PostgreSQL until I have a specific, measured reason not to. It handles JSONB, full-text search, geospatial, and time-series reasonably well — so it covers most workloads. I'd reach for a specialised store when I have a concrete constraint: write throughput beyond what one primary can handle, a query pattern SQL serves poorly, or a scale that makes sharding necessary. Choosing NoSQL for 'flexibility' is usually a mistake — you lose joins, transactions, and forty years of tooling to avoid designing a schema."</div>

<h4>CAP in practice — what you actually choose</h4>
<table><thead><tr><th>System</th><th>PACELC</th><th>Practical implication</th></tr></thead><tbody>
<tr><td>PostgreSQL (sync replica)</td><td>PC/EC</td><td>Consistent; writes slow when a replica is down</td></tr>
<tr><td>PostgreSQL (async replica)</td><td>PC/EL</td><td>Fast writes; replicas lag; failover can lose data</td></tr>
<tr><td>DynamoDB</td><td>PA/EL</td><td>Tunable consistency per request; always available</td></tr>
<tr><td>Cassandra</td><td>PA/EL</td><td>Tunable consistency; last-write-wins conflicts</td></tr>
<tr><td>MongoDB (majority)</td><td>PC/EC</td><td>Consistent; writes wait for majority ack</td></tr>
<tr><td>Spanner / CockroachDB</td><td>PC/EC</td><td>Globally consistent; higher latency</td></tr>
<tr><td>Redis (default)</td><td>PA/EL</td><td>Fast; may lose recent writes on failover</td></tr>
</tbody></table>

<h4>Cassandra's model — worth understanding</h4>
<pre><code>-- Tunable consistency per query
CONSISTENCY ONE; -- fast, may return stale data
CONSISTENCY QUORUM; -- majority of replicas must respond
CONSISTENCY ALL; -- all replicas, blocks on any failure

-- With RF=3:
-- Write at QUORUM (2) + Read at QUORUM (2) = strong consistency
-- W + R &gt; RF guarantees read-your-writes</code></pre>
<p><b>The formula:</b> if write replicas + read replicas &gt; replication factor, you get strong consistency. This is a genuinely useful thing to know and it comes up in interviews about Dynamo-style databases.</p>
<p><b>Cassandra's constraints:</b> no joins, no ad-hoc queries, denormalised by design, last-write-wins conflict resolution (which loses data unless you use timestamps carefully). You must design the table around the query, not the other way around.</p>

<h4>Polyglot persistence — the realistic architecture</h4>
<pre><code>PostgreSQL → primary transactional store (orders, payments, users)
Redis → cache, sessions, rate limiting
Elasticsearch → search index, built from Postgres via CDC
ClickHouse / DuckDB → analytics, built from Postgres via CDC
S3 → documents, exports, backups
Kafka → event backbone, feeding all the above</code></pre>
<p><b>The key insight:</b> you don't choose one database. You choose a primary store and derive the others. The hard part is keeping them in sync — which is where CDC (Debezium) and the outbox pattern come in, and where you need a reconciliation story because sync will fail.</p>`,

drill:["Set up streaming replication between two PostgreSQL instances. Write to the primary, read from the replica, and observe the lag.",
"Simulate replication lag by pausing the replica. Observe read-after-write inconsistency.",
"Write the W+R>RF formula for three consistency levels and verify which give strong consistency."],

qa:[
["Why is asynchronous replication the default despite the data-loss risk?","Because synchronous replication couples your write availability to your replica's availability. If the replica goes down, writes block or fail. For most applications the trade-off — a small chance of losing the last few milliseconds of writes on failover — is worth keeping writes fast and available. Systems where data loss is unacceptable (financial ledgers) use synchronous or quorum replication and accept the latency cost."],
["How do you prevent split-brain in a database cluster?","Quorum plus fencing. Quorum means a node can only become primary if it can reach a majority of the cluster — so a partitioned minority can't elect a new leader. Fencing means forcibly shutting down the old primary before promoting a new one, usually via a power management interface or by revoking its access to shared storage. Both are needed; quorum alone doesn't stop an old primary that's still running and still accepting writes."],
["When would you choose Cassandra over PostgreSQL?","When you have a very high write rate (hundreds of thousands per second), a known and stable access pattern, and no need for joins or transactions. Time-series ingestion, IoT sensor data, event logs. Cassandra scales horizontally with no single point of failure and writes are extremely fast. But you must design the table around the query — if the access pattern changes, you need a new table, not a new index. That inflexibility is the real cost."],
["What does last-write-wins mean and why is it dangerous?","Cassandra resolves conflicts by comparing timestamps and keeping the one with the higher timestamp. If two nodes accept writes for the same key during a partition, one silently loses. It's dangerous because there's no conflict detection — the data is just gone, and you only find out if something downstream looks wrong. And the timestamps come from the client's clock, so clock skew can cause a genuinely newer write to be discarded."],
["How do you keep a search index in sync with a primary database?","Change Data Capture. Read the database's replication log (Debezium for PostgreSQL) and publish changes as events that the indexer consumes. This avoids the dual-write problem — you never write to both the database and the index in the same transaction. It's at-least-once, so the indexer must be idempotent. And you need a periodic full reconciliation because CDC can miss events (a connector restart, a schema change) and the index will silently drift."]
],
exit:"Explain replication lag and the read-after-write fix, then justify choosing PostgreSQL over Cassandra for a payments system, in 2 minutes."},

{d:28,wk:4,prio:"P0",title:"Week 4 Integration — Database Retrieval & Design Drill",
obj:"Prove you can design a schema, justify an index, and read a query plan.",
core:`<h4>Retrieval test — answer out loud, 90 seconds each</h4>
<ol>
<li>Name all five concurrency anomalies and the isolation level that prevents each.</li>
<li>Why doesn't snapshot isolation prevent write skew?</li>
<li>Explain MVCC in one paragraph, and what VACUUM does.</li>
<li>What is the leftmost-prefix rule, and why does column order matter?</li>
<li>Name six reasons an index isn't used.</li>
<li>What does <code>loops</code> in EXPLAIN ANALYZE mean, and why do you multiply by it?</li>
<li>Why is keyset pagination O(1) and OFFSET O(n)?</li>
<li>What is the shard-key criteria, and which criterion do people forget?</li>
<li>How do you prevent split-brain?</li>
<li>Why does the W+R&gt;RF formula give strong consistency?</li>
</ol>

<h4>The design drill — do this on paper, 30 minutes</h4>
<p><b>Prompt:</b> Design the schema for a multi-tenant SaaS project-management tool. Requirements:</p>
<ul>
<li>50,000 tenants, ranging from 5 users to 5,000 users</li>
<li>Users belong to one tenant</li>
<li>Projects belong to a tenant, have many tasks</li>
<li>Tasks have assignees, status, due dates, and comments</li>
<li>The hot queries are: "my open tasks", "tasks in project X by status", "recent activity feed for a project"</li>
<li>You must never leak data across tenants</li>
</ul>

<p><b>Model answer — the schema:</b></p>
<pre><code>tenants (id uuid PK, name, created_at, plan)
users (id uuid PK, tenant_id FK, email, name,
UNIQUE (tenant_id, email)) -- email unique per tenant, not globally
projects (id uuid PK, tenant_id FK, name, created_at)
tasks (id uuid PK, tenant_id FK, project_id FK,
assignee_id FK NULL, status, due_date,
created_at, updated_at)
comments (id uuid PK, tenant_id FK, task_id FK,
author_id FK, body, created_at)</code></pre>

<p><b>Every table carries <code>tenant_id</code>.</b> This is deliberate and important — it enables:</p>
<ul>
<li><b>Row-level security</b> in PostgreSQL, enforced in the database rather than trusted to the application:</li>
</ul>
<pre><code>ALTER TABLE tasks ENABLE ROW LEVEL SECURITY;
CREATE POLICY tenant_isolation ON tasks
USING (tenant_id = current_setting('app.tenant_id')::uuid);</code></pre>
<ul>
<li><b>Tenant-scoped indexes</b> — every index leads with <code>tenant_id</code>.</li>
<li><b>Future sharding</b> by tenant, without a schema change.</li>
</ul>

<p><b>The indexes — one per hot query:</b></p>
<pre><code>-- "my open tasks": filter by assignee, exclude done, order by due date
CREATE INDEX idx_tasks_assignee_open
ON tasks (tenant_id, assignee_id, due_date)
WHERE status &lt;&gt; 'DONE';

-- "tasks in project X by status"
CREATE INDEX idx_tasks_project_status
ON tasks (tenant_id, project_id, status);

-- "recent activity for a project" — needs the task join
CREATE INDEX idx_comments_tenant_task_time
ON comments (tenant_id, task_id, created_at DESC);

-- Comments feed: fetch by project via join
CREATE INDEX idx_tasks_tenant_project ON tasks (tenant_id, project_id);</code></pre>

<p><b>Why these specific indexes:</b></p>
<ul>
<li><b>Every one leads with <code>tenant_id</code>.</b> This means no query can accidentally scan across tenants, and the index is naturally partitioned by tenant for future sharding.</li>
<li><b>The first is partial</b> (<code>WHERE status &lt;&gt; 'DONE'</code>). Most tasks are done, so this index is a fraction of the full size — and "my open tasks" is the hot query.</li>
<li><b>The second is a covering index candidate.</b> If the list view only needs id, name, and status, adding <code>INCLUDE (id, name)</code> makes it an index-only scan.</li>
<li><b>The third uses <code>DESC</code></b> because the feed is always "most recent first" — it matches the sort order so no sort is needed.</li>
</ul>

<p><b>Handling the tenant-size skew:</b></p>
<p>50,000 tenants with 5–5,000 users is a 1000× range. A 5,000-user tenant generates proportionally more data and traffic. Options:</p>
<ol>
<li><b>Do nothing initially.</b> PostgreSQL handles the skew fine at these sizes. Measure before optimising.</li>
<li><b>Partition <code>tasks</code> and <code>comments</code> by hash of <code>tenant_id</code>.</b> This distributes the large tenants across partitions.</li>
