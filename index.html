<div class="box w"><div class="t">Common bitmask DP setup</div>When n ≤ 20 and you're tracking a subset, use an int as the state.<br><br>
<code>dp[mask]</code> = best result using the elements selected by <code>mask</code>.<br>
Iterate <code>mask</code> from 0 to <code>(1&lt;&lt;n)-1</code>. For each, loop over elements not yet in the mask, add them, and update <code>dp[mask | (1&lt;&lt;i)]</code>.<br><br>
Classic problems: Travelling Salesman, partition to K equal subsets, maximum students taking exam.</div>

<h4>Decision guide</h4>
<table><thead><tr><th>Problem says</th><th>Reach for</th></tr></thead><tbody>
<tr><td>"K largest / smallest / most frequent"</td><td>Heap of size K</td></tr>
<tr><td>"Overlapping intervals / meeting rooms"</td><td>Sort + merge, or heap of end times</td></tr>
<tr><td>"Prefix" / "starts with" / autocomplete</td><td>Trie</td></tr>
<tr><td>"Connected" / "groups" / "cycle in undirected"</td><td>Union-Find</td></tr>
<tr><td>"Appears twice except one" / "subset of small set"</td><td>XOR / bitmask</td></tr>
</tbody></table>`,

drill:["Top K Frequent Elements — heap solution, then bucket-sort solution for O(n).",
"Meeting Rooms II — solve with a heap. Explain why sorting by start time matters.",
"Number of Connected Components — solve with Union-Find, then with BFS. Compare code length."],

qa:[
["Why does the min-heap find the K largest elements?","Because you keep evicting the smallest. After processing all n elements, the heap contains exactly the K that survived the evictions — and those are the K largest. Equivalently: any element smaller than K others gets evicted. The inversion is deliberate and worth saying out loud in an interview so the interviewer knows you didn't just memorise it."],
["When would you use a trie instead of a HashSet for word lookup?","When you need prefix operations. A HashSet gives O(1) exact lookup but can't answer 'does any word start with abc?'. A trie answers that in O(3). Also useful for autocomplete, word games (Boggle), and IP routing. If you only need exact membership, a HashSet is simpler and faster."],
["Union-Find vs BFS for connected components — when do you prefer which?","Union-Find wins when edges arrive incrementally — it handles dynamic connectivity naturally, which BFS can't without recomputation. It's also shorter code for pure connectivity. BFS wins when you need the actual component membership or the path, and when the graph is given as an adjacency list you'd have to build anyway. For 'number of islands II' (edges added one at a time), Union-Find is the only practical choice."],
["What's the space complexity of a trie and when is it a problem?","O(total characters × alphabet size) in the worst case, because each node allocates an array of 26 references. For a dictionary of 100,000 words averaging 8 characters, that's up to 800,000 nodes × 26 references × 8 bytes = ~166MB — unacceptable. Mitigations: use a HashMap for children (only allocated for used characters), or a compressed trie (radix tree) that merges single-child chains. Mentioning this trade-off shows real engineering judgment."],
["How does path compression alone compare to path compression plus union by rank?","Path compression alone gives amortized O(log n). Adding union by rank (or size) gives O(α(n)) — the inverse Ackermann function, which is below 5 for any realistic n. The combination is what makes Union-Find effectively constant time. Both optimisations are two lines each, so there's no reason to use only one."]
],
exit:"Write the Trie class and the Union-Find class from memory in 15 minutes total. These are pure recall — no thinking required."},

{d:13,wk:2,prio:"P0",title:"JVM Memory Model & Garbage Collection",
obj:"Explain heap layout, GC algorithms, and diagnose an OOM from a heap dump.",
core:`<h4>The memory regions</h4>
<table><thead><tr><th>Region</th><th>Holds</th><th>Shared?</th><th>GC?</th></tr></thead><tbody>
<tr><td><b>Heap</b></td><td>All objects, arrays</td><td>Yes</td><td>Yes</td></tr>
<tr><td><b>Metaspace</b></td><td>Class metadata, method bytecode</td><td>Yes</td><td>Yes (unloading)</td></tr>
<tr><td><b>Stack</b></td><td>Local variables, frames, references</td><td>No — per thread</td><td>No (frame pop)</td></tr>
<tr><td><b>PC register</b></td><td>Current instruction address</td><td>No</td><td>No</td></tr>
<tr><td><b>Native method stack</b></td><td>JNI frames</td><td>No</td><td>No</td></tr>
<tr><td><b>Direct memory</b></td><td><code>ByteBuffer.allocateDirect</code></td><td>Yes</td><td>Not by heap GC</td></tr>
</tbody></table>
<div class="box b"><div class="t">The trap</div><code>-Xmx</code> bounds the <b>heap only</b>. It does not bound Metaspace, thread stacks, direct buffers, or JNI memory. "We have OOM but the heap dump is small" is almost always native memory — direct buffers or thread stacks. This is a real production question and interviewers use it to separate people who've debugged from people who've read.</div>

<h4>The generational hypothesis</h4>
<p><b>Most objects die young.</b> Empirically, 90%+ of allocated objects become garbage almost immediately — request-scoped DTOs, temporary strings, iterators. The heap is split so that this common case is cheap to collect.</p>
<pre><code>┌─────────────── Young Generation ───────────────┐ ┌── Old Gen ──┐
│ Eden │ Survivor S0 │ Survivor S1 │ │ Tenured │
└───────────┴─────────────┴────────────────────┘ └─────────────┘
new objects objects that survived 1+ minor GCs</code></pre>
<ul>
<li><b>New objects</b> are allocated in Eden (bump-the-pointer — extremely fast).</li>
<li><b>Minor GC</b> copies live objects from Eden to a survivor space, then clears Eden. Cheap because few objects survive.</li>
<li><b>Promotion</b> to old gen happens after surviving <code>-XX:MaxTenuringThreshold</code> collections (default 15), or immediately if the object is too large for Eden.</li>
<li><b>Major/Full GC</b> collects old gen. Expensive — typically 10–100× slower than a minor GC.</li>
</ul>

<h4>Humongous allocations</h4>
<p>In G1, the heap is divided into equal-sized regions (typically 1–32MB). Any object larger than <b>half a region</b> is "humongous" and allocated directly in old gen, bypassing the young generation entirely. This is a common cause of unexpected full GCs.</p>
<div class="box w"><div class="t">The real-world story to have ready</div>"We saw p99 latency spikes of 800ms every ~40 seconds with no obvious cause. GC logs showed repeated humongous allocations. The culprit was building 3MB JSON strings by concatenating a full response object into memory. We switched to streaming serialisation via Jackson's <code>JsonGenerator</code> over the response output stream, and the spikes disappeared — the allocation rate dropped and nothing crossed the humongous threshold."</div>

<h4>GC algorithms compared</h4>
<table><thead><tr><th>Collector</th><th>Pause profile</th><th>Best for</th><th>Cost</th></tr></thead><tbody>
<tr><td><b>Serial</b></td><td>Seconds — stop the world</td><td>Small heaps, single-core, CLI tools</td><td>Unusable for servers</td></tr>
<tr><td><b>Parallel</b></td><td>100ms–1s STW</td><td>Batch jobs where throughput matters, not latency</td><td>Long pauses</td></tr>
<tr><td><b>G1</b> (default, 9+)</td><td>10–200ms, predictable</td><td>General server workloads, 4–32GB heaps</td><td>Lower throughput than Parallel</td></tr>
<tr><td><b>ZGC</b></td><td>Sub-millisecond</td><td>Latency-critical, very large heaps (up to TB)</td><td>Higher CPU and memory overhead</td></tr>
<tr><td><b>Shenandoah</b></td><td>Sub-millisecond</td><td>Similar to ZGC</td><td>Similar overhead</td></tr>
</tbody></table>
<div class="box o"><div class="t">The line that signals experience</div>"Collector choice is a latency-vs-throughput-vs-CPU-budget decision, and it's only worth revisiting <em>after</em> you've fixed the allocation rate. Most GC problems are actually allocation problems. You can't tune your way out of allocating 3GB per second."</div>

<h4>How to choose</h4>
<ol>
<li><b>Measure first.</b> Enable GC logging: <code>-Xlog:gc*:file=gc.log:time,uptime,level,tags</code>. Look at pause frequency, duration, and the allocation rate.</li>
<li><b>Fix the allocation rate.</b> Look for string concatenation in loops, unnecessary boxing, large temporary collections, and over-sized buffers.</li>
<li><b>Then pick a collector.</b> Latency-sensitive → ZGC or G1 with a low pause target. Throughput-bound → Parallel. Default → G1.</li>
<li><b>Tune the heap.</b> <code>-Xms</code> = <code>-Xmx</code> to avoid resizing. In containers, use <code>-XX:MaxRAMPercentage=75</code> rather than a fixed <code>-Xmx</code>.</li>
</ol>

<h4>Heap dump triage — the 6-step method</h4>
<ol>
<li><b>Identify which OOM.</b> <code>Java heap space</code> (heap), <code>Metaspace</code> (classloader leak), <code>GC overhead limit exceeded</code> (spending &gt;98% of time in GC), <code>unable to create native thread</code> (thread leak or ulimit), <code>Direct buffer memory</code> (native). Each has a different fix.</li>
<li><b>Look at the dominator tree, not the histogram.</b> The class with the most instances isn't necessarily the leak — you want whatever <em>retains</em> the most heap. A single <code>HashMap</code> with 50M entries retains more than 50M individual small objects.</li>
<li><b>Check for the usual suspects:</b> unbounded collections, static caches that never evict, ThreadLocals in pooled threads that are never cleared, event listeners registered but never removed.</li>
<li><b>Compare two dumps.</b> Take one now and one in 10 minutes. A leak is growth in retained size over time, not absolute size. A large static cache that's stable isn't a leak.</li>
<li><b>Check classloader leaks.</b> Classic in application servers with hot redeploys — the old classloader is retained by a static reference, so nothing it loaded can be collected.</li>
<li><b>Reproduce small.</b> Run with <code>-Xmx256m</code>. The failure happens faster and the dump is easier to read.</li>
</ol>`,

drill:["Run a JVM with <code>-Xlog:gc*</code>, trigger a GC with <code>System.gc()</code>, and read the log output line by line.",
"Write a program that allocates 3MB strings in a loop under G1 with a small heap. Observe humongous allocation warnings.",
"Take a heap dump of a program with a deliberate leak (<code>static List</code> that grows). Identify the retaining path."],

qa:[
["Why is minor GC cheap and major GC expensive?","Minor GC only scans the young generation, and most young objects are already garbage — so it copies a small number of survivors to a survivor space and clears Eden. Cost is proportional to <em>surviving</em> objects, not total objects. Major GC must trace the entire old generation, including long-lived object graphs that may be deeply connected. Cost is proportional to total live data."],
["What is the write barrier and why does G1 need it?","G1 collects regions independently, but objects in one region can reference objects in another. To collect a region without scanning the whole heap, G1 needs to know which external regions point into it. The write barrier is a small piece of code injected at every reference assignment that records cross-region references in a remembered set. This is the cost G1 pays for region-based collection — it's why G1 has slightly lower throughput than Parallel."],
["How does ZGC achieve sub-millisecond pauses?","By doing almost everything concurrently with the application — marking, relocation, and reference updating all happen while threads run. The only stop-the-world phases are tiny: initial mark and final mark, measured in microseconds. The mechanism is coloured pointers (metadata stored in unused bits of the 64-bit reference) plus load barriers that fix up references on access. The cost is higher CPU usage and more memory overhead, plus the need for heap headroom to allow concurrent relocation."],
["Why set <code>-Xms</code> equal to <code>-Xmx</code> in production?","To avoid heap resizing. If they differ, the JVM starts small and grows, which means the OS has to allocate pages over time and the GC has to adjust its heuristics. The resize itself can cause pauses. Setting them equal commits the memory upfront (which the OS may not actually fault in until used) and gives the GC a stable target. The trade-off is that the process appears to use the full amount immediately in monitoring tools."],
["What causes a Metaspace OOM and how do you fix it?","A classloader leak. Classes can't be unloaded while their classloader is reachable. This typically happens with hot redeployment in application servers, dynamic proxy generation, or frameworks that create classloaders per request. The fix is identifying what retains the classloader — often a static field, a thread, or a JDBC driver registered in a static registry. Increasing <code>-XX:MaxMetaspaceSize</code> only delays the failure."]
],
exit:"Read a real GC log aloud and explain every line to a colleague, then describe your 6-step heap dump triage in 90 seconds."},

{d:14,wk:2,prio:"P0",title:"Concurrency I — JMM, volatile & Atomics",
obj:"Explain happens-before and why volatile doesn't make count++ safe.",
core:`<h4>The problem the JMM solves</h4>
<p>Modern CPUs and the JIT reorder instructions and cache values in registers and store buffers. Without rules, you cannot reason about what one thread sees of another thread's writes. The Java Memory Model defines <b>happens-before</b> — a partial order that tells you when a write is guaranteed visible to a read.</p>

<h4>The happens-before rules</h4>
<table><thead><tr><th>Rule</th><th>Guarantee</th></tr></thead><tbody>
<tr><td><b>Program order</b></td><td>Within a thread, statements appear to execute in order</td></tr>
<tr><td><b>Monitor lock</b></td><td>Unlock of a monitor happens-before a subsequent lock of the same monitor</td></tr>
<tr><td><b>Volatile</b></td><td>A write to a volatile field happens-before a subsequent read of that field</td></tr>
<tr><td><b>Thread start</b></td><td>Everything before <code>t.start()</code> is visible to thread t</td></tr>
<tr><td><b>Thread join</b></td><td>Everything in thread t is visible after <code>t.join()</code> returns</td></tr>
<tr><td><b>Transitivity</b></td><td>If A hb B and B hb C, then A hb C</td></tr>
<tr><td><b>Finalizer / interruption / etc.</b></td><td>Various specialised rules</td></tr>
</tbody></table>

<h4>volatile — what it does and doesn't do</h4>
<pre><code>volatile boolean running = true;

// Thread A
while (running) { /* do work */ }

// Thread B
running = false; // A is guaranteed to see this</code></pre>
<p><b>What volatile guarantees:</b></p>
<ul>
<li><b>Visibility.</b> A write is immediately visible to all threads.</li>
<li><b>No reordering</b> around the volatile access — it acts as a memory barrier.</li>
<li>No caching in registers — the value is read from main memory each time.</li>
</ul>
<p><b>What volatile does NOT guarantee:</b> atomicity of compound operations.</p>
<div class="box b"><div class="t">The classic wrong answer</div><pre><code>volatile int count = 0;
count++; // NOT SAFE — read, increment, write are three operations</code></pre>
Two threads can both read <code>count = 5</code>, both compute 6, both write 6. One increment is lost. Volatile gives visibility, not atomicity. This is the single most common concurrency question and the answer is <b>AtomicInteger</b>, <b>LongAdder</b>, or a lock.</div>

<h4>AtomicInteger — CAS under the hood</h4>
<pre><code>// AtomicInteger.incrementAndGet() is essentially:
do {
int current = get();
int next = current + 1;
} while (!compareAndSet(current, next));
return next;</code></pre>
<p><code>compareAndSet</code> maps to a single CPU instruction (<code>lock cmpxchg</code> on x86). It succeeds only if the current value still equals the expected value. If another thread changed it, the loop retries.</p>
<p><b>The cost:</b> under high contention, many threads retry and burn CPU. This is why <code>LongAdder</code> exists.</p>

<h4>LongAdder — striping for contention</h4>
<pre><code>LongAdder adder = new LongAdder();
adder.increment(); // writes to a per-thread cell — no contention
adder.sum(); // sums all cells — O(number of cells)</code></pre>
<p>LongAdder maintains an array of cells. Each thread updates its own cell (via a hash of the thread ID), so there's no contention on the hot path. <code>sum()</code> adds them all up, which is approximate under concurrent writes but exact when quiescent.</p>
<div class="box o"><div class="t">When to use which</div>
<b>Low contention, need the value:</b> <code>AtomicLong</code>.<br>
<b>High contention, need a counter (metrics, stats):</b> <code>LongAdder</code>.<br>
<b>High contention, need the value immediately:</b> <code>LongAccumulator</code> or reconsider the design.</div>

<h4>The Atomic* family</h4>
<table><thead><tr><th>Class</th><th>Use</th></tr></thead><tbody>
<tr><td><code>AtomicInteger</code>, <code>AtomicLong</code></td><td>Counters, sequence generators</td></tr>
<tr><td><code>AtomicBoolean</code></td><td>Flags, one-shot initialisation guards</td></tr>
<tr><td><code>AtomicReference&lt;V&gt;</code></td><td>Lock-free swap of an object reference</td></tr>
<tr><td><code>AtomicReferenceArray</code></td><td>Atomic element updates in an array</td></tr>
<tr><td><code>AtomicIntegerFieldUpdater</code></td><td>Atomic updates on a volatile field of an existing class — avoids per-instance AtomicInteger objects</td></tr>
<tr><td><code>LongAdder</code>, <code>DoubleAdder</code></td><td>High-contention counters</td></tr>
<tr><td><code>LongAccumulator</code></td><td>High-contention reduce with a custom function</td></tr>
</tbody></table>

<h4>The ABA problem</h4>
<p>CAS checks "is the value still A?" but not "has it changed and changed back?" If thread 1 reads A, thread 2 changes it to B and back to A, thread 1's CAS succeeds even though the world changed. In Java this rarely matters because references are garbage-collected — but it matters in lock-free data structures where a node could be freed and reallocated at the same address.</p>
<p><b>The fix:</b> <code>AtomicStampedReference</code>, which pairs the reference with an integer version stamp.</p>

<h4>Safe publication — the subtle one</h4>
<pre><code>// UNSAFE — another thread may see a partially-constructed object
public class Holder {
int value;
Holder() { value = 42; }
}
static Holder instance;
// thread A: instance = new Holder();
// thread B: read instance.value → may see 0</code></pre>
<p>Without a happens-before edge, thread B can see the reference but not the writes that happened in the constructor. The fixes:</p>
<ul>
<li><code>final</code> fields — the JMM guarantees final fields are visible after construction.</li>
<li><code>volatile</code> reference — the write to the reference is a release, the read is an acquire.</li>
<li>Static initializers — class initialisation has happens-before guarantees.</li>
<li><code>synchronized</code> on both sides.</li>
</ul>
<div class="box"><div class="t">The practical rule</div>If you're sharing an object between threads without a lock, <b>make it immutable</b>. Immutable objects are safe to publish by any mechanism, because there's no state to be inconsistent and final fields have visibility guarantees. Most concurrency bugs are really publication bugs.</div>`,

drill:["Write a program with a non-volatile boolean flag and a busy-wait loop. Observe it hanging. Add volatile and watch it work.",
"Write a counter with <code>volatile int</code>, run 10 threads × 100,000 increments, observe the lost updates. Fix with AtomicInteger, then LongAdder.",
"Implement a simple spinlock using AtomicBoolean. Then break it by removing the volatile."],

qa:[
["Can a <code>volatile</code> write be reordered with a normal write that comes before it?","No. A volatile write acts as a release barrier — all preceding writes are flushed before the volatile write becomes visible. Similarly a volatile read is an acquire barrier — subsequent reads can't be hoisted above it. This is why volatile is used for the flag-plus-data pattern: write the data, then set the volatile flag; the reader sees the flag and is guaranteed to see the data."],
["Why is double-checked locking safe in Java 5+ but broken before?","Before Java 5, the JMM allowed the write to the reference (after allocation) to be reordered before the constructor finished. Another thread could see a non-null reference to a partially-constructed object. Java 5 fixed this by making volatile writes release barriers, which prevents the reordering. So the fix is: declare the field <code>volatile</code>. Modern code should just use the holder idiom or an enum singleton and avoid the issue entirely."],
["What's the difference between <code>AtomicInteger.compareAndSet</code> and <code>AtomicInteger.weakCompareAndSet</code>?","<code>compareAndSet</code> has full volatile semantics — it's a strong read-modify-write with memory barriers. <code>weakCompareAndSet</code> may fail spuriously (return false even when the value matches) and historically had weaker ordering guarantees. In practice on x86 they compile to the same instruction, and the weak version is rarely useful. Use <code>compareAndSet</code>."],
["When would you use a lock instead of atomics?","When the critical section involves more than one variable that must change together, when you need to block rather than spin, or when the operation is long enough that CAS retry loops waste CPU. Atomics are for single-variable updates under moderate contention. Anything involving multiple variables and an invariant needs a lock — or a redesign into a single atomic value."],
["How does LongAdder's sum() behave under concurrent writes?","It's not a snapshot — it sums the cells while they may be changing, so the result can be slightly stale. The doc says the returned value is not an atomic snapshot; concurrent updates during the sum may or may not be reflected. This is fine for metrics and statistics, where approximate is acceptable. If you need an exact value at a moment in time, you need a lock or an AtomicLong."]
],
exit:"Explain happens-before and the volatile-vs-atomic distinction in 90 seconds, using the count++ example."},

/* ================= WEEK 3 — CONCURRENCY & SPRING ================= */
{d:15,wk:3,prio:"P0",title:"Concurrency II — Locks & CompletableFuture",
obj:"Choose the right lock and compose async operations without blocking.",
core:`<h4>The lock hierarchy</h4>
<table><thead><tr><th>Lock</th><th>Use when</th><th>Cost</th></tr></thead><tbody>
<tr><td><code>synchronized</code></td><td>Simple mutual exclusion, short critical sections</td><td>JVM-managed, can't timeout, can't interrupt</td></tr>
<tr><td><code>ReentrantLock</code></td><td>Need tryLock, timeout, interruptibility, or fairness</td><td>Explicit unlock — must be in finally</td></tr>
<tr><td><code>ReentrantReadWriteLock</code></td><td>Read-heavy, write-rare</td><td>Write starvation possible; read lock isn't upgradable</td></tr>
<tr><td><code>StampedLock</code></td><td>Read-heavy, want optimistic reads</td><td>Not reentrant; no condition variables</td></tr>
<tr><td><code>Semaphore</code></td><td>Limit concurrency to N (connection pools, rate limits)</td><td>Not mutual exclusion — just counting</td></tr>
<tr><td><code>CountDownLatch</code></td><td>Wait for N events, one-shot</td><td>Can't reset</td></tr>
<tr><td><code>CyclicBarrier</code></td><td>N threads wait for each other, reusable</td><td>All threads must reach it or all hang</td></tr>
<tr><td><code>Phaser</code></td><td>Multi-phase coordination, dynamic parties</td><td>Complex</td></tr>
</tbody></table>

<h4>ReentrantLock — the template</h4>
<pre><code>private final ReentrantLock lock = new ReentrantLock();

public void transfer(Account from, Account to, long amount) {
lock.lock();
try {
// critical section
} finally {
lock.unlock(); // ← MUST be in finally
}
}

// With timeout — the reason to prefer this over synchronized
if (lock.tryLock(500, TimeUnit.MILLISECONDS)) {
try { /* work */ }
finally { lock.unlock(); }
} else {
// couldn't acquire — back off, don't block forever
}</code></pre>
<div class="box b"><div class="t">The bug that ships</div>Forgetting <code>unlock()</code> in a <code>finally</code> block. If the critical section throws, the lock is never released and every subsequent thread hangs forever. Unlike <code>synchronized</code>, the JVM does not release the lock when the thread dies. This is a permanent deadlock.</div>

<h4>StampedLock — optimistic reads</h4>
<pre><code>private final StampedLock sl = new StampedLock();
private double x, y;

public double distanceFromOrigin() {
long stamp = sl.tryOptimisticRead(); // no lock acquired
double cx = x, cy = y; // read without blocking
if (!sl.validate(stamp)) { // did a write happen?
stamp = sl.readLock(); // fall back to a real read lock
try { cx = x; cy = y; }
finally { sl.unlockRead(stamp); }
}
return Math.sqrt(cx*cx + cy*cy);
}</code></pre>
<p><b>The win:</b> in the common case (no concurrent write), you read with zero locking overhead. <code>tryOptimisticRead</code> returns a stamp; <code>validate</code> tells you whether a write occurred since. If it did, you take the slow path.</p>
<p><b>The constraint:</b> StampedLock is not reentrant. Taking a read lock twice in the same thread deadlocks.</p>

<h4>Choosing a lock — the decision table</h4>
<table><thead><tr><th>Need</th><th>Use</th></tr></thead><tbody>
<tr><td>Simple exclusion, short section</td><td><code>synchronized</code></td></tr>
<tr><td>Try-with-timeout, interruptible</td><td><code>ReentrantLock</code></td></tr>
<tr><td>Read-heavy, occasional writes</td><td><code>StampedLock</code> optimistic, or <code>ReentrantReadWriteLock</code></td></tr>
<tr><td>Limit to N concurrent</td><td><code>Semaphore(N)</code></td></tr>
<tr><td>Wait for a startup signal</td><td><code>CountDownLatch(1)</code></td></tr>
<tr><td>Producer/consumer</td><td><code>ArrayBlockingQueue</code> — no explicit lock needed</td></tr>
</tbody></table>

<h4>CompletableFuture — the composition toolkit</h4>
<pre><code>// Chain: transform
CompletableFuture&lt;Order&gt; order = fetchOrder(id);
CompletableFuture&lt;Receipt&gt; receipt = order
.thenApply(this::validate) // sync transform
.thenCompose(this::charge) // async transform (returns CF)
.thenApply(this::buildReceipt);

// Combine two independent async results
CompletableFuture&lt;User&gt; user = fetchUser(uid);
CompletableFuture&lt;List&lt;Order&gt;&gt; orders = fetchOrders(uid);
CompletableFuture&lt;Summary&gt; summary =
user.thenCombine(orders, Summary::new); // runs both in parallel

// Wait for all
CompletableFuture.allOf(f1, f2, f3).join();

// Wait for the first
CompletableFuture.anyOf(f1, f2).join();

// Error handling
future
.exceptionally(ex -&gt; fallback()) // recover
.handle((result, ex) -&gt; ex != null ? fallback() : result);

// Timeout (Java 9+)
future.orTimeout(2, TimeUnit.SECONDS)
.completeOnTimeout(defaultValue, 2, TimeUnit.SECONDS);</code></pre>

<h4>thenApply vs thenCompose vs thenCombine</h4>
<table><thead><tr><th>Method</th><th>Takes</th><th>Returns</th><th>Use for</th></tr></thead><tbody>
<tr><td><code>thenApply</code></td><td><code>T → U</code></td><td><code>CF&lt;U&gt;</code></td><td>Sync transform</td></tr>
<tr><td><code>thenCompose</code></td><td><code>T → CF&lt;U&gt;</code></td><td><code>CF&lt;U&gt;</code></td><td>Chaining another async call (flattening)</td></tr>
<tr><td><code>thenCombine</code></td><td><code>(T, U) → V</code></td><td><code>CF&lt;V&gt;</code></td><td>Joining two independent futures</td></tr>
<tr><td><code>thenAccept</code></td><td><code>T → void</code></td><td><code>CF&lt;Void&gt;</code></td><td>Terminal side effect</td></tr>
<tr><td><code>thenRun</code></td><td><code>Runnable</code></td><td><code>CF&lt;Void&gt;</code></td><td>Run after, ignore result</td></tr>
</tbody></table>
<div class="box w"><div class="t">The classic mistake</div>Using <code>thenApply</code> when you meant <code>thenCompose</code>. If your function returns a <code>CompletableFuture</code>, <code>thenApply</code> gives you <code>CompletableFuture&lt;CompletableFuture&lt;T&gt;&gt;</code> — nested and useless. Use <code>thenCompose</code> to flatten. This is exactly analogous to <code>map</code> vs <code>flatMap</code> in streams.</div>

<h4>The default executor trap</h4>
<p>If you don't supply an executor, async operations run on the <b>common ForkJoinPool</b>, which is sized to <code>availableProcessors - 1</code>. Blocking operations there starve the entire JVM.</p>
<pre><code>// WRONG — blocks a common-pool thread
CompletableFuture.supplyAsync(() -&gt; blockingHttpCall());

// RIGHT — dedicated executor
ExecutorService io = Executors.newFixedThreadPool(50);
CompletableFuture.supplyAsync(() -&gt; blockingHttpCall(), io);</code></pre>
<div class="box o"><div class="t">The architect-level answer</div>"I never use the common pool for I/O. For blocking calls I use a dedicated bounded executor sized to the downstream's concurrency limit, with a bounded queue and a rejection policy. The common pool is for CPU-bound work only — and in modern Java I'd use virtual threads for blocking I/O instead of a large platform-thread pool."</div>`,

drill:["Write a transfer method using ReentrantLock with tryLock and timeout. Then break it by removing the finally.",
"Implement a StampedLock-protected Point class. Benchmark optimistic reads vs synchronized reads.",
"Compose three async calls with CompletableFuture — one dependent, two parallel — and join them."],

qa:[
["Why is StampedLock not reentrant, and does that matter?","It's designed for the optimistic-read pattern where you don't hold locks across calls. Reentrancy requires tracking ownership per thread, which adds overhead to every operation. If you need reentrancy, use ReentrantReadWriteLock. The constraint matters when you accidentally call a StampedLock-protected method from inside another one — that deadlocks, and it's easy to do by accident."],
["What happens if you call <code>join()</code> on a CompletableFuture inside a common-pool thread?","You can deadlock. The common pool has N-1 threads; if all of them are blocked in <code>join()</code> waiting for tasks that need a common-pool thread to run, nothing progresses. This is a real production failure. The fix is to supply a dedicated executor, or use <code>thenCompose</code> to chain instead of blocking."],
["When should you use <code>synchronized</code> over <code>ReentrantLock</code>?","Whenever you don't need the extra features. <code>synchronized</code> is simpler, can't be forgotten (no explicit unlock), is optimised by the JVM (biased locking, lock elision), and produces clearer stack traces. Use <code>ReentrantLock</code> only when you need tryLock with timeout, interruptibility, fairness, or multiple condition variables."],
["How do you implement a bounded blocking queue from scratch?","Two condition variables (notFull, notEmpty) on a ReentrantLock, plus a circular array. <code>put</code> acquires the lock, waits on notFull while full, inserts, signals notEmpty. <code>take</code> does the mirror. The key details: signal after releasing the data structure change but while holding the lock, and use <code>while</code> loops around <code>await()</code> rather than <code>if</code> — spurious wakeups are allowed. ArrayBlockingQueue is exactly this."],
["What's the difference between a Semaphore and a lock?","A lock has ownership — only the thread that acquired it can release it. A semaphore has no ownership — any thread can release. That makes semaphores suitable for signalling and resource counting, and locks suitable for mutual exclusion. A binary semaphore looks like a lock but behaves differently under error conditions and doesn't support reentrancy or condition variables."]
],
exit:"Explain when to use synchronized vs ReentrantLock vs StampedLock, and why thenCompose exists, in 90 seconds."},

{d:16,wk:3,prio:"P0",title:"Virtual Threads & Structured Concurrency",
obj:"Know exactly when virtual threads help, when they don't, and what pinning is.",
core:`<h4>What virtual threads actually are</h4>
<p>A virtual thread is a <code>Thread</code> implemented in the JVM, not the OS. Millions can exist because they're just objects on the heap. When a virtual thread blocks on I/O, the JVM unmounts it from its <b>carrier thread</b> (a platform thread) and schedules another virtual thread on that carrier. The platform thread never blocks; the virtual thread's continuation is parked.</p>
<pre><code>// Platform threads — ~1MB stack each, ~thousands max
Thread t = new Thread(task);
t.start();

// Virtual threads — cheap, ~millions
Thread t = Thread.ofVirtual().start(task);
Thread t = Thread.startVirtualThread(task);

// Or via executor
try (var exec = Executors.newVirtualThreadPerTaskExecutor()) {
for (var task : tasks) exec.submit(task);
}</code></pre>

<h4>When virtual threads help</h4>
<ul>
<li><b>Blocking I/O at high concurrency.</b> 10,000 concurrent HTTP calls, each waiting 200ms. With platform threads you need 10,000 threads and ~10GB of stack. With virtual threads it's essentially free.</li>
<li><b>Request-per-thread servers.</b> Servlet containers can go back to the simple thread-per-request model without a reactive framework.</li>
<li><b>Fan-out with blocking clients.</b> Call 50 services in parallel with a plain <code>HttpClient</code> — no reactive plumbing.</li>
</ul>

<h4>When they don't help</h4>
<ul>
<li><b>CPU-bound work.</b> You have as many cores as you have. More threads just adds context switching. Use a fixed platform-thread pool sized to the core count.</li>
<li><b>Code that holds a lock while blocking.</b> See pinning below.</li>
<li><b>Code that's already non-blocking.</b> If you're using reactive streams and never block, virtual threads add nothing.</li>
</ul>

<h4>Pinning — the trap</h4>
<p>A virtual thread cannot unmount from its carrier while it is:</p>
<ul>
<li>Inside a <code>synchronized</code> block or method — <b>before Java 24</b>. Java 24+ removed this restriction for most cases.</li>
<li>Executing a native method (JNI) or a <code>Foreign Function</code> call.</li>
<li>Inside <code>Object.wait()</code>.</li>
</ul>
<pre><code>// PINNED — carrier thread is blocked for the duration
synchronized (lock) {
httpClient.send(request); // blocks the carrier
}

// FIXED — ReentrantLock allows unmounting
lock.lock();
try {
httpClient.send(request);
} finally {
lock.unlock();
}</code></pre>
<div class="box b"><div class="t">Why this matters in production</div>If enough virtual threads pin their carriers, you exhaust the carrier pool and throughput collapses — with no error, just latency. The symptom looks like a thread-pool starvation problem but the fix is replacing <code>synchronized</code> with <code>ReentrantLock</code> in the blocking path. There's also a JVM flag <code>-Djdk.tracePinnedThreads=full</code> (older JDKs) or JFR events (newer) to detect it.</div>

<h4>Never pool virtual threads</h4>
<div class="box w"><div class="t">The most common misunderstanding</div>Virtual threads are cheap to create and destroy. Pooling them defeats the entire purpose — you're adding a queue and a lifecycle for something that costs almost nothing. Use <code>Executors.newVirtualThreadPerTaskExecutor()</code>, which creates a new virtual thread per task and doesn't pool. The only reason to limit concurrency is to protect a downstream resource, and that's what <code>Semaphore</code> is for.</div>

<h4>Structured concurrency — the preview API</h4>
<pre><code>// Java 21+ preview
try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {
Subtask&lt;User&gt; user = scope.fork(() -&gt; fetchUser(id));
Subtask&lt;List&lt;Order&gt;&gt; orders = scope.fork(() -&gt; fetchOrders(id));

scope.join(); // wait for all
scope.throwIfFailed(); // propagate any exception

return new Summary(user.get(), orders.get());
}</code></pre>
<p><b>What it guarantees:</b></p>
<ul>
<li><b>All subtasks complete before the scope exits.</b> No orphaned threads.</li>
<li><b>Cancellation propagates.</b> If one fails, the others are cancelled.</li>
<li><b>Errors are collected.</b> No silently-swallowed exceptions.</li>
<li><b>The trace is readable.</b> The parent-child relationship is structural, so stack traces and profilers show the real hierarchy.</li>
</ul>
<p><b>Contrast with CompletableFuture:</b> a <code>CompletableFuture</code> that's never joined leaks. Its thread keeps running, its exception is swallowed, and there's no way to cancel a family of related operations. Structured concurrency makes the lifetime of subtasks lexically scoped — they cannot outlive the block.</p>

<h4>ScopedValue — the ThreadLocal replacement</h4>
<pre><code>// Java 25 — stable
static final ScopedValue&lt;RequestContext&gt; CTX = ScopedValue.newInstance();

ScopedValue.where(CTX, requestContext).run(() -&gt; {
handleRequest(); // CTX.get() works here and in nested calls
}); // automatically unbound on exit</code></pre>
<p><b>Why it beats ThreadLocal:</b></p>
<ul>
<li><b>Immutable</b> — can't be changed after binding. No accidental leakage.</li>
<li><b>Bounded to a scope</b> — automatically unbound, so no <code>remove()</code> needed in a <code>finally</code>.</li>
<li><b>Inherited correctly</b> by structured-concurrency subtasks.</li>
<li><b>No leak in pooled threads</b> — the classic ThreadLocal problem disappears.</li>
</ul>
<div class="box o"><div class="t">The migration story</div>"ThreadLocal was always a hack for passing context without threading it through every method signature. It leaks in pooled threads, it's mutable, and it interacts badly with virtual threads. ScopedValue fixes all three — immutable, lexically scoped, and correctly inherited. If I were starting a new service today, I'd use ScopedValue for request context and never touch ThreadLocal."</div>

<h4>The decision guide</h4>
<table><thead><tr><th>Workload</th><th>Use</th></tr></thead><tbody>
<tr><td>Blocking I/O, high concurrency</td><td>Virtual threads</td></tr>
<tr><td>CPU-bound parallel work</td><td>Fixed platform-thread pool (or parallel streams)</td></tr>
<tr><td>Fan-out with cancellation</td><td>StructuredTaskScope</td></tr>
<tr><td>Async composition without blocking</td><td>CompletableFuture, or reactive</td></tr>
<tr><td>Request context propagation</td><td>ScopedValue (not ThreadLocal)</td></tr>
<tr><td>Limiting concurrency to a resource</td><td>Semaphore + virtual threads</td></tr>
</tbody></table>`,

drill:["Write a program that spawns 100,000 virtual threads each sleeping 1 second. Time it. Then try the same with platform threads.",
"Write the pinning example — a synchronized block containing a blocking call — and observe the difference after switching to ReentrantLock.",
"Refactor a CompletableFuture fan-out into a StructuredTaskScope with ShutdownOnFailure."],

qa:[
["How does a virtual thread's stack work?","It starts on the heap and grows as needed, unlike a platform thread's fixed 1MB stack. When the virtual thread unmounts, its stack frames are stored as a continuation object on the heap. When it's rescheduled, the frames are restored to the carrier thread's stack. This is why virtual threads are cheap — the stack isn't a fixed allocation."],
["Why can't you set thread priority on virtual threads?","Because scheduling happens at the JVM level, not the OS. The JVM schedules virtual threads onto carriers with a simple FIFO-like policy. Thread priority is an OS concept and doesn't translate. If you need prioritisation, you have to implement it at the application level — separate executors for different priority classes, for example."],
["What happens to a virtual thread's ThreadLocal when it unmounts?","The ThreadLocal values stay with the virtual thread, not the carrier. When the virtual thread is rescheduled, its ThreadLocals are restored. This is correct behaviour but it means you can have millions of ThreadLocal maps alive — a memory concern. This is one of the arguments for ScopedValue, which is immutable and scoped rather than per-thread."],
["Can you use virtual threads with Spring Boot?","Yes — Spring Boot 3.2+ supports <code>spring.threads.virtual.enabled=true</code>, which makes Tomcat use a virtual-thread-per-request executor. But you must audit your code for <code>synchronized</code> blocks that contain blocking calls, and check that your connection pools are sized appropriately — a pool of 10 connections with 10,000 virtual threads just moves the bottleneck."],
["How does StructuredTaskScope handle a failure in one subtask?","With <code>ShutdownOnFailure</code>, the first failure triggers cancellation of all other subtasks, and <code>throwIfFailed()</code> rethrows the original exception wrapped appropriately. With <code>ShutdownOnSuccess</code>, the first success cancels the rest and you take that result — useful for hedged requests where you fan out to multiple replicas and take the fastest."]
],
exit:"Explain pinning and why virtual threads shouldn't be pooled, in 90 seconds, with a concrete example of each."},

{d:17,wk:3,prio:"P1",title:"Spring Core — Lifecycle, Proxies & AOP",
obj:"Explain how Spring creates a bean, what a proxy is, and why self-invocation breaks things.",
core:`<h4>The bean lifecycle — in order</h4>
<ol>
<li><b>Instantiation</b> — constructor called (or factory method).</li>
<li><b>Populate properties</b> — dependency injection via setters or fields.</li>
<li><b>BeanNameAware / BeanFactoryAware / ApplicationContextAware</b> — callbacks if implemented.</li>
<li><b>BeanPostProcessor.postProcessBeforeInitialization</b> — this is where <code>@PostConstruct</code> annotations are found and where AOP proxies are created.</li>
<li><b>@PostConstruct</b> — your initialisation method.</li>
<li><b>InitializingBean.afterPropertiesSet</b> — legacy alternative to @PostConstruct.</li>
<li><b>Custom init-method</b> — from <code>@Bean(initMethod = "...")</code>.</li>
<li><b>BeanPostProcessor.postProcessAfterInitialization</b> — where the AOP proxy is typically applied.</li>
<li>Bean is ready.</li>
</ol>
<p>On shutdown, in reverse: <code>@PreDestroy</code>, <code>DisposableBean.destroy</code>, custom destroy method.</p>

<h4>What a proxy actually is</h4>
<p>When Spring needs to add behaviour to a bean — transactions, caching, async, security — it doesn't modify your class. It wraps it in a proxy object that implements the same interface (JDK dynamic proxy) or subclasses your class (CGLIB). The proxy intercepts method calls, applies the advice, and delegates to your real object.</p>
<pre><code>// What you write
@Service
public class PaymentService {
@Transactional
public void charge() { ... }
}

// What Spring actually gives callers (conceptually)
class PaymentService$$Proxy extends PaymentService {
@Override
public void charge() {
Transaction tx = beginTransaction(); // advice
try {
super.charge(); // your code
tx.commit();
} catch (Exception e) {
tx.rollback();
throw e;
}
}
}</code></pre>

<h4>JDK proxy vs CGLIB</h4>
<table><thead><tr><th></th><th>JDK dynamic proxy</th><th>CGLIB</th></tr></thead><tbody>
<tr><td>Requires</td><td>An interface</td><td>Non-final class, non-final methods</td></tr>
<tr><td>Mechanism</td><td><code>java.lang.reflect.Proxy</code></td><td>Bytecode subclass generation</td></tr>
<tr><td>Limitation</td><td>Only interface methods are proxied</td><td>Can't proxy final classes or final/private methods</td></tr>
<tr><td>Default since</td><td>—</td><td>Spring Boot 2.x uses CGLIB by default</td></tr>
</tbody></table>
<div class="box b"><div class="t">The consequence people miss</div>Because CGLIB creates a <em>subclass</em>, <code>private</code>, <code>final</code>, and <code>static</code> methods cannot be advised. Putting <code>@Transactional</code> on a private method silently does nothing — no error, no warning, no transaction. This is a very common production bug.</div>

<h4>Self-invocation — the classic trap</h4>
<pre><code>@Service
public class OrderService {
public void process() {
this.save(); // ← bypasses the proxy entirely
}

@Transactional
public void save() { ... } // transaction never starts
}</code></pre>
<p>When you call <code>this.save()</code>, you're calling the real object's method directly. The proxy is never involved. No advice runs.</p>
<p><b>Fixes, in order of preference:</b></p>
<ol>
<li><b>Split into two beans.</b> If <code>save</code> needs its own transaction, it probably belongs in a different class. This is the right answer 90% of the time — it fixes the design, not just the symptom.</li>
<li><b>Inject self.</b> <code>@Autowired @Lazy private OrderService self;</code> then <code>self.save()</code>. Works, but signals a design problem.</li>
<li><b>Use TransactionTemplate.</b> Programmatic control, no proxy involved. Often the clearest option for a single method.</li>
<li><b>AspectJ load-time weaving.</b> Changes the proxy model entirely. Rarely worth the build complexity.</li>
</ol>

<h4>Circular dependencies</h4>
<pre><code>@Service class A { @Autowired B b; }
@Service class B { @Autowired A a; } // circular</code></pre>
<p>Spring can resolve this via setter or field injection by injecting a proxy or an early reference. But <b>it cannot resolve constructor injection circular dependencies</b> — that's a genuine design problem and Spring throws <code>BeanCurrentlyInCreationException</code>.</p>
<div class="box o"><div class="t">The architect answer</div>"A circular dependency is a design smell, not a configuration problem. Two beans that need each other are usually one concept split in the wrong place, or they need a third collaborator. Constructor injection makes the cycle visible at startup rather than hiding it. I'd rather fix the design than add <code>@Lazy</code>."</div>

<h4>Auto-configuration mechanics</h4>
<p><code>@SpringBootApplication</code> includes <code>@EnableAutoConfiguration</code>, which imports candidate configurations listed in:</p>
<pre><code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports</code></pre>
<p>(This replaced <code>spring.factories</code> in Boot 2.7+.)</p>
<p>Each candidate is guarded by conditions:</p>
<table><thead><tr><th>Annotation</th><th>Applies when</th></tr></thead><tbody>
<tr><td><code>@ConditionalOnClass</code></td><td>A class is on the classpath</td></tr>
<tr><td><code>@ConditionalOnMissingClass</code></td><td>A class is absent</td></tr>
<tr><td><code>@ConditionalOnBean</code></td><td>A bean of that type exists</td></tr>
<tr><td><code>@ConditionalOnMissingBean</code></td><td>No bean of that type exists — <b>this is why your @Bean overrides the default</b></td></tr>
<tr><td><code>@ConditionalOnProperty</code></td><td>A property has a specific value</td></tr>
<tr><td><code>@ConditionalOnWebApplication</code></td><td>Running in a web context</td></tr>
</tbody></table>
<p><b>Debug it:</b> run with <code>--debug</code> to get the condition evaluation report showing what matched, what didn't, and why. This is the fastest way to answer "why isn't my auto-configuration applying?"</p>

<h4>AOP — the terminology</h4>
<table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>
<tr><td><b>Aspect</b></td><td>The cross-cutting concern (a class annotated <code>@Aspect</code>)</td></tr>
<tr><td><b>Join point</b></td><td>A point in execution where advice can apply (method call)</td></tr>
<tr><td><b>Pointcut</b></td><td>An expression selecting join points</td></tr>
<tr><td><b>Advice</b></td><td>The action — @Before, @After, @Around, @AfterReturning, @AfterThrowing</td></tr>
<tr><td><b>Weaving</b></td><td>Applying aspects to targets. Spring does runtime weaving via proxies.</td></tr>
</tbody></table>
<pre><code>@Aspect
@Component
public class TimingAspect {
@Around("@annotation(Timed)")
public Object time(ProceedingJoinPoint pjp) throws Throwable {
long start = System.nanoTime();
try {
return pjp.proceed();
} finally {
long ms = (System.nanoTime() - start) / 1_000_000;
log.info("{} took {}ms", pjp.getSignature(), ms);
}
}
}</code></pre>
<p><b>The proxy limitation applies here too:</b> self-invocation bypasses the aspect. Same root cause, same fixes.</p>`,

drill:["Write a bean with @PostConstruct and @PreDestroy, and log the lifecycle order. Add a BeanPostProcessor and observe where it fires.",
"Create a self-invocation @Transactional bug. Verify no transaction starts (check the logs for BEGIN/COMMIT). Fix it three ways.",
"Run a Spring Boot app with --debug and read the auto-configuration report. Identify three configurations that did not match and why."],

qa:[
["Why does Spring use CGLIB by default in Boot 2+ instead of JDK proxies?","Because CGLIB can proxy classes without interfaces, which is what most user code looks like. Many beans don't implement an interface, and requiring one just to get transactions would be a bad developer experience. The trade-off is that final classes and methods can't be proxied — a limitation you have to know about."],
["What's the difference between @PostConstruct and InitializingBean.afterPropertiesSet?","Functionally the same point in the lifecycle. <code>@PostConstruct</code> is the standard Jakarta annotation and doesn't couple your class to Spring. <code>InitializingBean</code> is a Spring interface. Prefer the annotation — it works with any DI container and keeps your domain classes framework-free."],
["How does @Transactional on a private method behave?","Silently nothing. CGLIB creates a subclass and overrides methods — private methods can't be overridden, so no advice can apply. Spring doesn't warn about this, which is why it's a common bug. The same applies to final and static methods. If you suspect a transaction isn't starting, check the method visibility first."],
["Can you have two beans of the same type, and how does injection resolve it?","Yes — but injection becomes ambiguous and throws <code>NoUniqueBeanDefinitionException</code>. Resolve it with <code>@Primary</code> on one, <code>@Qualifier("name")</code> at the injection point, or by naming the parameter to match the bean name. I prefer @Qualifier because it's explicit at the point of use rather than hiding the choice in a distant annotation."],
["What happens if a @Bean method throws an exception?","The application context fails to start. This is deliberate — a bean that can't be created means the application can't work, so failing fast is correct. The exception is wrapped in <code>BeanCreationException</code> with the original cause preserved. If you need a bean that might fail, make the failure explicit and handle it in the bean's own initialisation rather than the factory method."]
],
exit:"Explain the bean lifecycle and the self-invocation trap in 90 seconds, including why CGLIB can't advise private methods."},

{d:18,wk:3,prio:"P0",title:"@Transactional Deep Dive",
obj:"Know propagation, isolation, rollback rules, and the four things transactions don't cover.",
core:`<h4>What @Transactional actually does</h4>
<p>It's a proxy-based advice. Around the annotated method, Spring:</p>
<ol>
<li>Determines the transaction attribute (propagation, isolation, readOnly, timeout).</li>
<li>Checks whether a transaction already exists per the propagation rule.</li>
<li>Starts, joins, or suspends as required.</li>
<li>Invokes the method.</li>
<li>Commits or rolls back based on the outcome and rollback rules.</li>
</ol>

<h4>Propagation — the complete table</h4>
<table><thead><tr><th>Propagation</th><th>Behaviour</th><th>Real use case</th></tr></thead><tbody>
<tr><td><b>REQUIRED</b> (default)</td><td>Join existing, else create new</td><td>Almost everything</td></tr>
<tr><td><b>REQUIRES_NEW</b></td><td>Suspend existing, always create new</td><td>Audit log that must survive the caller's rollback</td></tr>
<tr><td><b>NESTED</b></td><td>Savepoint within the existing transaction</td><td>Partial rollback — the outer can still commit</td></tr>
<tr><td><b>SUPPORTS</b></td><td>Join if present, else run non-transactionally</td><td>Read helpers callable from both contexts</td></tr>
<tr><td><b>NOT_SUPPORTED</b></td><td>Suspend existing, run without a transaction</td><td>Long external call you don't want holding a DB connection</td></tr>
<tr><td><b>MANDATORY</b></td><td>Must have an existing transaction, else throws</td><td>Enforcing that a method is never called outside a transaction</td></tr>
<tr><td><b>NEVER</b></td><td>Must NOT have a transaction, else throws</td><td>Enforcing that a method is called outside any transaction</td></tr>
</tbody></table>
<div class="box b"><div class="t">The REQUIRES_NEW connection-pool deadlock</div><code>REQUIRES_NEW</code> needs a <b>second</b> connection from the pool while the outer transaction holds the first. Under load, every thread holds connection A and waits for connection B, and B is never released because all threads are in the same state. This is a classic pool-exhaustion deadlock.<br><br><b>The fix:</b> size the pool to at least 2× the max concurrent threads, or avoid REQUIRES_NEW in hot paths. This is a real production incident that interviewers love to hear about.</div>

<h4>Isolation — the anomalies each level prevents</h4>
<table><thead><tr><th>Level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom read</th></tr></thead><tbody>
<tr><td>READ_UNCOMMITTED</td><td>Possible</td><td>Possible</td><td>Possible</td></tr>
<tr><td>READ_COMMITTED</td><td>Prevented</td><td>Possible</td><td>Possible</td></tr>
<tr><td>REPEATABLE_READ</td><td>Prevented</td><td>Prevented</td><td>Possible*</td></tr>
<tr><td>SERIALIZABLE</td><td>Prevented</td><td>Prevented</td><td>Prevented</td></tr>
</tbody></table>
<p>*InnoDB actually prevents phantoms at REPEATABLE_READ via next-key locks, even though the SQL standard allows them. This is a real gotcha if you're comparing MySQL and PostgreSQL behaviour.</p>
<p><b>The important caveat:</b> <code>@Transactional(isolation = ...)</code> is a <em>hint</em> to the JDBC driver. If the underlying database or driver doesn't support it, it's silently ignored. Don't assume your setting is in effect without verifying.</p>

<h4>Rollback rules — the trap</h4>
<pre><code>@Transactional
public void process() throws IOException {
save();
if (bad) throw new IOException("checked!"); // ← transaction COMMITS
}</code></pre>
<p>By default, Spring rolls back only on <code>RuntimeException</code> and <code>Error</code>. Checked exceptions <b>commit</b>.</p>
<pre><code>// Fix 1 — declare it
@Transactional(rollbackFor = Exception.class)

// Fix 2 — throw a runtime exception instead
throw new ServiceException("...", cause);</code></pre>
<div class="box w"><div class="t">Why this default exists</div>Checked exceptions were intended to represent recoverable conditions the caller can handle — so rolling back might be wrong. Runtime exceptions represent programming errors where the transaction should definitely be abandoned. The rationale is defensible, but in practice almost everyone wants rollback on all exceptions, so the default surprises people.</div>

<h4>The four things @Transactional does NOT cover</h4>
<ol>
<li><b>External calls.</b> Publishing to Kafka, calling a REST API, sending an email — none roll back. This is exactly why the <b>Transactional Outbox</b> pattern exists.</li>
<li><b>Async work.</b> A <code>@Async</code> method runs on another thread and doesn't inherit the transaction context. The ThreadLocal doesn't propagate.</li>
<li><b>Caches.</b> Rolling back the database doesn't evict your Redis entry. You get a cache that reflects a transaction that never happened.</li>
<li><b>File system or object storage writes.</b> Same as external calls — no rollback.</li>
</ol>

<h4>readOnly — what it actually does</h4>
<pre><code>@Transactional(readOnly = true)
public List&lt;Order&gt; findOrders(Long userId) { ... }</code></pre>
<ul>
<li><b>Hibernate:</b> sets <code>FlushMode.MANUAL</code> — no dirty checking, no automatic flush. This is a real performance win: the persistence context doesn't track changes.</li>
<li><b>JDBC:</b> calls <code>Connection.setReadOnly(true)</code>. Whether this does anything depends on the driver and database.</li>
<li><b>Routing:</b> if you have a read-write split datasource, readOnly routes to a replica.</li>
<li><b>It is NOT a security guarantee.</b> Nothing prevents a write; it's a hint for optimisation.</li>
</ul>

<h4>TransactionTemplate — when to use it</h4>
<pre><code>@Autowired private TransactionTemplate txTemplate;

public void process(Order order) {
txTemplate.execute(status -&gt; {
repo.save(order);
if (order.isInvalid()) {
status.setRollbackOnly(); // explicit control
return null;
}
return null;
});
}</code></pre>
<p><b>Use it when:</b> you need programmatic control over the boundary, you're in a loop and want one transaction per iteration, or you're calling code that isn't proxied (self-invocation). It's often clearer than fighting the proxy model.</p>

<h4>Debugging transactions</h4>
<ul>
<li><b>Enable SQL logging</b> and look for BEGIN/COMMIT/ROLLBACK. If you don't see them, the transaction isn't starting.</li>
<li><b>Check method visibility</b> — private/final methods can't be advised.</li>
<li><b>Check self-invocation</b> — calling <code>this.method()</code> bypasses the proxy.</li>
<li><b>Check the call path</b> — if the caller is outside Spring's proxy (e.g. a test calling the impl directly), no advice applies.</li>
<li><b>Log <code>TransactionSynchronizationManager.isActualTransactionActive()</code></b> at the start of the method to confirm.</li>
</ul>`,

drill:["Write a service with REQUIRES_NEW inside a REQUIRES transaction. Break it with a small connection pool and observe the deadlock.",
"Write a method that throws a checked exception inside @Transactional. Verify the transaction commits. Fix it with rollbackFor.",
"Implement the TransactionTemplate version of a method with conditional rollback."],

qa:[
["What happens if you call a @Transactional method from a non-Spring-managed object?","No transaction starts. The advice is applied by a proxy, and if the caller holds a raw reference to the implementation rather than the proxy, no interception happens. This bites people in tests (where they instantiate the class directly) and in code that uses <code>new</code> instead of injection."],
["Why does REQUIRES_NEW need a separate connection?","Because the outer transaction still holds its connection and its locks. The inner transaction is a genuinely separate database transaction — it needs its own connection to begin, commit, and hold its own locks. There's no way to have two independent transactions on one connection. Hence the pool-sizing requirement."],
["What's the difference between NESTED and REQUIRES_NEW?","NESTED uses a JDBC savepoint within the same transaction and the same connection. If the inner fails, you roll back to the savepoint and the outer can still commit. REQUIRES_NEW is a fully separate transaction on a separate connection — if the inner commits and the outer rolls back, the inner's changes persist. NESTED requires savepoint support; not all databases have it."],
["How do you ensure a Kafka message is published exactly when the database transaction commits?","I don't try to make them atomic — that's not possible without distributed transactions. I use the Transactional Outbox: write the business row and an outbox row in the same local transaction, then a separate relay (poller or CDC) reads the outbox and publishes. Publishing becomes at-least-once, so consumers must be idempotent. This is the standard pattern and the correct answer."],
["Can you have nested @Transactional methods with different isolation levels?","You can declare it, but it usually has no effect. Isolation is set on the JDBC connection, and if the inner method joins the existing transaction (REQUIRED), the connection already has its isolation level set. To actually change isolation, the inner method must use REQUIRES_NEW — which brings the connection-pool cost. In practice, mixing isolation levels in one call chain is a design smell."]
],
exit:"Explain the four things @Transactional doesn't cover, and the REQUIRES_NEW pool deadlock, in 90 seconds."},

{d:19,wk:3,prio:"P0",title:"JPA / Hibernate — N+1, Fetching & Locking",
obj:"Diagnose N+1 and pick the right fetching strategy and locking approach.",
core:`<h4>The persistence context — the thing that explains everything</h4>
<p>Within a transaction, Hibernate keeps a first-level cache of every entity it has loaded. This gives you:</p>
<ul>
<li><b>Identity guarantee:</b> loading the same row twice returns the same object instance.</li>
<li><b>Dirty checking:</b> at flush time, Hibernate compares each managed entity to its loaded snapshot and issues UPDATEs for changed ones. No explicit save needed.</li>
<li><b>Write-behind:</b> changes are batched and flushed at commit or before a query that needs them.</li>
</ul>
<div class="box w"><div class="t">The consequence</div>Because dirty checking compares against a snapshot, loading 10,000 entities just to read one field means 10,000 snapshots held in memory and 10,000 objects compared at flush. This is why read paths should use projections, not entities. It's the single biggest JPA performance lesson.</div>

<h4>N+1 — the pattern</h4>
<pre><code>// 1 query to load orders
List&lt;Order&gt; orders = orderRepo.findAll();

// N queries, one per order, to load the customer
for (Order o : orders) {
System.out.println(o.getCustomer().getName()); // lazy load → SELECT
}
// Total: N + 1 queries</code></pre>
<p><b>Detection:</b> enable SQL logging in a test and count the statements. Or use Hibernate <code>Statistics</code>, or <code>datasource-proxy</code> with a query-count assertion. A test that asserts "this operation issues exactly 2 queries" catches N+1 regressions before they ship.</p>

<h4>The four fixes</h4>
<table><thead><tr><th>Fix</th><th>How</th><th>When</th><th>Caveat</th></tr></thead><tbody>
<tr><td><b>JOIN FETCH</b></td><td><code>SELECT o FROM Order o JOIN FETCH o.customer</code></td><td>Simple, one association</td><td>Breaks with pagination on collection fetches</td></tr>
<tr><td><b>EntityGraph</b></td><td><code>@EntityGraph(attributePaths = "customer")</code></td><td>Declarative, reusable</td><td>Same pagination caveat for collections</td></tr>
<tr><td><b>DTO projection</b></td><td>Query returning a DTO directly</td><td>Read paths — the best answer</td><td>More code; separate read model</td></tr>
<tr><td><b>@BatchSize</b></td><td><code>@BatchSize(size = 50)</code> on the association</td><td>Can't restructure the query</td><td>Turns N+1 into N/50+1 — still not 1</td></tr>
</tbody></table>

<h4>DTO projection — the architect's default</h4>
<pre><code>public record OrderSummary(Long id, String customerName, BigDecimal total) {}

@Query("""
SELECT new com.example.OrderSummary(o.id, c.name, o.total)
FROM Order o JOIN o.customer c
WHERE o.status = :status
""")
List&lt;OrderSummary&gt; findSummaries(OrderStatus status);</code></pre>
<p><b>Why this wins:</b></p>
<ul>
<li><b>One query.</b> The join is in the SQL.</li>
<li><b>No managed entities.</b> Nothing is tracked, nothing is dirty-checked, nothing is snapshotted.</li>
<li><b>Only the needed columns.</b> Less data over the wire, potentially an index-only scan.</li>
<li><b>Pagination works.</b> No in-memory paging fallback.</li>
</ul>
<div class="box o"><div class="t">Say this in the interview</div>"We stopped treating JPA entities as the universal read model. Write paths use entities for their dirty-checking and cascade behaviour. Read paths use projections that fetch exactly what the screen needs. That single decision eliminated most of our N+1 problems and a large fraction of our memory pressure."</div>

<h4>Why JOIN FETCH breaks with pagination</h4>
<pre><code>// This looks fine but is NOT
@Query("SELECT o FROM Order o JOIN FETCH o.items")
List&lt;Order&gt; findAllWithItems(Pageable pageable);</code></pre>
<p>If an order has 10 items, the join produces 10 rows for that order. LIMIT 20 would return 20 rows — but that's only 2 orders, not 20. Hibernate detects this and falls back to loading <em>all</em> matching rows into memory, then paginating in Java. You get a warning: <code>HHH000104: firstResult/maxResults specified with collection fetch; applying in memory</code>. On a large table, this is an OOM.</p>
<p><b>The fixes:</b></p>
<ul>
<li><b>Two-query approach.</b> Page the order IDs first, then fetch the associations for those IDs.</li>
<li><b>@BatchSize</b> instead of JOIN FETCH — keeps pagination correct.</li>
<li><b>DTO projection</b> — sidesteps the issue entirely.</li>
</ul>

<h4>FetchType — LAZY vs EAGER</h4>
<table><thead><tr><th></th><th>LAZY</th><th>EAGER</th></tr></thead><tbody>
<tr><td>Default for</td><td><code>@OneToMany</code>, <code>@ManyToMany</code></td><td><code>@ManyToOne</code>, <code>@OneToOne</code></td></tr>
<tr><td>Loads</td><td>On first access</td><td>Immediately with the parent</td></tr>
<tr><td>Outside transaction</td><td><code>LazyInitializationException</code></td><td>Works, but you paid the cost</td></tr>
</tbody></table>
<p><b>The rule:</b> make everything LAZY, including <code>@ManyToOne</code>. EAGER looks convenient but it cascades — an eager <code>@ManyToOne</code> on an entity that's itself loaded by an eager association produces a join explosion. LAZY plus explicit fetching gives you control.</p>

<h4>Locking</h4>
<pre><code>// OPTIMISTIC — a @Version column, checked on UPDATE
@Entity
class Account {
@Version private Long version; // Hibernate manages this
private BigDecimal balance;
}

// On conflict: OptimisticLockException. Caller retries.

// PESSIMISTIC — SELECT ... FOR UPDATE
@Lock(LockModeType.PESSIMISTIC_WRITE)
@Query("SELECT a FROM Account a WHERE a.id = :id")
Account findForUpdate(@Param("id") Long id);</code></pre>
<table><thead><tr><th></th><th>Optimistic</th><th>Pessimistic</th></tr></thead><tbody>
<tr><td>Mechanism</td><td>Version check on write</td><td>Database row lock</td></tr>
<tr><td>Contention</td><td>Low — retries only on conflict</td><td>Serialises all access</td></tr>
<tr><td>Failure mode</td><td>Exception, retry needed</td><td>Deadlock, lock timeout</td></tr>
<tr><td>Retry requirement</td><td>Yes — must be idempotent</td><td>No, but must handle timeout</td></tr>
<tr><td>Use when</td><td>Conflicts are rare</td><td>Conflicts are frequent, or correctness demands serialisation</td></tr>
</tbody></table>

<div class="box b"><div class="t">The trap in pessimistic locking</div>You hold the database lock for the entire transaction. If you make an HTTP call inside that transaction — which people do by accident — you're holding a row lock for the duration of a network round trip. Under load, this serialises everything and exhausts the connection pool. <b>Never make external calls inside a transaction.</b></div>

<h4>The better answer for balances</h4>
<pre><code>// Instead of SELECT FOR UPDATE + modify + save:
@Modifying
@Query("""
UPDATE Account a
SET a.balance = a.balance - :amt, a.version = a.version + 1
WHERE a.id = :id AND a.balance &gt;= :amt
""")
int debit(@Param("id") Long id, @Param("amt") BigDecimal amt);
// returns 0 if insufficient funds — no exception, no lock held</code></pre>
<p><b>Why this is better:</b> a single atomic statement, no explicit lock, no read-modify-write window, and it fails cleanly. The <code>balance &gt;= amt</code> predicate is the business rule enforced in the database. This is the pattern for any hot-row update.</p>

<h4>Common Hibernate performance issues</h4>
<ul>
<li><b>N+1</b> — the big one. Use projections.</li>
<li><b>Unbounded queries</b> — <code>findAll()</code> on a large table. Always paginate.</li>
<li><b>EAGER cascades</b> — one eager association pulls in three more.</li>
<li><b>Dirty checking overhead</b> — loading entities for read-only use.</li>
<li><b>Missing <code>@BatchSize</code></b> on lazy collections that get iterated.</li>
<li><b>Flush before every query</b> — Hibernate flushes to ensure the query sees pending changes. <code>readOnly = true</code> disables this.</li>
<li><b>Wrong generation strategy</b> — <code>GenerationType.IDENTITY</code> disables JDBC batch inserts because the ID must be known immediately. Use <code>SEQUENCE</code> with a pooled optimizer for batching.</li>
</ul>`,

drill:["Reproduce N+1 with a simple Order/Customer model. Count the queries. Fix it four ways and count again.",
"Trigger the pagination-with-fetch warning. Observe in-memory paging. Fix with the two-query approach.",
"Implement optimistic locking with @Version. Force a conflict with two threads and observe the exception."],

qa:[
["Why is the persistence context called a first-level cache and how does it differ from the second-level cache?","The first-level cache is per-transaction and mandatory — it's the identity map that guarantees <code>find(id)</code> twice returns the same instance. The second-level cache is per-SessionFactory, optional, and shared across transactions. The first-level cache also gives you dirty checking; the second-level cache only stores data. The first is a correctness mechanism; the second is a performance optimisation."],
["What causes LazyInitializationException and how do you fix it properly?","Accessing a lazy association after the session is closed. The usual cause is loading an entity in a service method and passing it to a view or DTO mapper that runs outside the transaction. The wrong fix is <code>spring.jpa.open-in-view=true</code> (which is the default and holds the session open for the whole request — masking the problem and holding connections). The right fix is to fetch what you need inside the transaction, using a projection or a fetch join, and return a fully-initialised DTO."],
["When would you choose pessimistic locking over optimistic?","When conflicts are frequent enough that optimistic retry loops waste more work than serialisation would, or when the operation genuinely must not fail — a financial settlement that must complete. Also when the cost of a retry is high (long transaction) or when retries would produce confusing user-visible behaviour. But the first choice should always be to redesign so there's no contention — for example, an append-only ledger instead of an updated balance."],
["Why does GenerationType.IDENTITY prevent JDBC batch inserts?","Because with IDENTITY, the database generates the ID on insert, so Hibernate must execute each INSERT individually and read back the generated key before it can proceed. It can't queue multiple inserts into a batch. SEQUENCE generation lets Hibernate fetch a block of IDs up front, assign them in memory, and batch the inserts. On a bulk insert of 100,000 rows, this is the difference between minutes and seconds."],
["How do you test that your repository doesn't have an N+1 problem?","Write a test that asserts the query count. Use <code>datasource-proxy</code> or Hibernate's <code>Statistics</code> API to count statements, then assert an exact number. A test asserting 'this method issues exactly 2 queries' fails the moment someone adds a lazy access in a loop. It's the only reliable way to prevent regressions — manual review doesn't catch N+1."]
],
exit:"Reproduce and fix N+1 four ways in 20 minutes, and explain the pagination-with-fetch trap in 60 seconds."},

{d:20,wk:3,prio:"P1",title:"Spring Boot Internals, Config & Observability",
obj:"Explain auto-configuration, profiles, and actuator without hand-waving.",
core:`<h4>Auto-configuration — the mechanics</h4>
<pre><code>@SpringBootApplication
= @SpringBootConfiguration
+ @ComponentScan
+ @EnableAutoConfiguration</code></pre>
<p><code>@EnableAutoConfiguration</code> imports candidate configurations from:</p>
<pre><code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports</code></pre>
<p>Each candidate class is annotated with conditions. The condition evaluation is what makes "add a dependency and it works" possible — and what makes "why isn't my bean being used?" answerable.</p>
<pre><code>@AutoConfiguration
@ConditionalOnClass(DataSource.class)
@ConditionalOnMissingBean(DataSource.class)
@EnableConfigurationProperties(DataSourceProperties.class)
public class DataSourceAutoConfiguration {
@Bean
@ConditionalOnMissingBean
public DataSource dataSource(DataSourceProperties props) { ... }
}</code></pre>
<div class="box o"><div class="t">The one-liner that answers most questions</div>"Spring Boot auto-configuration is a set of conditional bean definitions. Each one applies only if its conditions match — typically 'this class is on the classpath and no bean of this type exists yet.' That's why adding a dependency activates configuration, and why defining your own bean overrides it."</div>

<h4>Debugging auto-configuration</h4>
<pre><code>java -jar app.jar --debug
# or in application.yml:
debug: true</code></pre>
<p>This prints the <b>condition evaluation report</b> with three sections:</p>
<ul>
<li><b>Positive matches</b> — configurations that applied and why.</li>
<li><b>Negative matches</b> — configurations that didn't apply and which condition failed.</li>
<li><b>Exclusions</b> — explicitly excluded configurations.</li>
</ul>
<p>This is the fastest way to answer "why isn't my datasource configured?" — the report tells you exactly which condition failed.</p>

<h4>Configuration precedence — highest to lowest</h4>
<ol>
<li>Command-line arguments (<code>--server.port=9090</code>)</li>
<li><code>SPRING_APPLICATION_JSON</code> (inline JSON in an env var)</li>
<li>ServletConfig / ServletContext init parameters</li>
<li>JNDI attributes</li>
<li>Java system properties (<code>-Dserver.port=9090</code>)</li>
<li>OS environment variables</li>
<li><code>application-{profile}.properties</code> outside the jar</li>
<li><code>application-{profile}.properties</code> inside the jar</li>
<li><code>application.properties</code> outside the jar</li>
<li><code>application.properties</code> inside the jar</li>
<li><code>@PropertySource</code> annotations</li>
<li>Default properties</li>
</ol>
<p><b>The practical rule:</b> external overrides internal, specific overrides general. This is what makes the same artifact deployable to every environment — you build once and override config at deploy time.</p>

<h4>Profiles</h4>
<pre><code># application.yml
spring:
profiles:
active: dev
---
spring:
config:
activate:
on-profile: prod
datasource:
url: jdbc:postgresql://prod-db:5432/app
hikari:
maximum-pool-size: 50</code></pre>
<pre><code>// Or programmatically
@Configuration
@Profile("prod")
public class ProdConfig { ... }

@Configuration
@Profile("!prod")
public class DevConfig { ... }</code></pre>
<div class="box w"><div class="t">The profile anti-pattern</div>Using profiles to switch between fundamentally different configurations — different databases, different message brokers — creates an untested matrix. The staging profile is never quite the production profile, and the difference bites you at the worst moment. Better: keep profiles for genuinely environment-specific values (URLs, credentials, pool sizes) and use feature flags for behavioural differences.</div>

<h4>Externalised configuration — @ConfigurationProperties</h4>
<pre><code>@ConfigurationProperties(prefix = "payment")
@Validated
public record PaymentProperties(
@NotBlank String gatewayUrl,
@Min(1) @Max(100) int maxRetries,
@NotNull Duration timeout,
@Valid Retry retry
) {
public record Retry(@Min(1) int initialDelayMs, @Min(1) int maxAttempts) {}
}</code></pre>
<pre><code>payment:
gateway-url: https://api.psp.example.com
max-retries: 3
timeout: 2s
retry:
initial-delay-ms: 100
max-attempts: 5</code></pre>
<p><b>Why this beats <code>@Value</code>:</b> type safety, validation, IDE completion, relaxed binding (<code>gateway-url</code>, <code>gatewayUrl</code>, and <code>GATEWAY_URL</code> all bind), and a single place to see all related config. <code>@Value</code> scattered across classes is a maintenance problem.</p>

<h4>Actuator — the production endpoints</h4>
<table><thead><tr><th>Endpoint</th><th>What it gives you</th><th>Expose in prod?</th></tr></thead><tbody>
<tr><td><code>/health</code></td><td>Liveness and readiness with component detail</td><td>Yes — needed by orchestrators</td></tr>
<tr><td><code>/info</code></td><td>Build info, git commit, version</td><td>Yes</td></tr>
<tr><td><code>/metrics</code></td><td>JVM, HTTP, datasource, custom metrics</td><td>Yes — via Prometheus scrape</td></tr>
<tr><td><code>/prometheus</code></td><td>Metrics in Prometheus format</td><td>Yes</td></tr>
<tr><td><code>/env</code></td><td>All resolved properties</td><td><b>No</b> — leaks secrets</td></tr>
<tr><td><code>/configprops</code></td><td>All @ConfigurationProperties beans</td><td><b>No</b></td></tr>
<tr><td><code>/beans</code></td><td>Every bean in the context</td><td><b>No</b></td></tr>
<tr><td><code>/heapdump</code></td><td>Heap dump download</td><td><b>Never</b> — contains all data</td></tr>
<tr><td><code>/threaddump</code></td><td>Thread dump</td><td>Restricted</td></tr>
<tr><td><code>/loggers</code></td><td>View and change log levels at runtime</td><td>Restricted — but very useful</td></tr>
</tbody></table>
<pre><code>management:
endpoints:
web:
exposure:
include: health,info,metrics,prometheus,loggers
endpoint:
health:
show-details: when-authorized
probes:
enabled: true</code></pre>
<div class="box b"><div class="t">The security incident</div>Exposing <code>/env</code> or <code>/heapdump</code> unauthenticated is a real breach. <code>/env</code> shows all resolved properties including passwords and tokens. <code>/heapdump</code> contains every object in memory including session data and PII. Never expose these on a public port. If you need them, put them on a separate management port with authentication and network restrictions.</div>

<h4>Micrometer — one API, many backends</h4>
<pre><code>@Autowired private MeterRegistry registry;

// Counter
registry.counter("payments.processed",
"gateway", "stripe", "status", "success").increment();

// Timer
Timer timer = registry.timer("payment.latency", "gateway", "stripe");
timer.record(() -&gt; processPayment());

// Gauge
registry.gauge("queue.depth", queue, Queue::size);</code></pre>
<p>Micrometer is to metrics what SLF4J is to logging — a facade. You write against the API and swap the backend (Prometheus, Datadog, CloudWatch) without changing code. Since Spring Boot 3, Micrometer Observation unifies metrics and tracing in one API.</p>

<h4>Health checks that matter</h4>
<pre><code>@Component
public class PaymentGatewayHealth implements HealthIndicator {
@Override
public Health health() {
try {
var response = gateway.ping();
if (response.isHealthy())
return Health.up().withDetail("latencyMs", response.latency()).build();
return Health.down().withDetail("reason", response.reason()).build();
} catch (Exception e) {
return Health.down(e).build();
}
}
}</code></pre>
