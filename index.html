<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>56-Day Interview Mastery — Daily Material</title>
<style>
:root{
--bg:#0b1020;--bg2:#0f172e;--card:#121a33;--card2:#16203d;
--line:#243154;--line2:#2f3f68;--tx:#e6ecff;--tx2:#a8b6dd;--tx3:#6f7fa8;
--acc:#6d8cff;--acc2:#8aa2ff;--ok:#38d39f;--warn:#ffb454;--bad:#ff6b81;--gold:#ffd479;
--r:14px;--r2:10px;--sb:272px;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
html[data-theme="light"]{
--bg:#f6f8fd;--bg2:#eef2fa;--card:#fff;--card2:#f4f7fd;--line:#dfe6f3;--line2:#c9d4e8;
--tx:#111a2e;--tx2:#455576;--tx3:#7b8aa8;--acc:#3b5bdb;--acc2:#2f4bc4;--ok:#0f9d68;
--warn:#b8720a;--bad:#d63a52;--gold:#a97a00;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.86em;background:var(--card2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--gold);white-space:nowrap}
html[data-theme="light"] code{color:#8a4b00}
pre{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.4px;line-height:1.55;margin:10px 0}
pre code{background:none;border:none;padding:0;color:var(--tx);white-space:pre}
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);
backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 20px}
.hrow{display:flex;align-items:center;gap:14px;max-width:1320px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:750;font-size:14.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}
.brand small{color:var(--tx3);font-family:var(--mono);font-size:10.5px;font-weight:500}
.hs{display:flex;gap:16px;margin-left:auto;align-items:center;flex-wrap:wrap}
.hst{text-align:right}
.hst .v{font-family:var(--mono);font-size:14.5px;font-weight:700}
.hst .k{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3)}
.pw{max-width:1320px;margin:8px auto 0}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .35s}
.bl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);font-family:var(--mono);margin-top:4px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx2);cursor:pointer;width:33px;height:33px;
border-radius:8px;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.ib:hover{border-color:var(--acc);color:var(--tx)}
.wrap{display:flex;min-height:100vh}
.sb{width:var(--sb);flex:0 0 var(--sb);position:fixed;top:0;bottom:0;left:0;background:var(--bg2);
border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60}
.sbh{padding:14px 16px 10px;border-top:56px solid transparent}
.sbs{font-size:11px;color:var(--tx3);font-family:var(--mono);padding:0 16px 10px;border-bottom:1px solid var(--line)}
.sbn{overflow-y:auto;flex:1;padding:8px 8px 30px}
.sbn::-webkit-scrollbar{width:8px}.sbn::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.wkg{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);font-weight:700;padding:13px 8px 5px}
.dl{display:flex;gap:8px;align-items:center;padding:6px 9px;border-radius:8px;color:var(--tx2);font-size:12.8px;cursor:pointer;border-left:2px solid transparent}
.dl:hover{background:var(--card);color:var(--tx);text-decoration:none}
.dl.on{background:var(--card);color:var(--tx);border-left-color:var(--acc);font-weight:600}
.dl .n{font-family:var(--mono);font-size:10px;color:var(--tx3);min-width:19px}
.dl.on .n{color:var(--acc2)}
.dl.done .n{color:var(--ok)}
.dl .ck{margin-left:auto;font-size:11px;color:var(--ok);opacity:0;flex:0 0 auto}
.dl.done .ck{opacity:1}
.main{margin-left:var(--sb);flex:1;min-width:0}
.ct{padding:26px 30px 120px;max-width:900px}
.mb{display:none}.sc{display:none}
@media(max-width:980px){
.sb{transform:translateX(-100%);transition:transform .22s;width:280px}
.sb.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
.main{margin-left:0}.ct{padding:18px 16px 100px}
.mb{display:grid}.sc.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.dh{padding:18px 22px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--card2),transparent)}
.dh .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.daynum{font-family:var(--mono);font-size:11px;background:var(--acc);color:#fff;padding:3px 10px;border-radius:6px;font-weight:700}
.wkp{font-family:var(--mono);font-size:10.5px;color:var(--tx3);border:1px solid var(--line2);padding:2px 8px;border-radius:99px}
.prp{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:700}
.prp.P0{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.prp.P1{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.prp.P2{background:color-mix(in srgb,var(--tx3) 18%,transparent);color:var(--tx3)}
.dh h1{font-size:23px;margin:0 0 8px;letter-spacing:-.4px;font-weight:770;line-height:1.25}
.obj{color:var(--tx2);font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.obj b{color:var(--acc2);flex:0 0 auto}
.db{padding:22px}
.db h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc2);font-weight:700;margin:22px 0 8px}
.db h4:first-child{margin-top:0}
.db p{margin:0 0 11px}
.db ul,.db ol{margin:0 0 12px;padding-left:21px}
.db li{margin:4px 0}
.db table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.2px}
.db th,.db td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.db th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700;background:var(--card2)}
.db strong{color:var(--tx);font-weight:670}
.db em{color:var(--tx2)}
.box{border-left:3px solid var(--acc);background:var(--card2);padding:11px 15px;border-radius:0 9px 9px 0;margin:12px 0;font-size:14px}
.box.w{border-left-color:var(--warn)}.box.b{border-left-color:var(--bad)}.box.o{border-left-color:var(--ok)}
.box .t{font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;color:var(--acc2)}
.box.w .t{color:var(--warn)}.box.b .t{color:var(--bad)}.box.o .t{color:var(--ok)}
.drill{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);margin-bottom:7px;cursor:pointer}
.drill:hover{border-color:var(--line2)}
.drill input{margin:4px 0 0;accent-color:var(--ok);width:16px;height:16px;flex:0 0 auto;cursor:pointer}
.drill .x{flex:1;font-size:14px}
.drill input:checked ~ .x{color:var(--tx3);text-decoration:line-through}
.qa{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--card2)}
.qa .q{padding:11px 14px;font-weight:620;font-size:14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;user-select:none}
.qa .q:hover{background:var(--card)}
.qa .q .qn{font-family:var(--mono);font-size:10.5px;color:var(--acc2);flex:0 0 auto;margin-top:3px}
.qa .q .tg{margin-left:auto;font-size:10.5px;color:var(--tx3);font-family:var(--mono);flex:0 0 auto;white-space:nowrap}
.qa .a{display:none;padding:0 14px 14px 38px;color:var(--tx2);font-size:14px;border-top:1px solid var(--line)}
.qa.open .a{display:block;padding-top:12px}
.qa .a strong{color:var(--tx)}
.exit{border:1px solid var(--line2);border-radius:11px;padding:14px 16px;margin-top:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 8%,var(--card)),var(--card))}
.exit .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc2);font-weight:700;margin-bottom:6px}
.exit .d{font-size:14.3px;color:var(--tx2);margin-bottom:11px}
.exit label{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;font-weight:600}
.exit input{accent-color:var(--ok);width:17px;height:17px;cursor:pointer}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap}
.nb{background:var(--card);border:1px solid var(--line2);color:var(--tx);cursor:pointer;padding:9px 16px;border-radius:9px;font-size:13.5px;font-family:var(--sans);font-weight:600}
.nb:hover{border-color:var(--acc)}
.nb:disabled{opacity:.35;cursor:not-allowed}
.nb.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.nb.pri:hover{background:var(--acc2)}
.nb2{margin-top:20px}
.nb2 textarea{width:100%;min-height:120px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
color:var(--tx);padding:12px;font-family:var(--mono);font-size:12.6px;line-height:1.6;resize:vertical;outline:none}
.nb2 textarea:focus{border-color:var(--acc)}
.nm{font-size:10.5px;color:var(--tx3);font-family:var(--mono);margin-top:5px;display:flex;justify-content:space-between}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--card);
border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-size:13px;z-index:200;opacity:0;
transition:.25s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{.sb,header,.nav,.toast,.mb{display:none}.main{margin:0}.ct{padding:0;max-width:none}.qa .a{display:block!important}}
</style>
</head>
<body>

<header>
<div class="hrow">
<div class="brand"><span class="dot"></span>56-Day Mastery <small id="brandSub">daily material</small></div>
<div class="sr">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input type="search" id="search" placeholder="Search all days…" autocomplete="off" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:7px 11px 7px 30px;border-radius:9px;font-size:13px;outline:none">
</div>
<div class="hs">
<div class="hst"><div class="v" id="hDay">Day 1</div><div class="k">Today</div></div>
<div class="hst"><div class="v" id="hStreak">0</div><div class="k">Streak</div></div>
<div class="hst"><div class="v" id="hDone">0/56</div><div class="k">Days done</div></div>
<button class="ib" id="todayBtn" title="Jump to today">⊙</button>
<button class="ib" id="themeBtn" title="Theme">◐</button>
<button class="ib mb" id="menuBtn" title="Menu">☰</button>
</div>
</div>
<div class="pw">
<div class="bar"><i id="pbar"></i></div>
<div class="bl"><span id="ptxt">0 of 56 days complete</span><span id="ppct">0%</span></div>
</div>
</header>

<div class="sc" id="scrim"></div>

<div class="wrap">
<aside class="sb" id="sidebar">
<div class="sbh"></div>
<div class="sbs" id="sbSub">56 days · 8 weeks</div>
<nav class="sbn" id="nav"></nav>
</aside>

<div class="main">
<div class="ct" id="content"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- MINIMAL CURRICULUM (structure only — full content in v2) ---------- */
const DAYS = [
{d:1,wk:1,prio:"P0",title:"Complexity, Arrays & Sorting in Java",obj:"Say the Big-O of any loop in under three seconds.",core:"<h4>Big-O reflex</h4><p>Learn the table, then practise on your own code.</p>",drill:["Write Big-O for 10 snippets from your own codebase."],qa:[["Why is quicksort O(n²) worst case?","Adversarial pivots. Java uses dual-pivot quicksort for primitives for cache locality."]],exit:"Say the Big-O of a nested loop, a sort, and a hash lookup in under 10 seconds."},
{d:2,wk:1,prio:"P1",title:"Two Pointers & Sliding Window",obj:"Recognise the pattern and write it from memory.",core:"<h4>Templates</h4><pre><code>int l=0; for(int r=0;r&lt;n;r++){ add(a[r]); while(!valid()){remove(a[l]); l++;} }</code></pre>",drill:["3Sum from memory in 8 minutes."],qa:[["Why is sliding window O(n) with a nested loop?","l only ever advances. Total work ≤ 2n."]],exit:"Write the sliding window template from memory."},
{d:3,wk:1,prio:"P1",title:"Binary Search (3 Variants) & Floyd's",obj:"Never write a buggy binary search.",core:"<h4>Three variants</h4><p>Exact match uses lo&lt;=hi with hi=mid-1. Lower/upper bound use lo&lt;hi with hi=mid. Mixing them loops forever.</p>",drill:["Implement all three variants with edge-case tests."],qa:[["Why lo + (hi-lo)/2 ?","Avoids integer overflow."]],exit:"Explain the lower-bound variant in 90 seconds."},
{d:4,wk:1,prio:"P0",title:"HashMap Internals",obj:"Explain buckets, treeify, load factor cold.",core:"<h4>Constants</h4><table><tr><th>Value</th><th>Why</th></tr><tr><td>16</td><td>Power of 2</td></tr><tr><td>0.75</td><td>Time/space balance</td></tr><tr><td>8</td><td>Treeify threshold</td></tr><tr><td>6</td><td>Untreeify (hysteresis)</td></tr></table>",drill:["Write a HashMap from scratch: put, get, resize."],qa:[["Why treeify at 8?","P(8 collisions) ≈ 6e-8 under Poisson. It's a DoS safety net."]],exit:"Draw the HashMap structure with all constants annotated."},
{d:5,wk:1,prio:"P1",title:"Collections: Lists, Sets, Deques",obj:"Pick the right collection in 5 seconds.",core:"<h4>Decision table</h4><p>Key-value → HashMap. Sorted → TreeMap. Concurrent → ConcurrentHashMap. Queue/stack → ArrayDeque.</p>",drill:["LRU both ways — LinkedHashMap and HashMap+DLL."],qa:[["Why not LinkedList?","Cache locality and per-node overhead. ArrayDeque wins."]],exit:"Name the right collection for five requirements in 60 seconds."},
{d:6,wk:1,prio:"P0",title:"equals/hashCode, Generics & PECS",obj:"Explain erasure and PECS without notes.",core:"<h4>PECS</h4><p>Producer Extends, Consumer Super.</p>",drill:["Demonstrate the symmetry violation with Point/ColorPoint."],qa:[["Why can't you new T()?","Erasure. The runtime type is Object."]],exit:"Explain PECS with a concrete example in 60 seconds."},
{d:7,wk:1,prio:"P0",title:"Week 1 Integration — Audit",obj:"Find your two weakest topics and fix them.",core:"<h4>Self-audit</h4><p>Score every topic 0–3. Anything below 2 gets 30 minutes today.</p>",drill:["Write a HashMap from scratch in 25 minutes."],qa:[["When would you use TreeMap?","Range queries and sorted iteration."]],exit:"Write a HashMap from scratch in 25 minutes."},
{d:8,wk:2,prio:"P1",title:"BFS & DFS",obj:"Pick BFS vs DFS correctly every time.",core:"<h4>Selection</h4><p>Shortest unweighted path → BFS. All paths, cycles → DFS.</p>",drill:["Number of Islands with BFS and DFS."],qa:[["Why capture q.size() before the loop?","The size changes as you enqueue."]],exit:"Explain why BFS finds shortest paths in 60 seconds."},
{d:9,wk:2,prio:"P1",title:"Backtracking",obj:"Write any backtracking from the template.",core:"<h4>Template</h4><pre><code>apply(c); recurse(); undo(c);</code></pre>",drill:["Subsets, Permutations, Subsets II."],qa:[["Why copy the list?","Otherwise every stored result is the same mutable object."]],exit:"Write Subsets II with the duplicate-skip line in 10 minutes."},
{d:10,wk:2,prio:"P1",title:"DP I — 1D & Knapsack",obj:"Apply the 4-step DP method.",core:"<h4>4 steps</h4><p>State → recurrence → base cases → order.</p>",drill:["Coin Change, 0/1 Knapsack, LIS."],qa:[["Why backward loop for 0/1 knapsack?","Each item used at most once."]],exit:"Write Coin Change and 0/1 Knapsack from blank."},
{d:11,wk:2,prio:"P1",title:"DP II — 2D & Intervals",obj:"Derive 2D recurrences from state definitions.",core:"<h4>Patterns</h4><p>Two sequences → dp[i][j] over prefixes. Intervals → loop by length.</p>",drill:["LCS and Edit Distance."],qa:[["Why loop by length for interval DP?","dp[i][j] depends on dp[i+1][j-1], a shorter interval."]],exit:"Draw the Edit Distance table by hand for cat→cut."},
{d:12,wk:2,prio:"P1",title:"Heap, Intervals, Trie, Union-Find, Bits",obj:"Deploy each pattern from a template.",core:"<h4>Heap trick</h4><p>K largest uses a MIN-heap of size K.</p>",drill:["Top-K frequent, Meeting Rooms II, Connected Components."],qa:[["Why min-heap for K largest?","You evict the smallest each time; survivors are the largest."]],exit:"Write Trie and Union-Find from memory in 15 minutes."},
{d:13,wk:2,prio:"P0",title:"JVM Memory & GC",obj:"Explain heap, GC algorithms, and OOM triage.",core:"<h4>Collectors</h4><p>G1 default, ZGC sub-ms, Parallel for throughput.</p>",drill:["Read a GC log line by line."],qa:[["Why is minor GC cheap?","Cost is proportional to survivors, not total objects."]],exit:"Read a GC log aloud and describe 6-step heap dump triage."},
{d:14,wk:2,prio:"P0",title:"Concurrency I — JMM & volatile",obj:"Explain happens-before and volatile's limits.",core:"<h4>HB rules</h4><p>Program order, monitor lock, volatile, start/join, transitivity.</p>",drill:["Reproduce a lost update with volatile int."],qa:[["Why is volatile count++ unsafe?","Read-modify-write is three operations."]],exit:"Explain happens-before in 90 seconds."},
{d:15,wk:3,prio:"P0",title:"Concurrency II — Locks & CompletableFuture",obj:"Choose the right lock and compose async.",core:"<h4>Locks</h4><p>synchronized for simple, ReentrantLock for tryLock, StampedLock for read-heavy.</p>",drill:["Transfer with tryLock and timeout."],qa:[["thenApply vs thenCompose?","thenCompose flattens nested futures."]],exit:"Explain when to use each lock in 90 seconds."},
{d:16,wk:3,prio:"P0",title:"Virtual Threads & Structured Concurrency",obj:"Know pinning and when not to use them.",core:"<h4>Pinning</h4><p>synchronized blocks pin carriers pre-Java-24. Use ReentrantLock instead.</p>",drill:["100k virtual threads, 1s sleep. Time it."],qa:[["Why not pool virtual threads?","They're cheap; pooling defeats the point."]],exit:"Explain pinning with a concrete example in 90 seconds."},
{d:17,wk:3,prio:"P1",title:"Spring Core — Lifecycle & Proxies",obj:"Explain the bean lifecycle and self-invocation.",core:"<h4>Self-invocation</h4><p>this.method() bypasses the proxy. Split into two beans.</p>",drill:["Reproduce the self-invocation bug and fix three ways."],qa:[["Why can't CGLIB advise private methods?","It subclasses — private methods aren't overridable."]],exit:"Explain the bean lifecycle and self-invocation trap in 90 seconds."},
{d:18,wk:3,prio:"P0",title:"@Transactional Deep Dive",obj:"Know propagation, rollback, and gaps.",core:"<h4>Gaps</h4><p>External calls, async, caches, filesystem — none roll back.</p>",drill:["REQUIRES_NEW pool deadlock with a small pool."],qa:[["Why does REQUIRES_NEW deadlock?","It needs a second connection."]],exit:"Explain the 4 gaps and the REQUIRES_NEW deadlock in 90 seconds."},
{d:19,wk:3,prio:"P0",title:"JPA — N+1, Fetching, Locking",obj:"Diagnose N+1 and pick the right locking.",core:"<h4>4 fixes</h4><p>JOIN FETCH, EntityGraph, DTO projection, @BatchSize.</p>",drill:["Reproduce N+1, fix four ways."],qa:[["Why does JOIN FETCH break pagination?","Row multiplication — Hibernate pages in memory."]],exit:"Reproduce and fix N+1 four ways in 20 minutes."},
{d:20,wk:3,prio:"P1",title:"Spring Boot Internals & Observability",obj:"Explain auto-config and Actuator.",core:"<h4>Auto-config</h4><p>@ConditionalOnMissingBean is why your bean overrides the default.</p>",drill:["Run with --debug and read the report."],qa:[["Why is /env dangerous?","It leaks resolved secrets."]],exit:"Explain auto-config and config precedence in 90 seconds."},
{d:21,wk:3,prio:"P0",title:"Week 3 Integration",obj:"Prove you can explain transactions and concurrency.",core:"<h4>Retrieval</h4><p>15 questions, 90 seconds each.</p>",drill:["Work the integrated payment scenario on paper."],qa:[["Why never make external calls inside a transaction?","You hold locks across a network call."]],exit:"Answer all 15 retrieval questions in under 22 minutes."},
{d:22,wk:4,prio:"P0",title:"ACID, Isolation & Anomalies",obj:"Name every anomaly and its isolation level.",core:"<h4>Five anomalies</h4><p>Dirty read, non-repeatable, phantom, lost update, write skew.</p>",drill:["Reproduce write skew in two psql sessions."],qa:[["Why doesn't snapshot isolation prevent write skew?","No write-write conflict to detect."]],exit:"Name all five anomalies and the level that prevents each."},
{d:23,wk:4,prio:"P0",title:"MVCC, Locking & Deadlocks",obj:"Explain MVCC and diagnose deadlocks.",core:"<h4>MVCC</h4><p>Readers don't block writers. Long transactions block VACUUM.</p>",drill:["Reproduce a deadlock, then fix with lock ordering."],qa:[["Why is a long transaction bad in Postgres?","It pins the visibility horizon; VACUUM can't reclaim."]],exit:"Explain MVCC in both databases and deadlock prevention."},
{d:24,wk:4,prio:"P0",title:"Indexing I — B-trees & Selectivity",obj:"Design indexes and know why they're ignored.",core:"<h4>Leftmost prefix</h4><p>Index on (a,b,c) can serve a, (a,b), (a,b,c) — not b alone.</p>",drill:["Create a composite index, test five queries."],qa:[["Why is a boolean index useless?","Low selectivity — full scan is cheaper."]],exit:"Explain leftmost-prefix and 5 reasons an index isn't used."},
{d:25,wk:4,prio:"P0",title:"Indexing II — Reading EXPLAIN",obj:"Read any query plan in two minutes.",core:"<h4>Loops</h4><p>Multiply actual time by loops — this is the #1 mistake.</p>",drill:["EXPLAIN ANALYZE five real queries."],qa:[["Why use ANALYZE not just EXPLAIN?","Estimates can be wildly wrong."]],exit:"Read a plan aloud: bottleneck, estimates, fix."},
{d:26,wk:4,prio:"P0",title:"Query Optimization & Sharding",obj:"Reduce a slow query and pick a shard key.",core:"<h4>Keyset pagination</h4><p>WHERE id &gt; lastSeenId beats OFFSET at depth.</p>",drill:["Rewrite an OFFSET query as keyset."],qa:[["Why is keyset O(1) and OFFSET O(n)?","OFFSET generates and discards preceding rows."]],exit:"Explain keyset pagination and shard-key criteria."},
{d:27,wk:4,prio:"P0",title:"Replication, SQL vs NoSQL & CAP",obj:"Choose a database with justification.",core:"<h4>Read-your-writes</h4><p>Pin to primary for 2s after a write, or return the value in the write response.</p>",drill:["Set up replication and observe the lag."],qa:[["How do you prevent split-brain?","Quorum plus fencing."]],exit:"Explain replication lag and the read-your-writes fix."},
{d:28,wk:4,prio:"P0",title:"Week 4 Integration — Schema Design",obj:"Design a schema with justified indexes.",core:"<h4>Multi-tenant</h4><p>tenant_id on every table, leading every index, enabling RLS.</p>",drill:["Design the multi-tenant SaaS schema on paper."],qa:[["Why tenant_id on every table?","RLS, index scoping, and future sharding."]],exit:"Design the schema in 30 minutes and defend every index."},
{d:29,wk:5,prio:"P0",title:"Consistency, CAP & PACELC",obj:"Choose a consistency model per operation.",core:"<h4>Ladder</h4><p>Eventual → read-your-writes → causal → linearizable.</p>",drill:["Assign a consistency model to 8 operations."],qa:[["What does PACELC add?","The L vs C choice during normal operation."]],exit:"Assign consistency per operation for a payments system."},
{d:30,wk:5,prio:"P0",title:"Consensus — Raft",obj:"Whiteboard Raft election and replication.",core:"<h4>Safety</h4><p>A candidate must have a log at least as up-to-date as a majority.</p>",drill:["Draw Raft with term numbers labelled."],qa:[["Why randomised timeouts?","Prevent split votes."]],exit:"Whiteboard Raft in 8 minutes."},
{d:31,wk:5,prio:"P0",title:"Kafka — Ordering, EOS & Operations",obj:"Explain partitioning and exactly-once.",core:"<h4>Ordering</h4><p>Within a partition only. Increasing partition count breaks key ordering.</p>",drill:["Produce with keys and verify partition assignment."],qa:[["Why is exactly-once only within Kafka?","External writes aren't transactional."]],exit:"Explain partitioning, EOS, and lag in 2 minutes."},
{d:32,wk:5,prio:"P0",title:"Distributed Tx — Saga, Outbox, 2PC",obj:"Know why 2PC fails at scale.",core:"<h4>Outbox</h4><p>Business row + outbox row in one local transaction.</p>",drill:["Design a saga for book-flight-hotel-car."],qa:[["Why is a compensation weaker than a rollback?","It's a new transaction with its own failure modes."]],exit:"Explain 2PC failure and design a saga."},
{d:33,wk:5,prio:"P0",title:"Resilience, Retries & SLOs",obj:"Design graceful degradation.",core:"<h4>Quartet</h4><p>Timeout, retry with jitter, circuit breaker, bulkhead.</p>",drill:["Full jitter distribution over 10k samples."],qa:[["Why is jitter essential?","Without it, clients retry in lockstep."]],exit:"Explain the cascade and four defences in 3 minutes."},
{d:34,wk:5,prio:"P0",title:"Caching — Strategies & Failure Modes",obj:"Choose a strategy and name every failure mode.",core:"<h4>Six failure modes</h4><p>Stampede, penetration, avalanche, hot key, big key, inconsistency.</p>",drill:["Reproduce a stampede with 100 threads."],qa:[["Why delete cache on write, not update?","Delete is idempotent and avoids the race."]],exit:"Name six failure modes and fixes in 3 minutes."},
{d:35,wk:5,prio:"P1",title:"Networking, HTTP & APIs",obj:"Reason about the network.",core:"<h4>HTTP/3</h4><p>QUIC over UDP fixes TCP-level HOL blocking.</p>",drill:["Trace an HTTPS request end to end."],qa:[["Why 202 for async payments?","200 implies the work is done."]],exit:"Trace HTTPS and explain three webhook requirements."},
{d:36,wk:6,prio:"P1",title:"Microservices, DDD & Decomposition",obj:"Decide when microservices are wrong.",core:"<h4>Bounded context</h4><p>Same word meaning different things = boundary.</p>",drill:["Identify bounded contexts in a system you know."],qa:[["When are microservices justified?","Independent deploy, scaling, or regulatory isolation."]],exit:"Argue for and against microservices for a specific team size."},
{d:37,wk:6,prio:"P1",title:"CQRS, Event Sourcing & Patterns",obj:"Know when each is over-engineering.",core:"<h4>Event sourcing</h4><p>State is derived from events. Hard schema evolution, complete audit.</p>",drill:["Design event sourcing for a bank account."],qa:[["Event-driven vs event sourcing?","Events for communication vs events as the source of truth."]],exit:"Explain CQRS and event sourcing with their costs."},
{d:38,wk:6,prio:"P1",title:"Security — OWASP, Auth & Secrets",obj:"Design a secure system.",core:"<h4>JWT pitfalls</h4><p>alg:none, HS/RS confusion, no exp check, trusting the payload.</p>",drill:["Forge a JWT with alg:none."],qa:[["Why is OAuth2 not authentication?","It issues authorization tokens, not identity."]],exit:"Name OWASP Top 10 with a concrete attack each."},
{d:39,wk:6,prio:"P0",title:"Design Framework & URL Shortener",obj:"Internalise the 6-phase framework.",core:"<h4>Phases</h4><p>Clarify 5m, numbers 4m, API 4m, high-level 10m, deep dive 15m, failure 7m.</p>",drill:["URL shortener, 35 min timed."],qa:[["Why fan-out on write for normal users?","Reads dominate; precompute the feed."]],exit:"Deliver the URL shortener in 35 minutes."},
{d:40,wk:6,prio:"P0",title:"Drill — Rate Limiter & Notifications",obj:"Two full designs under time.",core:"<h4>Token bucket in Lua</h4><p>Atomic read-modify-write via Redis script.</p>",drill:["Both drills, 30 min each."],qa:[["Why Lua for the rate limiter?","GET-compute-SET has a race without atomicity."]],exit:"Deliver both designs in 60 minutes total."},
{d:41,wk:6,prio:"P0",title:"Drill — Feed & Incident Response",obj:"One classic design and one incident.",core:"<h4>Hybrid fan-out</h4><p>Push for normal users, pull for celebrities.</p>",drill:["Both drills, 30 and 20 min."],qa:[["Why roll back before investigating?","Impact is ongoing; debug in staging after."]],exit:"Deliver the feed design and the incident in 50 minutes."},
{d:42,wk:6,prio:"P0",title:"Week 6 Integration — Full Mock",obj:"Score 22+ on the payment processing mock.",core:"<h4>PCI scope</h4><p>Tokenize at the edge. Card data never touches your servers.</p>",drill:["45 min mock, recorded, scored."],qa:[["Why is PCI scope the first decision?","It determines audit cost and breach blast radius."]],exit:"Score 22+ on the rubric, or fix the two weakest areas."},
{d:43,wk:7,prio:"P0",title:"The Six Fintech Constraints",obj:"Recite all six and lead with them.",core:"<h4>Six constraints</h4><p>Idempotency, consistency where it counts, downstream limits, retry storms, reconciliation, auditability.</p>",drill:["Recite all six with an example each."],qa:[["Why is idempotency critical in fintech?","The cost of a duplicate is asymmetric and irreversible."]],exit:"Recite all six constraints in 45 seconds."},
{d:44,wk:7,prio:"P0",title:"Idempotency — Complete Implementation",obj:"Design the full layer end to end.",core:"<h4>Three states</h4><p>SUCCEEDED returns the stored response. FAILED returns the failure. IN_PROGRESS returns 409.</p>",drill:["Implement the layer with the request hash check."],qa:[["Why a DB constraint, not application logic?","Application logic has a race window."]],exit:"Design the idempotency layer in 10 minutes."},
{d:45,wk:7,prio:"P0",title:"Ledger Design & Reconciliation",obj:"Design append-only double-entry.",core:"<h4>Zero-sum</h4><p>Every entry's postings sum to zero. Balances are derived, not stored.</p>",drill:["Design the schema and implement a transfer."],qa:[["Why append-only?","Complete audit trail and replayable state."]],exit:"Design ledger and reconciliation in 12 minutes."},
{d:46,wk:7,prio:"P0",title:"Case — UPI Spike & Double Debit",obj:"Two most-asked fintech scenarios.",core:"<h4>Bottleneck</h4><p>The PSP is outside your control. Autoscaling is the wrong lever.</p>",drill:["Both cases, 25 min each."],qa:[["Why is a timeout not a failure?","The outcome is unknown, not failed."]],exit:"Deliver both cases plus the combined scenario."},
{d:47,wk:7,prio:"P0",title:"Case — Cross-Border & Fraud",obj:"Two more complex scenarios.",core:"<h4>State machine</h4><p>Long-running process with compensations, not a distributed transaction.</p>",drill:["Both cases, 30 min each."],qa:[["Why is explainability required in fraud?","Regulatory and operational — you must justify a decline."]],exit:"Deliver both cases in 60 minutes."},
{d:48,wk:7,prio:"P0",title:"Week 7 Integration — Wallet Mock",obj:"Score 28+ on the wallet design.",core:"<h4>Not a scale problem</h4><p>60 TPS is small. The complexity is correctness and auditability.</p>",drill:["45 min mock, scored."],qa:[["Why say 'not a scale problem'?","Calibration is a senior signal."]],exit:"Score 28+ on the wallet rubric."},
{d:49,wk:7,prio:"P0",title:"Fintech Weakness Audit",obj:"Find and fix the specific gaps.",core:"<h4>Rapid fire</h4><p>18 questions, 30 seconds each. Anything you can't answer is your study list.</p>",drill:["Answer all 18 aloud, then work the integrated scenario."],qa:[["Most common mistake at senior level?","Treating fintech as generic system design."]],exit:"Answer all 18 in under 10 minutes, plus the 10-min whiteboard."},
{d:50,wk:8,prio:"P0",title:"Story Bank — All Ten",obj:"Write ten STAR-L stories with real numbers.",core:"<h4>STAR-L</h4><p>Situation, Task, Action, Result, Learning. Numbers in every result.</p>",drill:["Write all ten, 300 words each."],qa:[["How long should an answer be?","2 minutes, Action 60%."]],exit:"Write all ten, then deliver three including the failure."},
{d:51,wk:8,prio:"P0",title:"Behavioral — The Twelve Questions",obj:"Deliver all twelve aloud, timed.",core:"<h4>The test</h4><p>Numbers, ownership, and a learning in every answer.</p>",drill:["All twelve, 90 seconds each, scored."],qa:[["What if interrupted?","Answer their question; let them steer."]],exit:"Score 40+ across the twelve, or rewrite the weakest three."},
{d:52,wk:8,prio:"P0",title:"Failure, Pushback & Pressure",obj:"Handle the five pressure tactics.",core:"<h4>Failure story</h4><p>Real, unsoftened, with a current behaviour change.</p>",drill:["All five tactics in sequence."],qa:[["How to answer 'biggest weakness'?","Real pattern, real cost, concrete behaviour change."]],exit:"Handle all five tactics without becoming defensive."},
{d:53,wk:8,prio:"P0",title:"Machine Coding — Three Drills",obj:"Clean, tested, working code.",core:"<h4>LRU</h4><p>LinkedHashMap first, then HashMap + doubly-linked list.</p>",drill:["LRU, token bucket, ledger — all with tests."],qa:[["Should you write tests unprompted?","Yes. Two minutes, high signal."]],exit:"Complete all three with passing tests in 60 minutes."},
{d:54,wk:8,prio:"P0",title:"Résumé, Negotiation & Logistics",obj:"Build the artifacts and the script.",core:"<h4>Résumé</h4><p>Numbers in the first three bullets. Outcomes, not technologies.</p>",drill:["Rewrite résumé, research salary, rehearse the script."],qa:[["How to handle a lowball?","Ask about structure, then counter once with a reason."]],exit:"Have a rewritten résumé, researched bands, and a rehearsed script."},
{d:55,wk:8,prio:"P0",title:"Final Mock — Full Loop",obj:"Four rounds under real conditions.",core:"<h4>The loop</h4><p>Coding, design, behavioral, negotiation. Back to back.</p>",drill:["Full loop, recorded, scored."],qa:[["How do I know I'm ready?","You can deliver five designs and ten stories from memory."]],exit:"Complete the loop and fix only the two biggest gaps."},
{d:56,wk:8,prio:"P0",title:"Rest, Consolidate & Launch",obj:"Stop preparing. Start applying.",core:"<h4>Waves</h4><p>5 practice, 5 match, 5 top targets. Apply in sequence.</p>",drill:["60 min review, then apply to 5 wave-1 companies."],qa:[["What if I feel unprepared?","Apply today. The feeling doesn't go away with more study."]],exit:"Submit wave-1 applications today and rest."},
];

const $ = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
const LS = {
get(k,d){ try{ const v=localStorage.getItem('mat.v2.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
set(k,v){ try{ localStorage.setItem('mat.v2.'+k, JSON.stringify(v)); }catch(e){} }
};

let STATE = {
start: LS.get('start', iso(today())),
currentDay: LS.get('currentDay', 1),
done: LS.get('done', {}),
drills: LS.get('drills', {}),
notes: LS.get('notes', {}),
qa: LS.get('qa', {}),
streak: LS.get('streak', { last:null, count:0 })
};
function save(){
LS.set('start', STATE.start); LS.set('currentDay', STATE.currentDay);
LS.set('done', STATE.done); LS.set('drills', STATE.drills);
LS.set('notes', STATE.notes); LS.set('qa', STATE.qa); LS.set('streak', STATE.streak);
}
function iso(d){ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderNav(){
const nav = $('#nav');
const weeks = {};
DAYS.forEach(d => { (weeks[d.wk] = weeks[d.wk] || []).push(d); });
let html = '';
Object.keys(weeks).sort((a,b)=>a-b).forEach(w => {
const wk = weeks[w];
const done = wk.filter(d => STATE.done[d.d]).length;
html += '<div class="wkg">Week ' + w + ' · ' + done + '/' + wk.length + '</div>';
wk.forEach(d => {
const isDone = !!STATE.done[d.d];
const isOn = d.d === STATE.currentDay;
html += '<a class="dl' + (isDone?' done':'') + (isOn?' on':'') + '" data-day="' + d.d + '" href="#day' + d.d + '">' +
'<span class="n">' + String(d.d).padStart(2,'0') + '</span>' +
'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(d.title) + '</span>' +
'<span class="ck">✓</span></a>';
});
});
nav.innerHTML = html;
nav.querySelectorAll('.dl').forEach(a => {
a.addEventListener('click', e => {
e.preventDefault();
goToDay(parseInt(a.dataset.day,10));
if (window.innerWidth <= 980) closeNav();
});
});
}

function renderDay(d){
const dk = 'd' + d.d;
let html = '<div class="day" id="day' + d.d + '">';
html += '<div class="dh"><div class="top">';
html += '<span class="daynum">Day ' + d.d + '</span>';
html += '<span class="wkp">Week ' + d.wk + '</span>';
html += '<span class="prp ' + d.prio + '">' + d.prio + '</span>';
html += '</div><h1>' + esc(d.title) + '</h1>';
html += '<div class="obj"><b>Objective</b><span>' + esc(d.obj) + '</span></div></div>';
html += '<div class="db">';
html += d.core;
if (d.drill && d.drill.length){
html += '<h4>Drills</h4>';
d.drill.forEach((dr,i) => {
const k = dk + ':' + i;
html += '<label class="drill"><input type="checkbox" data-drill="' + k + '"' + (STATE.drills[k]?' checked':'') + '>' +
'<span class="x">' + dr + '</span></label>';
});
}
if (d.qa && d.qa.length){
html += '<h4>Self-test — answer aloud before revealing</h4>';
d.qa.forEach((pair,i) => {
const k = dk + ':q' + i;
const open = !!STATE.qa[k];
html += '<div class="qa' + (open?' open':'') + '" data-qa="' + k + '">' +
'<div class="q"><span class="qn">Q' + (i+1) + '</span><span style="flex:1">' + pair[0] + '</span>' +
'<span class="tg">' + (open?'hide':'reveal') + '</span></div>' +
'<div class="a">' + pair[1] + '</div></div>';
});
}
html += '<div class="exit"><div class="t">Exit check</div><div class="d">' + esc(d.exit) + '</div>' +
'<label><input type="checkbox" id="exitCheck"' + (STATE.done[d.d]?' checked':'') + '> I can do this, out loud, without notes.</label></div>';
html += '<div class="nb2"><h4>Notes for this day</h4>' +
'<textarea data-notes="' + d.d + '" placeholder="What clicked, what is still fuzzy…">' + esc(STATE.notes[d.d]||'') + '</textarea>' +
'<div class="nm"><span>' + (STATE.notes[d.d]||'').length + ' chars</span><span>saved locally</span></div></div>';
html += '</div></div>';
const prev = d.d > 1 ? d.d-1 : null;
const next = d.d < DAYS.length ? d.d+1 : null;
html += '<div class="nav">' +
'<button class="nb" ' + (prev?'':'disabled') + ' data-go="' + (prev||'') + '">← Day ' + (prev||'') + '</button>' +
'<button class="nb" data-go-today>Jump to today</button>' +
'<button class="nb pri" ' + (next?'':'disabled') + ' data-go="' + (next||'') + '">Day ' + (next||'') + ' →</button>' +
'</div>';
return html;
}

function bindDay(d){
$$('input[data-drill]').forEach(cb => {
cb.addEventListener('change', () => {
STATE.drills[cb.dataset.drill] = cb.checked;
save(); updateProgress();
});
});
$$('.qa').forEach(el => {
el.querySelector('.q').addEventListener('click', () => {
const k = el.dataset.qa;
const open = !STATE.qa[k];
STATE.qa[k] = open;
el.classList.toggle('open', open);
el.querySelector('.tg').textContent = open ? 'hide' : 'reveal';
save();
});
});
const ex = $('#exitCheck');
if (ex){
ex.addEventListener('change', () => {
if (ex.checked){ STATE.done[d.d]=true; markStreak(); toast('Day ' + d.d + ' complete'); }
else delete STATE.done[d.d];
save(); updateProgress(); renderNav();
});
}
const ta = $('textarea[data-notes]');
if (ta){
ta.addEventListener('input', () => {
STATE.notes[d.d] = ta.value;
LS.set('notes', STATE.notes);
const m = ta.parentElement.querySelector('.nm span');
if (m) m.textContent = ta.value.length + ' chars';
});
}
$$('[data-go]').forEach(b => {
b.addEventListener('click', () => {
const n = parseInt(b.dataset.go,10);
if (n) goToDay(n);
});
});
const jt = $('[data-go-today]');
if (jt) jt.addEventListener('click', jumpToToday);
}

function markStreak(){
const t = iso(today());
const s = STATE.streak;
if (s.last === t) return;
const y = iso(addDays(today(),-1));
s.count = (s.last === y) ? s.count+1 : 1;
s.last = t; save();
}

function goToDay(n){
STATE.currentDay = n; save(); render();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function jumpToToday(){
const elapsed = daysBetween(parse(STATE.start), today());
goToDay(Math.max(1, Math.min(DAYS.length, elapsed+1)));
}

function updateProgress(){
const total = DAYS.length;
const done = DAYS.filter(d => STATE.done[d.d]).length;
const pct = Math.round(done/total*100);
$('#pbar').style.width = pct + '%';
$('#ptxt').textContent = done + ' of ' + total + ' days complete';
$('#ppct').textContent = pct + '%';
$('#hDone').textContent = done + '/' + total;
$('#hStreak').textContent = STATE.streak.count || 0;
const elapsed = daysBetween(parse(STATE.start), today());
$('#hDay').textContent = 'Day ' + Math.max(1, Math.min(total, elapsed+1));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const s = parse(STATE.start);
$('#sbSub').textContent = 'Started ' + s.getDate() + ' ' + MON[s.getMonth()] + ' · ' + done + '/' + total + ' done';
}

function render(){
const d = DAYS.find(x => x.d === STATE.currentDay) || DAYS[0];
$('#content').innerHTML = renderDay(d);
bindDay(d);
renderNav();
updateProgress();
}

function toast(msg){
const el = $('#toast');
el.textContent = msg; el.classList.add('show');
clearTimeout(window.__tt);
window.__tt = setTimeout(() => el.classList.remove('show'), 2200);
}
function closeNav(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

function initChrome(){
const t = LS.get('theme','dark');
document.documentElement.setAttribute('data-theme', t);
$('#themeBtn').addEventListener('click', () => {
const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
document.documentElement.setAttribute('data-theme', n);
LS.set('theme', n);
});
$('#menuBtn').addEventListener('click', () => {
$('#sidebar').classList.toggle('open');
$('#scrim').classList.toggle('show');
});
$('#scrim').addEventListener('click', closeNav);
$('#todayBtn').addEventListener('click', jumpToToday);
document.addEventListener('keydown', e => {
if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
if (e.key === 'ArrowRight' && STATE.currentDay < DAYS.length) goToDay(STATE.currentDay+1);
if (e.key === 'ArrowLeft' && STATE.currentDay > 1) goToDay(STATE.currentDay-1);
if (e.key === 't') $('#themeBtn').click();
});
}

initChrome();
render();
</script>
</body>
